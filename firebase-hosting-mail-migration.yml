name: Verify IRPA Cloudflare frontend (mail migration)
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-cloudflare-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Mandatory full-source readability and contrast check
        run: npm run check:production-readability
      - name: Build web application
        env:
          VITE_IRPA_ENV: staging
          VITE_FIREBASE_API_KEY: "AIzaSyA6UmHtP-mRr99rBw57_-qrD4_mFSBnZ38"
          VITE_FIREBASE_AUTH_DOMAIN: "irpa-dbg-staging-a73ec.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "irpa-dbg-staging-a73ec"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1018976634858"
          VITE_FIREBASE_APP_ID: "1:1018976634858:web:e73e9e09f55a76ade25493"
          VITE_FIREBASE_MEASUREMENT_ID: ""
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_WEATHER_API_KEY: ${{ secrets.VITE_GOOGLE_WEATHER_API_KEY }}
        run: npm run build
      - name: Independent production readability verification
        run: npm run verify:production-readability
      - name: Verify Cloudflare production frontend
        shell: bash
        run: |
          set -euo pipefail
          url="https://irpa-digital-board-governance-frontend.irpa-governance.workers.dev"
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 30 "$url/" -o "$RUNNER_TEMP/cloudflare-live.html"
          grep -qi '<html' "$RUNNER_TEMP/cloudflare-live.html"
          health="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 20 "$url/__irpa_health")"
          echo "$health"
          echo "$health" | grep -q '"ok":true'
          echo "Cloudflare frontend verification passed; this workflow does not deploy Firebase Hosting."
