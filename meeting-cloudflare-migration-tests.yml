name: Meeting Cloudflare Migration Tests

on:
  push:
    branches: ["migrate-meeting-portal-cloudflare-20261010"]
    paths:
      - "drive-gateway/**"
      - "infra/livekit/**"
      - ".github/workflows/cloudflare-livekit-secrets.yml"
      - ".github/workflows/meeting-cloudflare-migration-tests.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "drive-gateway/**"
      - "infra/livekit/**"
      - ".github/workflows/cloudflare-livekit-secrets.yml"
      - ".github/workflows/meeting-cloudflare-migration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meeting-cloudflare-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drive-gateway/package-lock.json

      - name: Install Worker dependencies
        working-directory: drive-gateway
        run: npm ci --no-audit --no-fund

      - name: Validate Worker module syntax
        working-directory: drive-gateway
        run: |
          node --check src/index.js
          node --check src/meetingPortal.mjs
          node --check src/meetingServices.mjs

      - name: Run Worker and meeting migration tests
        working-directory: drive-gateway
        run: npm test

      - name: Validate LiveKit deployment scripts and Compose configuration
        env:
          LIVEKIT_DOMAIN: meet.example.invalid
          LIVEKIT_TURN_DOMAIN: turn.example.invalid
          LIVEKIT_API_KEY: test-api-key-12345678
          LIVEKIT_API_SECRET: test-api-secret-012345678901234567890123456789
          ACME_EMAIL: test@example.invalid
        run: |
          set -euo pipefail
          bash -n infra/livekit/deploy-staging.sh infra/livekit/preflight.sh
          docker compose -f infra/livekit/docker-compose.yml config -q
          if grep -RInE 'livekit/(livekit-server|egress|caddyl4):latest' infra/livekit; then
            echo "Unpinned LiveKit infrastructure image detected."
            exit 1
          fi

      - name: Build governance application
        env:
          VITE_IRPA_ENV: staging
          VITE_FIREBASE_API_KEY: "AIzaSyA6UmHtP-mRr99rBw57_-qrD4_mFSBnZ38"
          VITE_FIREBASE_AUTH_DOMAIN: "irpa-dbg-staging-a73ec.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "irpa-dbg-staging-a73ec"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1018976634858"
          VITE_FIREBASE_APP_ID: "1:1018976634858:web:e73e9e09f55a76ade25493"
          VITE_FIREBASE_MEASUREMENT_ID: ""
        run: |
          npm ci --no-audit --no-fund
          npm run build
