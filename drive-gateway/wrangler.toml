# IRPA controlled deployment configuration
# Production cutover explicitly authorized on 2026-10-04.
# Deployment verification retriggered from main after controlled cutover merge.
name = "irpa-google-drive-gateway"
main = "src/index.js"
compatibility_date = "2026-09-29"
workers_dev = true

[vars]
CLOUDFLARE_INVITATION_REDEMPTION_ENABLED = "false"
FIREBASE_PROJECT_ID = "irpa-digital-board-governance"
AUTHORIZED_DRIVE_EMAIL = "irpa2412@gmail.com"
IRPA_APP_URL = "https://irpa-digital-board-governance.web.app"
SMTP_HOST = "mail.irpa.or.tz"
SMTP_PORT = "465"
SMTP_FROM = "info@irpa.or.tz"
DRIVE_ROOT_FOLDER_NAME = "IRPA Governance System"
FIRESTORE_COLLECTION_PREFIX = ""
DRIVE_MOCK = "false"
LOCAL_TEST_MODE = "false"
ESIGN_MODULE_ENABLED = "true"
CLOUDFLARE_AUTH_FUNCTIONS_ENABLED = "true"
IRPA_PRODUCTION_CUTOVER = "true"

[[kv_namespaces]]
binding = "DRIVE_KV"
id = "ccdbffa662ac48bfbdf7f4b1f62ca941"

[[durable_objects.bindings]]
name = "ESIGN_DO"
class_name = "EsignRecordDurableObject"

[[migrations]]
tag = "esign-do-v1"
new_sqlite_classes = ["EsignRecordDurableObject"]

[env.staging]
name = "irpa-google-drive-gateway-staging"
workers_dev = true

[env.staging.vars]
IRPA_ENVIRONMENT = "staging"
CLOUDFLARE_INVITATION_REDEMPTION_ENABLED = "true"
FIREBASE_WEB_API_KEY = "AIzaSyC2aMdxHD14nMnGiRyf4mSL1ixXdzBoOtE"
FIREBASE_PROJECT_ID = "irpa-digital-board-governance"
