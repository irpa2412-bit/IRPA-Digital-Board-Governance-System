name: Meeting Room AI Assistant Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/pages/MeetingRoom.jsx"
      - "tests/meeting-room-ai-assistant.test.mjs"
      - ".github/workflows/meeting-room-ai-assistant-verification.yml"
  push:
    branches: [main]
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/pages/MeetingRoom.jsx"
      - "tests/meeting-room-ai-assistant.test.mjs"
      - ".github/workflows/meeting-room-ai-assistant-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-meeting-room-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Meeting Room assistant command paths
        run: node --test tests/meeting-room-ai-assistant.test.mjs
      - name: Build production application
        env:
            VITE_IRPA_ENV: staging
            VITE_FIREBASE_API_KEY: "AIzaSyA6UmHtP-mRr99rBw57_-qrD4_mFSBnZ38"
            VITE_FIREBASE_AUTH_DOMAIN: "irpa-dbg-staging-a73ec.firebaseapp.com"
            VITE_FIREBASE_PROJECT_ID: "irpa-dbg-staging-a73ec"
            VITE_FIREBASE_MESSAGING_SENDER_ID: "1018976634858"
            VITE_FIREBASE_APP_ID: "1:1018976634858:web:e73e9e09f55a76ade25493"
            VITE_FIREBASE_MEASUREMENT_ID: ""
        run: npm run build
