# Isolated grant-discovery Worker. Never reuse drive-gateway/wrangler.toml.
name = "irpa-grant-crawler"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
IRPA_ENVIRONMENT = "local"
GRANT_FEED_URLS = "[\"https://www.gov.uk/international-development-funding.atom?fund_state=open\",\"https://www.gov.uk/international-development-funding.atom?location%5B%5D=tanzania&fund_state=open\",\"https://www.gov.uk/international-development-funding.atom?eligible_entities=organisations-lmic&fund_state=open\"]"
GRANT_SOURCE_PAGE_URLS = "[\"https://www.undp.org/tanzania/news-centre\",\"https://www.undp.org/tanzania/press-releases\",\"https://www.thegef.org/what-we-do/topics/gef-small-grants-programme\",\"https://www.fao.org/partnerships/funding-opportunities/en\",\"https://www.eeas.europa.eu/eeas/grants_en\",\"https://www.eeas.europa.eu/delegations/tanzania_en\",\"https://www.mfukowamisitu.go.tz/download-center\",\"https://www.mzv.sk/en/web/daressalaam-en/small-grants\",\"https://www.thefoundation.or.tz/what-we-do/grantmaking\",\"https://www.thefoundation.or.tz/our-platforms/smart-grants\"]"
GRANT_SITEMAP_URLS = "[\"https://www.undp.org/sitemap.xml\",\"https://www.fao.org/sitemap.xml\",\"https://www.thegef.org/sitemap.xml\"]"
GRANT_STRUCTURED_SOURCE_URLS = "[\"https://www.undp.org/tanzania/news\",\"https://www.thegef.org/what-we-do/topics/gef-small-grants-programme\",\"https://www.fao.org/partnerships/funding-opportunities/en\"]"
GRANT_GOVERNMENT_SOURCE_URLS = "[\"https://www.usaid.gov/work-usaid/partnership-opportunities\",\"https://www.gov.uk/international-development-funding\",\"https://www.grants.gov/search-grants.html\"]"
GRANT_FOUNDATION_SOURCE_URLS = "[\"https://www.mcknight.org/programs/\",\"https://www.globalgreengrants.org/grants/\",\"https://www.fordfoundation.org/work/our-grants/\",\"https://www.foundationforsociety.or.tz/\"]"
GRANT_EMBASSY_SOURCE_URLS = "[\"https://tz.usembassy.gov/education-culture/grants/\",\"https://www.eeas.europa.eu/delegations/tanzania_en\",\"https://www.international.gc.ca/world-monde/funding-financement/cfli-fcil/index.aspx?lang=eng\",\"https://tz.emb-japan.go.jp/itpr_en/grassroots.html\"]"
GRANT_CLIMATE_SOURCE_URLS = "[\"https://www.thegef.org/what-we-do/topics/gef-small-grants-programme\",\"https://www.greenclimate.fund/projects\",\"https://www.adaptation-fund.org/apply-funding/\",\"https://www.afdb.org/en/topics-and-sectors/initiatives-partnerships/africa-climate-change-fund\"]"
