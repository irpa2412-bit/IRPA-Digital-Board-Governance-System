# Isolated grant-discovery Worker. Never reuse drive-gateway/wrangler.toml.
name = "irpa-grant-crawler"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
IRPA_ENVIRONMENT = "local"
GRANT_FEED_URLS = "[\"https://www.gov.uk/international-development-funding.atom?fund_state=open\",\"https://www.gov.uk/international-development-funding.atom?location%5B%5D=tanzania&fund_state=open\",\"https://www.gov.uk/international-development-funding.atom?eligible_entities=organisations-lmic&fund_state=open\"]"
GRANT_SOURCE_PAGE_URLS = "[\"https://www.undp.org/tanzania/news-centre\",\"https://www.undp.org/tanzania/press-releases\",\"https://www.thegef.org/what-we-do/topics/gef-small-grants-programme\",\"https://www.fao.org/partnerships/funding-opportunities/en\",\"https://www.eeas.europa.eu/eeas/grants_en\",\"https://www.eeas.europa.eu/delegations/tanzania_en\",\"https://www.mfukowamisitu.go.tz/download-center\",\"https://www.mzv.sk/en/web/daressalaam-en/small-grants\",\"https://www.thefoundation.or.tz/what-we-do/grantmaking\",\"https://www.thefoundation.or.tz/our-platforms/smart-grants\",\"https://africanngos.org/\",\"https://grantcatalyst.africa/\",\"https://africatraininginstitute.org/grants-funding/\",\"https://trustafrica.org/?Itemid=75&id=24&lang=en&option=com_grants&task=view\",\"https://awdf.org/grants/\",\"https://uaf-africa.org/\",\"https://globalfundcommunityfoundations.org/\",\"https://www.unpartnerportal.org/landing/opportunities/\",\"https://www.afdb.org/en/projects-and-operations/procurement\",\"https://www.usadf.gov/\"]"

[ai]
binding = "AI"

[[d1_databases]]
binding = "GRANTS_DB"
database_name = "irpa-grant-crawler-staging"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = []

[env.staging]
name = "irpa-grant-crawler-staging"
workers_dev = true

[env.staging.vars]
IRPA_ENVIRONMENT = "staging"
GRANT_CRAWLER_ADMIN_EMAILS = "irpa2412@gmail.com"
GRANT_FEED_URLS = "[\"https://www.gov.uk/international-development-funding.atom?fund_state=open\",\"https://www.gov.uk/international-development-funding.atom?location%5B%5D=tanzania&fund_state=open\",\"https://www.gov.uk/international-development-funding.atom?eligible_entities=organisations-lmic&fund_state=open\"]"
GRANT_SOURCE_PAGE_URLS = "[\"https://www.undp.org/tanzania/news-centre\",\"https://www.undp.org/tanzania/press-releases\",\"https://www.thegef.org/what-we-do/topics/gef-small-grants-programme\",\"https://www.fao.org/partnerships/funding-opportunities/en\",\"https://www.eeas.europa.eu/eeas/grants_en\",\"https://www.eeas.europa.eu/delegations/tanzania_en\",\"https://www.mfukowamisitu.go.tz/download-center\",\"https://www.mzv.sk/en/web/daressalaam-en/small-grants\",\"https://www.thefoundation.or.tz/what-we-do/grantmaking\",\"https://www.thefoundation.or.tz/our-platforms/smart-grants\",\"https://africanngos.org/\",\"https://grantcatalyst.africa/\",\"https://africatraininginstitute.org/grants-funding/\",\"https://trustafrica.org/?Itemid=75&id=24&lang=en&option=com_grants&task=view\",\"https://awdf.org/grants/\",\"https://uaf-africa.org/\",\"https://globalfundcommunityfoundations.org/\",\"https://www.unpartnerportal.org/landing/opportunities/\",\"https://www.afdb.org/en/projects-and-operations/procurement\",\"https://www.usadf.gov/\"]"

[env.staging.ai]
binding = "AI"

[[env.staging.d1_databases]]
binding = "GRANTS_DB"
database_name = "irpa-grant-crawler-staging"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.staging.triggers]
crons = ["0 */6 * * *"]

[env.production]
name = "irpa-grant-crawler-production"
workers_dev = true

[env.production.vars]
IRPA_ENVIRONMENT = "production"
GRANT_CRAWLER_ADMIN_EMAILS = "irpa2412@gmail.com"
GRANT_FEED_URLS = "[\"https://www.gov.uk/international-development-funding.atom?fund_state=open\",\"https://www.gov.uk/international-development-funding.atom?location%5B%5D=tanzania&fund_state=open\",\"https://www.gov.uk/international-development-funding.atom?eligible_entities=organisations-lmic&fund_state=open\"]"
