# LEGACY EXAMPLE ONLY — NOT FOR DEPLOYMENT.
# This minimal sample uses a moving image tag and omits the TLS/ACME startup
# sequence and staging acceptance gates. Use docker-compose.staging.yml and
# STAGING_ACCEPTANCE.md for the isolated staging preparation path.
# IRPA-DGBS Live Meeting Infrastructure
services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - 7880:7880
      - 7881:7881
      - 3478:3478/udp
      - 5349:5349/tcp
      - 50000-60000:50000-60000/udp
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, yes]
    volumes:
      - redis-data:/data

volumes:
  redis-data: