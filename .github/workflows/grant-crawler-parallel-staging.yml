name: IRPA Grant Crawler — Parallel Engines Staging

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/grant-crawler-parallel/**"
      - ".github/workflows/grant-crawler-parallel-staging.yml"

permissions:
  contents: read

concurrency:
  group: irpa-grant-crawler-staging-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/grant-crawler-parallel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run parser, authentication and isolation tests
        run: npm run check
      - name: Validate Wrangler TOML and staging Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --config wrangler.toml --dry-run --env staging
      - name: Verify deployment config cannot target production gateway
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = fs.readFileSync('wrangler.toml', 'utf8');
          if (config.includes('irpa-google-drive-gateway')) throw new Error('Crawler config references production gateway.');
          if (!config.includes('name = "irpa-grant-crawler-staging"')) throw new Error('Staging Worker name missing.');
          if (!config.includes('IRPA_ENVIRONMENT = "staging"')) throw new Error('Staging environment marker missing.');
          if (!config.includes('database_name = "irpa-grant-crawler-staging"')) throw new Error('Staging D1 database missing.');
          NODE

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dashboard dependencies
        run: npm ci
      - name: Build dashboard with engine provision panel
        run: npm run build

  firebase-rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repository test dependencies
        run: npm ci
      - name: Set up Java 21 for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify isolated Firebase rules in the emulator
        run: npx firebase emulators:exec --config cloudflare/grant-crawler-parallel/firebase-staging/firebase.json --only firestore --project demo-irpa-grant-crawler-staging-test "node --test cloudflare/grant-crawler-parallel/firebase-staging/firestore.rules.test.js"

  deploy-staging:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
      - test
      - dashboard-build
      - firebase-rules-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: irpa-grant-crawler-staging
    defaults:
      run:
        working-directory: cloudflare/grant-crawler-parallel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Validate scoped deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GRANT_CRAWLER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo "Required Cloudflare credentials are present; values are not printed."
      - name: Locate existing isolated staging D1 database (read-only account listing)
        id: staging_db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GRANT_CRAWLER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
          database_id="$(node - "$response" <<'NODE'
          const payload = JSON.parse(process.argv[2]);
          if (!payload.success) throw new Error("Cloudflare D1 database listing failed.");
          const database = (payload.result || []).find(item => item.name === "irpa-grant-crawler-staging");
          if (!database?.uuid) throw new Error("Existing irpa-grant-crawler-staging D1 database was not found; refusing to create or mutate a database.");
          process.stdout.write(database.uuid);
          NODE
          )"
          if ! [[ "$database_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Staging D1 identifier is invalid; refusing deployment." >&2
            exit 1
          fi
          node - "$database_id" <<'NODE'
          import fs from "node:fs";
          const id = process.argv[2];
          let config = fs.readFileSync("wrangler.toml", "utf8");
          if (!config.includes('database_name = "irpa-grant-crawler-staging"')) throw new Error("Staging D1 binding is missing.");
          config = config.replaceAll("00000000-0000-0000-0000-000000000000", id);
          fs.writeFileSync("wrangler.toml", config);
          NODE
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
      - name: D1 quota pre-check (one-row read only; stop before deploy on code 7500)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GRANT_CRAWLER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          set +e
          output="$(npx wrangler d1 execute irpa-grant-crawler-staging --config wrangler.toml --env staging --remote --command "SELECT 1 AS staging_quota_precheck" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            if printf '%s' "$output" | grep -Eqi '(^|[^0-9])7500([^0-9]|$)'; then
              echo "::error::STAGING DEPLOYMENT STOPPED: Cloudflare D1 returned quota error code 7500. No migration, crawler, diagnostics, or Worker deployment was run. Wait for quota reset or resolve the D1 plan limit, then dispatch manually."
              exit 78
            fi
            echo "::error::D1 read-only pre-check failed; refusing to deploy."
            exit "$status"
          fi
      - name: Deploy isolated staging Worker only (no migration, seed, or crawler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GRANT_CRAWLER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml --env staging
      - name: Read-only staging health smoke test
        env:
          STAGING_WORKER_URL: ${{ vars.GRANT_CRAWLER_STAGING_WORKER_URL }}
        run: |
          set -euo pipefail
          test -n "$STAGING_WORKER_URL"
          health="$(curl --fail --silent --show-error --max-time 15 "$STAGING_WORKER_URL/health")"
          node - "$health" <<'NODE'
          const body = JSON.parse(process.argv[2]);
          if (body.service !== "irpa-grant-crawler" || body.environment !== "staging" ||
              body.storage !== "configured" || body.ai !== "configured" ||
              body.identity !== "firebase-id-token-verification-only" ||
              body.draftStorage !== "cloudflare-d1") {
            throw new Error("Staging health smoke test failed.");
          }
          console.log("Read-only staging /health smoke test passed; no crawler or diagnostic endpoint was called.");
          NODE
