name: Temporary Dependency Audit Fix

on:
  push:
    branches:
      - security/assessment-remediation-20261012

permissions:
  contents: write

concurrency:
  group: irpa-audit-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile and apply only non-breaking advisory fixes
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Commit lockfile changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "NO_LOCKFILE_CHANGES=true"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push -m generated-lockfile -- package-lock.json
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git stash pop
          git add package-lock.json
          git commit -m "security: apply non-breaking dependency advisory fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
