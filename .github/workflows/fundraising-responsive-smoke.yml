name: Fundraising Responsive Browser Smoke

on:
  pull_request:
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/pages/GrantIntelligencePortal.jsx"
      - "src/pages/grant-fundraising/**"
      - "tests/browser/**"
      - "playwright.fundraising.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fundraising-responsive-smoke.yml"
  push:
    branches:
      - "plan/fundraising-csr-esg-safe-expansion"
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/pages/GrantIntelligencePortal.jsx"
      - "src/pages/grant-fundraising/**"
      - "tests/browser/**"
      - "playwright.fundraising.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fundraising-responsive-smoke.yml"

permissions:
  contents: read

concurrency:
  group: fundraising-responsive-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated fundraising change
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked application dependencies
        run: npm ci
      - name: Install Firebase Admin SDK for emulator-only fixture seeding
        run: npm --prefix functions install --omit=dev
      - name: Test grant crawler board mapping and pagination regression
        run: node --test tests/grant-crawler-board-data.test.mjs
      - name: Install Playwright test runner without changing lockfile
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile fundraising registry smoke tests
        run: npx playwright test --config=playwright.fundraising.config.mjs
      - name: Run authenticated Analyse mock at mobile and desktop sizes (emulators only)
        run: npx firebase emulators:exec --config firebase.emulator.test.json --only auth,firestore --project demo-irpa-dgbs "node scripts/seed-authenticated-browser-fixture.cjs && npx playwright test --config=playwright.grant-analyse.config.mjs"
