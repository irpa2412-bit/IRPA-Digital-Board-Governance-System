name: Fundraising Responsive Browser Smoke

on:
  pull_request:
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/pages/GrantIntelligencePortal.jsx"
      - "src/pages/grant-fundraising/**"
      - "tests/browser/**"
      - "playwright.fundraising.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fundraising-responsive-smoke.yml"
  push:
    branches:
      - "plan/fundraising-csr-esg-safe-expansion"
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/pages/GrantIntelligencePortal.jsx"
      - "src/pages/grant-fundraising/**"
      - "tests/browser/**"
      - "playwright.fundraising.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fundraising-responsive-smoke.yml"

permissions:
  contents: read

concurrency:
  group: fundraising-responsive-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated fundraising change
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Install Playwright test runner without changing lockfile
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile fundraising registry smoke tests
        env:
          VITE_IRPA_ENV: staging
          VITE_FIREBASE_API_KEY: "AIzaSyA6UmHtP-mRr99rBw57_-qrD4_mFSBnZ38"
          VITE_FIREBASE_AUTH_DOMAIN: "irpa-dbg-staging-a73ec.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "irpa-dbg-staging-a73ec"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1018976634858"
          VITE_FIREBASE_APP_ID: "1:1018976634858:web:e73e9e09f55a76ade25493"
          VITE_FIREBASE_MEASUREMENT_ID: ""
          VITE_GOOGLE_DRIVE_GATEWAY_URL: "https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev"
          VITE_GATEWAY_ORIGIN: "https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev"
        run: npx playwright test --config=playwright.fundraising.config.mjs
