name: Member account compatibility dry run (read only)

on:
  workflow_dispatch:
    inputs:
      owner_confirmation:
        description: Explicit owner authorization for this sensitive identity audit
        required: true
        type: choice
        options:
          - NO
          - I_AUTHORIZE_IRPA_MEMBER_IDENTITY_AUDIT
        default: NO

permissions:
  contents: read

concurrency:
  group: irpa-member-account-compatibility-dry-run
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor == 'irpa2412-bit' && github.triggering_actor == 'irpa2412-bit' && inputs.owner_confirmation == 'I_AUTHORIZE_IRPA_MEMBER_IDENTITY_AUDIT'
    name: Read and encrypt owner-only account findings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify owner authorization and main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "irpa2412-bit"
          test "${{ github.triggering_actor }}" = "irpa2412-bit"
          test "${{ inputs.owner_confirmation }}" = "I_AUTHORIZE_IRPA_MEMBER_IDENTITY_AUDIT"
      - name: Validate owner-controlled report public key before reading production
        env:
          IRPA_MEMBER_AUDIT_REPORT_PUBLIC_KEY: ${{ vars.IRPA_MEMBER_AUDIT_REPORT_PUBLIC_KEY }}
        run: node scripts/encrypt-member-account-report.cjs --check
      - name: Syntax-check audit and encryption scripts
        run: |
          node --check scripts/member-account-compatibility-audit.cjs
          node --check scripts/encrypt-member-account-report.cjs
      - name: Test audit and encryption safeguards
        run: node --test tests/member-account-compatibility-audit.test.cjs
      - name: Install Firebase Admin SDK
        run: npm install --prefix functions --no-save --no-package-lock --ignore-scripts firebase-admin@13.5.0
      - name: Run read-only account compatibility audit
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: node scripts/member-account-compatibility-audit.cjs
      - name: Encrypt detailed report for owner and destroy plaintext
        env:
          IRPA_MEMBER_AUDIT_REPORT_PUBLIC_KEY: ${{ vars.IRPA_MEMBER_AUDIT_REPORT_PUBLIC_KEY }}
        run: node scripts/encrypt-member-account-report.cjs reports/member-account-compatibility-dry-run.json reports/member-account-compatibility-dry-run.enc.json
      - name: Assert plaintext report is absent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e reports/member-account-compatibility-dry-run.json
          test -s reports/member-account-compatibility-dry-run.enc.json
      - name: Upload encrypted owner report (ciphertext only; one-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: irpa-member-account-compatibility-owner-encrypted
          path: reports/member-account-compatibility-dry-run.enc.json
          retention-days: 1
          if-no-files-found: error
