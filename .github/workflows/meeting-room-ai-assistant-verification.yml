name: Meeting Room AI Assistant Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/pages/MeetingRoom.jsx"
      - "tests/meeting-room-ai-assistant.test.mjs"
      - ".github/workflows/meeting-room-ai-assistant-verification.yml"
  push:
    branches: [main]
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/pages/MeetingRoom.jsx"
      - "tests/meeting-room-ai-assistant.test.mjs"
      - ".github/workflows/meeting-room-ai-assistant-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-meeting-room-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Meeting Room assistant command paths
        run: node --test tests/meeting-room-ai-assistant.test.mjs
      - name: Build production application
        env:
          VITE_IRPA_ENV: production
          VITE_FIREBASE_API_KEY: "AIzaSyC2aMdxHD14nMnGiRyf4mSL1ixXdzBoOtE"
          VITE_FIREBASE_AUTH_DOMAIN: "irpa-digital-board-governance.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "irpa-digital-board-governance"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "217055978789"
          VITE_FIREBASE_APP_ID: "1:217055978789:web:937d1f2f781202cc1e26cc"
          VITE_FIREBASE_MEASUREMENT_ID: "G-XDJEBRBEVC"
        run: npm run build
