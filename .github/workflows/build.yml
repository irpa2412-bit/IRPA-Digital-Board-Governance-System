name: IRPA Release Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install

      - name: Mandatory full-source readability and contrast check
        run: npm run check:production-readability
      - name: Production build
        env:
          VITE_IRPA_ENV: production
          VITE_FIREBASE_API_KEY: "AIzaSyC2aMdxHD14nMnGiRyf4mSL1ixXdzBoOtE"
          VITE_FIREBASE_AUTH_DOMAIN: irpa-digital-board-governance.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: irpa-digital-board-governance
          VITE_FIREBASE_MESSAGING_SENDER_ID: "217055978789"
          VITE_FIREBASE_APP_ID: "1:217055978789:web:937d1f2f781202cc1e26cc"
          VITE_FIREBASE_MEASUREMENT_ID: "G-XDJEBRBEVC"
        run: npm run build

      - name: Independent production readability verification
        run: npm run verify:production-readability
      - name: Verify Firebase Hosting output
        run: test -f dist/index.html
