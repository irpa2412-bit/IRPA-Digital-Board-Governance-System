name: IRPA Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install

      - name: Mandatory full-source readability and contrast check
        run: npm run check:production-readability
      - name: Production build
        run: npm run build

      - name: Independent production readability verification
        run: npm run verify:production-readability
      - name: Verify Firebase Hosting output
        run: test -f dist/index.html
