name: IRPA Release Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install main application dependencies
        run: npm install --include=dev
      - name: Install Cloudflare gateway tooling
        run: npm --prefix drive-gateway install --include=dev
      - name: Verify operational software
        run: npm run ops:verify
      - name: Production build
        run: npm run build
      - name: Verify Firebase Hosting output
        run: test -f dist/index.html
