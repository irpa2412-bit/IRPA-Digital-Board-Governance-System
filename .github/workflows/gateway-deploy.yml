name: Validate IRPA Mail and Drive Gateway

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drive-gateway/package-lock.json

      - name: Install gateway dependencies
        working-directory: drive-gateway
        run: npm ci

      - name: Validate Worker bundle without deployment
        working-directory: drive-gateway
        run: npx wrangler deploy --dry-run --keep-vars

      - name: Run gateway E2E tests
        working-directory: drive-gateway
        run: npm test

      - name: Verify live gateway
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3             https://irpa-google-drive-gateway.irpa-governance.workers.dev/health
          echo
