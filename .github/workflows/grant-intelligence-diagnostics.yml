name: Grant Intelligence staging and production diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - fix/grant-intelligence-20261030
    paths:
      - "src/pages/GrantIntelligencePortal.jsx"
      - "src/styles/grant-intelligence-layout.css"
      - "scripts/grant-intelligence-diagnostics.mjs"
      - ".github/workflows/grant-intelligence-diagnostics.yml"

permissions:
  contents: read

jobs:
  grant-intelligence-diagnostics:
    name: Read-only production / isolated staging diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Build staging diagnostic bundle (no deployment)
        env:
          VITE_BUILD_COMMIT: ${{ github.sha }}
          VITE_IRPA_ENVIRONMENT: "staging"
          VITE_GRANT_WORKER_URL: https://irpa-grant-crawler-staging.irpa-governance.workers.dev
          VITE_GOOGLE_DRIVE_GATEWAY_URL: https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev
          VITE_FIREBASE_API_KEY: "AIzaSyA6UmHtP-mRr99rBw57_-qrD4_mFSBnZ38"
          VITE_FIREBASE_AUTH_DOMAIN: "irpa-dbg-staging-a73ec.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "irpa-dbg-staging-a73ec"
          VITE_FIREBASE_STORAGE_BUCKET: "irpa-dbg-staging-a73ec.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1018976634858"
          VITE_FIREBASE_APP_ID: "1:1018976634858:web:e73e9e09f55a76ade25493"
        run: npm run build
      - name: Start isolated staging preview for browser tests
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 > "$RUNNER_TEMP/grant-preview.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ -o /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/grant-preview.log"
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test staging and production Worker APIs, CORS, auth, browser UI and versions
        env:
          STAGING_APP_URL: http://127.0.0.1:4173
          STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          PRODUCTION_TEST_EMAIL: ${{ secrets.PRODUCTION_TEST_EMAIL }}
          PRODUCTION_TEST_PASSWORD: ${{ secrets.PRODUCTION_TEST_PASSWORD }}
          CLOUDFLARE_GRANT_CRAWLER_API_TOKEN: ${{ secrets.CLOUDFLARE_GRANT_CRAWLER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIAGNOSTIC_BUILD_COMMIT: ${{ github.sha }}
        run: node scripts/grant-intelligence-diagnostics.mjs
