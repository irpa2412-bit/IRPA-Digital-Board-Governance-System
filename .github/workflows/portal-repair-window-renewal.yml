name: Portal repair-window owner renewal

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: portal-window-renewal-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  renew-one-portal-window:
    if: github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply exact owner-approved 72-hour renewal
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.comment.body || "").trim();
            const { owner, repo } = context.repo;
            const repoInfo = await github.rest.repos.get({ owner, repo });
            if (context.payload.comment.user.login !== repoInfo.data.owner.login) {
              core.setFailed("Only the repository owner may renew a portal repair window.");
              return;
            }
            const getFile = async (path, ref) => {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref });
              if (Array.isArray(response.data) || !response.data.content) throw new Error("Expected file: " + path);
              return { sha: response.data.sha, content: Buffer.from(response.data.content, "base64").toString("utf8") };
            };
            const registryFile = await getFile("docs/portal-protection/portal-register.json", repoInfo.data.default_branch);
            const registry = JSON.parse(registryFile.content);
            const names = Object.keys(registry.portals).sort((a,b) => b.length-a.length);
            let kind = null, portal = null, reason = null, prNumber = null;
            const approve = body.match(/^APPROVE\s+#?(\d+)\s+(.+)$/);
            if (approve) {
              kind = "approve"; prNumber = Number(approve[1]); reason = approve[2].trim();
              if (!context.payload.issue.pull_request || context.payload.issue.number !== prNumber) {
                core.setFailed("APPROVE must be posted on the same pull request named in the command.");
                return;
              }
              const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: prNumber, per_page: 100 });
              const affected = new Set();
              for (const file of files.map(f => f.filename)) {
                for (const [name, entry] of Object.entries(registry.portals)) {
                  if ((entry.paths || []).some(p => file === p || (p.endsWith("/") && file.startsWith(p)))) affected.add(name);
                }
                for (const shared of registry.shared || []) {
                  if (file === shared.path || (shared.path.endsWith("/") && file.startsWith(shared.path))) shared.portals.forEach(p => affected.add(p));
                }
                const match = file.match(/^docs\/portal-protection\/(?:records|windows)\/([a-z0-9-]+)\.json$/);
                if (match) {
                  const found = names.find(n => n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") === match[1]);
                  if (found) affected.add(found);
                }
              }
              if (affected.size !== 1) {
                core.setFailed("Renewal refused: the PR must map to exactly one portal; shared/multi-portal PRs cannot be renewed.");
                return;
              }
              portal = [...affected][0];
            } else {
              for (const name of names) {
                const prefix = "RENEW " + name + " ";
                if (body.startsWith(prefix) && body.slice(prefix.length).trim()) {
                  kind = "renew"; portal = name; reason = body.slice(prefix.length).trim(); break;
                }
              }
            }
            if (!kind || !portal || !reason) return;
            if (!context.payload.issue.pull_request) {
              core.setFailed("Renewal commands must be posted on a pull request so the approval is recorded on a reviewable branch.");
              return;
            }
            if (context.payload.comment.author_association !== "OWNER") {
              core.setFailed("Owner association is required.");
              return;
            }
            const slug = portal.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
            const pr = context.payload.issue.pull_request ? await github.rest.pulls.get({ owner, repo, pull_number: context.payload.issue.number }) : null;
            const ref = pr?.data.head.ref || repoInfo.data.default_branch;
            const quote = body;
            const commentUrl = context.payload.comment.html_url;
            const now = new Date();
            const expires = new Date(now.getTime() + 72 * 60 * 60 * 1000);
            const windowPath = "docs/portal-protection/windows/" + slug + ".json";
            const recordPath = "docs/portal-protection/records/" + slug + ".json";
            const winFile = await getFile(windowPath, ref);
            const recFile = await getFile(recordPath, ref);
            const windowState = JSON.parse(winFile.content);
            const record = JSON.parse(recFile.content);
            const approval = { at: now.toISOString(), expiresAt: expires.toISOString(), actor: context.payload.comment.user.login, quotedApproval: quote, commentUrl, command: kind, reason, prNumber };
            windowState.status = "open";
            windowState.openedAt = now.toISOString();
            windowState.lastActivityAt = now.toISOString();
            windowState.expiresAt = expires.toISOString();
            windowState.durationHours = 72;
            windowState.inactivityCloseHours = 72;
            windowState.warningHours = 12;
            windowState.emergency = false;
            windowState.emergencyExpiresAt = null;
            windowState.activityLog = [...(windowState.activityLog || []), { ...approval, action: "owner-approved 72-hour renewal" }];
            record.renewals = [...(record.renewals || []), approval];
            const update = async (path, content, sha, message) => github.rest.repos.createOrUpdateFileContents({ owner, repo, path, message, content: Buffer.from(content + "\n").toString("base64"), sha, branch: ref });
            await update(windowPath, JSON.stringify(windowState, null, 2), winFile.sha, "chore(portal-guard): renew " + portal + " window for 72 hours");
            await update(recordPath, JSON.stringify(record, null, 2), recFile.sha, "chore(portal-guard): record owner renewal for " + portal);
            let approvals = "";
            try { approvals = (await getFile("docs/approvals.md", ref)).content; } catch {}
            const entry = "\n- " + now.toISOString() + " — " + portal + " — " + quote + " — " + commentUrl + " — expires " + expires.toISOString();
            const existing = await github.rest.repos.getContent({ owner, repo, path: "docs/approvals.md", ref }).catch(() => null);
            await update("docs/approvals.md", (approvals || "# Owner approvals\n") + entry, existing?.data?.sha, "docs(approvals): record " + portal + " 72-hour renewal");
            core.notice("Renewed " + portal + " for 72 hours. Lock tests and baseline/full regression requirements remain mandatory.");
