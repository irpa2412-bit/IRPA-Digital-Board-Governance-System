name: Dashboard Hero Headless PR Check
on:
  pull_request:
    paths:
      - "src/styles/readability-harmony.css"
      - "src/styles/app.css"
      - "src/styles/portal-typography.css"
      - "src/styles/shared-header-hero.css"
      - "src/styles/page-back-next-navigation.css"
      - "src/styles/mobile-app-enhancement.css"
      - "src/styles/mobile-viewport-containment.css"
      - "src/main.jsx"
      - "src/App.jsx"
      - "index.html"
      - "public/dashboard-hero-fix.js"
      - "scripts/dashboard-hero-layout-check.mjs"
      - ".github/workflows/dashboard-hero-check.yml"
      - ".github/workflows/dashboard-hero-pr-check.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  dashboard-hero-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install isolated Playwright runner without resolving application dependencies
        run: |
          set -euo pipefail
          PLAYWRIGHT_PREFIX="$RUNNER_TEMP/irpa-playwright"
          mkdir -p "$PLAYWRIGHT_PREFIX"
          npm install --prefix "$PLAYWRIGHT_PREFIX" --no-save --package-lock=false playwright@1.56.1
          mkdir -p node_modules
          ln -sfn "$PLAYWRIGHT_PREFIX/node_modules/playwright" node_modules/playwright
          "$PLAYWRIGHT_PREFIX/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build production CSS
        run: npm run build
      - name: Verify Dashboard hero and sticky portal navigation
        run: node scripts/dashboard-hero-layout-check.mjs
