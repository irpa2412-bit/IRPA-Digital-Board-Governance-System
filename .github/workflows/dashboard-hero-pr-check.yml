name: Dashboard Hero Headless PR Check
on:
  pull_request:
    paths:
      - "src/styles/readability-harmony.css"
      - "src/styles/app.css"
      - "src/styles/portal-typography.css"
      - "src/styles/shared-header-hero.css"
      - "src/styles/page-back-next-navigation.css"
      - "src/styles/mobile-app-enhancement.css"
      - "src/styles/mobile-viewport-containment.css"
      - "src/main.jsx"
      - "src/App.jsx"
      - "index.html"
      - "public/dashboard-hero-fix.js"
      - "scripts/dashboard-hero-layout-check.mjs"
      - ".github/workflows/dashboard-hero-check.yml"
      - ".github/workflows/dashboard-hero-pr-check.yml"
permissions:
  contents: read
jobs:
  dashboard-hero-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install headless Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Build production CSS
        env:
          VITE_IRPA_ENV: staging
          VITE_FIREBASE_API_KEY: "AIzaSyA6UmHtP-mRr99rBw57_-qrD4_mFSBnZ38"
          VITE_FIREBASE_AUTH_DOMAIN: "irpa-dbg-staging-a73ec.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "irpa-dbg-staging-a73ec"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1018976634858"
          VITE_FIREBASE_APP_ID: "1:1018976634858:web:e73e9e09f55a76ade25493"
          VITE_FIREBASE_MEASUREMENT_ID: ""
        run: npm run build
      - name: Verify Dashboard hero and sticky portal navigation
        run: node scripts/dashboard-hero-layout-check.mjs
