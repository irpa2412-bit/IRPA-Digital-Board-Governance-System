name: Emergency Retrieval Public Route Probe

on:
  push:
    paths:
      - ".github/workflows/emergency-retrieval-route-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe production Worker health and recovery routes without credentials
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://irpa-google-drive-gateway.irpa-governance.workers.dev"
          probe() {
            local label="$1" method="$2" path="$3" expected="$4"
            local file status body
            file="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 --request "$method" --output "$file" --write-out '%{http_code}' "$BASE$path" || true)"
            body="$(cat "$file")"
            printf '%s method=%s status=%s body=' "$label" "$method" "${status:-000}"
            head -c 180 "$file" | tr '\n' ' '
            printf '\n'
            if [[ "$expected" == "health" ]]; then
              [[ "$status" == "200" ]] || { echo "FAIL: health must return 200"; exit 1; }
              node -e 'const h=JSON.parse(process.argv[1]); if(h.ok!==true)process.exit(1); console.log("health version="+(h.workerCommit||h.commit||h.version||"NOT_REPORTED"));' "$body"
            elif [[ "$expected" == "missing" ]]; then
              [[ "$status" == "404" && "$body" == *"Not found."* ]] || { echo "FAIL: nonsense path must be the expected 404"; exit 1; }
            else
              [[ "$status" == "401" || "$status" == "403" ]] || { echo "FAIL: $label expected 401/403, got $status"; exit 1; }
              [[ "$body" == \{* && "$body" == *"error"* ]] || { echo "FAIL: $label did not return JSON error"; exit 1; }
              [[ "$body" =~ [Ss]ign.?in|[Aa]uthentication ]] || { echo "FAIL: $label did not return a JSON sign-in/authentication message"; exit 1; }
            fi
            rm -f "$file"
          }
          ID="IRPA-ENV-2026-11501354"
          probe "health" GET "/health" health
          probe "recovery-queue" GET "/api/recovery/envelopes" protected
          probe "recovery-evidence" GET "/api/recovery/envelopes/$ID/evidence" protected
          probe "recovery-preview" GET "/api/recovery/envelopes/$ID/preview.pdf" protected
          probe "recovery-completed-copy" GET "/api/recovery/envelopes/$ID/completed-copy.pdf" protected
          probe "recovery-stamp-reassign" POST "/api/recovery/envelopes/$ID/stamps/reassign" protected
          probe "recovery-diagnose-finalisation" POST "/api/envelopes/$ID/diagnose-finalisation" protected
          probe "emergency-retrieval" POST "/api/recovery/envelopes/$ID/emergency-retrieval" protected
          probe "nonsense" GET "/__emergency_retrieval_probe_not_a_real_route__" missing
