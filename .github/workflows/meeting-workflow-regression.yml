name: Meeting workflow regression gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/pages/Meetings.jsx"
      - "src/pages/OperationalGatewaysParticipants.jsx"
      - "src/firebase/**"
      - "functions/**"
      - "firestore.rules"
      - "tests/**"
      - ".github/workflows/meeting-workflow-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meeting-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Build production web bundle
        run: npm run build
      - name: Meeting category and Firestore rules tests
        run: npx firebase-tools emulators:exec --only firestore --project irpa-digital-board-governance "npm run test:meeting-category"
      - name: Meeting entry authorization tests
        run: npm run test:meeting-entry-policy
      - name: Portal navigation regression tests
        run: npm run test:portal-navigation
      - name: Production readability gate
        run: npm run check:production-readability
      - name: Validate Functions JavaScript syntax
        run: |
          node --check functions/index.js
          node --check functions/meetingGateway.js
