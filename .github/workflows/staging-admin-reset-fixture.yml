name: Staging Admin Reset Test Fixture

on:
  workflow_dispatch:
    inputs:
      test_uid:
        description: "UID of the dedicated staging-only test account (not a production account)"
        required: true
        type: string
        default: "mVlfzJdyneafO6S89kLJPhqCdRh2"

permissions:
  contents: read

jobs:
  seed-staging-admin-profile:
    if: github.ref == 'refs/heads/security/admin-registration-reset-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify staging target and service-account project
        id: guard
        env:
          PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.LIVEKIT_STAGING_FIREBASE_SERVICE_ACCOUNT }}
          TEST_UID: ${{ inputs.test_uid }}
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "irpa-dbg-staging-a73ec" || { echo "Refusing: staging project ID is missing or unexpected."; exit 1; }
          test "$PROJECT_ID" != "irpa-digital-board-governance" || { echo "Refusing production project."; exit 1; }
          node - <<'NODE'
          const fs = require("fs");
          const raw = process.env.SERVICE_ACCOUNT_JSON || "";
          if (!raw) throw new Error("Staging Firestore service-account secret is missing.");
          let sa;
          try { sa = JSON.parse(raw); } catch { throw new Error("Staging service-account secret is not valid JSON."); }
          if (sa.project_id !== "irpa-dbg-staging-a73ec") throw new Error("Service-account project_id does not match the isolated staging project.");
          if (!sa.client_email || !sa.private_key) throw new Error("Service-account credentials are incomplete.");
          const uid = process.env.TEST_UID || "";
          if (!/^[A-Za-z0-9:_-]{1,128}$/.test(uid)) throw new Error("Test UID has invalid format.");
          if (uid === "irpa2412@gmail.com") throw new Error("A UID must be supplied, not an email address.");
          console.log("STAGING_PROJECT_GUARD=PASS");
          console.log("STAGING_SERVICE_ACCOUNT_PROJECT_MATCH=PASS");
          console.log("TEST_UID_FORMAT=PASS");
          NODE
          echo "STAGING_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Create or update only the staging test profile
        env:
          PROJECT_ID: ${{ steps.guard.outputs.STAGING_PROJECT_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.LIVEKIT_STAGING_FIREBASE_SERVICE_ACCOUNT }}
          TEST_UID: ${{ inputs.test_uid }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require("crypto");
          const sa = JSON.parse(process.env.SERVICE_ACCOUNT_JSON);
          const projectId = process.env.PROJECT_ID;
          const uid = process.env.TEST_UID;
          if (projectId !== "irpa-dbg-staging-a73ec" || sa.project_id !== projectId) {
            throw new Error("Staging-only write guard failed.");
          }
          const now = Math.floor(Date.now() / 1000);
          const b64url = value => Buffer.from(value).toString("base64url");
          const unsigned = b64url(JSON.stringify({ alg: "RS256", typ: "JWT" })) + "." +
            b64url(JSON.stringify({
              iss: sa.client_email,
              scope: "https://www.googleapis.com/auth/datastore",
              aud: "https://oauth2.googleapis.com/token",
              iat: now,
              exp: now + 300
            }));
          const signature = crypto.sign("RSA-SHA256", Buffer.from(unsigned), sa.private_key).toString("base64url");
          const assertion = unsigned + "." + signature;
          async function main() {
            const tokenResponse = await fetch("https://oauth2.googleapis.com/token", {
              method: "POST",
              headers: { "content-type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({
                grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
                assertion
              })
            });
            const tokenBody = await tokenResponse.json().catch(() => ({}));
            if (!tokenResponse.ok || !tokenBody.access_token) {
              throw new Error("Could not obtain a short-lived staging service token (credential values are not logged).");
            }
            const url = "https://firestore.googleapis.com/v1/projects/" +
              encodeURIComponent(projectId) +
              "/databases/(default)/documents/adminProfiles/" +
              encodeURIComponent(uid) +
              "?updateMask.fieldPaths=active&updateMask.fieldPaths=role";
            const response = await fetch(url, {
              method: "PATCH",
              headers: {
                authorization: "Bearer " + tokenBody.access_token,
                "content-type": "application/json"
              },
              body: JSON.stringify({
                fields: {
                  active: { booleanValue: true },
                  role: { stringValue: "Administrator" }
                }
              })
            });
            if (!response.ok) {
              const status = response.status;
              await response.text();
              throw new Error("Staging Firestore fixture write failed with HTTP " + status + ".");
            }
            const document = await response.json();
            const fields = document.fields || {};
            if (fields.active?.booleanValue !== true || fields.role?.stringValue !== "Administrator") {
              throw new Error("Staging fixture verification failed.");
            }
            if (!document.name?.endsWith("/adminProfiles/" + uid)) {
              throw new Error("Firestore returned an unexpected document path.");
            }
            console.log("STAGING_TEST_PROFILE=READY");
            console.log("STAGING_PROFILE_ACTIVE=true");
            console.log("STAGING_PROFILE_ROLE=Administrator");
            console.log("STAGING_DOCUMENT_PATH_VERIFIED=true");
            console.log("RECOVERY_ENDPOINT_INVOKED=false");
            console.log("PRODUCTION_TOUCHED=false");
          }
          main().catch(error => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
