name: Communication website staging acceptance

on:
  push:
    branches:
      - feature/communication-media-website-20261025
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: communication-website-staging-acceptance
  cancel-in-progress: false

jobs:
  policy-and-staging-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_GATEWAY_URL: https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev
      STAGING_WORDPRESS_BASE_URL: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
      STAGING_FIREBASE_WEB_API_KEY: ${{ secrets.STAGING_FIREBASE_WEB_API_KEY }}
      STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/communication-media-website-20261025
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run website policy tests
        id: unit
        continue-on-error: true
        run: node --test drive-gateway/tests/communications-website-policy.test.mjs
      - name: Run staging acceptance
        id: acceptance
        continue-on-error: true
        run: |
          node drive-gateway/tests/staging-communications-website-acceptance.mjs > acceptance-table.md 2>&1 || true
          cat acceptance-table.md
      - name: Write the single acceptance table to summary
        if: always()
        run: |
          if [ -f acceptance-table.md ]; then
            cat acceptance-table.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WEBSITE PORTAL VERDICT: FAIL (acceptance output missing)" >> "$GITHUB_STEP_SUMMARY"
            echo "| Check | PASS or FAIL | Exact error |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Acceptance output | FAIL | No acceptance table produced |" >> "$GITHUB_STEP_SUMMARY"
          fi
          grep -q "^WEBSITE PORTAL VERDICT: PASS$" acceptance-table.md || exit 1
