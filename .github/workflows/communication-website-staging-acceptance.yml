name: Communication website staging acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: communication-website-staging-acceptance
  cancel-in-progress: false

jobs:
  policy-and-staging-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_GATEWAY_URL: https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev
      STAGING_WORDPRESS_BASE_URL: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
      STAGING_FIREBASE_WEB_API_KEY: ${{ secrets.STAGING_FIREBASE_WEB_API_KEY }}
      STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/communication-media-website-20261025
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run website policy tests
        run: node --test drive-gateway/tests/communications-website-policy.test.mjs
      - name: Run staging-only live acceptance
        id: acceptance
        run: |
          set +e
          node drive-gateway/tests/staging-communications-website-acceptance.mjs > acceptance-table.md 2>&1
          result=$?
          cat acceptance-table.md
          cat acceptance-table.md >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Redacted acceptance summary
        if: always()
        run: |
          if [ -f acceptance-table.md ]; then
            sed -E 's/(Bearer )[A-Za-z0-9._~-]+/\1[REDACTED]/g; s/(password|token|secret)(["=: ]+)[^ ,|]+/\1\2[REDACTED]/Ig' acceptance-table.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Staging acceptance output | FAIL | No acceptance table produced |" >> "$GITHUB_STEP_SUMMARY"
          fi
