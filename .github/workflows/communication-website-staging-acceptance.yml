name: Communication website staging acceptance
on:
  push:
    branches:
      - feature/communication-media-website-20261025
      - fix/optional-staging-chair-acceptance-20261028
  pull_request:
    branches:
      - feature/communication-media-website-20261025
    paths:
      - .github/workflows/communication-website-staging-acceptance.yml
      - docs/STAGING_CHAIR_TEST_USER.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: communication-website-staging-acceptance-finalized
  cancel-in-progress: false
jobs:
  verify:
    name: Verify tests, build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Root npm ci
        run: npm ci
      - name: Focused communications, OAuth and navigation regression tests
        run: npm run test:communication-media && npm run test:meta-oauth && npm run test:portal-navigation
      - name: Root build
        run: npm run build
      - name: Root lint
        run: npm run lint
      - name: Worker npm ci
        working-directory: drive-gateway
        run: npm ci
      - name: Worker communications website regression tests
        working-directory: drive-gateway
        run: npm run test:communications-website
      - name: Worker lint
        working-directory: drive-gateway
        run: npm run lint
  staging-acceptance:
    name: Optional staging-only website acceptance
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_GATEWAY_URL: https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev
      STAGING_WORDPRESS_BASE_URL: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
      STAGING_FIREBASE_WEB_API_KEY: ${{ secrets.STAGING_FIREBASE_WEB_API_KEY }}
      STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
      STAGING_CHAIR_TEST_EMAIL: ${{ secrets.STAGING_CHAIR_TEST_EMAIL }}
      STAGING_CHAIR_TEST_PASSWORD: ${{ secrets.STAGING_CHAIR_TEST_PASSWORD }}
    steps:
      - name: Skip cleanly when dedicated Chair test credentials are absent
        id: chair_preflight
        env:
          CHAIR_EMAIL: ${{ secrets.STAGING_CHAIR_TEST_EMAIL }}
          CHAIR_PASSWORD: ${{ secrets.STAGING_CHAIR_TEST_PASSWORD }}
        run: |
          if [ -z "$CHAIR_EMAIL" ] || [ -z "$CHAIR_PASSWORD" ]; then
            echo "staging acceptance skipped: STAGING_CHAIR_TEST_EMAIL and STAGING_CHAIR_TEST_PASSWORD not configured"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chair_preflight.outputs.skip != 'true'
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        if: steps.chair_preflight.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Preflight require dedicated test identities and staging-only hosts
        if: steps.chair_preflight.outputs.skip != 'true'
        run: |
          set -eu
          for name in STAGING_WORDPRESS_BASE_URL STAGING_FIREBASE_WEB_API_KEY STAGING_TEST_EMAIL STAGING_TEST_PASSWORD; do
            eval 'value=${!name}'
            [ -n "$value" ] || { echo "Missing required Actions secret name: $name"; exit 1; }
          done
          [ "$STAGING_CHAIR_TEST_EMAIL" = "irpa-staging-chair-test@staging.irpa.or.tz" ] || { echo "Refusing non-dedicated Chair test identity."; exit 1; }
          [ "$STAGING_TEST_EMAIL" = "irpa-staging-editor-test@staging.irpa.or.tz" ] || { echo "Refusing non-dedicated editor test identity."; exit 1; }
          node --input-type=module -e '
            import { assertStagingWebsiteHost } from "./drive-gateway/src/communicationsWebsitePolicy.mjs";
            const u = new URL(process.env.STAGING_WORDPRESS_BASE_URL);
            if (u.protocol !== "https:" || u.hostname !== "staging.irpa.or.tz" || u.pathname !== "/" || u.username || u.password || u.search || u.hash) throw new Error("Refusing non-staging WordPress URL.");
            assertStagingWebsiteHost(u.href);
            const g = new URL(process.env.STAGING_GATEWAY_URL);
            if (g.protocol !== "https:" || g.hostname !== "irpa-google-drive-gateway-staging.irpa-governance.workers.dev") throw new Error("Refusing non-staging gateway.");
          '
          echo "Preflight passed: dedicated test identities and exact staging hosts only; secret values were not printed."
      - name: Run complete staging acceptance
        if: steps.chair_preflight.outputs.skip != 'true'
        id: acceptance
        continue-on-error: true
        run: node drive-gateway/tests/staging-communications-website-acceptance.mjs
      - name: Publish acceptance summary
        if: always() && steps.chair_preflight.outputs.skip != 'true'
        run: |
          if [ -f acceptance-summary.md ]; then
            cat acceptance-summary.md | tee -a "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'WEBSITE PORTAL VERDICT: FAIL (acceptance output missing)' '' '| Check | Result | Detail |' '|---|---|---|' '| Acceptance output | FAIL | results.tsv and summary were not created |' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f results.tsv ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Raw results.tsv:" >> "$GITHUB_STEP_SUMMARY"
            cat results.tsv >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fail unless acceptance verdict is PASS
        if: always() && steps.chair_preflight.outputs.skip != 'true'
        run: grep -qx 'WEBSITE PORTAL VERDICT: PASS' acceptance-summary.md
