name: email-signing-contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email-signing-contract:
    name: email-signing-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            drive-gateway/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefix drive-gateway
      - name: Run email signing contract
        run: node --test drive-gateway/tests/email-signing-contract.test.mjs
      - name: Run email signer review and submission navigation regression
        run: node --test tests/email-signing-review-navigation.test.mjs
      - name: Run email signing integration regressions
        run: node --test drive-gateway/tests/email-signing-links.integration.test.mjs
      - name: Install frontend dependencies
        run: npm ci
      - name: Set up Java for isolated Firebase browser emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install emulator-only fixture seeding dependency
        run: npm --prefix functions install --omit=dev
      - name: Install Playwright for startup smoke
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium for startup smoke
        run: npx playwright install --with-deps chromium
      - name: Run clean and mocked signed-in startup smoke at Android and desktop widths
        run: npx firebase emulators:exec --config firebase.emulator.test.json --only auth,firestore --project demo-irpa-dgbs "node scripts/seed-authenticated-browser-fixture.cjs && npx playwright test --config=playwright.authenticated-governance.config.mjs tests/browser/signature-self-test-startup.spec.mjs --workers=1"
      - name: Run Signature Pathway Self-Test session-safety regression
        run: npm run test:signature-self-test
      - name: Smoke-test public production entry bundles and every imported chunk on both hosts
        run: node scripts/signature-self-test-public-assets-smoke.mjs
      - name: Run seven-portal protection smoke tests
        run: node scripts/portal-protection-smoke.mjs
      - name: Run full repository regression suite
        run: npm run test:all
