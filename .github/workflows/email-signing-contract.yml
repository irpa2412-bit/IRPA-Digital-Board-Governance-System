name: email-signing-contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email-signing-contract:
    name: email-signing-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            drive-gateway/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefix drive-gateway
      - name: Run email signing contract
        run: node --test drive-gateway/tests/email-signing-contract.test.mjs
      - name: Run email signer review and submission navigation regression
        run: node --test tests/email-signing-review-navigation.test.mjs
      - name: Run email signing integration regressions
        run: node --test drive-gateway/tests/email-signing-links.integration.test.mjs
      - name: Install frontend dependencies
        run: npm ci
      - name: Run Signature Pathway Self-Test safety and 500-document stress regressions
        run: npm run test:signature-self-test
      - name: Build production application for startup smoke
        env:
          VITE_USE_FIREBASE_EMULATORS: "true"
        run: npm run build
      - name: Install headless browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Start built application
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort > "$RUNNER_TEMP/signature-startup.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/signature-startup.pid"
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/signature-startup.log"
          exit 1
      - name: Run built-app startup smoke at desktop and Android widths
        run: node tests/browser/signature-self-test-startup-smoke.mjs
      - name: Run seven-portal protection smoke tests
        run: node scripts/portal-protection-smoke.mjs
