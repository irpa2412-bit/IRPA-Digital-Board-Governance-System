name: IRPA Grant Crawler — Isolated Staging
on:
  push:
    branches:
      - feature/isolated-grant-crawler-staging
    paths:
      - "cloudflare/grant-crawler/**"
      - ".github/workflows/grant-crawler-staging.yml"
  pull_request:
    paths:
      - "cloudflare/grant-crawler/**"
      - ".github/workflows/grant-crawler-staging.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: irpa-grant-crawler-staging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/grant-crawler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run parser, authentication and isolation tests
        run: npm run check
      - name: Verify deployment config cannot target production gateway
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = fs.readFileSync('wrangler.toml', 'utf8');
          if (config.includes('irpa-google-drive-gateway')) throw new Error('Crawler config references production gateway.');
          if (!config.includes('name = "irpa-grant-crawler-staging"')) throw new Error('Staging Worker name missing.');
          if (!config.includes('IRPA_ENVIRONMENT = "staging"')) throw new Error('Staging environment marker missing.');
          if (!config.includes('database_name = "irpa-grant-crawler-staging"')) throw new Error('Staging D1 database missing.');
          NODE
  firebase-rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install repository test dependencies
        run: npm ci
      - name: Set up Java 21 for the Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify isolated Firebase rules in the emulator
        run: npx firebase emulators:exec --config cloudflare/grant-crawler/firebase-staging/firebase.json --only firestore --project demo-irpa-grant-crawler-staging-test "node --test cloudflare/grant-crawler/firebase-staging/firestore.rules.test.js"

  deploy-staging:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/feature/isolated-grant-crawler-staging')
    needs: test
    runs-on: ubuntu-latest
    environment: irpa-grant-crawler-staging
    defaults:
      run:
        working-directory: cloudflare/grant-crawler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Validate scoped deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GRANT_CRAWLER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GRANT_CRAWLER_CONTROL_TOKEN: ${{ secrets.GRANT_CRAWLER_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#GRANT_CRAWLER_CONTROL_TOKEN}" -ge 32
          echo "Required secret presence validated; values are not printed."
      - name: Create or locate isolated staging D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GRANT_CRAWLER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
          database_id="$(node - "$response" <<'NODE'
          const a = JSON.parse(process.argv[2]);
          if (!a.success) throw new Error('Cloudflare D1 listing failed.');
          const d = (a.result || []).find(x => x.name === 'irpa-grant-crawler-staging');
          if (d?.uuid) process.stdout.write(d.uuid);
          NODE
          )"
          if [ -z "$database_id" ]; then
            created="$(curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"irpa-grant-crawler-staging"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
            database_id="$(node - "$created" <<'NODE'
          const a = JSON.parse(process.argv[2]);
          if (!a.success || !a.result?.uuid) throw new Error('Could not create isolated staging D1 database.');
          process.stdout.write(a.result.uuid);
          NODE
            )"
          fi
          node - "$database_id" <<'NODE'
          const fs = require('fs');
          const id = process.argv[2];
          if (!/^[0-9a-f-]{36}$/i.test(id)) throw new Error('Invalid staging D1 identifier.');
          let config = fs.readFileSync('wrangler.toml', 'utf8');
          config = config.replaceAll('00000000-0000-0000-0000-000000000000', id);
          fs.writeFileSync('wrangler.toml', config);
          NODE
          echo "Isolated staging database configured; ID is not printed."
      - name: Apply staging D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GRANT_CRAWLER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply irpa-grant-crawler-staging --env staging --remote
      - name: Deploy only the isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GRANT_CRAWLER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GRANT_CRAWLER_CONTROL_TOKEN: ${{ secrets.GRANT_CRAWLER_CONTROL_TOKEN }}
          GRANT_CRAWLER_FEED_URLS: ${{ secrets.GRANT_CRAWLER_FEED_URLS }}
        run: |
          set -euo pipefail
          npx wrangler secret put CRAWLER_CONTROL_TOKEN --env staging <<< "$GRANT_CRAWLER_CONTROL_TOKEN"
          if [ -n "${GRANT_CRAWLER_FEED_URLS:-}" ]; then
            node - "$GRANT_CRAWLER_FEED_URLS" <<'NODE'
          const feeds = JSON.parse(process.argv[2]);
          if (!Array.isArray(feeds) || feeds.length > 30) throw new Error('Feed secret must be a JSON array with at most 30 URLs.');
          for (const value of feeds) {
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.username || url.password || (url.port && url.port !== '443')) throw new Error('Every feed must use credential-free HTTPS on port 443.');
          }
          NODE
            printf '%s' "$GRANT_CRAWLER_FEED_URLS" | npx wrangler secret put GRANT_FEED_URLS_JSON --env staging
          fi
          deploy_log="$(npx wrangler deploy --env staging 2>&1)"
          printf '%s\n' "$deploy_log"
          worker_url="$(printf '%s\n' "$deploy_log" | grep -Eo 'https://irpa-grant-crawler-staging\.[a-zA-Z0-9.-]+\.workers\.dev' | head -n 1 || true)"
          if [ -z "$worker_url" ]; then
            echo "Could not safely resolve the deployed staging URL from Wrangler output." >&2
            exit 1
          fi
          health="$(curl --fail --silent --show-error --max-time 15 "$worker_url/health")"
          node - "$health" <<'NODE'
          const body = JSON.parse(process.argv[2]);
          if (body.service !== 'irpa-grant-crawler' || body.environment !== 'staging' || body.storage !== 'configured') throw new Error('Staging health response failed.');
          if (!String(body.firebase).startsWith('disabled-by-design')) throw new Error('Firebase sync must remain disabled.');
          console.log('Staging health verification passed; Firebase remains disabled.');
          NODE
      - name: Run live feed discovery and IRPA topic-fit assessment
        env:
          GRANT_CRAWLER_CONTROL_TOKEN: ${{ secrets.GRANT_CRAWLER_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          result="$(curl --silent --show-error --max-time 90 -X POST \
            -H "Authorization: Bearer $GRANT_CRAWLER_CONTROL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://irpa-grant-crawler-staging.irpa-governance.workers.dev/crawl")"
          node - "$result" <<'NODE'
          const result = JSON.parse(process.argv[2]);
          if (result.status !== 'success') {
            console.error(JSON.stringify({ status: result.status || 'error', error: result.error || 'Unknown crawler error' }, null, 2));
            process.exit(1);
          }
          if (result.feedsConfigured < 1) throw new Error('No official feeds are configured.');
          console.log(JSON.stringify({
            status: result.status,
            feedsConfigured: result.feedsConfigured,
            itemsSeen: result.itemsSeen,
            recordsChanged: result.recordsChanged,
            irpaFitMatches: result.irpaFitMatches
          }, null, 2));
          NODE
