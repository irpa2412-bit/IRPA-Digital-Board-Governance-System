name: Meeting Portal Isolated Browser Regression
on:
  pull_request:
    branches: [main, security/member-role-array-emulator-proof]
    paths:
      - "src/pages/Meetings.jsx"
      - "docs/portal-protection/repair-window.json"
      - "docs/implementation-status.md"
      - "docs/portal-protection/records/meeting-portal.json"
      - "docs/portal-protection/windows/meeting-portal.json"
      - "scripts/portal-protection-check.mjs"
      - "tests/portal-protection-policy.test.mjs"
      - "drive-gateway/src/meetingEnvironment.mjs"
      - "drive-gateway/src/meetingDeletion.mjs"
      - "drive-gateway/tests/meeting-trial-deletion.test.mjs"
      - "src/pages/Meetings.jsx"
      - "tests/meeting-trial-delete-ui.test.mjs"
      - "drive-gateway/tests/meeting-environment.test.mjs"
      - "src/pages/MeetingRoom.jsx"
      - "src/pages/OperationalGatewaysParticipants.jsx"
      - "src/firebase/meetingPolicy.js"
      - "src/firebase/meetingGatewayApi.js"
      - "src/firebase/meetingRecords.js"
      - "src/firebase/meetingAttendanceSigning.js"
      - "src/firebase/meetingAttendanceSignerIdentity.js"
      - "drive-gateway/src/meetingPortal.mjs"
      - "drive-gateway/src/meetingServices.mjs"
      - "drive-gateway/tests/meeting-portal-router.test.mjs"
      - "drive-gateway/tests/meeting-services-router.test.mjs"
      - "tests/meeting-portal-browser.test.mjs"
      - "tests/meeting-portal-protection.test.mjs"
      - "tests/meeting-daily-attendance-email-signing.test.mjs"
      - "tests/meeting-quorum-reconciliation.test.mjs"
      - "tests/meeting-attendance-guest-identity.test.mjs"
      - "tests/meeting-time-eat.test.mjs"
      - "tests/meeting-registration-connectivity.test.mjs"
      - "tests/meeting-configurable-quorum.test.mjs"
      - "tests/meeting-category-policy.test.mjs"
      - "tests/meeting-isolation-guard.test.mjs"
      - "tests/fixtures/**"
      - "vite.meeting-fixture.config.js"
      - "scripts/meeting-portal-fixture-isolation-guard.sh"
      - ".github/workflows/meeting-portal-fixture-browser.yml"
  workflow_dispatch: {}
concurrency:
  group: meeting-portal-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:

  # Evidence jobs deliberately check out pull_request.base.sha, never the PR head.
  # Push a fresh PR revision after main advances so the evidence event captures the new base SHA.
  baseline-protection-smoke:
    name: baseline-protection-smoke-${{ github.event.pull_request.base.sha }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact pre-change base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Record exact baseline source commit
        run: echo "BASELINE_SOURCE_SHA=${{ github.event.pull_request.base.sha }}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run registered protected-portal baseline smoke
        run: npm run test:protected-portals

  baseline-full-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact pre-change base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Record exact baseline source commit
        run: echo "BASELINE_SOURCE_SHA=${{ github.event.pull_request.base.sha }}"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Build baseline application
        run: npm run build
      - name: Verify portal navigation
        run: npm run test:portal-navigation
      - name: Verify meeting entry policy
        run: npm run test:meeting-entry-policy
      - name: Verify meeting invitation quorum
        run: npm run test:meeting-invitation-resend
      - name: Verify Cloudflare client migration contracts
        run: node --test tests/cloudflare-password-client-migration.test.mjs tests/cloudflare-document-reference-migration.test.mjs
      - name: Set up Java for Firebase emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify finance policy with Firestore emulator
        run: npx firebase emulators:exec --only firestore --project demo-irpa-dgbs "npm run test:finance-policy"
      - name: Install Gateway dependencies
        run: npm ci --prefix drive-gateway
      - name: Run Gateway regression suite
        run: npm test --prefix drive-gateway
      - name: Run full root regression suite in Firestore emulator
        run: npx firebase emulators:exec --only firestore --project demo-irpa-dgbs "npm run test:all"

  isolated-meeting-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Test source-isolation guard policy
        run: node --test tests/meeting-isolation-guard.test.mjs
      - name: Test meeting policy and invitation removal
        run: node --test tests/invitation-removal-policy.test.mjs tests/meeting-category-policy.test.mjs tests/meeting-quorum-reconciliation.test.mjs
      - name: Install isolated browser runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Assert runtime source isolation from unrelated portals
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if grep -Fq 'BASE_REF="${GITHUB_BASE_REF:-main}"' scripts/meeting-portal-fixture-isolation-guard.sh; then
            bash scripts/meeting-portal-fixture-isolation-guard.sh
          else
            echo "Fixture source-isolation check is deferred to the dependent Meeting Portal implementation PR."
          fi
      - name: Start the isolated Vite fixture
        run: |
          set -euo pipefail
          npm exec vite -- --config vite.meeting-fixture.config.js --host 127.0.0.1 --port 4179 > "$RUNNER_TEMP/meeting-fixture.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/meeting-fixture.pid"
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4179/tests/fixtures/meeting-portal-fixture.html >/dev/null; then
              echo "ISOLATED_FIXTURE_READY=true"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/meeting-fixture.log"
          exit 1
      - name: Run Meeting Portal browser regression at four viewport sizes
        run: node tests/meeting-portal-browser.test.mjs
      - name: Upload fixture server diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meeting-portal-fixture-diagnostics
          path: ${{ runner.temp }}/meeting-fixture.log
