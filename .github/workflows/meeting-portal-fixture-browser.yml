name: Meeting Portal Isolated Browser Regression
on:
  push:
    paths:
      - "src/pages/Meetings.jsx"
      - "src/pages/MeetingRoom.jsx"
      - "src/pages/OperationalGatewaysParticipants.jsx"
      - "src/firebase/meetingPolicy.js"
      - "src/firebase/meetingGatewayApi.js"
      - "src/firebase/meetingRecords.js"
      - "src/firebase/meetingAttendanceSigning.js"
      - "src/firebase/meetingAttendanceSignerIdentity.js"
      - "drive-gateway/src/meetingPortal.mjs"
      - "drive-gateway/src/meetingServices.mjs"
      - "drive-gateway/tests/meeting-portal-router.test.mjs"
      - "drive-gateway/tests/meeting-services-router.test.mjs"
      - "tests/meeting-portal-browser.test.mjs"
      - "tests/meeting-portal-protection.test.mjs"
      - "tests/meeting-daily-attendance-email-signing.test.mjs"
      - "tests/meeting-quorum-reconciliation.test.mjs"
      - "tests/meeting-attendance-guest-identity.test.mjs"
      - "tests/meeting-time-eat.test.mjs"
      - "tests/meeting-registration-connectivity.test.mjs"
      - "tests/meeting-configurable-quorum.test.mjs"
      - "tests/meeting-category-policy.test.mjs"
      - "tests/meeting-isolation-guard.test.mjs"
      - "tests/fixtures/**"
      - "vite.meeting-fixture.config.js"
      - "scripts/meeting-portal-fixture-isolation-guard.sh"
      - ".github/workflows/meeting-portal-fixture-browser.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/pages/Meetings.jsx"
      - "src/pages/MeetingRoom.jsx"
      - "src/pages/OperationalGatewaysParticipants.jsx"
      - "src/firebase/meetingPolicy.js"
      - "src/firebase/meetingGatewayApi.js"
      - "src/firebase/meetingRecords.js"
      - "src/firebase/meetingAttendanceSigning.js"
      - "src/firebase/meetingAttendanceSignerIdentity.js"
      - "drive-gateway/src/meetingPortal.mjs"
      - "drive-gateway/src/meetingServices.mjs"
      - "drive-gateway/tests/meeting-portal-router.test.mjs"
      - "drive-gateway/tests/meeting-services-router.test.mjs"
      - "tests/meeting-portal-browser.test.mjs"
      - "tests/meeting-portal-protection.test.mjs"
      - "tests/meeting-daily-attendance-email-signing.test.mjs"
      - "tests/meeting-quorum-reconciliation.test.mjs"
      - "tests/meeting-attendance-guest-identity.test.mjs"
      - "tests/meeting-time-eat.test.mjs"
      - "tests/meeting-registration-connectivity.test.mjs"
      - "tests/meeting-configurable-quorum.test.mjs"
      - "tests/meeting-category-policy.test.mjs"
      - "tests/meeting-isolation-guard.test.mjs"
      - "tests/fixtures/**"
      - "vite.meeting-fixture.config.js"
      - "scripts/meeting-portal-fixture-isolation-guard.sh"
      - ".github/workflows/meeting-portal-fixture-browser.yml"
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  isolated-meeting-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Test source-isolation guard policy
        run: node --test tests/meeting-isolation-guard.test.mjs
      - name: Test meeting policy and invitation removal
        run: node --test tests/invitation-removal-policy.test.mjs tests/meeting-category-policy.test.mjs tests/meeting-quorum-reconciliation.test.mjs
      - name: Install isolated browser runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Assert runtime source isolation from unrelated portals
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/meeting-portal-fixture-isolation-guard.sh
      - name: Start the isolated Vite fixture
        run: |
          set -euo pipefail
          npm exec vite -- --config vite.meeting-fixture.config.js --host 127.0.0.1 --port 4179 > "$RUNNER_TEMP/meeting-fixture.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/meeting-fixture.pid"
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4179/tests/fixtures/meeting-portal-fixture.html >/dev/null; then
              echo "ISOLATED_FIXTURE_READY=true"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/meeting-fixture.log"
          exit 1
      - name: Run Meeting Portal browser regression at four viewport sizes
        run: node tests/meeting-portal-browser.test.mjs
      - name: Upload fixture server diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meeting-portal-fixture-diagnostics
          path: ${{ runner.temp }}/meeting-fixture.log
