name: Meeting Portal Isolated Browser Regression
# Verification-only regression workflow; no production deployment is performed.
# Isolated fixture-only browser checks; no production credentials or live meeting sessions.
on:
  push:
    branches: [feat/secure-meeting-invitation-flow-20261013, test/meeting-signature-portal-browser-regression-20261014, fix/signature-gateway-cryptographic-bridge-20261015]
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/pages/Meetings.jsx"
      - "drive-gateway/src/invitationRedemption.mjs"
      - "drive-gateway/tests/invitation-redemption.test.mjs"
      - "functions/meetingGateway.emulator.test.cjs"
      - "tests/meeting-isolation-guard.test.mjs"
      - ".github/workflows/meeting-portal-fixture-browser.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/pages/Meetings.jsx"
      - "src/firebase/data.js"
      - "src/pages/Invitations.jsx"
      - "functions/index.js"
      - "tests/invitation-removal-policy.test.mjs"
      - "functions/meetingGateway.js"
      - "src/pages/OperationalGatewaysParticipants.jsx"
      - "firestore.rules"
      - "src/firebase/meetingPolicy.js"
      - "tests/meeting-portal-browser.test.mjs"
      - "tests/meeting-category-firestore-rules.test.cjs"
      - "tests/meeting-category-policy.test.mjs"
      - ".github/workflows/signature-migration-build-test.yml"
      - "drive-gateway/wrangler.toml"
      - "drive-gateway/src/signatureAssetAuthorization.mjs"
      - "drive-gateway/src/signatureProfileAuthorization.mjs"
      - "drive-gateway/tests/signature-asset-authorization.test.mjs"
      - "drive-gateway/tests/signature-profile-folder-authorization.test.mjs"
      - "drive-gateway/tests/signature-profile-folder-runtime.test.mjs"
      - "src/firebase/signaturePlatform.js"
      - "src/firebase/signatureStorage.js"
      - "src/firebase/signatureWorkflowPolicy.js"
      - "src/pages/SignaturePlatform.jsx"
      - "tests/signature-workflow-policy.test.mjs"
      - "tests/fixtures/**"
      - "vite.meeting-fixture.config.js"
      - ".github/workflows/meeting-portal-fixture-browser.yml"
      - "tests/meeting-isolation-guard.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-meeting-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Test source-isolation guard policy
        run: node --test tests/meeting-isolation-guard.test.mjs
      - name: Test administrator-only invitation removal policy
        run: node --test tests/invitation-removal-policy.test.mjs
      - name: Install isolated browser runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Validate workflow syntax with actionlint
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest .github/workflows/meeting-portal-fixture-browser.yml
      - name: Assert runtime source isolation from unrelated portals
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          node scripts/ci/meeting-fixture-isolation.mjs
      - name: Start the isolated Vite fixture
        run: |
          set -euo pipefail
          npm exec vite -- --config vite.meeting-fixture.config.js --host 127.0.0.1 --port 4179 > "$RUNNER_TEMP/meeting-fixture.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/meeting-fixture.pid"
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4179/tests/fixtures/meeting-portal-fixture.html >/dev/null; then
              echo "ISOLATED_FIXTURE_READY=true"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/meeting-fixture.log"
          exit 1
      - name: Run mobile and desktop authenticated-identity fixture tests
        run: node tests/meeting-portal-browser.test.mjs
      - name: Upload fixture server diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meeting-portal-fixture-diagnostics
          path: ${{ runner.temp }}/meeting-fixture.log
