name: Deploy IRPA LiveKit Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type DEPLOY-LIVEKIT to authorize deployment to the configured VM"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: irpa-livekit-deployment
  cancel-in-progress: false

jobs:
  deploy-livekit:
    if: ${{ inputs.confirm_deployment == 'DEPLOY-LIVEKIT' }}
    runs-on: ubuntu-latest
    environment: livekit-production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          LIVEKIT_SSH_HOST: ${{ secrets.LIVEKIT_SSH_HOST }}
          LIVEKIT_SSH_USER: ${{ secrets.LIVEKIT_SSH_USER }}
          LIVEKIT_SSH_PRIVATE_KEY: ${{ secrets.LIVEKIT_SSH_PRIVATE_KEY }}
          LIVEKIT_SSH_KNOWN_HOSTS: ${{ secrets.LIVEKIT_SSH_KNOWN_HOSTS }}
          LIVEKIT_DOMAIN: ${{ secrets.LIVEKIT_DOMAIN }}
          LIVEKIT_TURN_DOMAIN: ${{ secrets.LIVEKIT_TURN_DOMAIN }}
          LIVEKIT_ACME_EMAIL: ${{ secrets.LIVEKIT_ACME_EMAIL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          set -euo pipefail
          for name in LIVEKIT_SSH_HOST LIVEKIT_SSH_USER LIVEKIT_SSH_PRIVATE_KEY LIVEKIT_SSH_KNOWN_HOSTS LIVEKIT_DOMAIN LIVEKIT_TURN_DOMAIN LIVEKIT_ACME_EMAIL LIVEKIT_API_KEY LIVEKIT_API_SECRET; do
            if [[ -z "${!name:-}" ]]; then echo "Missing required secret: $name" >&2; exit 1; fi
          done
          [[ "$LIVEKIT_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$LIVEKIT_TURN_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$LIVEKIT_API_KEY" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$LIVEKIT_API_SECRET" =~ ^[A-Za-z0-9_-]+$ ]]

      - name: Install pinned SSH host identity
        env:
          LIVEKIT_SSH_PRIVATE_KEY: ${{ secrets.LIVEKIT_SSH_PRIVATE_KEY }}
          LIVEKIT_SSH_KNOWN_HOSTS: ${{ secrets.LIVEKIT_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$LIVEKIT_SSH_PRIVATE_KEY" > ~/.ssh/irpa-livekit
          chmod 600 ~/.ssh/irpa-livekit
          printf '%s\n' "$LIVEKIT_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package and upload infrastructure configuration
        env:
          LIVEKIT_SSH_HOST: ${{ secrets.LIVEKIT_SSH_HOST }}
          LIVEKIT_SSH_USER: ${{ secrets.LIVEKIT_SSH_USER }}
          LIVEKIT_DOMAIN: ${{ secrets.LIVEKIT_DOMAIN }}
          LIVEKIT_TURN_DOMAIN: ${{ secrets.LIVEKIT_TURN_DOMAIN }}
          LIVEKIT_ACME_EMAIL: ${{ secrets.LIVEKIT_ACME_EMAIL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"; rm -f ~/.ssh/irpa-livekit' EXIT
          cp infra/livekit/{bootstrap.sh,docker-compose.yml,Caddyfile,livekit.yaml.template} "$tmp/"
          chmod 700 "$tmp/bootstrap.sh"
          umask 077
          printf 'LIVEKIT_DOMAIN=%s\nLIVEKIT_TURN_DOMAIN=%s\nLIVEKIT_ACME_EMAIL=%s\nLIVEKIT_API_KEY=%s\nLIVEKIT_API_SECRET=%s\n' \
            "$LIVEKIT_DOMAIN" "$LIVEKIT_TURN_DOMAIN" "$LIVEKIT_ACME_EMAIL" "$LIVEKIT_API_KEY" "$LIVEKIT_API_SECRET" > "$tmp/.env"
          chmod 600 "$tmp/.env"
          ssh -i ~/.ssh/irpa-livekit -o BatchMode=yes "$LIVEKIT_SSH_USER@$LIVEKIT_SSH_HOST" 'mkdir -p /tmp/irpa-livekit-deploy'
          scp -i ~/.ssh/irpa-livekit -o BatchMode=yes "$tmp/"{bootstrap.sh,docker-compose.yml,Caddyfile,livekit.yaml.template,.env} "$LIVEKIT_SSH_USER@$LIVEKIT_SSH_HOST:/tmp/irpa-livekit-deploy/"
          ssh -i ~/.ssh/irpa-livekit -o BatchMode=yes "$LIVEKIT_SSH_USER@$LIVEKIT_SSH_HOST" \
            'set -Eeuo pipefail; trap "sudo rm -rf /tmp/irpa-livekit-deploy" EXIT; sudo bash /tmp/irpa-livekit-deploy/bootstrap.sh /tmp/irpa-livekit-deploy/.env'

      - name: Verify public TLS endpoint
        env:
          LIVEKIT_DOMAIN: ${{ secrets.LIVEKIT_DOMAIN }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' "https://${LIVEKIT_DOMAIN}/" || true)"
          if [[ ! "${code}" =~ ^[234][0-9][0-9]$ ]]; then
            echo "TLS endpoint failed its HTTPS handshake or returned a server error (HTTP ${code:-none}). Inspect VM service logs and firewall/DNS." >&2
            exit 1
          fi
          echo "HTTPS/TLS endpoint responded with HTTP ${code}. This is not yet proof of a WebRTC media session."

  deploy-firebase-token-function:
    needs: deploy-livekit
    runs-on: ubuntu-latest
    environment: livekit-production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Authenticate to the existing IRPA Firebase project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Configure LiveKit secret bindings and deploy only the token callable
        env:
          LIVEKIT_DOMAIN: ${{ secrets.LIVEKIT_DOMAIN }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          set -euo pipefail
          test -n "${LIVEKIT_DOMAIN}"
          test -n "${LIVEKIT_API_KEY}"
          test -n "${LIVEKIT_API_SECRET}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"; rm -f functions/.env.irpa-digital-board-governance' EXIT
          umask 077
          printf '%s' "$LIVEKIT_API_KEY" > "$tmp/livekit-api-key"
          printf '%s' "$LIVEKIT_API_SECRET" > "$tmp/livekit-api-secret"
          npm install --global firebase-tools
          firebase functions:secrets:set LIVEKIT_API_KEY --data-file "$tmp/livekit-api-key" --project irpa-digital-board-governance --force
          firebase functions:secrets:set LIVEKIT_API_SECRET --data-file "$tmp/livekit-api-secret" --project irpa-digital-board-governance --force
          printf 'LIVEKIT_URL=wss://%s\n' "$LIVEKIT_DOMAIN" > functions/.env.irpa-digital-board-governance
          chmod 600 functions/.env.irpa-digital-board-governance
          npm ci --prefix functions
          firebase deploy --only functions:issueLiveMeetingToken --project irpa-digital-board-governance

      - name: Report deployment boundary
        if: always()
        run: |
          echo "This workflow does not deploy the web application or alter Firebase authorization rules."
          echo "A two-browser WebRTC test is still required before meeting readiness can be declared."
