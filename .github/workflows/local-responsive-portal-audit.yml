name: Local Responsive Portal Audit (Report Only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/styles/**"
      - "tests/portal-responsive-browser.test.mjs"
      - "tests/fixtures/portal-layout-fixture.html"
      - "tests/fixtures/portal-layout-fixture.jsx"
      - "vite.responsive-fixture.config.js"
      - "playwright.responsive-audit.config.mjs"
      - ".github/workflows/local-responsive-portal-audit.yml"

permissions:
  contents: read

concurrency:
  group: local-responsive-portal-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-audit:
    name: Collect responsive findings without PR gating
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out mainline
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright without changing the lockfile
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run report-only responsive audit
        run: npx playwright test --config=playwright.responsive-audit.config.mjs

      - name: Upload responsive audit report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irpa-portal-responsive-audit-${{ github.sha }}
          path: artifacts/portal-responsive-audit/
          if-no-files-found: warn
          retention-days: 14
