name: Scheduled website health and safe maintenance
on:
  schedule:
    - cron: "17 5 */2 * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scheduled-staging-website-health
  cancel-in-progress: false
jobs:
  staging-health:
    name: Staging-only website health check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_GATEWAY_URL: https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev
      STAGING_WORDPRESS_BASE_URL: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
      STAGING_FIREBASE_WEB_API_KEY: ${{ secrets.STAGING_FIREBASE_WEB_API_KEY }}
      STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
      STAGING_MAINTENANCE_API_URL: ${{ secrets.STAGING_MAINTENANCE_API_URL }}
      STAGING_MAINTENANCE_API_TOKEN: ${{ secrets.STAGING_MAINTENANCE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run read-only health checks with bounded retries
        run: |
          set -o pipefail
          node scripts/staging-website-health-maintenance.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run allowlisted staging maintenance and rollback verification
        run: |
          set -o pipefail
          node scripts/website-maintenance-engine.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: State safety boundary
        if: always()
        run: |
          {
            echo ""
            echo "## Maintenance safety boundary"
            echo "- Scheduled cadence: every two days (UTC cron)."
            echo "- Target: staging.irpa.or.tz and the dedicated staging Worker only."
            echo "- Automatic behavior: bounded retries, plus allowlisted staging repairs only when the restricted host adapter is configured."
            echo "- Content, user, settings, and website-file edits are not performed by this job; core/plugin/theme updates are restricted to exact pinned versions via the host adapter."
            echo "- Human approval remains required for content changes in the Communications Portal."
            echo "- WordPress updates require a verified restorable backup, exact pinned staging manifest, compatibility plan, post-update checks, and rollback on failure."
            echo "- No host adapter/token means maintenance mutations are disabled; no production host is accepted."
          } >> "$GITHUB_STEP_SUMMARY"
