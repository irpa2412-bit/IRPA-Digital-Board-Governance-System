name: Deploy IRPA Governance to Firebase
# Deployment trigger for current production changes
# Administrator Gateway fix deployment marker: 2026-09-21T22:20Z
# Production restore redeploy: 2026-09-22T12:03Z
# V3 Meeting Centre safety hardening redeploy trigger: 2026-09-24T08:46Z
# Signature Profile save authorization redeploy trigger: 2026-09-24T16:51Z
# Safe production deployment verification marker: 2026-09-25T19:54Z — deploy current main (includes 56f7df3) without changing application behavior.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web and Android packaging dependencies
        run: npm install

      - name: Build web application
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_DRIVE_GATEWAY_URL: ${{ secrets.VITE_GOOGLE_DRIVE_GATEWAY_URL }}
          VITE_GOOGLE_WEATHER_API_KEY: ${{ secrets.VITE_GOOGLE_WEATHER_API_KEY }}
        run: npm run build

      - name: Bootstrap primary administrator authorization
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          NODE_PATH: ${{ github.workspace }}/functions/node_modules
        run: |
          npm --prefix functions install --omit=dev
          node <<'NODE'
          const { initializeApp, cert } = require("firebase-admin/app");
          const { getAuth } = require("firebase-admin/auth");
          const { getFirestore, FieldValue } = require("firebase-admin/firestore");

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          initializeApp({ credential: cert(serviceAccount) });

          (async () => {
            const auth = getAuth();
            const db = getFirestore();
            const administrators = [
              { email: "irpa2412@gmail.com", name: "IRPA Primary Administrator" },
            ];

            for (const administrator of administrators) {
              const user = await auth.getUserByEmail(administrator.email);

              await db.collection("adminProfiles").doc(user.uid).set({
                uid: user.uid,
                email: administrator.email,
                name: administrator.name,
                role: "Administrator",
                active: true,
                createdByUid: "irpa2412@gmail.com",
                createdByEmail: "irpa2412@gmail.com",
                updatedAt: FieldValue.serverTimestamp()
              }, { merge: true });

              await auth.setCustomUserClaims(user.uid, {
                ...(user.customClaims || {}),
                admin: true
              });

              console.log(`Administrator authorization bootstrapped for ${administrator.email} (UID ${user.uid}).`);
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Synchronize server-controlled authorization claims
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          NODE_PATH: ${{ github.workspace }}/functions/node_modules
        run: |
          node <<'NODE'
          const { initializeApp, cert } = require("firebase-admin/app");
          const { getAuth } = require("firebase-admin/auth");
          const { getFirestore } = require("firebase-admin/firestore");
          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          initializeApp({ credential: cert(serviceAccount) });
          (async () => {
            const db = getFirestore();
            const auth = getAuth();
            const rolesByUid = new Map();
            const addRoles = (uid, data) => {
              if (!uid) return;
              const values = [
                data?.role,
                ...(Array.isArray(data?.roles) ? data.roles : []),
                ...(Array.isArray(data?.assignedRoles) ? data.assignedRoles : []),
                ...(Array.isArray(data?.selectedRoles) ? data.selectedRoles : []),
                ...(Array.isArray(data?.roleAssignments) ? data.roleAssignments : [])
              ].flatMap(v => String(v || "").split(",").map(x => x.trim()).filter(Boolean));
              const existing = rolesByUid.get(uid) || new Set();
              values.forEach(v => existing.add(v));
              rolesByUid.set(uid, existing);
            };
            for (const collection of ["members","employees"]) {
              const snap = await db.collection(collection).get();
              for (const doc of snap.docs) {
                const data = doc.data() || {};
                const uid = String(data.uid || doc.id || "").trim();
                const active = String(data.status || data.employmentStatus || data.registrationStatus || "").toLowerCase();
                if (uid && active !== "inactive" && active !== "disabled") addRoles(uid, data);
              }
            }
            const adminSnap = await db.collection("adminProfiles").get();
            const adminUids = new Set();
            for (const doc of adminSnap.docs) {
              const data = doc.data() || {};
              if (data.active === true && doc.id) adminUids.add(doc.id);
            }
            let updated = 0;
            for (const [uid, roleSet] of rolesByUid.entries()) {
              try {
                const user = await auth.getUser(uid);
                const previous = user.customClaims || {};
                const claims = { ...previous, irpaRoles: [...roleSet].slice(0, 60) };
                if (adminUids.has(uid) || String(user.email || "").toLowerCase() === "irpa2412@gmail.com") claims.admin = true;
                else delete claims.admin;
                await auth.setCustomUserClaims(uid, claims);
                updated++;
              } catch (error) {
                console.warn("Authorization claim synchronization skipped", uid, error.message);
              }
            }
            for (const uid of adminUids) {
              if (rolesByUid.has(uid)) continue;
              try {
                const user = await auth.getUser(uid);
                await auth.setCustomUserClaims(uid, { ...(user.customClaims || {}), admin: true });
                updated++;
              } catch (error) {
                console.warn("Administrator claim synchronization skipped", uid, error.message);
              }
            }
            console.log(`SERVER_CONTROLLED_AUTH_CLAIMS_SYNCHRONIZED: ${updated}`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Verify configured administrator authorization
        run: echo "Primary administrator and approved additional administrator accounts are bootstrapped above; no hard-coded administrator revocation is performed during deployment."

      - name: Backfill signer authorization metadata
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          NODE_PATH: ${{ github.workspace }}/functions/node_modules
        run: |
          node <<'NODE'
          const { initializeApp, cert } = require("firebase-admin/app");
          const { getFirestore, FieldValue } = require("firebase-admin/firestore");

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          initializeApp({ credential: cert(serviceAccount) });

          (async () => {
            const db = getFirestore();
            const snap = await db.collection("signatureEnvelopes").get();
            const writer = db.bulkWriter();
            let changed = 0;

            for (const doc of snap.docs) {
              const data = doc.data() || {};
              const actionUids = [...new Set(
                (Array.isArray(data.fields) ? data.fields : [])
                  .map(field => String(field?.signerUid || "").trim())
                  .filter(Boolean)
              )];

              const existing = Array.isArray(data.actionUids) ? data.actionUids : [];
              const same = existing.length === actionUids.length &&
                existing.every(uid => actionUids.includes(uid));

              if (!same) {
                writer.update(doc.ref, {
                  actionUids,
                  updatedAt: FieldValue.serverTimestamp()
                });
                changed += 1;
              }
            }

            await writer.close();
            console.log(`Signer authorization metadata backfilled for ${changed} envelope(s) out of ${snap.size}.`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Migrate retained Signature Profiles to Signer Identity records
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          NODE_PATH: ${{ github.workspace }}/functions/node_modules
        run: |
          node <<'NODE'
          const { initializeApp, cert } = require("firebase-admin/app");
          const { getFirestore, FieldValue } = require("firebase-admin/firestore");

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          initializeApp({ credential: cert(serviceAccount) });

          (async () => {
            const db = getFirestore();
            const profiles = await db.collection("signatureProfiles").get();
            const writer = db.bulkWriter();
            let migrated = 0;

            for (const profileDoc of profiles.docs) {
              const p = profileDoc.data() || {};
              const uid = String(p.uid || profileDoc.id).trim();
              if (!uid) continue;

              writer.set(db.collection("signerIdentities").doc(uid), {
                uid,
                signerProfileId: uid,
                signerName: String(p.displayName || p.email || "Signer"),
                email: String(p.email || ""),
                organisationName: "Improvement of Rangeland in Pastoral Areas",
                signatureStatus: String(p.status || "Profile Setup Required"),
                revocationStatus: p.status === "Revoked" ? "Revoked" : "Active",
                revocationReason: String(p.revocationReason || ""),
                currentSignatureHash: p.signatureSha256 || null,
                migratedFromSignatureProfile: true,
                updatedAt: FieldValue.serverTimestamp()
              }, { merge: true });
              migrated += 1;
            }

            await writer.close();
            console.log(`Retained Signature Profiles migrated into Signer Identity records: ${migrated}.`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Deploy Hosting and Firestore
        uses: w9jds/firebase-action@v14.17.0
        with:
          args: deploy --project irpa-digital-board-governance --only hosting,firestore,functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}

      - name: Verify live Firebase application
        run: |
          set -e
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://irpa-digital-board-governance.web.app/
