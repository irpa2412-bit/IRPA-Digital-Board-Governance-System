name: Deploy IRPA Governance to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java for Android packaging
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web and Android packaging dependencies
        run: npm install

      - name: Build web application
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_DRIVE_GATEWAY_URL: ${{ secrets.VITE_GOOGLE_DRIVE_GATEWAY_URL }}
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish APK into Firebase Hosting downloads
        run: |
          mkdir -p dist/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/downloads/IRPA-Digital-Governance.apk

      - name: Deploy Hosting and Firestore only
        uses: w9jds/firebase-action@v14.17.0
        with:
          args: deploy --project irpa-digital-board-governance --only hosting,firestore
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
