name: Deploy IRPA Governance to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm install

      - name: Build web application
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      - name: Install Firebase Functions dependencies
        working-directory: functions
        run: npm install

      - name: Deploy Hosting, Firestore, Storage and Functions
        uses: w9jds/firebase-action@v14.17.0
        with:
          args: deploy --project irpa-digital-board-governance
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
