name: Deploy IRPA Governance to Firebase
# Deployment trigger for current production changes
# Administrator Gateway fix deployment marker: 2026-09-21T22:20Z
# Production restore redeploy: 2026-09-22T12:03Z
# V3 Meeting Centre safety hardening redeploy trigger: 2026-09-24T08:46Z
# Signature Profile save authorization redeploy trigger: 2026-09-24T16:51Z
# Safe production deployment verification marker: 2026-09-25T19:54Z — deploy current main (includes 56f7df3) without changing application behavior.
# 2026-09-26 document-reference repair: deploy the secure server-side document reference callable together with hosting/firestore so normal portal users are not blocked by admin-only counter rules.
# 2026-09-26 IT Specialist login gateway release verification: force production deployment of current main.

permissions:
  contents: read
  statuses: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web and Android packaging dependencies
        run: npm install

      - name: Build web application
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_DRIVE_GATEWAY_URL: ${{ secrets.VITE_GOOGLE_DRIVE_GATEWAY_URL }}
          VITE_GOOGLE_WEATHER_API_KEY: ${{ secrets.VITE_GOOGLE_WEATHER_API_KEY }}
        run: npm run build

      - name: Bootstrap primary administrator authorization
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          NODE_PATH: ${{ github.workspace }}/functions/node_modules
        run: |
          npm --prefix functions install --omit=dev
          node <<'NODE'
          const { initializeApp, cert } = require("firebase-admin/app");
          const { getAuth } = require("firebase-admin/auth");
          const { getFirestore, FieldValue } = require("firebase-admin/firestore");

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          initializeApp({ credential: cert(serviceAccount) });

          (async () => {
            const auth = getAuth();
            const db = getFirestore();
            const administrators = [
              { email: "irpa2412@gmail.com", name: "IRPA Primary Administrator" },
            ];

            for (const administrator of administrators) {
              const user = await auth.getUserByEmail(administrator.email);

              await db.collection("adminProfiles").doc(user.uid).set({
                uid: user.uid,
                email: administrator.email,
                name: administrator.name,
                role: "Administrator",
                active: true,
                createdByUid: "irpa2412@gmail.com",
                createdByEmail: "irpa2412@gmail.com",
                updatedAt: FieldValue.serverTimestamp()
              }, { merge: true });

              await auth.setCustomUserClaims(user.uid, {
                ...(user.customClaims || {}),
                admin: true
              });

              console.log(`Administrator authorization bootstrapped for ${administrator.email} (UID ${user.uid}).`);
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Synchronize server-controlled authorization claims
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          NODE_PATH: ${{ github.workspace }}/functions/node_modules
        run: |
          node <<'NODE'
          const { initializeApp, cert } = require("firebase-admin/app");
          const { getAuth } = require("firebase-admin/auth");
          const { getFirestore } = require("firebase-admin/firestore");
          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          initializeApp({ credential: cert(serviceAccount) });
          (async () => {
            const db = getFirestore();
            const auth = getAuth();
            const rolesByUid = new Map();
            const addRoles = (uid, data) => {
              if (!uid) return;
              const values = [
                data?.role,
                ...(Array.isArray(data?.roles) ? data.roles : []),
                ...(Array.isArray(data?.assignedRoles) ? data.assignedRoles : []),
                ...(Array.isArray(data?.selectedRoles) ? data.selectedRoles : []),
                ...(Array.isArray(data?.roleAssignments) ? data.roleAssignments : [])
              ].flatMap(v => String(v || "").split(",").map(x => x.trim()).filter(Boolean));
              const existing = rolesByUid.get(uid) || new Set();
              values.forEach(v => existing.add(v));
              rolesByUid.set(uid, existing);
            };
            for (const collection of ["members","employees"]) {
              const snap = await db.collection(collection).get();
              for (const doc of snap.docs) {
                const data = doc.data() || {};
                let uid = String(data.uid || doc.id || "").trim();
                const registeredEmail = String(data.email || "").trim().toLowerCase();
                if (registeredEmail) {
                  try {
                    const authUser = await auth.getUserByEmail(registeredEmail);
                    uid = authUser.uid;
                    if (String(data.uid || "").trim() !== uid) {
                      await doc.ref.set({uid,firebaseAuthEmail:registeredEmail,uidAssignmentStatus:"UID Linked — Deployment Claim Synchronization"}, {merge:true});
                    }
                  } catch (error) {
                    if (error?.code !== "auth/user-not-found") throw error;
                  }
                }
                const active = String(data.status || data.employmentStatus || data.registrationStatus || "").toLowerCase();
                if (uid && active !== "inactive" && active !== "disabled") addRoles(uid, data);
              }
            }
            const adminSnap = await db.collection("adminProfiles").get();
            const adminUids = new Set();
            for (const doc of adminSnap.docs) {
              const data = doc.data() || {};
              if (data.active === true && doc.id) adminUids.add(doc.id);
            }
            let updated = 0;
            for (const [uid, roleSet] of rolesByUid.entries()) {
              try {
                const user = await auth.getUser(uid);
                const previous = user.customClaims || {};
                const claims = { ...previous, irpaRoles: [...roleSet].slice(0, 60) };
                // Administrator continuity safeguard: deployment may grant/retain admin
                // access, but it must never revoke an existing admin claim. Explicit
                // administrator removal is handled only by the controlled server workflow.
                if (adminUids.has(uid) || String(user.email || "").toLowerCase() === "irpa2412@gmail.com" || previous.admin === true) claims.admin = true;
                await auth.setCustomUserClaims(uid, claims);
                updated++;
              } catch (error) {
                console.warn("Authorization claim synchronization skipped", uid, error.message);
              }
            }
            for (const uid of adminUids) {
              if (rolesByUid.has(uid)) continue;
              try {
                const user = await auth.getUser(uid);
                await auth.setCustomUserClaims(uid, { ...(user.customClaims || {}), admin: true });
                updated++;
              } catch (error) {
                console.warn("Administrator claim synchronization skipped", uid, error.message);
              }
            }
            console.log(`SERVER_CONTROLLED_AUTH_CLAIMS_SYNCHRONIZED: ${updated}`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Verify configured administrator authorization
        run: echo "Primary administrator and approved additional administrator accounts are bootstrapped above; no hard-coded administrator revocation is performed during deployment."

      - name: Backfill signer authorization metadata
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          NODE_PATH: ${{ github.workspace }}/functions/node_modules
        run: |
          node <<'NODE'
          const { initializeApp, cert } = require("firebase-admin/app");
          const { getFirestore, FieldValue } = require("firebase-admin/firestore");

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          initializeApp({ credential: cert(serviceAccount) });

          (async () => {
            const db = getFirestore();
            const snap = await db.collection("signatureEnvelopes").get();
            const writer = db.bulkWriter();
            let changed = 0;

            for (const doc of snap.docs) {
              const data = doc.data() || {};
              const actionUids = [...new Set(
                (Array.isArray(data.fields) ? data.fields : [])
                  .map(field => String(field?.signerUid || "").trim())
                  .filter(Boolean)
              )];

              const existing = Array.isArray(data.actionUids) ? data.actionUids : [];
              const same = existing.length === actionUids.length &&
                existing.every(uid => actionUids.includes(uid));

              if (!same) {
                writer.update(doc.ref, {
                  actionUids,
                  updatedAt: FieldValue.serverTimestamp()
                });
                changed += 1;
              }
            }

            await writer.close();
            console.log(`Signer authorization metadata backfilled for ${changed} envelope(s) out of ${snap.size}.`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Migrate retained Signature Profiles to Signer Identity records
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          NODE_PATH: ${{ github.workspace }}/functions/node_modules
        run: |
          node <<'NODE'
          const { initializeApp, cert } = require("firebase-admin/app");
          const { getFirestore, FieldValue } = require("firebase-admin/firestore");

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          initializeApp({ credential: cert(serviceAccount) });

          (async () => {
            const db = getFirestore();
            const profiles = await db.collection("signatureProfiles").get();
            const writer = db.bulkWriter();
            let migrated = 0;

            for (const profileDoc of profiles.docs) {
              const p = profileDoc.data() || {};
              const uid = String(p.uid || profileDoc.id).trim();
              if (!uid) continue;

              writer.set(db.collection("signerIdentities").doc(uid), {
                uid,
                signerProfileId: uid,
                signerName: String(p.displayName || p.email || "Signer"),
                email: String(p.email || ""),
                organisationName: "Improvement of Rangeland in Pastoral Areas",
                signatureStatus: String(p.status || "Profile Setup Required"),
                revocationStatus: p.status === "Revoked" ? "Revoked" : "Active",
                revocationReason: String(p.revocationReason || ""),
                currentSignatureHash: p.signatureSha256 || null,
                migratedFromSignatureProfile: true,
                updatedAt: FieldValue.serverTimestamp()
              }, { merge: true });
              migrated += 1;
            }

            await writer.close();
            console.log(`Retained Signature Profiles migrated into Signer Identity records: ${migrated}.`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Deploy Hosting and Firestore
        uses: w9jds/firebase-action@v14.17.0
        with:
          args: deploy --project irpa-digital-board-governance --only hosting,firestore
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}

      # Cloud Functions deployment is a separate billing-gated operation. Keep the
      # production Hosting/Firestore release from being marked failed when Google
      # blocks function deployment because the project's billing account is closed.
      # A retained resolver is accepted only after its live callable endpoint is
      # verified; a missing resolver remains a hard failure.
      - name: Deploy login authorization resolver
        id: login_resolver_deploy
        continue-on-error: true
        uses: w9jds/firebase-action@v14.17.0
        with:
          args: deploy --project irpa-digital-board-governance --only functions:resolveAuthenticatedLoginContext
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}

      - name: Verify retained login authorization resolver
        id: login_resolver_verify
        if: steps.login_resolver_deploy.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT="https://us-central1-irpa-digital-board-governance.cloudfunctions.net/resolveAuthenticatedLoginContext"
          HTTP_STATUS="$(curl -L --silent --show-error --output /tmp/irpa-login-resolver.json \
            --write-out '%{http_code}' --retry 5 --retry-delay 3 --max-time 30 \
            -X POST -H 'Content-Type: application/json' \
            --data '{"data":{}}' "$ENDPOINT")"
          echo "LOGIN_RESOLVER_HTTP_STATUS=$HTTP_STATUS"
          cat /tmp/irpa-login-resolver.json || true

          # A deployed onCall resolver with no Firebase ID token must reject the
          # request as UNAUTHENTICATED (401). A 404 means the resolver is absent.
          if [ "$HTTP_STATUS" = "401" ]; then
            echo "Existing login authorization resolver is reachable; deployment was retained."
            echo "resolver_state=retained" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HTTP_STATUS" = "404" ]; then
            echo "ERROR: login authorization resolver is not deployed."
            exit 1
          fi

          echo "ERROR: login authorization resolver health check returned unexpected HTTP $HTTP_STATUS."
          exit 1

      - name: Record deferred Firebase Functions deployment
        if: steps.login_resolver_deploy.outcome == 'failure'
        run: |
          echo "::warning::Firebase Cloud Functions deployment was deferred because the resolver deployment did not complete. The workflow remains successful only when the retained resolver endpoint is reachable."
          echo "FUNCTION_DEPLOYMENT=DEFERRED_OR_RETAINED" >> "$GITHUB_STEP_SUMMARY"
          echo "Login resolver source remains in the repository; redeployment requires an active Google Cloud Billing account."

      - name: Deploy authentication security and document-reference functions
        if: steps.login_resolver_deploy.outcome == 'success'
        uses: w9jds/firebase-action@v14.17.0
        with:
          args: deploy --project irpa-digital-board-governance --only functions:checkPasswordAttemptState,functions:recordPasswordFailure,functions:clearPasswordAttemptState,functions:preparePasswordResetPhone,functions:nextDocumentReference
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}

      - name: Verify live Firebase application
        run: |
          set -e
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://irpa-digital-board-governance.web.app/

  live-hosting-verification:
    name: Live Hosting Verification and Commit Status
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always()
    steps:
      - name: Verify production hosting independently
        id: live
        shell: bash
        run: |
          set +e
          HTTP_STATUS="$(curl -L --silent --show-error --output /tmp/irpa-live.html --write-out '%{http_code}' --retry 5 --retry-delay 3 --max-time 30 https://irpa-digital-board-governance.web.app/)"
          CURL_EXIT=$?
          echo "HTTP_STATUS=$HTTP_STATUS"
          echo "CURL_EXIT=$CURL_EXIT"
          if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_STATUS" = "200" ]; then
            echo "live_ok=true" >> "$GITHUB_OUTPUT"
            echo "Production hosting is reachable and returned HTTP 200."
          else
            echo "live_ok=false" >> "$GITHUB_OUTPUT"
            echo "Production hosting verification failed."
            exit 1
          fi

      - name: Publish commit status
        if: always()
        uses: actions/github-script@v7
        env:
          LIVE_OK: ${{ steps.live.outputs.live_ok }}
        with:
          script: |
            const liveOk = process.env.LIVE_OK === "true";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: liveOk ? "success" : "failure",
              context: "firebase/hosting-live",
              description: liveOk
                ? "Production Firebase Hosting returned HTTP 200."
                : "Production Firebase Hosting did not return HTTP 200.",
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
