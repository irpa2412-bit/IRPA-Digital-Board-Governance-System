            const slugOf=item=>{try{return new URL(item.link).pathname.replace(/\/+$/,"").split("/").pop()}catch{return ""}};
            const canonicalCandidates=candidates.filter(item=>slugOf(item)==="irpa-staging-integration-check");
            if(canonicalCandidates.length!==1) throw new Error("A single canonical staging test page is required (listed "+(listed.items||[]).length+" page(s), matching "+candidates.length+", canonical "+canonicalCandidates.length+").");
            const canonical=canonicalCandidates[0];
            // Clean only extra pages carrying this workflow's unmistakable marker. Restore their pre-test snapshot, then unpublish the duplicate.
            for(const duplicate of candidates.filter(item=>Number(item.id)!==Number(canonical.id))){
              const duplicateRead=await call("/api/communications/website/content/pages/"+Number(duplicate.id));
              const duplicateItem=duplicateRead.item;
              const hasMarker=String(duplicateItem?.title||"").includes("IRPA_STAGING_WEBSITE_CHECK_")||
                String(duplicateItem?.content||"").includes("IRPA_STAGING_WEBSITE_CHECK_");
              let cleanDuplicate=duplicateItem;
              if(hasMarker){
                const duplicateHistory=await call("/api/communications/website/revisions?type=pages&id="+Number(duplicate.id));
                const duplicateSnapshots=(duplicateHistory.revisions||[]).filter(r=>r.source==="IRPA saved snapshot"&&r.snapshotId&&
                  r.title===fixtureTitle&&Date.now()-Date.parse(r.date||"")<24*60*60*1000)
                  .sort((a,b)=>Date.parse(b.date||"")-Date.parse(a.date||""));
                if(!duplicateSnapshots.length) throw new Error("A marked duplicate staging test page has no recent verified pre-test snapshot; refusing to alter it.");
                await call("/api/communications/website/restore",{method:"POST",body:JSON.stringify({type:"pages",id:Number(duplicate.id),snapshotId:duplicateSnapshots[0].snapshotId})});
                cleanDuplicate=(await call("/api/communications/website/content/pages/"+Number(duplicate.id))).item;
              }else{
                // No unique workflow marker means ownership is unproven: leave this page untouched.
                continue;
              }
              const draft=await call("/api/communications/website/content",{method:"PUT",body:JSON.stringify({
                type:"pages",id:Number(duplicate.id),title:cleanDuplicate.title,content:cleanDuplicate.content,
                excerpt:cleanDuplicate.excerpt||"",featuredMedia:Number(cleanDuplicate.featuredMedia||0),status:"draft"
              })});
              if(!draft.success) throw new Error("A marked duplicate staging test page could not be safely unpublished.");
              const draftCheck=(await call("/api/communications/website/content/pages/"+Number(duplicate.id))).item;
              if(draftCheck.status!=="draft") throw new Error("A marked duplicate staging test page remains published after cleanup.");
            }
            const testPageId=Number(canonical.id);
            let before=await call("/api/communications/website/content/pages/"+testPageId);
            let original=before.item;
            if(!original||original.type!=="pages"||!original.title||typeof original.content!=="string") throw new Error("The pre-provisioned staging test page could not be read.");
            // Recover a leftover acceptance marker from an earlier timed-out run before treating this page as the baseline.
            if(original.title.includes("IRPA_STAGING_WEBSITE_CHECK_")||original.content.includes("IRPA_STAGING_WEBSITE_CHECK_")){
              const history=await call("/api/communications/website/revisions?type=pages&id="+testPageId);
              const recent=(history.revisions||[]).filter(r=>r.source==="IRPA saved snapshot"&&r.snapshotId&&
                !String(r.title||"").includes("IRPA_STAGING_WEBSITE_CHECK_")&&Date.now()-Date.parse(r.date||"")<24*60*60*1000)
                .sort((a,b)=>Date.parse(b.date||"")-Date.parse(a.date||""));
              if(recent.length) await call("/api/communications/website/restore",{method:"POST",body:JSON.stringify({type:"pages",id:testPageId,snapshotId:recent[0].snapshotId})});
