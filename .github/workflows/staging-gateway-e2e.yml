name: Staging Gateway E2E and Deploy

on:
  push:
    branches: [main, fix/member-signature-invitation-email-20261004, fix/communications-cloudflare-website-integration]
    paths:
      - "drive-gateway/**"
      - "src/firebase/documentLifecycle.js"
      - "firebase.json"
      - ".github/workflows/staging-gateway-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "drive-gateway/**"
      - "src/firebase/documentLifecycle.js"
      - "firebase.json"
      - ".github/workflows/staging-gateway-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  local-e2e:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/member-signature-invitation-email-20261004' || github.ref == 'refs/heads/fix/communications-cloudflare-website-integration' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/communications-cloudflare-website-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: drive-gateway
      - name: Firestore emulator E2E
        run: |
          set -o pipefail
          npx firebase emulators:exec --project demo-irpa-staging --only firestore "npm --prefix drive-gateway test" | tee e2e-output.ndjson
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-gateway-e2e-raw-output
          path: e2e-output.ndjson

  deploy-staging:
    needs: local-e2e
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/member-signature-invitation-email-20261004' || github.ref == 'refs/heads/fix/communications-cloudflare-website-integration' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/communications-cloudflare-website-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require isolated staging secrets
        env:
          CF_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          APP_URL: ${{ secrets.STAGING_IRPA_APP_URL }}
          DRIVE_ID: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_ID }}
          DRIVE_SECRET: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_SECRET }}
          DRIVE_KEY: ${{ secrets.STAGING_GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_WEB_API_KEY: ${{ secrets.STAGING_FIREBASE_WEB_API_KEY }}
          TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          WP_BASE: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
          WP_USER: ${{ secrets.STAGING_WORDPRESS_USERNAME }}
          WP_PASSWORD: ${{ secrets.STAGING_WORDPRESS_APPLICATION_PASSWORD }}
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
          CP_ROOT: ${{ secrets.STAGING_CPANEL_DOCUMENT_ROOT }}
          CP_TEST_FILE: ${{ secrets.STAGING_CPANEL_TEST_FILE }}
        run: |
          set -euo pipefail
          missing=0
          for pair in             "CLOUDFLARE_API_TOKEN:$CF_TOKEN"             "CLOUDFLARE_ACCOUNT_ID:$CF_ACCOUNT"             "STAGING_FIREBASE_PROJECT_ID:$PROJECT"             "STAGING_IRPA_APP_URL:$APP_URL"             "STAGING_GOOGLE_DRIVE_CLIENT_ID:$DRIVE_ID"             "STAGING_GOOGLE_DRIVE_CLIENT_SECRET:$DRIVE_SECRET"             "STAGING_GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY:$DRIVE_KEY"             "STAGING_FIREBASE_SERVICE_ACCOUNT_JSON:$FIREBASE_SERVICE_ACCOUNT"             "STAGING_FIREBASE_WEB_API_KEY:$FIREBASE_WEB_API_KEY"             "STAGING_TEST_EMAIL:$TEST_EMAIL"             "STAGING_TEST_PASSWORD:$TEST_PASSWORD"             "STAGING_WORDPRESS_BASE_URL:$WP_BASE"             "STAGING_WORDPRESS_USERNAME:$WP_USER"             "STAGING_WORDPRESS_APPLICATION_PASSWORD:$WP_PASSWORD"             "STAGING_CPANEL_BASE_URL:$CP_BASE"             "STAGING_CPANEL_USERNAME:$CP_USER"             "STAGING_CPANEL_API_TOKEN:$CP_TOKEN"             "STAGING_CPANEL_DOCUMENT_ROOT:$CP_ROOT"             "STAGING_CPANEL_TEST_FILE:$CP_TEST_FILE"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -z "$value" ]; then echo "Missing staging secret: $name"; missing=1; fi
          done
          test "$PROJECT" = "irpa-dbg-staging-a73ec"
          test "$APP_URL" != "https://irpa-digital-board-governance.web.app"
          test "$missing" -eq 0
          node <<'NODE'
          const fs=require("fs");
          const project=process.env.PROJECT;
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||"{}");
          if(project!=="irpa-dbg-staging-a73ec") throw new Error("Firebase project must match the approved isolated staging project.");
          if(sa.project_id!==project) throw new Error("Staging service account must belong to the isolated staging Firebase project.");
          const app=new URL(process.env.APP_URL);
          if(app.protocol!=="https:" || ["irpa.or.tz","www.irpa.or.tz","irpa-digital-board-governance.web.app"].includes(app.hostname.toLowerCase())) throw new Error("Staging application must use HTTPS on an isolated non-production hostname.");
          const wp=new URL(process.env.WP_BASE);
          if(wp.protocol!=="https:" || ["irpa.or.tz","www.irpa.or.tz"].includes(wp.hostname.toLowerCase())) throw new Error("Staging WordPress must use HTTPS on an isolated non-production hostname.");
          console.log("STAGING_MAIL_DELIVERY_MOCKED");
          const cp=new URL(process.env.CP_BASE);
          if(cp.protocol!=="https:" || cp.port!=="2083" || cp.pathname!=="/") throw new Error("Staging cPanel endpoint must use HTTPS port 2083.");
          const root=process.env.CP_ROOT.replace(/^\/+|\/+$/g,"");
          if(!root || root.split("/").some(p=>!p || p==="." || p===".." || p.startsWith("."))) throw new Error("Staging cPanel document root is invalid.");
          const file=process.env.CP_TEST_FILE;
          if(!file || file.includes("/") || file.startsWith("/") || file.split("/").some(p=>!p || p==="." || p===".." || p.startsWith(".")) || !/\.txt$/i.test(file)) throw new Error("Staging cPanel test file must be a safe relative .txt path.");
          console.log("ISOLATED_STAGING_CREDENTIALS_VALID");
          NODE

      - name: Diagnostic - verify Cloudflare staging token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN||"";
          const report={
            length:token.length,
            hasCR:token.includes("\r"),
            hasLF:token.includes("\n"),
            hasLeadingWhitespace:/^\s/.test(token),
            hasTrailingWhitespace:/\s$/.test(token),
            hasNonAscii:/[^\x20-\x7E]/.test(token),
            isPrintableAscii:/^[\x20-\x7E]*$/.test(token)
          };
          console.log("CLOUDFLARE_TOKEN_SHAPE="+JSON.stringify(report));
          if(!token || !report.isPrintableAscii || report.hasCR || report.hasLF || report.hasLeadingWhitespace || report.hasTrailingWhitespace) {
            throw new Error("Cloudflare staging token has invalid/hidden characters; token value intentionally not printed.");
          }
          NODE
          set +e
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/cf-verify.json" --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          curl_rc=$?
          set -e
          if [ "$curl_rc" -ne 0 ]; then
            echo "Cloudflare curl verification failed with exit code: $curl_rc; retrying the same verification via Node HTTPS (no token output)."
            node <<'NODE'
          const https=require("https");
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const req=https.request("https://api.cloudflare.com/client/v4/user/tokens/verify",{method:"GET",headers:{Authorization:"Bearer "+token,Accept:"application/json"}},res=>{
            let body=""; res.setEncoding("utf8"); res.on("data",c=>body+=c); res.on("end",()=>{
              let a; try { a=JSON.parse(body); } catch(e) { console.error("Cloudflare verification returned non-JSON response; HTTP status="+res.statusCode); process.exit(1); }
              const valid=res.statusCode===200 && a?.success===true && a?.result?.status==="active";
              console.log("CLOUDFLARE_TOKEN_VALID="+valid);
              if(!valid) { console.error("Cloudflare token verification failed; HTTP status="+res.statusCode); process.exit(1); }
            });
          });
          req.on("error",e=>{ console.error("Cloudflare Node HTTPS verification failed: "+e.message); process.exit(1); });
          req.end();
          NODE
            exit 0
          fi
          body="$(cat "$RUNNER_TEMP/cf-verify.json")"
          if [ "$code" != "200" ]; then
            echo "CLOUDFLARE_TOKEN_VALID=false"
            echo "Cloudflare token verification HTTP status: $code"
            exit 1
          fi
          valid="$(node -e 'const a=JSON.parse(process.argv[1]); process.stdout.write(String(a?.success===true && a?.result?.status==="active"))' "$body")"
          echo "CLOUDFLARE_TOKEN_VALID=$valid"
          test "$valid" = "true"

      - name: Provision or reuse dedicated staging KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          APP_URL: ${{ secrets.STAGING_IRPA_APP_URL }}
          CP_ROOT: ${{ secrets.STAGING_CPANEL_DOCUMENT_ROOT }}
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          list="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces")"
          id="$(node - "$list" <<'NODE'
          const a=JSON.parse(process.argv[2]);
          if(!a.success) throw new Error("Cloudflare KV namespace list failed");
          const x=(Array.isArray(a.result)?a.result:[]).find(v=>v.title==="irpa-google-drive-gateway-staging");
          if(x?.id) process.stdout.write(x.id);
          NODE
          )"
          if [ -z "$id" ]; then
            created="$(curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"title":"irpa-google-drive-gateway-staging"}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces")"
            id="$(node - "$created" <<'NODE'
          const a=JSON.parse(process.argv[2]);
          if(!a.success) throw new Error("Cloudflare KV namespace creation failed");
          process.stdout.write(a?.result?.id||"");
          NODE
            )"
          fi
          case "$id" in ''|*[!a-f0-9]*) exit 1;; esac
          export STAGING_KV_ID="$id"
          node <<'NODE'
          const fs=require("fs");
          const c={
            name:"irpa-google-drive-gateway-staging",main:"src/index.js",
            compatibility_date:"2026-09-29",workers_dev:true,
            vars:{
              FIREBASE_PROJECT_ID:process.env.PROJECT,
              SMTP_MOCK:"success",
              AUTHORIZED_DRIVE_EMAIL:"irpa2412@gmail.com",
              IRPA_APP_URL:process.env.APP_URL,
              DRIVE_ROOT_FOLDER_NAME:"IRPA Governance System - STAGING",
              FIRESTORE_COLLECTION_PREFIX:"staging_",DRIVE_MOCK:"false",LOCAL_TEST_MODE:"false",
              IRPA_ENVIRONMENT:"staging",CPANEL_DOCUMENT_ROOT:process.env.CP_ROOT
            },
            kv_namespaces:[{binding:"DRIVE_KV",id:process.env.STAGING_KV_ID}],
            triggers:{crons:["0 * * * *"]}
          };
          if(c.vars.FIREBASE_PROJECT_ID!=="irpa-dbg-staging-a73ec") throw new Error("Worker must use the approved isolated staging Firebase project.");
          fs.writeFileSync("wrangler.staging.generated.json",JSON.stringify(c,null,2)+"\n");
          NODE

      - name: Verify staging configuration
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          node <<'NODE'
          const c=require("./wrangler.staging.generated.json");
          if(c.name!=="irpa-google-drive-gateway-staging") throw new Error("Worker boundary mismatch");
          if(c.vars.FIREBASE_PROJECT_ID!=="irpa-dbg-staging-a73ec") throw new Error("Unexpected Firebase project for staging Worker");
          if(c.vars.IRPA_ENVIRONMENT!=="staging") throw new Error("Explicit staging environment marker missing");
          if(c.kv_namespaces?.[0]?.binding!=="DRIVE_KV") throw new Error("Missing staging KV");
          if(c.triggers?.crons?.[0]!=="0 * * * *") throw new Error("Cleanup cron missing");
          console.log("STAGING_CONFIGURATION_VALID");
          NODE

      - name: Diagnose configured staging WordPress origin (no credentials)
        env:
          WP_BASE: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const dns = require("node:dns").promises;
          const https = require("node:https");
          (async () => {
            let u;
            try { u = new URL(process.env.WP_BASE || ""); } catch { throw new Error("Staging WordPress base URL is invalid or missing."); }
            if (u.protocol !== "https:" || u.username || u.password || u.search || u.hash) throw new Error("Staging WordPress base URL must be a clean HTTPS origin/path.");
            console.log("STAGING_WORDPRESS_HOST=" + u.hostname);
            try {
              const addresses = await dns.lookup(u.hostname, { all: true });
              console.log("STAGING_WORDPRESS_DNS=" + JSON.stringify(addresses.map(a => ({address:a.address,family:a.family}))));
            } catch (e) {
              console.log("STAGING_WORDPRESS_DNS_ERROR=" + String(e.code || e.name));
            }
            await new Promise(resolve => {
              const req = https.request(new URL("/wp-json/", u), { method: "GET", timeout: 10000, headers: { Accept: "application/json" } }, res => {
                let raw = "";
                res.setEncoding("utf8");
                res.on("data", chunk => raw += chunk);
                res.on("end", () => {
                  console.log("STAGING_WORDPRESS_HTTP=" + res.statusCode);
                  console.log("STAGING_WORDPRESS_SERVER=" + String(res.headers.server || "").slice(0,80));
                  console.log("STAGING_WORDPRESS_CF_RAY=" + String(res.headers["cf-ray"] || "").slice(0,100));
                  const hint = raw.replace(/<[^>]*>/g," ").replace(/[\\r\\n\\t]+/g," ").replace(/\\s+/g," ").trim();
                  if (hint) console.log("STAGING_WORDPRESS_RESPONSE_HINT=" + hint.slice(0,180));
                  resolve();
                });
              });
              req.on("timeout", () => { console.log("STAGING_WORDPRESS_HTTP_ERROR=timeout"); req.destroy(); resolve(); });
              req.on("error", e => { console.log("STAGING_WORDPRESS_HTTP_ERROR=" + String(e.code || e.name)); resolve(); });
              req.end();
            });
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE

      - name: Identify cPanel domain mapping for wp268 (read-only)
        env:
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const https=require("node:https");
          const {URL,URLSearchParams}=require("node:url");
          function call(path) {
            return new Promise((resolve,reject)=>{
              const u=new URL(process.env.CP_BASE);
              u.pathname="/execute/"+path;
              u.search=new URLSearchParams({}).toString();
              const req=https.request(u,{headers:{Authorization:"cpanel "+process.env.CP_USER+":"+process.env.CP_TOKEN,Accept:"application/json"},timeout:10000},res=>{
                let raw="";res.setEncoding("utf8");res.on("data",c=>raw+=c);res.on("end",()=>{
                  let data=null;try{data=JSON.parse(raw)}catch{}
                  resolve({http:res.statusCode,data,invalidJson:!data,bodyHint:!data?raw.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,160):""});
                });
              });
              req.on("timeout",()=>req.destroy(new Error("cPanel read-only inspection timed out.")));
              req.on("error",reject);req.end();
            });
          }
          function collect(value,section="",out=[]) {
            if(Array.isArray(value)){for(const v of value)collect(v,section,out);return out}
            if(!value||typeof value!=="object")return out;
            const domain=String(value.domain||value.domain_name||value.main_domain||value.name||"");
            const root=String(value.documentroot||value.document_root||value.docroot||value.root||"");
            if(domain)out.push({section,domain:domain.slice(0,180),document_root:root.slice(0,240)});
            for(const [k,v] of Object.entries(value))if(v&&typeof v==="object")collect(v,section?section+"."+k:k,out);
            return out;
          }
          (async()=>{
            const domains=await call("DomainInfo/list_domains");
            console.log("CPANEL_LIST_DOMAINS_HTTP="+domains.http);
            console.log("CPANEL_LIST_DOMAINS_STATUS="+String(domains.data?.status));
            console.log("CPANEL_LIST_DOMAINS_KEYS="+JSON.stringify(Object.keys(domains.data?.data||{})));
            console.log("CPANEL_LIST_DOMAINS_ROWS="+JSON.stringify(collect(domains.data?.data||{})).slice(0,5000));
            if(domains.invalidJson)console.log("CPANEL_LIST_DOMAINS_RESPONSE_HINT="+domains.bodyHint);
            const details=await call("DomainInfo/domains_data");
            console.log("CPANEL_DOMAINS_DATA_HTTP="+details.http);
            console.log("CPANEL_DOMAINS_DATA_STATUS="+String(details.data?.status));
            console.log("CPANEL_DOMAINS_DATA_KEYS="+JSON.stringify(Object.keys(details.data?.data||{})));
            console.log("CPANEL_DOMAIN_DOCUMENT_ROOTS="+JSON.stringify(collect(details.data?.data||{})).slice(0,5000));
            if(details.invalidJson)console.log("CPANEL_DOMAINS_DATA_RESPONSE_HINT="+details.bodyHint);
            if(domains.http!==200||domains.data?.status!==1)throw new Error("cPanel could not return domain mappings.");
          })().catch(e=>{console.error("cPanel mapping diagnostic unavailable: "+e.message);console.log("CPANEL_MAPPING_DIAGNOSTIC_UNAVAILABLE");});
          NODE


      - name: Check all configured Cloudflare tokens for IRPA DNS zone access (read-only)
        env:
          CF_PRODUCTION: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_STAGING: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CF_GRANT: ${{ secrets.CLOUDFLARE_GRANT_CRAWLER_API_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const https=require("node:https");
          function get(token){
            return new Promise((resolve,reject)=>{
              const req=https.request("https://api.cloudflare.com/client/v4/zones?name=irpa.or.tz&per_page=10",{headers:{Authorization:"Bearer "+token,Accept:"application/json"},timeout:10000},res=>{
                let raw="";res.setEncoding("utf8");res.on("data",c=>raw+=c);res.on("end",()=>{let data;try{data=JSON.parse(raw)}catch{}resolve({http:res.statusCode,data})});
              });
              req.on("timeout",()=>req.destroy(new Error("Cloudflare zone access check timed out.")));
              req.on("error",reject);req.end();
            });
          }
          (async()=>{
            for(const [name,token] of [["production",process.env.CF_PRODUCTION],["staging",process.env.CF_STAGING],["grant-crawler",process.env.CF_GRANT]]){
              if(!token){console.log("IRPA_DNS_TOKEN_"+name.toUpperCase()+"=missing");continue}
              try{
                const r=await get(token);
                const zones=Array.isArray(r.data?.result)?r.data.result:[];
                console.log("IRPA_DNS_TOKEN_"+name.toUpperCase()+"_HTTP="+r.http);
                console.log("IRPA_DNS_TOKEN_"+name.toUpperCase()+"_SUCCESS="+String(r.data?.success));
                console.log("IRPA_DNS_TOKEN_"+name.toUpperCase()+"_ZONE_VISIBLE="+String(zones.some(z=>z.name==="irpa.or.tz")));
                console.log("IRPA_DNS_TOKEN_"+name.toUpperCase()+"_ZONE_COUNT="+zones.length);
                console.log("IRPA_DNS_TOKEN_"+name.toUpperCase()+"_ERROR_CODES="+JSON.stringify((r.data?.errors||[]).map(e=>e.code)));
              }catch(e){console.log("IRPA_DNS_TOKEN_"+name.toUpperCase()+"_ERROR="+String(e.code||e.name))}
            }
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Verify production Cloudflare token can inspect the IRPA DNS zone (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const https=require("node:https");
          function get(url){
            return new Promise((resolve,reject)=>{
              const req=https.request(url,{headers:{Authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN,Accept:"application/json"},timeout:10000},res=>{
                let raw="";res.setEncoding("utf8");res.on("data",c=>raw+=c);res.on("end",()=>{let data;try{data=JSON.parse(raw)}catch{}resolve({http:res.statusCode,data})});
              });
              req.on("timeout",()=>req.destroy(new Error("Cloudflare DNS scope check timed out.")));
              req.on("error",reject);req.end();
            });
          }
          (async()=>{
            const r=await get("https://api.cloudflare.com/client/v4/zones?name=irpa.or.tz&per_page=10");
            console.log("IRPA_DNS_ZONE_QUERY_HTTP="+r.http);
            console.log("IRPA_DNS_ZONE_QUERY_SUCCESS="+String(r.data?.success));
            console.log("IRPA_DNS_ZONE_VISIBLE="+String((r.data?.result||[]).some(z=>z.name==="irpa.or.tz")));
            console.log("IRPA_DNS_ZONE_ERRORS="+JSON.stringify((r.data?.errors||[]).map(e=>({code:e.code,message:String(e.message||"").slice(0,120)}))));
            if(r.http!==200||r.data?.success!==true) throw new Error("Production Cloudflare token cannot inspect DNS zone metadata.");
          })().catch(e=>{console.error("IRPA DNS zone read-only verification failed: "+(e.code||e.message||e.name));process.exit(1)});
          NODE

      - name: Inspect cPanel staging installation and reachable WordPress paths (read-only)
        continue-on-error: true
        env:
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const https=require("node:https");
          const dns=require("node:dns").promises;
          const {URL,URLSearchParams}=require("node:url");
          function get(url,headers={}) {
            return new Promise((resolve,reject)=>{
              const req=https.request(url,{headers,timeout:10000},res=>{
                let raw="";res.setEncoding("utf8");res.on("data",c=>raw+=c);res.on("end",()=>{let data;try{data=JSON.parse(raw)}catch{}resolve({http:res.statusCode,data,raw})});
              });
              req.on("timeout",()=>req.destroy(new Error("Inspection request timed out.")));
              req.on("error",reject);req.end();
            });
          }
          async function main(){
            const base=new URL(process.env.CP_BASE);
            const auth={Authorization:"cpanel "+process.env.CP_USER+":"+process.env.CP_TOKEN,Accept:"application/json"};
            const call=async(path,params={})=>{const u=new URL("/execute/"+path,base);u.search=new URLSearchParams(params).toString();return get(u,auth)};
            const info=await call("DomainInfo/domains_data");
            const root=String(info.data?.data?.main_domain?.documentroot||info.data?.data?.main_domain?.document_root||"");
            if(info.http!==200||info.data?.status!==1||!root) throw new Error("Could not resolve the cPanel main document root.");
            console.log("CPANEL_ROOT_CONFIRMED="+root.replace(/\/home\/[^/]+/,"/home/[account]"));
            for(const rel of ["staging","staging ","wp","wp-content","wp-admin","wp-includes"]){
              const dir=root+"/"+rel;
              const listing=await call("Fileman/list_files",{dir,showdotfiles:1});
              const rows=Array.isArray(listing.data?.data)?listing.data.data:[];
              console.log("CPANEL_INSTALL_DIR="+JSON.stringify({dir:dir.replace(/\/home\/[^/]+/,"/home/[account]"),status:listing.data?.status,files:rows.map(v=>String(v.file||v.name||"")).filter(Boolean).slice(0,80)}));
            }
            for(const path of ["/wp-json/","/staging/wp-json/","/staging /wp-json/","/staging/"]){
              try{
                const u=new URL("https://irpa.or.tz"+path);
                const result=await get(u,{Accept:"application/json"});
                console.log("PUBLIC_WORDPRESS_PATH="+JSON.stringify({path,http:result.http,server:result.data?undefined:undefined,contentType:result.raw.slice(0,120).replace(/[\r\n]+/g," ")}));
              }catch(e){console.log("PUBLIC_WORDPRESS_PATH_ERROR="+JSON.stringify({path,code:e.code||e.name}))}
            }
          }
          main().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Inspect staging DNS and wp268 installation mapping (read-only)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const https=require("node:https");
          const dns=require("node:dns").promises;
          const {URL,URLSearchParams}=require("node:url");
          function request(url,headers={}) {
            return new Promise((resolve,reject)=>{
              const req=https.request(url,{headers,timeout:10000},res=>{
                let raw="";res.setEncoding("utf8");res.on("data",c=>raw+=c);res.on("end",()=>{let data;try{data=JSON.parse(raw)}catch{}resolve({http:res.statusCode,data,raw})});
              });
              req.on("timeout",()=>req.destroy(new Error("Read-only DNS/cPanel inspection timed out.")));
              req.on("error",reject);req.end();
            });
          }
          function cp(path,params={}) {
            const u=new URL(process.env.CP_BASE);u.pathname="/execute/"+path;u.search=new URLSearchParams(params).toString();
            return request(u,{Authorization:"cpanel "+process.env.CP_USER+":"+process.env.CP_TOKEN,Accept:"application/json"});
          }
          (async()=>{
            const cpHost=new URL(process.env.CP_BASE).hostname;
            try{console.log("CPANEL_HOST_DNS="+JSON.stringify((await dns.lookup(cpHost,{all:true})).map(x=>({address:x.address,family:x.family}))));}
            catch(e){console.log("CPANEL_HOST_DNS_ERROR="+String(e.code||e.name))}
            const z=await request("https://api.cloudflare.com/client/v4/zones?per_page=100",{Authorization:"Bearer "+process.env.CLOUDFLARE_API_TOKEN,Accept:"application/json"});
            console.log("CF_ZONES_HTTP="+z.http);
            console.log("CF_ZONES_SUCCESS="+String(z.data?.success));
            console.log("CF_ZONE_NAMES="+JSON.stringify((z.data?.result||[]).map(x=>({name:x.name,status:x.status,id:x.id}))));
            console.log("CF_ZONE_ERRORS="+JSON.stringify((z.data?.errors||[]).map(x=>({code:x.code,message:String(x.message||"").slice(0,160)}))));
            const dom=await cp("DomainInfo/domains_data");
            const main=dom.data?.data?.main_domain||{};
            const docroot=String(main.documentroot||main.document_root||"");
            console.log("CPANEL_MAIN_DOMAIN="+String(main.domain||main.domain_name||""));
            console.log("CPANEL_MAIN_DOCROOT="+docroot.slice(0,240));
            const r=await cp("Fileman/list_files",{dir:docroot,showdotfiles:0});
            const entries=Array.isArray(r.data?.data)?r.data.data:[];
            console.log("CPANEL_PUBLIC_HTML_ENTRIES="+JSON.stringify(entries.map(x=>({name:x.file||x.name,type:x.type||x.filetype})).filter(x=>x.name).slice(0,120)));
            for(const dir of [docroot+"/wp268",docroot+"/stage268"]){
              const q=await cp("Fileman/list_files",{dir,showdotfiles:0});
              console.log("CPANEL_DIR_CHECK="+JSON.stringify({dir:dir.replace(/\/home\/[^/]+/,"/home/[account]"),http:q.http,status:q.data?.status,errors:(q.data?.errors||[]).map(x=>String(x).slice(0,120))}));
            }
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Remediate staging DNS and cPanel document root (independent attempts)
        if: always()
        env:
          CF_PRODUCTION: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_STAGING: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CF_GRANT: ${{ secrets.CLOUDFLARE_GRANT_CRAWLER_API_TOKEN }}
          CF_ZONE_ID_SECRET: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_STAGING_ZONE_ID_SECRET: ${{ secrets.STAGING_CLOUDFLARE_ZONE_ID }}
          CF_ZONE_ID_VAR: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CF_STAGING_ZONE_ID_VAR: ${{ vars.STAGING_CLOUDFLARE_ZONE_ID }}
          CF_ZONE_ID_ALT1: ${{ secrets.CF_ZONE_ID }}
          CF_ZONE_ID_ALT2: ${{ secrets.IRPA_ZONE_ID }}
          CF_ZONE_ID_ALT3: ${{ secrets.IRPA_CLOUDFLARE_ZONE_ID }}
          CF_ZONE_ID_ALT4: ${{ secrets.CLOUDFLARE_IRPA_ZONE_ID }}
          CF_ZONE_ID_ALT5: ${{ secrets.CLOUDFLARE_DNS_ZONE_ID }}
          CF_ZONE_ID_ALT6: ${{ secrets.IRPA_OR_TZ_ZONE_ID }}
          CF_ZONE_ID_ALT7: ${{ secrets.DNS_ZONE_ID }}
          CF_ZONE_ID_ALT8: ${{ secrets.STAGING_ZONE_ID }}
          CF_ZONE_ID_ALT9: ${{ secrets.CLOUDFLARE_PRODUCTION_ZONE_ID }}
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
          CP_TEST_FILE: ${{ secrets.STAGING_CPANEL_TEST_FILE }}
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -euo pipefail
          node <<'NODE'
          const https=require("node:https");
          require("node:dns").setDefaultResultOrder("ipv4first");
          const {URL,URLSearchParams}=require("node:url");
          function request(url,method="GET",headers={},body){
            return new Promise((resolve,reject)=>{
              const u=new URL(url);
              const req=https.request({protocol:u.protocol,hostname:u.hostname,port:u.port||443,family:4,path:u.pathname+u.search,method,headers,timeout:15000},res=>{
                let raw="";res.setEncoding("utf8");res.on("data",c=>raw+=c);res.on("end",()=>{let data;try{data=JSON.parse(raw)}catch{}resolve({http:res.statusCode,data,raw})});
              });
              req.on("timeout",()=>req.destroy(new Error("request timeout")));
              req.on("error",reject);
              if(body)req.write(body);
              req.end();
            });
          }
          const cfHeaders=token=>({Authorization:"Bearer "+token,Accept:"application/json","Content-Type":"application/json"});
          async function remediateDns(){
            const tokens=[["production",process.env.CF_PRODUCTION],["staging",process.env.CF_STAGING],["grant-crawler",process.env.CF_GRANT]].filter(x=>x[1]);
            const configuredIds=[process.env.CF_ZONE_ID_SECRET,process.env.CF_STAGING_ZONE_ID_SECRET,process.env.CF_ZONE_ID_VAR,process.env.CF_STAGING_ZONE_ID_VAR,process.env.CF_ZONE_ID_ALT1,process.env.CF_ZONE_ID_ALT2,process.env.CF_ZONE_ID_ALT3,process.env.CF_ZONE_ID_ALT4,process.env.CF_ZONE_ID_ALT5,process.env.CF_ZONE_ID_ALT6,process.env.CF_ZONE_ID_ALT7,process.env.CF_ZONE_ID_ALT8,process.env.CF_ZONE_ID_ALT9].map(x=>(x||"").trim()).filter(Boolean);
            const variableNames=[];
            try{
              const gh=await request("https://api.github.com/repos/"+encodeURIComponent(process.env.GITHUB_REPOSITORY)+"/actions/variables?per_page=100","GET",{Authorization:"Bearer "+process.env.GH_TOKEN,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
              if(gh.http===200&&Array.isArray(gh.data?.variables)){
                for(const variable of gh.data.variables){
                  if(/cloudflare|dns|zone/i.test(variable.name||"")){
                    variableNames.push(variable.name);
                    if(/zone.*id|id.*zone|dns.*zone/i.test(variable.name||"")&&typeof variable.value==="string"&&variable.value.trim())configuredIds.push(variable.value.trim());
                  }
                }
                console.log("GITHUB_DNS_RELATED_VARIABLE_NAMES="+JSON.stringify(variableNames));
              }else console.log("GITHUB_REPOSITORY_VARIABLE_LOOKUP=UNAVAILABLE_HTTP_"+gh.http);
            }catch(e){console.log("GITHUB_REPOSITORY_VARIABLE_LOOKUP=ERROR_"+String(e.code||e.name))}
            let zone=null,token=null;
            for(const [label,t] of tokens){
              try{
                const r=await request("https://api.cloudflare.com/client/v4/zones?name=irpa.or.tz&per_page=10","GET",cfHeaders(t));
                const found=(r.data?.result||[]).find(z=>z.name==="irpa.or.tz");
                console.log("DNS_ZONE_DISCOVERY_"+label.toUpperCase()+"="+(found?"visible":r.http===200&&r.data?.success===true?"no-zone-visible":"api-error"));
                if(found){zone=found;token=t;break;}
              }catch(e){console.log("DNS_ZONE_DISCOVERY_"+label.toUpperCase()+"_ERROR="+String(e.code||e.name))}
            }
            if(!zone){
              for(const id of [...new Set(configuredIds)]){
                for(const [label,t] of tokens){
                  try{
                    const r=await request("https://api.cloudflare.com/client/v4/zones/"+encodeURIComponent(id),"GET",cfHeaders(t));
                    if(r.http===200&&r.data?.success===true&&r.data?.result?.name==="irpa.or.tz"){
                      zone=r.data.result;token=t;console.log("DNS_ZONE_ID_VALIDATED="+label);break;
                    }
                    const records=await request("https://api.cloudflare.com/client/v4/zones/"+encodeURIComponent(id)+"/dns_records?name=staging.irpa.or.tz","GET",cfHeaders(t));
                    if(records.http===200&&records.data?.success===true&&Array.isArray(records.data?.result)){
                      zone={id,name:"irpa.or.tz"};token=t;console.log("DNS_ZONE_ID_VALIDATED_BY_RECORD_SCOPE="+label);break;
                    }
                  }catch(e){console.log("DNS_ZONE_ID_CANDIDATE_ERROR="+String(e.code||e.name))}
                }
                if(zone)break;
              }
            }
            if(!zone||!token){console.log("DNS_REMEDIATION=BLOCKED_NO_ZONE_SCOPED_TOKEN_AND_ZONE_ID");return false}
            const endpoint="https://api.cloudflare.com/client/v4/zones/"+encodeURIComponent(zone.id)+"/dns_records";
            const list=await request(endpoint+"?type=A&name=staging.irpa.or.tz","GET",cfHeaders(token));
            if(list.http!==200||list.data?.success!==true||!Array.isArray(list.data?.result)){console.log("DNS_REMEDIATION=BLOCKED_DNS_RECORD_READ");return false}
            const aRecords=list.data.result;
            const all=await request(endpoint+"?name=staging.irpa.or.tz","GET",cfHeaders(token));
            if(all.http!==200||all.data?.success!==true||!Array.isArray(all.data?.result)){console.log("DNS_REMEDIATION=BLOCKED_DNS_RECORD_INSPECTION");return false}
            const conflicts=all.data.result.filter(r=>r.type!=="A");
            if(conflicts.length){console.log("DNS_REMEDIATION=BLOCKED_CONFLICTING_RECORD_TYPE_"+conflicts.map(r=>r.type).join("_"));return false}
            const desired={type:"A",name:"staging.irpa.or.tz",content:"41.220.128.10",ttl:1,proxied:true};
            if(aRecords.length){
              let success=true;
              for(const record of aRecords){
                if(record.content==="41.220.128.10"&&record.proxied===true)continue;
                const updated=await request(endpoint+"/"+encodeURIComponent(record.id),"PATCH",cfHeaders(token),JSON.stringify(desired));
                if(updated.http<200||updated.http>=300||updated.data?.success!==true)success=false;
              }
              console.log("DNS_REMEDIATION="+(success?"UPDATED_OR_ALREADY_CORRECT":"FAILED_UPDATE"));return success;
            }
            const created=await request(endpoint,"POST",cfHeaders(token),JSON.stringify(desired));
            const success=created.http>=200&&created.http<300&&created.data?.success===true;
            console.log("DNS_REMEDIATION="+(success?"CREATED_A_RECORD":"FAILED_CREATE"));return success;
          }
          async function remediateCpanel(){
            const base=new URL(process.env.CP_BASE);
            const auth={Authorization:"cpanel "+process.env.CP_USER+":"+process.env.CP_TOKEN,Accept:"application/json"};
            async function uapi(path,params={}){
              const url=new URL("/execute/"+path,base);url.search=new URLSearchParams(params).toString();
              return request(url.href,"GET",auth);
            }
            async function api2(module,func,params={}){
              const url=new URL("/json-api/cpanel",base);
              url.search=new URLSearchParams({cpanel_jsonapi_apiversion:"2",cpanel_jsonapi_module:module,cpanel_jsonapi_func:func,...params}).toString();
              const r=await request(url.href,"GET",auth);
              const root=r.data?.cpanelresult||r.data;
              const rows=Array.isArray(root?.data)?root.data:[];
              return {http:r.http,ok:r.http===200&&(root?.event?.result===1||rows.some(x=>x?.result===1))&&!root?.error,rows,raw:r.raw};
            }
            const info=await uapi("DomainInfo/domains_data");
            const main=info.data?.data?.main_domain||{};
            const root=String(main.documentroot||main.document_root||"");
            if(info.http!==200||info.data?.status!==1||!root.endsWith("/public_html")){console.log("CPANEL_REMEDIATION=BLOCKED_UNEXPECTED_MAIN_DOCUMENT_ROOT");return false}
            const list=async dir=>{
              const r=await uapi("Fileman/list_files",{dir,showdotfiles:1});
              if(r.http!==200||r.data?.status!==1||!Array.isArray(r.data?.data))throw new Error("Could not inspect cPanel directory safely");
              return r.data.data;
            };
            const entries=await list(root);
            const names=entries.map(x=>String(x.file||x.name||""));
            const hasSource=names.includes("staging "),hasTarget=names.includes("staging");
            if(hasSource){
              const sourceFiles=await list(root+"/staging ");
              const sourceNames=sourceFiles.map(x=>String(x.file||x.name||""));
              const required=["wp-admin","wp-content","wp-includes","wp-config.php","index.php"];
              if(!required.every(x=>sourceNames.includes(x))){console.log("CPANEL_REMEDIATION=BLOCKED_SOURCE_NOT_COMPLETE_WORDPRESS");return false}
              if(hasTarget){
                const targetFiles=await list(root+"/staging");
                const targetNames=targetFiles.map(x=>String(x.file||x.name||""));
                if(targetFiles.length!==0){
                  if(required.every(x=>targetNames.includes(x)))console.log("CPANEL_WORDPRESS_DIRECTORY=ALREADY_NORMALIZED");
                  else {
                    const unexpected=targetNames.filter(x=>x!==process.env.CP_TEST_FILE);
                    if(unexpected.length){console.log("CPANEL_REMEDIATION=BLOCKED_TARGET_HAS_UNEXPECTED_FILES");return false}
                    const backup="public_html/staging-empty-backup-"+String(process.env.GITHUB_RUN_ID||"run");
                    const backupCheck=await uapi("Fileman/list_files",{dir:root+"/staging-empty-backup-"+String(process.env.GITHUB_RUN_ID||"run"),showdotfiles:1});
                    if(backupCheck.http===200&&backupCheck.data?.status===1){console.log("CPANEL_REMEDIATION=BLOCKED_BACKUP_PATH_ALREADY_EXISTS");return false}
                    const movedTarget=await api2("Fileman","fileop",{op:"rename",sourcefiles:"public_html/staging",destfiles:backup,doubledecode:"1"});
                    if(!movedTarget.ok){console.log("CPANEL_REMEDIATION=FAILED_TO_PRESERVE_TARGET_TEST_FILE");return false}
                    const movedWp=await api2("Fileman","fileop",{op:"rename",sourcefiles:"public_html/staging ",destfiles:"public_html/staging",doubledecode:"1"});
                    if(!movedWp.ok){
                      await api2("Fileman","fileop",{op:"rename",sourcefiles:backup,destfiles:"public_html/staging",doubledecode:"1"});
                      console.log("CPANEL_WORDPRESS_DIRECTORY_RENAME=FAILED_ROLLBACK_ATTEMPTED");return false
                    }
                    console.log("CPANEL_WORDPRESS_DIRECTORY_RENAME=PASS_TEST_FILE_PRESERVED_IN_BACKUP");
                  }
                }else{
                  const backup="public_html/staging-empty-backup-20261017";
                  const backupCheck=await uapi("Fileman/list_files",{dir:root+"/staging-empty-backup-20261017",showdotfiles:1});
                  if(backupCheck.http===200&&backupCheck.data?.status===1){console.log("CPANEL_REMEDIATION=BLOCKED_BACKUP_PATH_ALREADY_EXISTS");return false}
                  const movedEmpty=await api2("Fileman","fileop",{op:"rename",sourcefiles:"public_html/staging",destfiles:backup,doubledecode:"1"});
                  if(!movedEmpty.ok){console.log("CPANEL_EMPTY_DIRECTORY_BACKUP=FAILED");return false}
                  const movedWp=await api2("Fileman","fileop",{op:"rename",sourcefiles:"public_html/staging ",destfiles:"public_html/staging",doubledecode:"1"});
                  if(!movedWp.ok){
                    await api2("Fileman","fileop",{op:"rename",sourcefiles:backup,destfiles:"public_html/staging",doubledecode:"1"});
                    console.log("CPANEL_WORDPRESS_DIRECTORY_RENAME=FAILED_ROLLBACK_ATTEMPTED");return false
                  }
                  console.log("CPANEL_WORDPRESS_DIRECTORY_RENAME=PASS");
                }
              }else{
                const movedWp=await api2("Fileman","fileop",{op:"rename",sourcefiles:"public_html/staging ",destfiles:"public_html/staging",doubledecode:"1"});
                if(!movedWp.ok){console.log("CPANEL_WORDPRESS_DIRECTORY_RENAME=FAILED");return false}
                console.log("CPANEL_WORDPRESS_DIRECTORY_RENAME=PASS");
              }
            }else if(hasTarget){
              const targetFiles=await list(root+"/staging");
              const targetNames=targetFiles.map(x=>String(x.file||x.name||""));
              if(!["wp-admin","wp-content","wp-includes","wp-config.php","index.php"].every(x=>targetNames.includes(x))){console.log("CPANEL_REMEDIATION=BLOCKED_WORDPRESS_NOT_FOUND_IN_NORMAL_TARGET");return false}
              console.log("CPANEL_WORDPRESS_DIRECTORY=ALREADY_NORMALIZED");
            }else{console.log("CPANEL_REMEDIATION=BLOCKED_EXPECTED_DIRECTORIES_NOT_FOUND");return false}
            const subdomains=await api2("SubDomain","listsubdomains",{regex:"staging"});
            const found=subdomains.rows.find(x=>x.domain==="staging.irpa.or.tz"||x.fullsubdomain==="staging.irpa.or.tz");
            if(found){
              const changed=await uapi("SubDomain/changedocroot",{subdomain:"staging",rootdomain:"irpa.or.tz",dir:"/public_html/staging"});
              if(changed.http!==200||changed.data?.status!==1||changed.data?.result?.result===0){console.log("CPANEL_SUBDOMAIN_MAPPING=FAILED_CHANGE_DOCROOT");return false}
            }else{
              const added=await uapi("SubDomain/addsubdomain",{domain:"staging",rootdomain:"irpa.or.tz",dir:"/public_html/staging"});
              if(added.http!==200||added.data?.status!==1||added.data?.result?.result===0){console.log("CPANEL_SUBDOMAIN_MAPPING=FAILED_ADD");return false}
            }
            const verify=await uapi("DomainInfo/domains_data");
            const data=verify.data?.data||{};
            const all=[...(Array.isArray(data.sub_domains)?data.sub_domains:[]),...(Array.isArray(data.subdomains)?data.subdomains:[])];
            const mapped=all.some(x=>(x.domain||x.name)==="staging.irpa.or.tz"&&String(x.documentroot||x.document_root||x.dir||"").endsWith("/public_html/staging"));
            console.log("CPANEL_SUBDOMAIN_MAPPING="+(mapped?"PASS":"CHANGED_RECHECK_REQUIRED"));
            return true;
          }
          (async()=>{
            let dnsOk=false,cpanelOk=false;
            try{dnsOk=await remediateDns()}catch(e){console.log("DNS_REMEDIATION_ERROR="+String(e.code||e.message||e.name))}
            try{cpanelOk=await remediateCpanel()}catch(e){console.log("CPANEL_REMEDIATION_ERROR="+String(e.code||e.message||e.name))}
            console.log("DNS_REMEDIATION_FINAL="+(dnsOk?"PASS":"BLOCKED_OR_FAILED"));
            console.log("CPANEL_REMEDIATION_FINAL="+(cpanelOk?"PASS":"BLOCKED_OR_FAILED"));
          })().catch(e=>{console.error("Staging remediation step failed unexpectedly: "+String(e.message||e));process.exit(1)});
          NODE

      - name: Inject staging-only Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY: ${{ secrets.STAGING_GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
          WP_BASE: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
          WP_USER: ${{ secrets.STAGING_WORDPRESS_USERNAME }}
          WP_PASSWORD: ${{ secrets.STAGING_WORDPRESS_APPLICATION_PASSWORD }}
