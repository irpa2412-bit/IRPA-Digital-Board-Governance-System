              header('X-IRPA-Staging-Auth-Diagnostic: bridge=active;https=1;authorization=1;php_user=1;php_password=1;app_password=unsupported' . $diagnostic_suffix);
              return $userId;
            }
            $authUser = (string) ($_SERVER['PHP_AUTH_USER'] ?? '');
            $authPassword = (string) ($_SERVER['PHP_AUTH_PW'] ?? '');
            if ($authUser === '' || $authPassword === '') { return $userId; }
            $validated = wp_authenticate_application_password(false, $authUser, $authPassword);
            if ($validated instanceof WP_User) {
              header('X-IRPA-Staging-Auth-Diagnostic: bridge=active;https=1;authorization=1;php_user=1;php_password=1;app_password=valid;fallback=1' . $diagnostic_suffix);
