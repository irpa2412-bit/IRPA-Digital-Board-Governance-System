            const plugin=`<?php
          /**
           * IRPA staging-only WordPress REST Basic Authentication forwarding.
           * Accepts the custom header used by the isolated staging Worker only.
           */
          if (!defined('ABSPATH')) { return; }
          if (strtolower((string) ($_SERVER['HTTP_HOST'] ?? '')) !== 'staging.irpa.or.tz') { return; }
          if (empty($_SERVER['HTTPS']) || strtolower((string) $_SERVER['HTTPS']) === 'off') {
            $cfVisitor = json_decode((string) ($_SERVER['HTTP_CF_VISITOR'] ?? ''), true);
            $forwardedProto = strtolower(trim(explode(',', (string) ($_SERVER['HTTP_X_FORWARDED_PROTO'] ?? ''))[0]));
            $proxySaysHttps = (is_array($cfVisitor) && strtolower((string) ($cfVisitor['scheme'] ?? '')) === 'https') || $forwardedProto === 'https';
            if (!$proxySaysHttps) { return; }
            // Restore the original HTTPS scheme so WordPress Application Passwords remain available behind the TLS-terminating proxy.
            $_SERVER['HTTPS'] = 'on';
            $_SERVER['SERVER_PORT'] = '443';
          }
          $header = trim((string) ($_SERVER['HTTP_X_IRPA_STAGING_AUTHORIZATION'] ?? ''));
          if (!preg_match('/^Basic\s+[A-Za-z0-9+\\/]+={0,2}$/i', $header)) { return; }
          $decoded = base64_decode(substr($header, 6), true);
          if (!is_string($decoded) || strpos($decoded, ':') === false) { return; }
          [$username, $password] = explode(':', $decoded, 2);
          if ($username === '' || $password === '') { return; }
          // Populate the variables WordPress Application Password authentication consumes.
          $_SERVER['HTTP_AUTHORIZATION'] = $header;
          $_SERVER['REDIRECT_HTTP_AUTHORIZATION'] = $header;
          $_SERVER['PHP_AUTH_USER'] = $username;
          $_SERVER['PHP_AUTH_PW'] = $password;
          // Presence-only account diagnostics; never return usernames, passwords, hashes or application-password records.
          $diagnostic_user = function_exists('get_user_by') ? get_user_by('login', $username) : false;
          $diagnostic_user_found = $diagnostic_user instanceof WP_User;
          $diagnostic_editor_caps = $diagnostic_user_found && user_can($diagnostic_user, 'edit_pages') && user_can($diagnostic_user, 'edit_posts');
          $diagnostic_admin = $diagnostic_user_found && user_can($diagnostic_user, 'manage_options');
          $diagnostic_ap_class = class_exists('WP_Application_Passwords');
          $diagnostic_ap_available = function_exists('wp_is_application_passwords_available') ? (bool) wp_is_application_passwords_available() : null;
          $diagnostic_ap_supported = function_exists('wp_is_application_passwords_supported') ? (bool) wp_is_application_passwords_supported() : null;
          $diagnostic_ap_in_use = $diagnostic_ap_class && method_exists('WP_Application_Passwords', 'is_in_use') ? (bool) WP_Application_Passwords::is_in_use() : null;
          $diagnostic_ap_count = null;
          if ($diagnostic_user_found && $diagnostic_ap_class && method_exists('WP_Application_Passwords', 'get_user_application_passwords')) {
            $diagnostic_ap_list = WP_Application_Passwords::get_user_application_passwords($diagnostic_user->ID);
            if (is_array($diagnostic_ap_list)) { $diagnostic_ap_count = count($diagnostic_ap_list); }
          }
          $diagnostic_suffix = ';username_found=' . ($diagnostic_user_found ? '1' : '0') .
            ';editor_caps=' . ($diagnostic_editor_caps ? '1' : '0') .
            ';admin_cap=' . ($diagnostic_admin ? '1' : '0') .
            ';ap_class=' . ($diagnostic_ap_class ? '1' : '0') .
            ';ap_available=' . ($diagnostic_ap_available === null ? 'unknown' : ($diagnostic_ap_available ? '1' : '0')) .
            ';ap_supported=' . ($diagnostic_ap_supported === null ? 'unknown' : ($diagnostic_ap_supported ? '1' : '0')) .
            ';ap_in_use=' . ($diagnostic_ap_in_use === null ? 'unknown' : ($diagnostic_ap_in_use ? '1' : '0')) .
            ';ap_count=' . ($diagnostic_ap_count === null ? 'unknown' : (string) $diagnostic_ap_count);
          header('X-IRPA-Staging-Auth-Diagnostic: bridge=active;https=1;authorization=1;php_user=1;php_password=1;app_password=not_observed' . $diagnostic_suffix);
          add_action('application_password_did_authenticate', function ($user) {
            if ($user instanceof WP_User) {
              header('X-IRPA-Staging-Auth-Diagnostic: bridge=active;https=1;authorization=1;php_user=1;php_password=1;app_password=valid' . $diagnostic_suffix);
            }
