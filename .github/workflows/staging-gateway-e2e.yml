                ...auth,"Content-Type":"multipart/form-data; boundary="+boundary,"Content-Length":String(payload.length)
              },payload);
              let uploadData;try{uploadData=JSON.parse(uploaded.raw)}catch{}
              if(uploaded.http!==200||uploadData?.status!==1)throw new Error("cPanel save and multipart upload both failed for the staging MU-plugin.");
              check=await read(dir,file);
