                  "if($header===''&&function_exists('getallheaders')){foreach((array)getallheaders() as $k=>$v){if(strcasecmp((string)$k,'Authorization')===0){$header=(string)$v;break;}}}",
                  "if($header===''&&function_exists('apache_request_headers')){foreach((array)apache_request_headers() as $k=>$v){if(strcasecmp((string)$k,'Authorization')===0){$header=(string)$v;break;}}}",
                  "if(!preg_match('/^Basic\\\\s+([A-Za-z0-9+\\\\/=]+)$/i',$header,$matches)) return 0;",
                  "$decoded=base64_decode($matches[1],true);",
                  "if($decoded===false||strpos($decoded,':')===false) return 0;",
                  "list($username,$password)=explode(':',$decoded,2);",
                  "$password=preg_replace('/\\\\s+/','',$password);",
                  "if(!hash_equals(base64_decode('"+usernameB64+"'),$username)||!hash_equals('"+passwordHash+"',hash('sha256',$password))) return 0;",
                  "$user=get_user_by('login','"+integrationUser+"');",
                  "if(!$user||get_user_meta($user->ID,'_irpa_staging_gateway_managed',true)!=='v1'||!user_can($user,'edit_pages')) return 0;",
                  "return (int)$user->ID;",
                  "}",
                  "}",
                  "add_filter('determine_current_user',function($userId){if($userId)return $userId;$candidate=irpa_staging_rest_auth_user();return $candidate?:$userId;},20);",
                  "add_filter('rest_authentication_errors',function($result){if(is_wp_error($result)&&$result->get_error_code()==='rest_not_logged_in'){$candidate=irpa_staging_rest_auth_user();if($candidate){wp_set_current_user($candidate);return null;}}return $result;},200);"
                ].join("\n")+"\n";
                if(!await writeFile(muDir,"irpa-staging-rest-auth.php",shim))throw new Error("Could not install and verify the staging-only WordPress REST authentication adapter.");
                console.log("STAGING_REST_AUTH_SHIM_INSTALL=VERIFIED");
              }
              // A prior guarded index.php bootstrap may remain in PHP OPcache even after its original bytes are restored.
              // Invalidate only the staging WordPress front controller via a temporary MU-plugin; never rewrite index.php.
              const cacheToken=crypto.randomBytes(32).toString("hex");
              const cacheHash=crypto.createHash("sha256").update(cacheToken).digest("hex");
              const cachePlugin="irpa-staging-opcache-"+crypto.randomBytes(6).toString("hex")+".php";
              const cachePhp=[
                "<?php",
                "$path=(string)(parse_url((string)(\$_SERVER['REQUEST_URI']??''),PHP_URL_PATH)?:'');",
                "if($path!=='/wp-admin/'&&$path!=='/wp-admin/index.php') return;",
                "$host=strtolower(preg_replace('/:\\d+$/','',(string)(\$_SERVER['HTTP_HOST']??'')));",
                "if($host!=='staging.irpa.or.tz') return;",
                "$provided=(string)(\$_SERVER['HTTP_X_IRPA_STAGING_OPCACHE_TOKEN']??'');",
                "if(!hash_equals('"+cacheHash+"',hash('sha256',$provided))) return;",
                "$target=ABSPATH.'index.php';",
                "$cached=function_exists('opcache_is_script_cached')&&opcache_is_script_cached($target);",
                "$invalidated=!$cached||(function_exists('opcache_invalidate')&&@opcache_invalidate($target,true));",
                "header('Content-Type: application/json; charset=utf-8');",
                "echo json_encode(['ok'=>!$cached||$invalidated,'cached'=>$cached,'invalidated'=>$invalidated]);exit;"
              ].join("\n")+"\n";
              if(!await writeFile(muDir,cachePlugin,cachePhp))throw new Error("Could not install the temporary staging OPcache invalidation plugin.");
              let cacheResult=null,cacheError=null;
              try{
                cacheResult=await request(new URL("/wp-admin/",wpBase).href,"GET",{"X-IRPA-Staging-OPCACHE-Token":cacheToken,Accept:"application/json","Cache-Control":"no-cache"});
                console.log("STAGING_INDEX_OPCACHE_INVALIDATION="+JSON.stringify({http:cacheResult.http,ok:cacheResult.data?.ok===true,cached:cacheResult.data?.cached===true,invalidated:cacheResult.data?.invalidated===true}));
              }catch(e){
                cacheError=e;
                console.log("STAGING_INDEX_OPCACHE_INVALIDATION_ERROR="+String(e.code||e.name||"error"));
              }finally{
                if(!await writeFile(muDir,cachePlugin,inert))throw new Error("Could not neutralize the temporary staging OPcache plugin.");
              }
              const fatalToken=crypto.randomBytes(32).toString("hex");
              const fatalHash=crypto.createHash("sha256").update(fatalToken).digest("hex");
              const fatalPlugin="irpa-staging-fatal-"+crypto.randomBytes(6).toString("hex")+".php";
              const fatalLogName="irpa-staging-fatal-"+crypto.randomBytes(6).toString("hex")+".log";
              const fatalLogPath=stage+"/wp-content/"+fatalLogName;
              const fatalPhp=[
                "<?php",
                "$host=strtolower(preg_replace('/:\\\\d+$/','',(string)(\$_SERVER['HTTP_HOST']??'')));",
                "if($host!=='staging.irpa.or.tz') return;",
                "$path=(string)(parse_url((string)(\$_SERVER['REQUEST_URI']??''),PHP_URL_PATH)?:'');",
                "if(strpos($path,'/wp-json/wp/v2/')!==0) return;",
                "$provided=(string)(\$_SERVER['HTTP_X_IRPA_STAGING_FATAL_TOKEN']??'');",
                "if(!hash_equals('"+fatalHash+"',hash('sha256',$provided))) return;",
                "$logPath='"+fatalLogPath+"';",
                "register_shutdown_function(function() use ($logPath){ $e=error_get_last(); $msg=(string)($e['message']??'no-last-error'); $msg=preg_replace('/(?:password|secret|token|authorization)\\\\s*[:=]\\\\s*[^,\\\\s;]+/i','credential=[redacted]',$msg); $msg=preg_replace('/[A-Z0-9._%+-]+@[A-Z0-9.-]+\\\\.[A-Z]{2,}/i','[email]',$msg); $payload=['type'=>(int)($e['type']??0),'file'=>basename((string)($e['file']??'')),'line'=>(int)($e['line']??0),'message'=>substr($msg,0,240)]; @file_put_contents($logPath,json_encode($payload).PHP_EOL,FILE_APPEND|LOCK_EX); });"
              ].join("\\n")+"\\n";
              if(!await writeFile(muDir,fatalPlugin,fatalPhp))throw new Error("Could not install the temporary staging fatal diagnostic.");
              try{
                verified=await verifyAuth(fatalToken);
              }finally{
                if(!await writeFile(muDir,fatalPlugin,inert))throw new Error("Could not neutralize the temporary staging fatal diagnostic.");
              }
              const fatalLog=await readFile(stage+"/wp-content",fatalLogName);
              if(fatalLog.ok&&fatalLog.content){
                const fatalLines=fatalLog.content.split(/\r?\n/).filter(Boolean).slice(-3).map(line=>{try{const d=JSON.parse(line);return {type:d.type,file:d.file,line:d.line,message:String(d.message||"").replace(/\/home\/[^/\s]+/g,"/home/[account]").replace(/(?:password|secret|token|authorization)\s*[:=]\s*[^,\s;]+/ig,"credential=[redacted]").replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig,"[email]").slice(0,240)}}catch{return {invalidDiagnosticLine:true}}});
                console.log("STAGING_REST_FATAL_DIAGNOSTIC="+JSON.stringify(fatalLines));
              }else{
                console.log("STAGING_REST_FATAL_DIAGNOSTIC="+JSON.stringify({logCreated:false,logReadOk:fatalLog.ok}));
              }
              if(!await writeFile(stage+"/wp-content",fatalLogName,inert))throw new Error("Could not neutralize the temporary staging fatal diagnostic log.");
              if(!verified.ok&&verified.http===500){
                const logDirs=[{label:"staging",dir:stage},{label:"webroot",dir:root},{label:"home-logs",dir:root.replace(/\/public_html$/,"")+"/logs"},{label:"wp-content",dir:stage+"/wp-content"}];
                for(const entry of logDirs){
                  try{
                    const listing=await list(entry.dir);
                    if(!listing.ok)continue;
                    for(const name of listing.files.filter(n=>n==="error_log"||n==="debug.log"||/staging.*error.*log/i.test(n)).slice(0,3)){
                      const log=await readFile(entry.dir,name);
                      const lines=log.content.split(/\r?\n/).filter(line=>/fatal error|uncaught|parse error|irpa-staging-rest-auth|irpa_staging_fatal_diag|undefined function|critical error/i.test(line)).slice(-8).map(line=>line.replace(/\/home\/[^/\s]+/g,"/home/[account]").replace(/(?:password|secret|token|authorization)\s*[:=]\s*[^,\s;]+/ig,"credential=[redacted]").replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig,"[email]").slice(0,200));
                      console.log("STAGING_WORDPRESS_FATAL_LOG="+JSON.stringify({location:entry.label,file:name,count:lines.length,lines}));
                    }
                  }catch{}
                }
              }
              if(!verified.ok&&appPasswordsUnavailable){
                // Read-only diagnostic through a token-guarded temporary index.php, reporting booleans only; always restore the exact original bytes.
                const diagOriginal=await readFile(stage,"index.php");
                if(!diagOriginal.ok||!diagOriginal.content.startsWith("<?php"))throw new Error("Could not read staging index.php for guarded auth diagnostics.");
                const diagToken=crypto.randomBytes(32).toString("hex");
                const diagTokenHash=crypto.createHash("sha256").update(diagToken).digest("hex");
                const diagExpectedUserB64=Buffer.from(process.env.WP_USER,"utf8").toString("base64");
                const diagPasswordHash=crypto.createHash("sha256").update(wpPassword).digest("hex");
                const diagPhp=[
                  "<?php",
                  "$provided=(string)($_SERVER['HTTP_X_IRPA_STAGING_DIAG_TOKEN']??'');",
                  "if(!hash_equals('"+diagTokenHash+"',hash('sha256',$provided))){http_response_code(404);exit;}",
                  "require_once __DIR__.'/wp-load.php';",
                  "$header=(string)($_SERVER['HTTP_X_IRPA_STAGING_AUTHORIZATION']??$_SERVER['HTTP_AUTHORIZATION']??$_SERVER['REDIRECT_HTTP_AUTHORIZATION']??'');",
                  "if($header===''&&function_exists('getallheaders')){foreach((array)getallheaders() as $k=>$v){if(strcasecmp((string)$k,'Authorization')===0){$header=(string)$v;break;}}}",
                  "$parsed=preg_match('/^Basic\\\\s+([A-Za-z0-9+\\\\/=]+)$/i',$header,$m)===1;",
                  "$decoded=$parsed?base64_decode($m[1],true):false;",
                  "$parts=($decoded!==false&&strpos($decoded,':')!==false)?explode(':',$decoded,2):['',''];",
                  "$username=$parts[0];$password=preg_replace('/\\\\s+/','',$parts[1]);",
                  "$expectedUser=base64_decode('"+diagExpectedUserB64+"');",
                  "$user=get_user_by('login','"+integrationUser+"');",
                  "$diagnostics=['auth_header_present'=>$header!=='','basic_parsed'=>$parsed,'username_matches'=>hash_equals($expectedUser,$username),'password_hash_matches'=>hash_equals('"+diagPasswordHash+"',hash('sha256',$password)),'user_found'=>(bool)$user,'user_can_edit_pages'=>($user&&user_can($user,'edit_pages'))];",
                  "header('Content-Type: application/json; charset=utf-8');echo json_encode(['diagnostics'=>$diagnostics]);exit;"
                ].join("\n");
                let diagnosticError=null;
                try{
                  if(!await writeFile(stage,"index.php",diagPhp))throw new Error("Could not install the guarded WordPress auth diagnostic.");
                  const diag=await request(new URL("/index.php",wpBase).href,"GET",{"X-IRPA-Staging-Diag-Token":diagToken,Authorization:basic,"X-IRPA-Staging-Authorization":basic,Accept:"application/json","Cache-Control":"no-cache"});
                  console.log("STAGING_REST_AUTH_DIAGNOSTIC="+JSON.stringify(diag.data?.diagnostics||{http:diag.http,parsedJson:!!diag.data}));
                }catch(e){diagnosticError=e}
                finally{
                  if(!await writeFile(stage,"index.php",diagOriginal.content))throw new Error("CRITICAL: original staging index.php could not be restored after auth diagnostics.");
                  console.log("STAGING_AUTH_DIAGNOSTIC_INDEX_RESTORE=VERIFIED");
                }
                if(diagnosticError)console.log("STAGING_REST_AUTH_DIAGNOSTIC_ERROR="+String(diagnosticError.code||diagnosticError.name||"error"));
              }
            }
            if(!verified.ok){
              const probes=[];
              for(const path of ["/wp-json/","/wp-json/wp/v2/types","/wp-json/wp/v2/posts?per_page=1","/wp-json/wp/v2/users/me?context=edit"]){
                try{
                  const r=await request(new URL(path,wpBase).href,"GET",{Authorization:basic,"X-IRPA-Staging-Authorization":basic,Accept:"application/json","Cache-Control":"no-cache"});
                  probes.push({path,http:r.http,code:String(r.data?.code||"").slice(0,80),message:String(r.data?.message||"").replace(/\/home\/[^/\s]+/g,"/home/[account]").replace(/(?:password|secret|token|authorization)\s*[:=]\s*[^,\s;]+/ig,"credential=[redacted]").slice(0,140)});
                }catch(e){probes.push({path,error:String(e.code||e.name||"error")});}
              }
              console.log("STAGING_REST_ENDPOINT_DIAGNOSTICS="+JSON.stringify(probes));
            }
            console.log("STAGING_WORDPRESS_AUTH_AFTER_REPAIR="+JSON.stringify(verified));
            if(!verified.ok)throw new Error("WordPress REST authentication remains unavailable after the staging bootstrap repair.");
          }
          main().catch(e=>{console.error("Staging WordPress bootstrap repair:",String(e.message||e));process.exit(1)});
          NODE

      - name: Capture staging WordPress fatal diagnostics (redacted)
        if: always()
        env:
          WP_BASE: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
          WP_USER: ${{ secrets.STAGING_WORDPRESS_USERNAME }}
          WP_PASSWORD: ${{ secrets.STAGING_WORDPRESS_APPLICATION_PASSWORD }}
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const https=require("node:https");
          const {URL,URLSearchParams}=require("node:url");
          function request(url,headers={},method="GET",body){
            return new Promise((resolve,reject)=>{
              const u=new URL(url);
              const req=https.request({protocol:u.protocol,hostname:u.hostname,port:u.port||443,path:u.pathname+u.search,method,headers,timeout:12000},res=>{
                let raw="";res.setEncoding("utf8");res.on("data",c=>raw+=c);res.on("end",()=>resolve({http:res.statusCode,headers:res.headers,raw}));
              });
              req.on("timeout",()=>req.destroy(new Error("request timeout")));
              req.on("error",reject);if(body)req.write(body);req.end();
            });
          }
          async function main(){
            const wp=new URL(process.env.WP_BASE||"");
            if(wp.protocol!=="https:"||wp.hostname.toLowerCase()!=="staging.irpa.or.tz")throw new Error("ABORT: fatal diagnostics are restricted to staging.irpa.or.tz.");
            const auth="Basic "+Buffer.from(process.env.WP_USER+":"+String(process.env.WP_PASSWORD||"").replace(/\s/g,"")).toString("base64");
            const probes=[];
            for(const path of ["/wp-json/wp/v2/users/me?context=edit","/wp-json/wp/v2/posts?per_page=1"]){
              try{
                const r=await request(new URL(path,wp).href,{Authorization:auth,"X-IRPA-Staging-Authorization":auth,Accept:"application/json","Cache-Control":"no-cache"});
                let data;try{data=JSON.parse(r.raw)}catch{}
                probes.push({url:new URL(path,wp).href,http:r.http,errorCode:String(data?.code||"").slice(0,80)});
              }catch(e){probes.push({path,error:String(e.code||e.name||"request_error")})}
            }
            const cp=new URL(process.env.CP_BASE||"");
            async function uapi(fn,params={}){
              const u=new URL("/execute/"+fn,cp);u.search=new URLSearchParams(params).toString();
              const r=await request(u.href,{Authorization:"cpanel "+process.env.CP_USER+":"+process.env.CP_TOKEN,Accept:"application/json"});
              let data;try{data=JSON.parse(r.raw)}catch{}
              return {http:r.http,data};
            }
            const info=await uapi("DomainInfo/domains_data");
            const root=String(info.data?.data?.main_domain?.documentroot||info.data?.data?.main_domain?.document_root||"");
            if(info.http!==200||info.data?.status!==1||!root.endsWith("/public_html"))throw new Error("Could not verify staging log locations.");
            const files=[
              {label:"staging-debug-log",dir:root+"/staging/wp-content",name:"debug.log"},
              {label:"staging-webroot-error-log",dir:root+"/staging",name:"error_log"},
              {label:"home-php-error-log",dir:root.replace(/\/public_html$/,"")+"/logs",name:"php.error.log"},
              {label:"staging-domain-error-log",dir:root.replace(/\/public_html$/,"")+"/logs",name:"staging_irpa_or_tz.php.error.log"}
            ];
            const reports=[];
            for(const f of files){
              try{
                const r=await uapi("Fileman/get_file_content",{dir:f.dir,file:f.name});
                const content=String(r.data?.data?.content??r.data?.data?.[0]?.content??r.data?.result?.data?.content??"");
                const lines=content.split(/\r?\n/).filter(x=>/fatal error|allowed memory size|uncaught|parse error|undefined function|uncaught throwable|maximum execution time|out of memory|typeerror|error:/i.test(x)).slice(-10).map(x=>x.replace(/\/home\/[^/\s]+/g,"/home/[account]").replace(/(?:password|secret|token|authorization)\s*[:=]\s*[^,\s;]+/ig,"credential=[redacted]").replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig,"[email]").replace(/[\r\n\t]+/g," ").slice(0,220));
                reports.push({file:f.label,http:r.http,status:r.data?.status??null,contentLength:content.length,relevantLineCount:lines.length,lines});
              }catch(e){reports.push({file:f.label,error:String(e.code||e.name||"read_error")})}
            }
            const output={targetHost:wp.hostname,probes,logs:reports};
            const fs=require("node:fs");
            fs.writeFileSync("staging-wordpress-fatal-diagnostics.txt",JSON.stringify(output,null,2)+"\n");
            console.log("STAGING_FATAL_DIAGNOSTICS="+JSON.stringify({targetHost:wp.hostname,probes:probes.map(p=>({url:p.url,http:p.http,errorCode:p.errorCode,error:p.error})),logs:reports.map(x=>({file:x.file,http:x.http,status:x.status,contentLength:x.contentLength,relevantLineCount:x.relevantLineCount,lines:x.lines}))}));
          }
          main().catch(e=>{console.error("Staging fatal diagnostics failed: "+String(e.message||e));process.exit(1)});
          NODE

      - name: Inject staging-only Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY: ${{ secrets.STAGING_GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
          WP_BASE: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
          WP_USER: ${{ secrets.STAGING_WORDPRESS_USERNAME }}
          WP_PASSWORD: ${{ secrets.STAGING_WORDPRESS_APPLICATION_PASSWORD }}
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_DRIVE_CLIENT_ID" | npx wrangler secret put GOOGLE_DRIVE_CLIENT_ID --config wrangler.staging.generated.json
          printf '%s' "$GOOGLE_DRIVE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_DRIVE_CLIENT_SECRET --config wrangler.staging.generated.json
          printf '%s' "$GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY" | npx wrangler secret put GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY --config wrangler.staging.generated.json
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON --config wrangler.staging.generated.json
          printf '%s' "$WP_BASE" | npx wrangler secret put WORDPRESS_BASE_URL --config wrangler.staging.generated.json
          printf '%s' "$WP_USER" | npx wrangler secret put WORDPRESS_USERNAME --config wrangler.staging.generated.json
          printf '%s' "$WP_PASSWORD" | npx wrangler secret put WORDPRESS_APPLICATION_PASSWORD --config wrangler.staging.generated.json
          printf '%s' "$CP_BASE" | npx wrangler secret put CPANEL_BASE_URL --config wrangler.staging.generated.json
          printf '%s' "$CP_USER" | npx wrangler secret put CPANEL_USERNAME --config wrangler.staging.generated.json
          printf '%s' "$CP_TOKEN" | npx wrangler secret put CPANEL_API_TOKEN --config wrangler.staging.generated.json

      - name: Install gateway dependencies for bundling
        working-directory: drive-gateway
        run: npm ci --no-audit --no-fund

      - name: Deploy staging Worker only
        id: deploy-staging-worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: drive-gateway
          command: deploy --config wrangler.staging.generated.json

      - name: Prepare isolated staging reviewer identity
        env:
          PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
          TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
        run: |
          set -euo pipefail
          npm --prefix functions install --omit=dev --no-audit --no-fund
          NODE_PATH="$GITHUB_WORKSPACE/functions/node_modules" node <<'NODE'
          const {initializeApp,cert}=require("firebase-admin/app");
          const {getAuth}=require("firebase-admin/auth");
          const {getFirestore}=require("firebase-admin/firestore");
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          if(sa.project_id!==process.env.PROJECT) throw new Error("Staging service account project mismatch.");
          initializeApp({credential:cert(sa),projectId:process.env.PROJECT});
          (async()=>{
            const user=await getAuth().getUserByEmail(process.env.TEST_EMAIL);
            await getFirestore().collection("adminProfiles").doc(user.uid).set({uid:user.uid,email:user.email,role:"Administrator",active:true,updatedAt:new Date().toISOString()},{merge:true});
            console.log("STAGING_REVIEWER_IDENTITY_READY");
          })().catch(e=>{console.error("Unable to prepare isolated staging reviewer identity:",e.message);process.exit(1)});
          NODE

      - name: Verify staging health
        id: staging-health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Accept: application/json" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(node -e 'const a=JSON.parse(process.argv[1]); if(!a.success || !a.result?.subdomain) process.exit(1); process.stdout.write(a.result.subdomain)' "$subdomain_json")"
          test -n "$subdomain"
          url="https://irpa-google-drive-gateway-staging.$subdomain.workers.dev"
          echo "staging_url=$url" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$url/health" | tee staging-health.json
          grep -q '"ok":true' staging-health.json
          grep -q '"environment":"staging"' staging-health.json

      - name: Diagnose cPanel endpoint reachability
        env:
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const dns=require("dns").promises;
          const net=require("net");
          (async()=>{
            const u=new URL(process.env.CP_BASE);
            let addresses=[];
            try { addresses=(await dns.lookup(u.hostname,{all:true})).map(x=>x.address); }
            catch(e) { throw new Error("cPanel DNS lookup failed ("+(e.code||e.name)+") for "+u.hostname+"."); }
            console.log("CPANEL_DNS_RESOLVED="+addresses.length+" address(es)");
            async function probe(address){
              let last={address,result:"not-tested"};
              for(let attempt=1;attempt<=3;attempt++){
                last=await new Promise(resolve=>{
                  const socket=net.connect({host:address,port:Number(u.port||443)});
                  let settled=false;
                  const done=v=>{if(!settled){settled=true;socket.destroy();resolve(v)}};
                  socket.setTimeout(8000,()=>done({address,result:"timeout"}));
                  socket.once("connect",()=>done({address,result:"connected"}));
                  socket.once("error",e=>done({address,result:e.code||e.name||"error"}));
                });
                if(last.result==="connected"||last.result==="ENETUNREACH"||attempt===3)return last;
                await new Promise(resolve=>setTimeout(resolve,attempt*1500));
              }
              return last;
            }
            const result=await Promise.all(addresses.map(probe));
            console.log("CPANEL_TCP_REACHABILITY="+JSON.stringify(result));
            if(!result.some(x=>x.result==="connected")) {
              throw new Error("Runner cannot establish TCP connectivity to the configured cPanel endpoint on port "+(u.port||443)+". Check hosting-provider IP allowlisting, firewall rules, routing, and endpoint availability.");
            }
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Prepare isolated cPanel rollback test file
        env:
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
          CP_ROOT: ${{ secrets.STAGING_CPANEL_DOCUMENT_ROOT }}
          CP_TEST_FILE: ${{ secrets.STAGING_CPANEL_TEST_FILE }}
        run: |
          set -euo pipefail
          node <<'NODE'
          require("node:dns").setDefaultResultOrder("ipv4first");
          async function main(){
            let root=process.env.CP_ROOT.trim().replace(/^\/+|\/+$/g,"");
            const homePrefix="home/"+process.env.CP_USER+"/";
            if(root.startsWith(homePrefix)) root=root.slice(homePrefix.length);
            const parts=process.env.CP_TEST_FILE.split("/");
            const file=parts.pop();
            const dir=root+(parts.length?"/"+parts.join("/"):"");
            const base=new URL(process.env.CP_BASE);
            const auth="cpanel "+process.env.CP_USER+":"+process.env.CP_TOKEN;
            const https=require("node:https");
            async function httpsPost(url,headers,body){
              return await new Promise((resolve,reject)=>{
                const req=https.request({protocol:"https:",hostname:base.hostname,servername:base.hostname,port:Number(base.port||443),family:4,path:url.pathname+url.search,method:"POST",headers,timeout:20000},res=>{
                  const chunks=[];res.on("data",chunk=>chunks.push(Buffer.from(chunk)));
                  res.on("end",()=>resolve({status:res.statusCode,ok:res.statusCode>=200&&res.statusCode<300,headers:res.headers,raw:Buffer.concat(chunks).toString("utf8")}));
                });
                req.on("timeout",()=>req.destroy(Object.assign(new Error("cPanel request timed out"),{code:"ETIMEDOUT"})));
                req.on("error",reject);req.end(body);
              });
            }
            async function request(operation,values){
              const url=new URL("/execute/Fileman/"+operation,base);
              let response;
              let lastError;
              for(let attempt=1;attempt<=3;attempt++){
                try {
                  response=await httpsPost(url,{Authorization:auth,Accept:"application/json","Content-Type":"application/x-www-form-urlencoded"},new URLSearchParams(values).toString());
                  lastError=null;break;
                } catch(error) {
                  lastError=error;
                  const code=error.code||error.cause?.code||error.cause?.name||error.name||"unknown";
                  const transient=["ETIMEDOUT","ECONNRESET","EHOSTUNREACH","UND_ERR_CONNECT_TIMEOUT","TimeoutError"].includes(code);
                  if(!transient||attempt===3) throw new Error("Staging cPanel API connection failed ("+code+") at "+base.hostname+":"+base.port+" after "+attempt+" IPv4 attempt(s).");
                  await new Promise(resolve=>setTimeout(resolve,attempt*2000));
                }
              }
              if(lastError||!response) throw new Error("Staging cPanel API request did not return a response.");
              const raw=response.raw;
              let body=null;
              try { body=JSON.parse(raw); } catch {}
              if(!response.ok||!body) {
                const detail=String(body?.errors?.map?.(x=>x?.message).filter(Boolean).join("; ")||body?.error||body?.message||"").replace(/[\r\n\t]+/g," ").slice(0,220);
                const contentType=response.headers["content-type"]||"unknown";
                const lower=raw.toLowerCase();
                const titleStart=lower.indexOf("<title");
                const titleOpen=titleStart>=0?raw.indexOf(">",titleStart):-1;
                const titleEnd=titleOpen>=0?lower.indexOf("</title>",titleOpen):-1;
                const title=titleOpen>=0&&titleEnd>titleOpen?raw.slice(titleOpen+1,titleEnd).replace(/<[^>]*>/g," ").replace(/[\r\n\t]+/g," ").trim().slice(0,120):"";
                const excerpt=raw.replace(/<[^>]*>/g," ").replace(/&nbsp;/gi," ").replace(/&amp;/gi,"&").replace(/[\r\n\t]+/g," ").replace(/\s+/g," ").trim().slice(0,180);
                const diagnostic=[detail,title?"page title: "+title:"",excerpt?"response excerpt: "+excerpt:""].filter(Boolean).join("; ");
                throw new Error("Staging cPanel test-file preparation failed with HTTP "+response.status+" (content-type: "+contentType+")"+(diagnostic?"; "+diagnostic:"; response body was not valid cPanel JSON")+". Check cPanel API token validity, user association, token privileges, and hosting security rules.");
              }
              if(body.status!==1 && body.errors?.length) {
                const detail=String(body.errors.map(x=>typeof x==="string"?x:(x?.message||x?.error||JSON.stringify(x))).filter(Boolean).join("; ")).replace(/[\\r\\n\\t]+/g," ").slice(0,220);
                if(operation==="get_file_content" && body.status!==1 && body.errors?.length) { console.log("STAGING_CPANEL_TEST_FILE_NOT_READABLE_OR_MISSING; attempting isolated upload"); return body; }
                const meta="status="+String(body.status)+", error_keys="+Object.keys(body).filter(k=>/error|reason|status|message/i.test(k)).join(",");
                throw new Error("cPanel Fileman API rejected the request ("+meta+")"+(detail?": "+detail:"; no readable error detail returned")+".");
              }
              return body;
            }
            const existing=await request("get_file_content",{dir,file});
            if(existing.status===1){
              const content=existing.data?.content??existing.data?.[0]?.content;
              if(typeof content!=="string") throw new Error("Staging cPanel test file exists but is not readable.");
              console.log("STAGING_CPANEL_TEST_FILE_READY");
              return;
            }
            // Fileman::save_file_content updates an existing file on some cPanel builds.
            // Create a missing, dedicated staging test file using the documented multipart upload API.
            const uploadUrl=new URL("/execute/Fileman/upload_files",base);
            const boundary="----IRPAStagingUpload"+Date.now().toString(16);
            const uploadBody=Buffer.concat([
              Buffer.from("--"+boundary+"\r\nContent-Disposition: form-data; name=\"dir\"\r\n\r\n"+dir+"\r\n"),
              Buffer.from("--"+boundary+"\r\nContent-Disposition: form-data; name=\"file-1\"; filename=\""+file+"\"\r\nContent-Type: text/plain; charset=utf-8\r\n\r\n"),
              Buffer.from("IRPA staging cPanel rollback baseline\n"),
              Buffer.from("\r\n--"+boundary+"--\r\n")
            ]);
            let uploadResponse;
            let uploadError;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                uploadResponse=await httpsPost(uploadUrl,{Authorization:auth,Accept:"application/json","Content-Type":"multipart/form-data; boundary="+boundary,"Content-Length":String(uploadBody.length)},uploadBody);
                uploadError=null;break;
              }catch(error){
                uploadError=error;
                const code=error.code||error.cause?.code||error.cause?.name||error.name||"unknown";
                if(!["ETIMEDOUT","ECONNRESET","EHOSTUNREACH","UND_ERR_CONNECT_TIMEOUT","TimeoutError"].includes(code)||attempt===3){
                  throw new Error("Staging cPanel test-file upload failed ("+code+") after "+attempt+" IPv4 attempt(s).");
                }
                await new Promise(resolve=>setTimeout(resolve,attempt*2000));
              }
            }
            if(uploadError||!uploadResponse) throw new Error("Staging cPanel test-file upload returned no response.");
            const uploadRaw=uploadResponse.raw;
            let uploaded=null;
            try{uploaded=JSON.parse(uploadRaw)}catch{}
            if(!uploadResponse.ok||!uploaded||uploaded.status!==1){
              const detail=String(uploaded?.errors?.map?.(x=>typeof x==="string"?x:(x?.message||JSON.stringify(x))).filter(Boolean).join("; ")||uploaded?.messages?.join?.("; ")||"").replace(/[\\r\\n\\t]+/g," ").slice(0,220);
              throw new Error("cPanel Fileman upload_files failed (HTTP "+uploadResponse.status+", status="+String(uploaded?.status)+")"+(detail?": "+detail:"; invalid JSON response")+".");
            }
            console.log("STAGING_CPANEL_TEST_FILE_CREATED");
          }
          main().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Diagnose staging WordPress application-password authentication (no secrets logged)
        env:
          WP_BASE: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
          WP_USER: ${{ secrets.STAGING_WORDPRESS_USERNAME }}
          WP_PASSWORD: ${{ secrets.STAGING_WORDPRESS_APPLICATION_PASSWORD }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const {URL}=require("node:url");
          async function main(){
            const base=new URL(process.env.WP_BASE);
            const auth="Basic "+Buffer.from(process.env.WP_USER+":"+String(process.env.WP_PASSWORD||"").replace(/\s/g,"")).toString("base64");
            let response;
            try{
              response=await fetch(new URL("/wp-json/wp/v2/users/me?context=edit",base),{headers:{Authorization:auth,"X-IRPA-Staging-Authorization":auth,Accept:"application/json","Cache-Control":"no-cache"},signal:AbortSignal.timeout(12000)});
            }catch(e){
              console.log("STAGING_WP_APPLICATION_PASSWORD_PREFLIGHT="+JSON.stringify({result:"network_error",error:String(e.cause?.code||e.name||"error")}));
              return;
            }
            const data=await response.json().catch(()=>({}));
            console.log("STAGING_WP_APPLICATION_PASSWORD_PREFLIGHT="+JSON.stringify({http:response.status,contentType:response.headers.get("content-type")||"",server:response.headers.get("server")||"",errorCode:String(data.code||"").slice(0,80),authenticated:response.status===200&&Number.isInteger(data.id)}));
          }
          main().catch(e=>{console.log("STAGING_WP_APPLICATION_PASSWORD_PREFLIGHT=ERROR_"+String(e.name||"error"));process.exit(1)});
          NODE


      - name: Write redacted repair summary
        if: always()
        env:
          PREFLIGHT: ${{ steps.staging-preflight.outcome }}
          REPAIR: ${{ steps.wp-bootstrap-repair.outcome }}
          DEPLOY: ${{ steps.deploy-staging-worker.outcome }}
          HEALTH: ${{ steps.staging-health.outcome }}
        run: |
          set -euo pipefail
          { echo "# IRPA-DBGS staging repair"; echo ""; echo "- Target: staging.irpa.or.tz"; echo "- Preflight: ${PREFLIGHT:-not-run}"; echo "- WordPress bootstrap/auth repair: ${REPAIR:-not-run}"; echo "- Staging Worker deployment: ${DEPLOY:-not-run}"; echo "- Staging health: ${HEALTH:-not-run}"; echo "- Production credentials/site/DNS: not accessed in this run"; echo "- Merge gate: CLOSED"; } | tee staging-repair-summary.md >> "$GITHUB_STEP_SUMMARY"
          cp staging-repair-summary.md staging-repair-diagnostics.txt
          if [ -f staging-wordpress-fatal-diagnostics.txt ]; then cat staging-wordpress-fatal-diagnostics.txt >> staging-repair-diagnostics.txt; fi
      - name: Upload redacted repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-repair-redacted-diagnostics
          path: staging-repair-diagnostics.txt
          if-no-files-found: error

  acceptance-staging:
    needs: repair-staging
    if: needs.repair-staging.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assert staging-only target before acceptance
        id: acceptance-preflight
        env:
          WP_BASE: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          STAGING_URL: ${{ needs.repair-staging.outputs.staging_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const wp=new URL(process.env.WP_BASE||""),cp=new URL(process.env.CP_BASE||""),worker=new URL(process.env.STAGING_URL||"");
          if(wp.protocol!=="https:"||wp.hostname.toLowerCase()!=="staging.irpa.or.tz") throw new Error("ABORT: WordPress target is not the approved staging host.");
          if(cp.protocol!=="https:"||cp.port!=="2083") throw new Error("ABORT: cPanel target is not HTTPS port 2083.");
          if(worker.protocol!=="https:"||!worker.hostname.startsWith("irpa-google-drive-gateway-staging.")||!worker.hostname.endsWith(".workers.dev")) throw new Error("ABORT: Worker target is not the isolated staging Worker.");
          console.log("STAGING_ACCEPTANCE_TARGETS=PASS");
          NODE
      - name: Verify WordPress and cPanel read-write-rollback integration
        id: acceptance
        env:
          STAGING_URL: ${{ needs.repair-staging.outputs.staging_url }}
          FIREBASE_WEB_API_KEY: ${{ secrets.STAGING_FIREBASE_WEB_API_KEY }}
          TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          WP_BASE: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
          WP_USER: ${{ secrets.STAGING_WORDPRESS_USERNAME }}
          WP_PASSWORD: ${{ secrets.STAGING_WORDPRESS_APPLICATION_PASSWORD }}
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
          CP_ROOT: ${{ secrets.STAGING_CPANEL_DOCUMENT_ROOT }}
          CP_TEST_FILE: ${{ secrets.STAGING_CPANEL_TEST_FILE }}
        run: |
          set -euo pipefail
          ID_TOKEN="$(node <<'NODE'
          const https=require("https");
          const body=JSON.stringify({email:process.env.TEST_EMAIL,password:process.env.TEST_PASSWORD,returnSecureToken:true});
          const req=https.request("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(process.env.FIREBASE_WEB_API_KEY),{method:"POST",headers:{"Content-Type":"application/json","Content-Length":Buffer.byteLength(body)}},res=>{
            let raw="";res.setEncoding("utf8");res.on("data",c=>raw+=c);res.on("end",()=>{let data;try{data=JSON.parse(raw)}catch{console.error("Staging Firebase sign-in returned invalid JSON.");process.exit(1)}if(res.statusCode!==200||!data.idToken){console.error("Staging Firebase sign-in failed with HTTP "+res.statusCode);process.exit(1)}process.stdout.write(data.idToken)});
          });req.on("error",e=>{console.error("Staging Firebase sign-in request failed:",e.message);process.exit(1)});req.end(body);
          NODE
          )"
          export ID_TOKEN
          node <<'NODE'
          const base=process.env.STAGING_URL;
          const token=process.env.ID_TOKEN;
          const marker="IRPA_STAGING_WEBSITE_CHECK_"+Date.now();
          const wpBase=process.env.WP_BASE.replace(/\/+$/,"");
          const wpAuth="Basic "+Buffer.from(process.env.WP_USER+":"+process.env.WP_PASSWORD).toString("base64");
          async function call(path,options={}){
            const response=await fetch(base+path,{...options,headers:{Authorization:"Bearer "+token,Accept:"application/json",...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{})}});
            const body=await response.json().catch(()=>({}));
            if(!response.ok) throw new Error(path+" returned HTTP "+response.status+": "+String(body.error||"request failed").slice(0,180));
            return body;
          }
          async function wpRequest(path,body){
            const response=await fetch(wpBase+"/wp-json/wp/v2/"+path,{method:body?"POST":"GET",headers:{Authorization:wpAuth,Accept:"application/json",...(body?{"Content-Type":"application/json"}:{})},...(body?{body:JSON.stringify(body)}:{})});
            const data=await response.json().catch(()=>null);
            if(!response.ok||!data) throw new Error("Staging WordPress test-page preparation/restore failed with HTTP "+response.status+".");
            return data;
          }
          async function waitForPublicMarker(url){
            for(let i=0;i<6;i++){
              const response=await fetch(url+(url.includes("?")?"&":"?")+"irpa_staging_check="+Date.now(),{cache:"no-store"});
              if(response.ok && (await response.text()).includes(marker)) return true;
              await new Promise(r=>setTimeout(r,1500));
            }
            return false;
          }
          (async()=>{
            const status=await call("/api/communications/site/status");
            if(status.connections?.website!=="connected"||status.connections?.cpanel!=="connected") throw new Error("WordPress/cPanel connection status: "+JSON.stringify(status.connections||{}));
            const baselineTitle="IRPA Staging Integration Check";
            const baselineContent="<p>IRPA staging integration baseline.</p>";
            const found=await wpRequest("pages?slug=irpa-staging-integration-check&context=edit&per_page=1");
            let page=(Array.isArray(found)?found:[]).find(x=>Number.isInteger(x.id));
            let created=false;
            let original=null;
            if(page){
              original={title:page.title?.raw||page.title?.rendered||baselineTitle,content:page.content?.raw??baselineContent,status:page.status||"draft"};
            }else{
              page=await wpRequest("pages",{title:baselineTitle,slug:"irpa-staging-integration-check",content:baselineContent,status:"draft"});
              created=true;
              original={title:baselineTitle,content:baselineContent,status:"draft"};
            }
            let prepared=false;
            try{
              const ready=await wpRequest("pages/"+page.id,{title:baselineTitle,slug:"irpa-staging-integration-check",content:baselineContent,status:"publish"});
              prepared=true;
              const listed=await call("/api/communications/website/content?type=pages");
              const portalPage=(listed.items||[]).find(x=>Number(x.id)===Number(page.id));
              if(!portalPage) throw new Error("The dedicated staging page was not visible through the Communication & Media Portal.");
              const updated=await call("/api/communications/website/content",{method:"PUT",body:JSON.stringify({id:page.id,type:"pages",title:baselineTitle+" "+marker,content:baselineContent+"<p>"+marker+"</p>"})});
              if(!updated.success||!await waitForPublicMarker(updated.publicUrl||ready.link||page.link)) throw new Error("The staged website edit did not render publicly.");
              await call("/api/communications/website/content",{method:"PUT",body:JSON.stringify({id:page.id,type:"pages",title:baselineTitle,content:baselineContent})});
            }finally{
              if(prepared){
                await wpRequest("pages/"+page.id,{title:original.title,content:original.content,status:created?"draft":original.status});
              }else if(created){
                await wpRequest("pages/"+page.id,{status:"draft"});
              }
            }
            const cpanelPath=process.env.CP_TEST_FILE;
            const before=await call("/api/communications/cpanel/files?path="+encodeURIComponent(cpanelPath));
            if(typeof before.content!=="string") throw new Error("The designated staging cPanel test file could not be read.");
            let backupId="";
            try{
              const write=await call("/api/communications/cpanel/files",{method:"PUT",body:JSON.stringify({path:cpanelPath,content:marker})});
              backupId=write.backupId||"";
              if(!backupId) throw new Error("The cPanel write did not return a rollback snapshot.");
              const after=await call("/api/communications/cpanel/files?path="+encodeURIComponent(cpanelPath));
              if(after.content!==marker) throw new Error("The cPanel file content did not match the staged write.");
            }finally{
              if(backupId){
                await call("/api/communications/cpanel/rollback",{method:"POST",body:JSON.stringify({path:cpanelPath,backupId})});
              }else{
                const root=process.env.CP_ROOT.replace(/^\/+|\/+$/g,"");
                const cpFile=cpanelPath.split("/").pop();
                const response=await fetch(new URL("/execute/Fileman/save_file_content",process.env.CP_BASE),{method:"POST",headers:{Authorization:"cpanel "+process.env.CP_USER+":"+process.env.CP_TOKEN,Accept:"application/json","Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({dir:root,file:cpFile,content:before.content,charset:"utf-8"})});
                const result=await response.json().catch(()=>null);
                if(!response.ok||result?.status!==1) throw new Error("Emergency restoration of the staging cPanel test file failed.");
              }
            }
            const restored=await call("/api/communications/cpanel/files?path="+encodeURIComponent(cpanelPath));
            if(restored.content!==before.content) throw new Error("The cPanel rollback did not restore the original content.");
            const denied=await fetch(base+"/api/communications/cpanel/files?path="+encodeURIComponent("../index.php"),{headers:{Authorization:"Bearer "+token,Accept:"application/json"}});
            if(denied.ok) throw new Error("cPanel traversal/executable path rejection failed.");
            console.log("STAGING_WORDPRESS_READ_WRITE_PUBLIC_RENDER_RESTORE_PASS");
            console.log("STAGING_CPANEL_READ_WRITE_ROLLBACK_PATH_REJECTION_PASS");
          })().catch(e=>{console.error("Staging website integration acceptance failed:",e.message);process.exit(1)});
          NODE

      - name: Write redacted acceptance summary
        if: always()
        env:
          PREFLIGHT: ${{ steps.acceptance-preflight.outcome }}
          ACCEPTANCE: ${{ steps.acceptance.outcome }}
        run: |
          set -euo pipefail
          { echo "# IRPA-DBGS staging acceptance"; echo ""; echo "- Target: staging only"; echo "- Target preflight: ${PREFLIGHT:-not-run}"; echo "- Read/write/restore acceptance: ${ACCEPTANCE:-not-run}"; echo "- Production site/DNS/credentials: not accessed in this run"; echo "- Merge gate: CLOSED"; } | tee staging-acceptance-summary.md >> "$GITHUB_STEP_SUMMARY"
          cp staging-acceptance-summary.md staging-acceptance-diagnostics.txt
      - name: Upload redacted acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-acceptance-redacted-diagnostics
          path: staging-acceptance-diagnostics.txt
          if-no-files-found: error

