name: Staging Gateway E2E and Deploy
# Archive repair deployment is isolated to the approved staging Firebase app and dedicated KV namespace.

on:
  push:
    branches: [main, fix/member-signature-invitation-email-20261004, fix/signature-gateway-cryptographic-bridge-20261015, fix/communication-media-archive-drive-oauth]
    paths:
      - "drive-gateway/**"
      - "src/firebase/documentLifecycle.js"
      - "firebase.json"
      - ".github/workflows/staging-gateway-e2e.yml"
      - ".github/workflows/meeting-portal-fixture-browser.yml"
      - "tests/meeting-isolation-guard.test.mjs"
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "Deploy the isolated staging Worker and run live cryptographic acceptance"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  local-e2e:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/member-signature-invitation-email-20261004' || github.ref == 'refs/heads/fix/signature-gateway-cryptographic-bridge-20261015' || github.ref == 'refs/heads/fix/communication-media-archive-drive-oauth'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: drive-gateway
      - name: Install meeting Gateway emulator test dependencies
        run: npm --prefix functions install --omit=dev --no-audit --no-fund
      - name: Validate runtime acceptance script and Drive multipart framing
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          node --check tests/staging-runtime-acceptance.mjs
          # RFC 7578 multipart upload framing must use actual CRLF escape sequences,
          # not literal backslash characters that Google Drive rejects.
          grep -Fq '\r\nContent-Type: application/json' src/esignContext.mjs
          if grep -Fq '\\r\\nContent-Type: application/json' src/esignContext.mjs; then
            echo "Drive multipart framing contains double-escaped CRLF." >&2
            exit 1
          fi
      - name: Firestore emulator E2E
        run: |
          set -o pipefail
          npx firebase emulators:exec --project demo-irpa-staging --only firestore "npm --prefix drive-gateway test && node --test functions/meetingGateway.emulator.test.cjs" | tee e2e-output.ndjson
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-gateway-e2e-raw-output
          path: e2e-output.ndjson

  preflight-staging:
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/fix/signature-gateway-cryptographic-bridge-20261015' || github.ref == 'refs/heads/fix/communication-media-archive-drive-oauth')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify staging signer and provision missing synthetic fixture (isolated staging only)
        env:
          PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          TEST_EMAIL: ${{ secrets.STAGING_CRYPTO_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.STAGING_CRYPTO_TEST_PASSWORD }}
          TEST_AUTHORITY: ${{ secrets.STAGING_CRYPTO_TEST_AUTHORITY || vars.STAGING_CRYPTO_TEST_AUTHORITY }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.LIVEKIT_STAGING_FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_WEB_API_KEY: "AIzaSyA6UmHtP-mRr99rBw57_-qrD4_mFSBnZ38"
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from "node:crypto";
          const project=process.env.PROJECT||"";
          const email=process.env.TEST_EMAIL||"";
          const password=process.env.TEST_PASSWORD||"";
          const desired=String(process.env.TEST_AUTHORITY||"").trim();
          if(project!=="irpa-dbg-staging-a73ec" || project==="irpa-digital-board-governance") throw new Error("Refusing non-isolated or unexpected Firebase project.");
          if(!email||!password||!process.env.SERVICE_ACCOUNT_JSON) throw new Error("Required staging credentials or service-account secret are unavailable; secret values are never logged.");
          let sa;
          try { sa=JSON.parse(process.env.SERVICE_ACCOUNT_JSON); } catch { throw new Error("Staging service-account secret is not valid JSON."); }
          if(sa.project_id!==project||!sa.client_email||!sa.private_key) throw new Error("Staging service account is incomplete or belongs to another project.");
          const authResponse=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(process.env.FIREBASE_WEB_API_KEY),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email,password,returnSecureToken:true})});
          const auth=await authResponse.json().catch(()=>({}));
          if(!authResponse.ok||!auth.idToken||!auth.localId) throw new Error("Dedicated staging Firebase account authentication failed (HTTP "+authResponse.status+").");
          const claims=JSON.parse(Buffer.from(auth.idToken.split(".")[1],"base64url").toString("utf8"));
          if(claims.aud!==project||claims.iss!=="https://securetoken.google.com/"+project) throw new Error("Staging signer token project/audience mismatch.");
          const readOwn=async collection=>{
            const res=await fetch("https://firestore.googleapis.com/v1/projects/"+project+"/databases/(default)/documents/"+collection+"/"+encodeURIComponent(auth.localId),{headers:{Authorization:"Bearer "+auth.idToken}});
            const data=await res.json().catch(()=>({}));
            if(res.status===404) return null;
            if(!res.ok) throw new Error("Cannot read the signer's "+collection+" record under its own authenticated identity (HTTP "+res.status+").");
            return data.fields||{};
          };
          let sig=await readOwn("signatureProfiles");
          let identity=await readOwn("signerIdentities");
          const val=(fields,key)=>fields?.[key]?.stringValue||"";
          if(!sig){
            // Explicit synthetic fixture for the dedicated staging test identity only.
            const svg='<svg xmlns="http://www.w3.org/2000/svg" width="360" height="90" viewBox="0 0 360 90"><rect width="360" height="90" fill="white"/><path d="M18 54 C32 16 38 77 58 45 S84 24 88 52 S110 69 130 38 S153 18 160 53 S184 68 200 41 S224 22 231 53 S252 67 271 39 S293 24 303 52" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/><text x="180" y="82" text-anchor="middle" font-size="10" fill="#6b7280">STAGING TEST FIXTURE - NOT A REAL SIGNATURE</text></svg>';
            const specimen='data:image/svg+xml;base64,'+Buffer.from(svg).toString("base64");
            const fields={uid:{stringValue:auth.localId},email:{stringValue:auth.email||email},displayName:{stringValue:"IRPA Staging Crypto Test Signer"},method:{stringValue:"Automated Staging Test Fixture"},status:{stringValue:"Active"},signatureUrl:{stringValue:specimen},signaturePath:{stringValue:"staging-test-fixture/synthetic.svg"},signatureSha256:{stringValue:crypto.createHash("sha256").update(svg).digest("hex")},recordOrigin:{stringValue:"TRIAL"},pathwayVersion:{stringValue:"STAGING-ONLY-TEST-FIXTURE"}};
            const created=await fetch("https://firestore.googleapis.com/v1/projects/"+project+"/databases/(default)/documents/signatureProfiles?documentId="+encodeURIComponent(auth.localId),{method:"POST",headers:{Authorization:"Bearer "+auth.idToken,"content-type":"application/json"},body:JSON.stringify({fields})});
            if(!created.ok && created.status!==409) throw new Error("Could not provision the authenticated staging-only Signature Profile fixture (HTTP "+created.status+").");
            sig=await readOwn("signatureProfiles");
            if(!sig) throw new Error("Staging-only Signature Profile fixture was not readable after provisioning.");
            console.log("STAGING_SYNTHETIC_SIGNATURE_FIXTURE=PROVISIONED (isolated test identity only)");
          }
          if(val(sig,"status")!=="Active"||!val(sig,"signatureUrl").startsWith("data:image/")) throw new Error("STAGING_SIGNER_PROFILE_INCOMPLETE: Signature Profile must be Active and contain a saved signature specimen.");
          const now=Math.floor(Date.now()/1000);
          const b64=x=>Buffer.from(x).toString("base64url");
          const unsigned=b64(JSON.stringify({alg:"RS256",typ:"JWT"}))+"."+b64(JSON.stringify({iss:sa.client_email,scope:"https://www.googleapis.com/auth/datastore",aud:"https://oauth2.googleapis.com/token",iat:now,exp:now+300}));
          const assertion=unsigned+"."+crypto.sign("RSA-SHA256",Buffer.from(unsigned),sa.private_key).toString("base64url");
          const tokenRes=await fetch("https://oauth2.googleapis.com/token",{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body:new URLSearchParams({grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",assertion})});
          const tokenData=await tokenRes.json().catch(()=>({}));
          if(!tokenRes.ok||!tokenData.access_token) throw new Error("Could not obtain staging Firestore authority-register access token.");
          const readRegister=async collection=>{
            const res=await fetch("https://firestore.googleapis.com/v1/projects/"+project+"/databases/(default)/documents/"+collection+"/"+encodeURIComponent(auth.localId),{headers:{Authorization:"Bearer "+tokenData.access_token}});
            const data=await res.json().catch(()=>({}));
            if(res.status===404) return null;
            if(!res.ok) throw new Error("Staging "+collection+" authority-register read failed (HTTP "+res.status+").");
            return data.fields||{};
          };
          let [member,employee]=await Promise.all([readRegister("members"),readRegister("employees")]);
          const active=(r,collection)=>!!r&&(collection==="members"?val(r,"status")==="Active":(val(r,"status")==="Active"||val(r,"employmentStatus")==="Active"));
          const roleValues=r=>[val(r,"role"),val(r,"boardPosition"),...(r?.roles?.arrayValue?.values||[]).map(x=>x.stringValue||""),...(r?.assignedRoles?.arrayValue?.values||[]).map(x=>x.stringValue||""),...(r?.selectedRoles?.arrayValue?.values||[]).map(x=>x.stringValue||""),...(r?.roleAssignments?.arrayValue?.values||[]).map(x=>x.stringValue||"")].filter(Boolean);
          if(!member&&!employee){
            if(desired) throw new Error("Configured STAGING_CRYPTO_TEST_AUTHORITY cannot be provisioned because no existing staging Member/Employee register record exists.");
            const fixtureFields={uid:{stringValue:auth.localId},email:{stringValue:auth.email||email},name:{stringValue:"IRPA Staging Crypto Test Signer"},fullName:{stringValue:"IRPA Staging Crypto Test Signer"},status:{stringValue:"Active"},registrationStatus:{stringValue:"Activated"},accountActivated:{booleanValue:true},department:{stringValue:"Staging Test Department"},unit:{stringValue:"Staging Test Unit"},role:{stringValue:"Staging Test Signer"},recordOrigin:{stringValue:"TRIAL"},isStagingTestFixture:{booleanValue:true},testFixtureType:{stringValue:"STAGING_CRYPTO_ACCEPTANCE"},createdAt:{timestampValue:new Date().toISOString()}};
            const created=await fetch("https://firestore.googleapis.com/v1/projects/"+project+"/databases/(default)/documents/members?documentId="+encodeURIComponent(auth.localId),{method:"POST",headers:{Authorization:"Bearer "+tokenData.access_token,"content-type":"application/json"},body:JSON.stringify({fields:fixtureFields})});
            if(!created.ok&&created.status!==409) throw new Error("Could not provision the isolated staging-only test member fixture (HTTP "+created.status+").");
            member=await readRegister("members");
            if(!member) throw new Error("Staging test member fixture was not readable after provisioning.");
            console.log("STAGING_TEST_MEMBER_FIXTURE=PROVISIONED (isolated test identity only)");
          }
          if(member?.isStagingTestFixture?.booleanValue===true&&val(member,"testFixtureType")==="STAGING_CRYPTO_ACCEPTANCE"&&(member?.accountActivated?.booleanValue!==true||val(member,"registrationStatus")!=="Activated")){
            const activationMask=new URLSearchParams();
            for(const field of ["registrationStatus","accountActivated","updatedAt"]) activationMask.append("updateMask.fieldPaths",field);
            const activationFields={registrationStatus:{stringValue:"Activated"},accountActivated:{booleanValue:true},updatedAt:{timestampValue:new Date().toISOString()}};
            const activationResponse=await fetch("https://firestore.googleapis.com/v1/projects/"+project+"/databases/(default)/documents/members/"+encodeURIComponent(auth.localId)+"?"+activationMask.toString(),{method:"PATCH",headers:{Authorization:"Bearer "+tokenData.access_token,"content-type":"application/json"},body:JSON.stringify({fields:activationFields})});
            if(!activationResponse.ok) throw new Error("Could not activate the isolated synthetic staging test member fixture (HTTP "+activationResponse.status+").");
            member=await readRegister("members");
            if(member?.accountActivated?.booleanValue!==true||val(member,"registrationStatus")!=="Activated") throw new Error("Isolated staging test member activation did not persist.");
            console.log("STAGING_TEST_MEMBER_ACTIVATION=PASS (synthetic fixture only)");
          }
          const candidates=[{record:member,collection:"members"},{record:employee,collection:"employees"}].filter(x=>active(x.record,x.collection));
          const norm=s=>String(s||"").toLowerCase().replace(/^(the|irpa)\s+/,"").replace(/[._-]+/g," ").replace(/\s+/g," ").trim();
          const selected=candidates.find(x=>desired&&roleValues(x.record).some(role=>norm(role)===norm(desired)))||candidates.find(x=>roleValues(x.record).length);
          if(!selected) throw new Error("No active staging Member/Employee authority record exists for the authenticated test UID.");
          const record=selected.record;
          const roles=roleValues(record);
          const role=desired?roles.find(value=>norm(value)===norm(desired))||"":(val(record,"role")||val(record,"boardPosition")||roles[0]||"");
          const dept=val(record,"department");
          const unit=val(record,"unit")||val(record,"unitName")||dept;
          if(!role||!dept||!unit) throw new Error("Active staging authority register lacks a role, department or unit for the test signer.");
          if(!identity){
            const fields={uid:{stringValue:auth.localId},signerProfileId:{stringValue:auth.localId},email:{stringValue:auth.email||email},organisationName:{stringValue:"Improvement of Rangeland in Pastoral Areas"},signatureStatus:{stringValue:"Active"},revocationStatus:{stringValue:"Active"},authorityRole:{stringValue:"Not yet assigned"},authorityStatus:{stringValue:"Unspecified"},authorityReference:{stringValue:""},createdAt:{timestampValue:new Date().toISOString()}};
            const created=await fetch("https://firestore.googleapis.com/v1/projects/"+project+"/databases/(default)/documents/signerIdentities?documentId="+encodeURIComponent(auth.localId),{method:"POST",headers:{Authorization:"Bearer "+auth.idToken,"content-type":"application/json"},body:JSON.stringify({fields})});
            if(!created.ok&&created.status!==409) throw new Error("Could not create the staging signer's owner-authorized placeholder identity (HTTP "+created.status+").");
            identity=await readOwn("signerIdentities");
            if(!identity) throw new Error("Staging Signer Identity placeholder was not readable after creation.");
            console.log("STAGING_SIGNER_IDENTITY_PLACEHOLDER=CREATED");
            const call=await fetch("https://us-central1-"+project+".cloudfunctions.net/updateSignerAuthority",{method:"POST",headers:{Authorization:"Bearer "+auth.idToken,"content-type":"application/json"},body:JSON.stringify({data:{authorityRole:role,authorityStatus:"Current",authorityDepartment:dept,authorityUnit:unit,authorityReference:"STAGING-TEST-FIXTURE"}})});
            const callBody=await call.json().catch(()=>({}));
            if(call.ok&&!callBody.error){
              console.log("STAGING_SIGNER_AUTHORITY=REGISTERED_THROUGH_AUTHORIZED_CALLABLE");
            }else if(call.status===404||call.status===503){
              // Match the app's documented fallback: Firestore rules independently validate
              // the same active institutional authority register before accepting this self-update.
              const updateMask=new URLSearchParams();
              for(const field of ["authorityRole","authorityStatus","authorityDepartment","authorityUnit","authorityReference","authorityUpdatedAt","updatedAt"]) updateMask.append("updateMask.fieldPaths",field);
              const timestamp=new Date().toISOString();
              const patchFields={authorityRole:{stringValue:role},authorityStatus:{stringValue:"Current"},authorityDepartment:{stringValue:dept},authorityUnit:{stringValue:unit},authorityReference:{stringValue:"STAGING-TEST-FIXTURE"},authorityUpdatedAt:{timestampValue:timestamp},updatedAt:{timestampValue:timestamp}};
              const patch=await fetch("https://firestore.googleapis.com/v1/projects/"+project+"/databases/(default)/documents/signerIdentities/"+encodeURIComponent(auth.localId)+"?"+updateMask.toString(),{method:"PATCH",headers:{Authorization:"Bearer "+auth.idToken,"content-type":"application/json"},body:JSON.stringify({fields:patchFields})});
              if(!patch.ok) throw new Error("Staging Signer Identity fallback update was rejected by Firestore's authority-register security rules (HTTP "+patch.status+").");
              console.log("STAGING_SIGNER_AUTHORITY=REGISTERED_THROUGH_FIRESTORE_AUTHORITY_RULES");
            }else{
              throw new Error("Authorized updateSignerAuthority callable rejected the isolated staging test role (HTTP "+call.status+").");
            }
            identity=await readOwn("signerIdentities");
          }
          if(val(identity,"authorityStatus")!=="Current") throw new Error("STAGING_SIGNER_AUTHORITY_NOT_CURRENT: staging Signer Identity authority status must be Current; no existing non-current authority was overridden.");
          const identityRole=val(identity,"authorityRole");
          const identityDept=val(identity,"authorityDepartment");
          const identityUnit=val(identity,"authorityUnit");
          if(!identityRole||!identityDept||!identityUnit) throw new Error("Staging signer authority is missing role, department or unit linkage.");
          if(desired&&norm(identityRole)!==norm(desired)) throw new Error("Configured STAGING_CRYPTO_TEST_AUTHORITY does not match signerIdentities.authorityRole.");
          const matched=(r,collection)=>active(r,collection)&&val(r,"department")===identityDept&&(val(r,"unit")===identityUnit||val(r,"unitName")===identityUnit||identityUnit===identityDept)&&roleValues(r).some(value=>value===identityRole);
          if(!matched(member,"members")&&!matched(employee,"employees")) throw new Error("No active staging Member/Employee record matches signer UID, department, unit and authority role.");
          console.log("STAGING_PROJECT_GUARD=PASS");
          console.log("STAGING_SECRETS_PRESENT=PASS (values not printed)");
          console.log("STAGING_SIGNER_AUTHENTICATION=PASS");
          console.log("STAGING_SIGNATURE_PROFILE=PASS");
          console.log("STAGING_SIGNER_IDENTITY_AUTHORITY=PASS");
          console.log("STAGING_MEMBER_EMPLOYEE_AUTHORITY_REGISTER=PASS");
          console.log("STAGING_PREFLIGHT=PASS; isolated test fixture only; worker deployed=false; production touched=false");
          NODE

  dispatch-staging-acceptance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/communication-media-archive-drive-oauth' && contains(github.event.head_commit.message, 'dispatch isolated runtime acceptance')
    needs: [local-e2e, preflight-staging]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the existing manually gated isolated staging acceptance workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "staging-gateway-e2e.yml",
              ref: "fix/communication-media-archive-drive-oauth",
              inputs: { deploy_staging: "true" }
            });

  deploy-staging:
    needs: [local-e2e, preflight-staging]
    if: github.event_name == 'workflow_dispatch' && (inputs.deploy_staging == true || inputs.deploy_staging == 'true') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/member-signature-invitation-email-20261004' || github.ref == 'refs/heads/fix/signature-gateway-cryptographic-bridge-20261015' || github.ref == 'refs/heads/fix/communication-media-archive-drive-oauth')
    concurrency:
      group: irpa-staging-gateway-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require isolated staging secrets
        env:
          CF_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          APP_URL: ${{ secrets.STAGING_IRPA_APP_URL }}
          DRIVE_ID: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_ID }}
          DRIVE_SECRET: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_SECRET }}
          DRIVE_KEY: ${{ secrets.STAGING_GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY }}
          SMTP: ${{ secrets.STAGING_SMTP_PASSWORD }}
          CRYPTO_TEST_EMAIL: ${{ secrets.STAGING_CRYPTO_TEST_EMAIL }}
          CRYPTO_TEST_PASSWORD: ${{ secrets.STAGING_CRYPTO_TEST_PASSWORD }}
          CRYPTO_TEST_AUTHORITY: ${{ secrets.STAGING_CRYPTO_TEST_AUTHORITY }}
          META_APP_ID: ${{ secrets.STAGING_META_APP_ID }}
          META_APP_SECRET: ${{ secrets.STAGING_META_APP_SECRET }}
          META_KEY: ${{ secrets.STAGING_META_TOKEN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for pair in             "CLOUDFLARE_API_TOKEN:$CF_TOKEN"             "CLOUDFLARE_ACCOUNT_ID:$CF_ACCOUNT"             "STAGING_FIREBASE_PROJECT_ID:$PROJECT"             "STAGING_IRPA_APP_URL:$APP_URL"             "STAGING_GOOGLE_DRIVE_CLIENT_ID:$DRIVE_ID"             "STAGING_GOOGLE_DRIVE_CLIENT_SECRET:$DRIVE_SECRET"             "STAGING_GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY:$DRIVE_KEY"             "STAGING_SMTP_PASSWORD:$SMTP"             "STAGING_CRYPTO_TEST_EMAIL:$CRYPTO_TEST_EMAIL"             "STAGING_CRYPTO_TEST_PASSWORD:$CRYPTO_TEST_PASSWORD"             "STAGING_META_APP_ID:$META_APP_ID"             "STAGING_META_APP_SECRET:$META_APP_SECRET"             "STAGING_META_TOKEN_ENCRYPTION_KEY:$META_KEY"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -z "$value" ]; then echo "Missing staging secret: $name"; missing=1; fi
          done
          test "$PROJECT" = "irpa-dbg-staging-a73ec"
          test "$APP_URL" = "https://irpa-dbg-staging-a73ec.web.app"
          test "$missing" -eq 0
          node <<'NODE'
          const appId=process.env.META_APP_ID||"";
          const appSecret=process.env.META_APP_SECRET||"";
          const encoded=process.env.META_KEY||"";
          let decoded;
          try { decoded=Buffer.from(encoded,"base64"); } catch { decoded=Buffer.alloc(0); }
          const valid=/^\d+$/.test(appId)&&Boolean(appSecret.trim())&&/^[A-Za-z0-9+/]+={0,2}$/.test(encoded)&&decoded.length===32&&encoded.trim()===encoded;
          if(!valid) throw new Error("Invalid staging Meta OAuth configuration; refusing to configure Worker secrets.");
          console.log("META_OAUTH_CONFIGURATION_SHAPE=VALID");
          NODE

      - name: Diagnostic - verify Cloudflare staging token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN||"";
          const report={
            length:token.length,
            hasCR:token.includes("\r"),
            hasLF:token.includes("\n"),
            hasLeadingWhitespace:/^\s/.test(token),
            hasTrailingWhitespace:/\s$/.test(token),
            hasNonAscii:/[^\x20-\x7E]/.test(token),
            isPrintableAscii:/^[\x20-\x7E]*$/.test(token)
          };
          console.log("CLOUDFLARE_TOKEN_SHAPE="+JSON.stringify(report));
          if(!token || !report.isPrintableAscii || report.hasCR || report.hasLF || report.hasLeadingWhitespace || report.hasTrailingWhitespace) {
            throw new Error("Cloudflare staging token has invalid/hidden characters; token value intentionally not printed.");
          }
          NODE
          set +e
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/cf-verify.json" --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          curl_rc=$?
          set -e
          if [ "$curl_rc" -ne 0 ]; then
            echo "Cloudflare curl verification failed with exit code: $curl_rc; retrying the same verification via Node HTTPS (no token output)."
            node <<'NODE'
          const https=require("https");
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const req=https.request("https://api.cloudflare.com/client/v4/user/tokens/verify",{method:"GET",headers:{Authorization:"Bearer "+token,Accept:"application/json"}},res=>{
            let body=""; res.setEncoding("utf8"); res.on("data",c=>body+=c); res.on("end",()=>{
              let a; try { a=JSON.parse(body); } catch(e) { console.error("Cloudflare verification returned non-JSON response; HTTP status="+res.statusCode); process.exit(1); }
              const valid=res.statusCode===200 && a?.success===true && a?.result?.status==="active";
              console.log("CLOUDFLARE_TOKEN_VALID="+valid);
              if(!valid) { console.error("Cloudflare token verification failed; HTTP status="+res.statusCode); process.exit(1); }
            });
          });
          req.on("error",e=>{ console.error("Cloudflare Node HTTPS verification failed: "+e.message); process.exit(1); });
          req.end();
          NODE
            exit 0
          fi
          body="$(cat "$RUNNER_TEMP/cf-verify.json")"
          if [ "$code" != "200" ]; then
            echo "CLOUDFLARE_TOKEN_VALID=false"
            echo "Cloudflare token verification HTTP status: $code"
            exit 1
          fi
          valid="$(node -e 'const a=JSON.parse(process.argv[1]); process.stdout.write(String(a?.success===true && a?.result?.status==="active"))' "$body")"
          echo "CLOUDFLARE_TOKEN_VALID=$valid"
          test "$valid" = "true"

      - name: Provision or reuse dedicated staging KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          APP_URL: ${{ secrets.STAGING_IRPA_APP_URL }}
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          list="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces")"
          id="$(node - "$list" <<'NODE'
          const a=JSON.parse(process.argv[2]);
          if(!a.success) throw new Error("Cloudflare KV namespace list failed");
          const x=(Array.isArray(a.result)?a.result:[]).find(v=>v.title==="irpa-google-drive-gateway-staging");
          if(x?.id) process.stdout.write(x.id);
          NODE
          )"
          test -n "$id" || { echo "Required dedicated staging KV namespace was not found; refusing to create or substitute a namespace."; exit 1; }
          test "$id" = "7b50627e29fc4fe1abaa8dc8665edd02" || { echo "Staging KV namespace ID does not match the approved isolated namespace; refusing deployment."; exit 1; }
          case "$id" in ''|*[!a-f0-9]*) exit 1;; esac
          export STAGING_KV_ID="$id"
          node <<'NODE'
          const fs=require("fs");
          const c={
            name:"irpa-google-drive-gateway-staging",main:"src/index.js",
            compatibility_date:"2026-09-29",workers_dev:true,
            vars:{
              IRPA_ENVIRONMENT:"staging",
              IRPA_STAGING_CRYPTO_TEST_MODE:"true",
              ESIGN_MODULE_ENABLED:"true",
              FIREBASE_PROJECT_ID:process.env.PROJECT,
              AUTHORIZED_DRIVE_EMAIL:"irpa2412@gmail.com",
              IRPA_APP_URL:process.env.APP_URL,
              SMTP_HOST:"mail.irpa.or.tz",SMTP_PORT:"465",SMTP_FROM:"info@irpa.or.tz",
              DRIVE_ROOT_FOLDER_NAME:"IRPA Governance System - STAGING",
              FIRESTORE_COLLECTION_PREFIX:"staging_",DRIVE_MOCK:"false",LOCAL_TEST_MODE:"false",
              IRPA_PRODUCTION_CUTOVER:"false",
              META_REDIRECT_URI:"https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev/api/communications/meta/callback",
              META_GRAPH_API_VERSION:"v26.0"
            },
            kv_namespaces:[{binding:"DRIVE_KV",id:process.env.STAGING_KV_ID}],
            // The generated config is standalone (not an env.staging overlay), so it must
            // explicitly carry the isolated signer's Durable Object binding and migration.
            durable_objects:{bindings:[{name:"ESIGN_DO",class_name:"EsignRecordDurableObject"}]},
            migrations:[{tag:"esign-do-staging-v1",new_sqlite_classes:["EsignRecordDurableObject"]}],
            triggers:{crons:["0 * * * *"]}
          };
          if(c.vars.FIREBASE_PROJECT_ID==="irpa-digital-board-governance") throw new Error("Production Firebase project forbidden.");
          fs.writeFileSync("wrangler.staging.generated.json",JSON.stringify(c,null,2)+"\n");
          NODE

      - name: Verify staging configuration
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          node <<'NODE'
          const c=require("./wrangler.staging.generated.json");
          if(c.name!=="irpa-google-drive-gateway-staging") throw new Error("Worker boundary mismatch");
          if(c.vars.IRPA_ENVIRONMENT!=="staging"||c.vars.IRPA_STAGING_CRYPTO_TEST_MODE!=="true"||c.vars.ESIGN_MODULE_ENABLED!=="true") throw new Error("Explicit staging-only e-sign crypto acceptance mode is missing");
          if(c.vars.FIREBASE_PROJECT_ID==="irpa-digital-board-governance") throw new Error("Production Firebase project");
          if(c.kv_namespaces?.[0]?.binding!=="DRIVE_KV") throw new Error("Missing staging KV");
          if(c.durable_objects?.bindings?.length!==1||c.durable_objects.bindings[0]?.name!=="ESIGN_DO"||c.durable_objects.bindings[0]?.class_name!=="EsignRecordDurableObject") throw new Error("Unexpected isolated staging Durable Object binding set");
          if(c.migrations?.length!==1||c.migrations[0]?.tag!=="esign-do-staging-v1"||!c.migrations[0]?.new_sqlite_classes?.includes("EsignRecordDurableObject")) throw new Error("Unexpected isolated staging signer Durable Object migration set");
          if(c.vars.FIREBASE_PROJECT_ID==="irpa-digital-board-governance"||c.vars.IRPA_ENVIRONMENT!=="staging") throw new Error("Staging cryptographic runtime must remain isolated from production.");
          if(c.triggers?.crons?.[0]!=="0 * * * *") throw new Error("Cleanup cron missing");
          console.log("STAGING_CONFIGURATION_VALID");
          NODE

      - name: Inject staging-only Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY: ${{ secrets.STAGING_GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY }}
          SMTP_PASSWORD: ${{ secrets.STAGING_SMTP_PASSWORD }}
          META_APP_ID: ${{ secrets.STAGING_META_APP_ID }}
          META_APP_SECRET: ${{ secrets.STAGING_META_APP_SECRET }}
          META_TOKEN_ENCRYPTION_KEY: ${{ secrets.STAGING_META_TOKEN_ENCRYPTION_KEY }}
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_DRIVE_CLIENT_ID" | npx wrangler secret put GOOGLE_DRIVE_CLIENT_ID --config wrangler.staging.generated.json
          printf '%s' "$GOOGLE_DRIVE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_DRIVE_CLIENT_SECRET --config wrangler.staging.generated.json
          printf '%s' "$GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY" | npx wrangler secret put GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY --config wrangler.staging.generated.json
          printf '%s' "$SMTP_PASSWORD" | npx wrangler secret put SMTP_PASSWORD --config wrangler.staging.generated.json
          printf '%s' "$META_APP_ID" | npx wrangler secret put META_APP_ID --config wrangler.staging.generated.json
          printf '%s' "$META_APP_SECRET" | npx wrangler secret put META_APP_SECRET --config wrangler.staging.generated.json
          printf '%s' "$META_TOKEN_ENCRYPTION_KEY" | npx wrangler secret put META_TOKEN_ENCRYPTION_KEY --config wrangler.staging.generated.json

      - name: Install gateway dependencies for bundling
        working-directory: drive-gateway
        run: npm ci --no-audit --no-fund

      - name: Generate and inject an isolated staging signer key
        id: staging_crypto_key
        env:
          FIREBASE_WEB_API_KEY: "AIzaSyA6UmHtP-mRr99rBw57_-qrD4_mFSBnZ38"
          FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          TEST_EMAIL: ${{ secrets.STAGING_CRYPTO_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.STAGING_CRYPTO_TEST_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createHash,webcrypto} from "node:crypto";
          import fs from "node:fs";
          const project=process.env.FIREBASE_PROJECT_ID||"";
          if(!project||project==="irpa-digital-board-governance")throw new Error("Staging key generation refused a production Firebase project.");
          const response=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(process.env.FIREBASE_WEB_API_KEY||""),{
            method:"POST",headers:{"content-type":"application/json"},
            body:JSON.stringify({email:process.env.TEST_EMAIL,password:process.env.TEST_PASSWORD,returnSecureToken:true})
          });
          const auth=await response.json().catch(()=>({}));
          if(!response.ok||!auth.idToken||!auth.localId)throw new Error("Unable to authenticate the isolated staging crypto test account.");
          const claims=JSON.parse(Buffer.from(auth.idToken.split(".")[1],"base64url").toString("utf8"));
          if(claims.aud!==project||claims.iss!=="https://securetoken.google.com/"+project)throw new Error("Staging signer token audience/issuer mismatch.");
          const pair=await webcrypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]);
          const privateBytes=new Uint8Array(await webcrypto.subtle.exportKey("pkcs8",pair.privateKey));
          const publicJwk=await webcrypto.subtle.exportKey("jwk",pair.publicKey);
          const keyId="IRPA-STAGING-ACCEPTANCE-"+Date.now().toString(36);
          const record=JSON.stringify({
            version:1,keyId,
            privateKeyPkcs8:Buffer.from(privateBytes).toString("base64"),
            publicKeyJwk:{kty:publicJwk.kty,crv:publicJwk.crv,x:publicJwk.x,y:publicJwk.y,ext:true}
          });
          const secretName="IRPA_CRYPTO_KEY_"+createHash("sha256").update(auth.localId).digest("hex").slice(0,32).toUpperCase();
          fs.writeFileSync(process.env.RUNNER_TEMP+"/irpa-staging-crypto-key-record",record,{mode:0o600});
          fs.writeFileSync(process.env.RUNNER_TEMP+"/irpa-staging-crypto-secret-name",secretName,{mode:0o600});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,"signer_uid="+auth.localId+"\nkey_id="+keyId+"\n");
          console.log("STAGING_SIGNER_UID_BOUND=true");
          console.log("STAGING_CRYPTO_KEY_GENERATED=true");
          NODE
          secret_name="$(cat "$RUNNER_TEMP/irpa-staging-crypto-secret-name")"
          printf '%s' "$(cat "$RUNNER_TEMP/irpa-staging-crypto-key-record")" | npx wrangler secret put "$secret_name" --config wrangler.staging.generated.json
          rm -f "$RUNNER_TEMP/irpa-staging-crypto-key-record" "$RUNNER_TEMP/irpa-staging-crypto-secret-name"

      - name: Deploy staging Worker only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: drive-gateway
          command: deploy --config wrangler.staging.generated.json

      - name: Verify staging health
        id: staging_health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Accept: application/json" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(node -e 'const a=JSON.parse(process.argv[1]); if(!a.success || !a.result?.subdomain) process.exit(1); process.stdout.write(a.result.subdomain)' "$subdomain_json")"
          test -n "$subdomain"
          gateway_url="https://irpa-google-drive-gateway-staging.$subdomain.workers.dev"
          url="$gateway_url/health"
          echo "gateway_url=$gateway_url" >> "$GITHUB_OUTPUT"
          echo "STAGING_HEALTH_URL=$url"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$url" | tee staging-health.json
          grep -q '"ok":true' staging-health.json

      - name: Run real-runtime staging cryptographic acceptance
        env:
          STAGING_GATEWAY_URL: ${{ steps.staging_health.outputs.gateway_url }}
          STAGING_FIREBASE_WEB_API_KEY: "AIzaSyA6UmHtP-mRr99rBw57_-qrD4_mFSBnZ38"
          STAGING_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          STAGING_CRYPTO_TEST_EMAIL: ${{ secrets.STAGING_CRYPTO_TEST_EMAIL }}
          STAGING_CRYPTO_TEST_PASSWORD: ${{ secrets.STAGING_CRYPTO_TEST_PASSWORD }}
          STAGING_CRYPTO_TEST_AUTHORITY: ${{ secrets.STAGING_CRYPTO_TEST_AUTHORITY }}
          STAGING_CRYPTO_TEST_SIGNER_UID: ${{ steps.staging_crypto_key.outputs.signer_uid }}
          STAGING_CRYPTO_TEST_KEY_ID: ${{ steps.staging_crypto_key.outputs.key_id }}
        working-directory: drive-gateway
        run: node tests/staging-runtime-acceptance.mjs

# Staging proof execution trigger — 2026-10-04


  deploy-staging-frontend:
    needs: [local-e2e, preflight-staging]
    if: github.event_name == 'workflow_dispatch' && (inputs.deploy_staging == true || inputs.deploy_staging == 'true') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/member-signature-invitation-email-20261004' || github.ref == 'refs/heads/fix/signature-gateway-cryptographic-bridge-20261015' || github.ref == 'refs/heads/fix/communication-media-archive-drive-oauth')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require isolated staging Firebase identity
        env:
