                let raw="";res.setEncoding("utf8");res.on("data",x=>raw+=x);res.on("end",()=>resolve({http:res.statusCode,raw}));
              });
              req.on("timeout",()=>req.destroy(new Error("Staging cPanel verification timed out.")));
              req.on("error",reject);req.end();
