          TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          WP_BASE: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
          CP_ROOT: ${{ secrets.STAGING_CPANEL_DOCUMENT_ROOT }}
          CP_TEST_FILE: ${{ secrets.STAGING_CPANEL_TEST_FILE }}
        run: |
          set -euo pipefail
