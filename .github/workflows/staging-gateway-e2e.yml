name: Staging Gateway E2E and Deploy

on:
  push:
    branches: [fix/member-signature-invitation-email-20261004]
    paths:
      - "drive-gateway/**"
      - "firebase.json"
      - "src/App.jsx"
      - "src/firebase/auth.js"
      - "src/firebase/invitationWorkflow.js"
      - ".github/workflows/staging-gateway-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-e2e:
    if: github.ref == 'refs/heads/fix/member-signature-invitation-email-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: drive-gateway
      - name: Firestore emulator E2E
        run: |
          set -o pipefail
          npx firebase emulators:exec --project demo-irpa-staging --only firestore "npm --prefix drive-gateway test" | tee e2e-output.ndjson
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-gateway-e2e-raw-output
          path: e2e-output.ndjson

  deploy-staging:
    needs: local-e2e
    if: github.ref == 'refs/heads/fix/member-signature-invitation-email-20261004' && vars.ALLOW_STAGING_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require isolated staging secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          APP_URL: ${{ secrets.STAGING_IRPA_APP_URL }}
          DRIVE_ID: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_ID }}
          DRIVE_SECRET: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_SECRET }}
          DRIVE_KEY: ${{ secrets.STAGING_GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY }}
          SMTP: ${{ secrets.STAGING_SMTP_PASSWORD }}
          FIREBASE_SA: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for pair in             "CLOUDFLARE_API_TOKEN:$CF_TOKEN"             "CLOUDFLARE_ACCOUNT_ID:$CF_ACCOUNT"             "STAGING_FIREBASE_PROJECT_ID:$PROJECT"             "STAGING_IRPA_APP_URL:$APP_URL"             "STAGING_GOOGLE_DRIVE_CLIENT_ID:$DRIVE_ID"             "STAGING_GOOGLE_DRIVE_CLIENT_SECRET:$DRIVE_SECRET"             "STAGING_GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY:$DRIVE_KEY"             "STAGING_SMTP_PASSWORD:$SMTP"             "STAGING_FIREBASE_SERVICE_ACCOUNT_JSON:$FIREBASE_SA"             "FIREBASE_WEB_API_KEY:$FIREBASE_API_KEY"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -z "$value" ]; then echo "Missing staging secret: $name"; missing=1; fi
          done
          test "$PROJECT" != "irpa-digital-board-governance"
          test "$missing" -eq 0

      - name: Diagnostic - verify Cloudflare staging token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN||"";
          const report={
            length:token.length,
            hasCR:token.includes("\r"),
            hasLF:token.includes("\n"),
            hasLeadingWhitespace:/^\s/.test(token),
            hasTrailingWhitespace:/\s$/.test(token),
            hasNonAscii:/[^\x20-\x7E]/.test(token),
            isPrintableAscii:/^[\x20-\x7E]*$/.test(token)
          };
          console.log("CLOUDFLARE_TOKEN_SHAPE="+JSON.stringify(report));
          if(!token || !report.isPrintableAscii || report.hasCR || report.hasLF || report.hasLeadingWhitespace || report.hasTrailingWhitespace) {
            throw new Error("Cloudflare staging token has invalid/hidden characters; token value intentionally not printed.");
          }
          NODE
          set +e
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/cf-verify.json" --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          curl_rc=$?
          set -e
          if [ "$curl_rc" -ne 0 ]; then
            echo "Cloudflare curl verification failed with exit code: $curl_rc; retrying the same verification via Node HTTPS (no token output)."
            node <<'NODE'
          const https=require("https");
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const req=https.request("https://api.cloudflare.com/client/v4/user/tokens/verify",{method:"GET",headers:{Authorization:"Bearer "+token,Accept:"application/json"}},res=>{
            let body=""; res.setEncoding("utf8"); res.on("data",c=>body+=c); res.on("end",()=>{
              let a; try { a=JSON.parse(body); } catch(e) { console.error("Cloudflare verification returned non-JSON response; HTTP status="+res.statusCode); process.exit(1); }
              const valid=res.statusCode===200 && a?.success===true && a?.result?.status==="active";
              console.log("CLOUDFLARE_TOKEN_VALID="+valid);
              if(!valid) { console.error("Cloudflare token verification failed; HTTP status="+res.statusCode); process.exit(1); }
            });
          });
          req.on("error",e=>{ console.error("Cloudflare Node HTTPS verification failed: "+e.message); process.exit(1); });
          req.end();
          NODE
            exit 0
          fi
          body="$(cat "$RUNNER_TEMP/cf-verify.json")"
          if [ "$code" != "200" ]; then
            echo "CLOUDFLARE_TOKEN_VALID=false"
            echo "Cloudflare token verification HTTP status: $code"
            exit 1
          fi
          valid="$(node -e 'const a=JSON.parse(process.argv[1]); process.stdout.write(String(a?.success===true && a?.result?.status==="active"))' "$body")"
          echo "CLOUDFLARE_TOKEN_VALID=$valid"
          test "$valid" = "true"

      - name: Validate staging configuration
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("fs");
          const text=fs.readFileSync("wrangler.toml","utf8");
          const staging=text.split("[env.staging]")[1] || "";
          if (!/\[env\.staging\]/.test(text)) throw new Error("Staging environment is missing.");
          if (!/name = "irpa-google-drive-gateway-staging"/.test(staging)) throw new Error("Staging Worker name is incorrect.");
          if (/FIREBASE_PROJECT_ID\s*=\s*"irpa-digital-board-governance"/.test(staging)) throw new Error("Production Firebase project is forbidden in staging.");
          if (/IRPA_APP_URL\s*=\s*"https:\/\/irpa-digital-board-governance\.web\.app"/.test(staging)) throw new Error("Production IRPA_APP_URL is forbidden in staging.");
          if (/FIREBASE_PROJECT_ID\s*=/.test(staging)) throw new Error("Staging FIREBASE_PROJECT_ID must not be committed until the separate staging project is provisioned.");
          if (/IRPA_APP_URL\s*=/.test(staging)) throw new Error("Staging IRPA_APP_URL must not be committed until the separate staging hosting origin is provisioned.");
          if (!/CLOUDFLARE_AUTH_FUNCTIONS_ENABLED = "true"/.test(staging)) throw new Error("Staging migration flag must be true.");
          if (!/DRIVE_MOCK = "false"/.test(staging)) throw new Error("Staging must use real Durable Object state (DRIVE_MOCK=false).");
          if (!/\[\[env\.staging\.kv_namespaces\]\][\s\S]*binding = "DRIVE_KV"/.test(text)) throw new Error("Staging DRIVE_KV binding is missing.");
          if (!/\[\[env\.staging\.durable_objects\.bindings\]\][\s\S]*name = "ESIGN_DO"[\s\S]*class_name = "EsignRecordDurableObject"/.test(text)) throw new Error("Staging ESIGN_DO binding is missing.");
          if (!/\[\[env\.staging\.migrations\]\][\s\S]*tag = "esign-do-staging-v1"/.test(text)) throw new Error("Staging DO migration is missing.");
          NODE

      - name: Validate staging Worker configuration without deployment
        working-directory: drive-gateway
        run: npx wrangler deploy --env staging --dry-run

      - name: Verify deploy configuration safety gate
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          ALLOWED_ORIGINS: ${{ secrets.STAGING_IRPA_APP_URL }},http://localhost:5173
        run: node scripts/verify-deploy-config.mjs --environment staging --config drive-gateway/wrangler.toml

      - name: Inject staging-only Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY: ${{ secrets.STAGING_GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY }}
          SMTP_PASSWORD: ${{ secrets.STAGING_SMTP_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_DRIVE_CLIENT_ID" | npx wrangler secret put GOOGLE_DRIVE_CLIENT_ID --env staging
          printf '%s' "$GOOGLE_DRIVE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_DRIVE_CLIENT_SECRET --env staging
          printf '%s' "$GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY" | npx wrangler secret put GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY --env staging
          printf '%s' "$SMTP_PASSWORD" | npx wrangler secret put SMTP_PASSWORD --env staging
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON --env staging
          printf '%s' "$FIREBASE_WEB_API_KEY" | npx wrangler secret put FIREBASE_WEB_API_KEY --env staging

      - name: Deploy staging Worker only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: drive-gateway
          command: deploy --env staging
      - name: Verify staging health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Accept: application/json" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(node -e 'const a=JSON.parse(process.argv[1]); if(!a.success || !a.result?.subdomain) process.exit(1); process.stdout.write(a.result.subdomain)' "$subdomain_json")"
          test -n "$subdomain"
          url="https://irpa-google-drive-gateway-staging.$subdomain.workers.dev/health"
          echo "STAGING_HEALTH_URL=$url"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$url" | tee staging-health.json
          grep -q '"ok":true' staging-health.json

# Controlled staging proof after stale Durable Object migration removal — 2026-10-05
