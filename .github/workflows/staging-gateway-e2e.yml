name: Staging Gateway E2E and Deploy

on:
  push:
    branches: [main, fix/member-signature-invitation-email-20261004, fix/communications-cloudflare-website-integration]
    paths:
      - "drive-gateway/**"
      - "src/firebase/documentLifecycle.js"
      - "firebase.json"
      - ".github/workflows/staging-gateway-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "drive-gateway/**"
      - "src/firebase/documentLifecycle.js"
      - "firebase.json"
      - ".github/workflows/staging-gateway-e2e.yml"
  workflow_dispatch:

concurrency:
  group: irpa-staging-website-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  local-e2e:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/member-signature-invitation-email-20261004' || github.ref == 'refs/heads/fix/communications-cloudflare-website-integration' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/communications-cloudflare-website-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: drive-gateway
      - name: Firestore emulator E2E
        id: firestore-e2e
        run: |
          set -o pipefail
          npx firebase emulators:exec --project demo-irpa-staging --only firestore "npm --prefix drive-gateway test" | tee e2e-output.ndjson
      - name: Write redacted local E2E summary
        if: always()
        env:
          E2E: ${{ steps.firestore-e2e.outcome }}
        run: |
          set -euo pipefail
          { echo "# IRPA-DBGS local regression checks"; echo ""; echo "- Firestore emulator E2E: ${E2E:-not-run}"; echo "- Environment: demo-irpa-staging"; } | tee local-e2e-summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f e2e-output.ndjson ]; then sed -E 's/(Authorization:)[^, ]+/\1[REDACTED]/Ig; s/(password|token|secret)(["=: ]+)[^", ]+/\1\2[REDACTED]/Ig' e2e-output.ndjson > local-e2e-diagnostics.txt; else echo "No E2E output file was produced." > local-e2e-diagnostics.txt; fi
      - name: Upload redacted local E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-local-e2e-redacted-diagnostics
          path: |
            local-e2e-summary.md
            local-e2e-diagnostics.txt
          if-no-files-found: error

  repair-staging:
    needs: local-e2e
    outputs:
      staging_url: ${{ steps.staging-health.outputs.staging_url }}
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/member-signature-invitation-email-20261004' || github.ref == 'refs/heads/fix/communications-cloudflare-website-integration' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/communications-cloudflare-website-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require isolated staging secrets
        id: staging-preflight
        env:
          CF_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          APP_URL: ${{ secrets.STAGING_IRPA_APP_URL }}
          DRIVE_ID: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_ID }}
          DRIVE_SECRET: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_SECRET }}
          DRIVE_KEY: ${{ secrets.STAGING_GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_WEB_API_KEY: ${{ secrets.STAGING_FIREBASE_WEB_API_KEY }}
          TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          WP_BASE: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
          CP_ROOT: ${{ secrets.STAGING_CPANEL_DOCUMENT_ROOT }}
          CP_TEST_FILE: ${{ secrets.STAGING_CPANEL_TEST_FILE }}
          STAGING_DB_NAME: ${{ secrets.STAGING_WORDPRESS_DB_NAME }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_WORDPRESS_DB_NAME }}
        run: |
          set -euo pipefail
          missing=0
          for pair in             "CLOUDFLARE_API_TOKEN:$CF_TOKEN"             "CLOUDFLARE_ACCOUNT_ID:$CF_ACCOUNT"             "STAGING_FIREBASE_PROJECT_ID:$PROJECT"             "STAGING_IRPA_APP_URL:$APP_URL"             "STAGING_GOOGLE_DRIVE_CLIENT_ID:$DRIVE_ID"             "STAGING_GOOGLE_DRIVE_CLIENT_SECRET:$DRIVE_SECRET"             "STAGING_GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY:$DRIVE_KEY"             "STAGING_FIREBASE_SERVICE_ACCOUNT_JSON:$FIREBASE_SERVICE_ACCOUNT"             "STAGING_FIREBASE_WEB_API_KEY:$FIREBASE_WEB_API_KEY"             "STAGING_TEST_EMAIL:$TEST_EMAIL"             "STAGING_TEST_PASSWORD:$TEST_PASSWORD"             "STAGING_WORDPRESS_BASE_URL:$WP_BASE"             "STAGING_WORDPRESS_DB_NAME:$STAGING_DB_NAME"             "PRODUCTION_WORDPRESS_DB_NAME:$PRODUCTION_DB_NAME"             "STAGING_CPANEL_BASE_URL:$CP_BASE"             "STAGING_CPANEL_USERNAME:$CP_USER"             "STAGING_CPANEL_API_TOKEN:$CP_TOKEN"             "STAGING_CPANEL_DOCUMENT_ROOT:$CP_ROOT"             "STAGING_CPANEL_TEST_FILE:$CP_TEST_FILE"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -z "$value" ]; then echo "Missing staging secret: $name"; missing=1; fi
          done
          test "$PROJECT" = "irpa-dbg-staging-a73ec"
          test "$APP_URL" != "https://irpa-digital-board-governance.web.app"
          test "$missing" -eq 0
          if [[ "$STAGING_DB_NAME" == "$PRODUCTION_DB_NAME" ]]; then echo "ABORT: staging and production database names must differ."; exit 1; fi
          node <<'NODE'
          const wp=new URL(process.env.WP_BASE);
          if(wp.hostname.toLowerCase()!=="staging.irpa.or.tz"||wp.protocol!=="https:") throw new Error("ABORT: WordPress target must be the HTTPS staging.irpa.or.tz host.");
          console.log("STAGING_HOST_ASSERTION=PASS host="+wp.hostname);
          NODE
          node <<'NODE'
          const fs=require("fs");
          const project=process.env.PROJECT;
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||"{}");
          if(project!=="irpa-dbg-staging-a73ec") throw new Error("Firebase project must match the approved isolated staging project.");
          if(sa.project_id!==project) throw new Error("Staging service account must belong to the isolated staging Firebase project.");
          const app=new URL(process.env.APP_URL);
          if(app.protocol!=="https:" || ["irpa.or.tz","www.irpa.or.tz","irpa-digital-board-governance.web.app"].includes(app.hostname.toLowerCase())) throw new Error("Staging application must use HTTPS on an isolated non-production hostname.");
          const wp=new URL(process.env.WP_BASE);
          if(wp.protocol!=="https:" || ["irpa.or.tz","www.irpa.or.tz"].includes(wp.hostname.toLowerCase())) throw new Error("Staging WordPress must use HTTPS on an isolated non-production hostname.");
          console.log("STAGING_MAIL_DELIVERY_MOCKED");
          const cp=new URL(process.env.CP_BASE);
          if(cp.protocol!=="https:" || cp.port!=="2083" || cp.pathname!=="/") throw new Error("Staging cPanel endpoint must use HTTPS port 2083.");
          const root=process.env.CP_ROOT.replace(/^\/+|\/+$/g,"");
          if(!root || root.split("/").some(p=>!p || p==="." || p===".." || p.startsWith("."))) throw new Error("Staging cPanel document root is invalid.");
          if(!/(^|\/)staging$/i.test(root)) throw new Error("ABORT: cPanel document root must be the isolated staging directory, never the production document root.");
          const file=process.env.CP_TEST_FILE;
          if(!file || file.includes("/") || file.startsWith("/") || file.split("/").some(p=>!p || p==="." || p===".." || p.startsWith(".")) || !/\.txt$/i.test(file)) throw new Error("Staging cPanel test file must be a safe relative .txt path.");
          console.log("ISOLATED_STAGING_CREDENTIALS_VALID");
          NODE

      - name: Diagnostic - verify Cloudflare staging token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN||"";
          const report={
            length:token.length,
            hasCR:token.includes("\r"),
            hasLF:token.includes("\n"),
            hasLeadingWhitespace:/^\s/.test(token),
            hasTrailingWhitespace:/\s$/.test(token),
            hasNonAscii:/[^\x20-\x7E]/.test(token),
            isPrintableAscii:/^[\x20-\x7E]*$/.test(token)
          };
          console.log("CLOUDFLARE_TOKEN_SHAPE="+JSON.stringify(report));
          if(!token || !report.isPrintableAscii || report.hasCR || report.hasLF || report.hasLeadingWhitespace || report.hasTrailingWhitespace) {
            throw new Error("Cloudflare staging token has invalid/hidden characters; token value intentionally not printed.");
          }
          NODE
          set +e
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/cf-verify.json" --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          curl_rc=$?
          set -e
          if [ "$curl_rc" -ne 0 ]; then
            echo "Cloudflare curl verification failed with exit code: $curl_rc; retrying the same verification via Node HTTPS (no token output)."
            node <<'NODE'
          const https=require("https");
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const req=https.request("https://api.cloudflare.com/client/v4/user/tokens/verify",{method:"GET",headers:{Authorization:"Bearer "+token,Accept:"application/json"}},res=>{
            let body=""; res.setEncoding("utf8"); res.on("data",c=>body+=c); res.on("end",()=>{
              let a; try { a=JSON.parse(body); } catch(e) { console.error("Cloudflare verification returned non-JSON response; HTTP status="+res.statusCode); process.exit(1); }
              const valid=res.statusCode===200 && a?.success===true && a?.result?.status==="active";
              console.log("CLOUDFLARE_TOKEN_VALID="+valid);
              if(!valid) { console.error("Cloudflare token verification failed; HTTP status="+res.statusCode); process.exit(1); }
            });
          });
          req.on("error",e=>{ console.error("Cloudflare Node HTTPS verification failed: "+e.message); process.exit(1); });
          req.end();
          NODE
            exit 0
          fi
          body="$(cat "$RUNNER_TEMP/cf-verify.json")"
          if [ "$code" != "200" ]; then
            echo "CLOUDFLARE_TOKEN_VALID=false"
            echo "Cloudflare token verification HTTP status: $code"
            exit 1
          fi
          valid="$(node -e 'const a=JSON.parse(process.argv[1]); process.stdout.write(String(a?.success===true && a?.result?.status==="active"))' "$body")"
          echo "CLOUDFLARE_TOKEN_VALID=$valid"
          test "$valid" = "true"

      - name: Provision or reuse dedicated staging KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          APP_URL: ${{ secrets.STAGING_IRPA_APP_URL }}
          CP_ROOT: ${{ secrets.STAGING_CPANEL_DOCUMENT_ROOT }}
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          list="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces")"
          id="$(node - "$list" <<'NODE'
          const a=JSON.parse(process.argv[2]);
          if(!a.success) throw new Error("Cloudflare KV namespace list failed");
          const x=(Array.isArray(a.result)?a.result:[]).find(v=>v.title==="irpa-google-drive-gateway-staging");
          if(x?.id) process.stdout.write(x.id);
          NODE
          )"
          if [ -z "$id" ]; then
            created="$(curl --fail --silent --show-error -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data '{"title":"irpa-google-drive-gateway-staging"}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces")"
            id="$(node - "$created" <<'NODE'
          const a=JSON.parse(process.argv[2]);
          if(!a.success) throw new Error("Cloudflare KV namespace creation failed");
          process.stdout.write(a?.result?.id||"");
          NODE
            )"
          fi
          case "$id" in ''|*[!a-f0-9]*) exit 1;; esac
          export STAGING_KV_ID="$id"
          node <<'NODE'
          const fs=require("fs");
          const c={
            name:"irpa-google-drive-gateway-staging",main:"src/index.js",
            compatibility_date:"2026-09-29",workers_dev:true,
            vars:{
              FIREBASE_PROJECT_ID:process.env.PROJECT,
              SMTP_MOCK:"success",
              AUTHORIZED_DRIVE_EMAIL:"irpa2412@gmail.com",
              IRPA_APP_URL:process.env.APP_URL,
              DRIVE_ROOT_FOLDER_NAME:"IRPA Governance System - STAGING",
              FIRESTORE_COLLECTION_PREFIX:"staging_",DRIVE_MOCK:"false",LOCAL_TEST_MODE:"false",
              IRPA_ENVIRONMENT:"staging",CPANEL_DOCUMENT_ROOT:process.env.CP_ROOT
            },
            kv_namespaces:[{binding:"DRIVE_KV",id:process.env.STAGING_KV_ID}],
            triggers:{crons:["0 * * * *"]}
          };
          if(c.vars.FIREBASE_PROJECT_ID!=="irpa-dbg-staging-a73ec") throw new Error("Worker must use the approved isolated staging Firebase project.");
          fs.writeFileSync("wrangler.staging.generated.json",JSON.stringify(c,null,2)+"\n");
          NODE

      - name: Verify staging configuration
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          node <<'NODE'
          const c=require("./wrangler.staging.generated.json");
          if(c.name!=="irpa-google-drive-gateway-staging") throw new Error("Worker boundary mismatch");
          if(c.vars.FIREBASE_PROJECT_ID!=="irpa-dbg-staging-a73ec") throw new Error("Unexpected Firebase project for staging Worker");
          if(c.vars.IRPA_ENVIRONMENT!=="staging") throw new Error("Explicit staging environment marker missing");
          if(c.kv_namespaces?.[0]?.binding!=="DRIVE_KV") throw new Error("Missing staging KV");
          if(c.triggers?.crons?.[0]!=="0 * * * *") throw new Error("Cleanup cron missing");
          console.log("STAGING_CONFIGURATION_VALID");
          NODE

      - name: Diagnose configured staging WordPress origin (no credentials)
        env:
          WP_BASE: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const dns = require("node:dns").promises;
          const https = require("node:https");
          (async () => {
            let u;
            try { u = new URL(process.env.WP_BASE || ""); } catch { throw new Error("Staging WordPress base URL is invalid or missing."); }
            if (u.protocol !== "https:" || u.username || u.password || u.search || u.hash) throw new Error("Staging WordPress base URL must be a clean HTTPS origin/path.");
            console.log("STAGING_WORDPRESS_HOST=" + u.hostname);
            console.log("STAGING_WORDPRESS_BASE_PATH=" + (u.pathname || "/"));
            try {
              const addresses = await dns.lookup(u.hostname, { all: true });
              console.log("STAGING_WORDPRESS_DNS=" + JSON.stringify(addresses.map(a => ({address:a.address,family:a.family}))));
            } catch (e) {
              console.log("STAGING_WORDPRESS_DNS_ERROR=" + String(e.code || e.name));
            }
            await new Promise(resolve => {
              const req = https.request(new URL("/wp-json/", u), { method: "GET", timeout: 10000, headers: { Accept: "application/json" } }, res => {
                let raw = "";
                res.setEncoding("utf8");
                res.on("data", chunk => raw += chunk);
                res.on("end", () => {
                  console.log("STAGING_WORDPRESS_HTTP=" + res.statusCode);
                  console.log("STAGING_WORDPRESS_LOCATION=" + String(res.headers.location || "").slice(0,180));
                  console.log("STAGING_WORDPRESS_SERVER=" + String(res.headers.server || "").slice(0,80));
                  console.log("STAGING_WORDPRESS_CF_RAY=" + String(res.headers["cf-ray"] || "").slice(0,100));
                  const hint = raw.replace(/<[^>]*>/g," ").replace(/[\\r\\n\\t]+/g," ").replace(/\\s+/g," ").trim();
                  if (hint) console.log("STAGING_WORDPRESS_RESPONSE_HINT=" + hint.slice(0,180));
                  resolve();
                });
              });
              req.on("timeout", () => { console.log("STAGING_WORDPRESS_HTTP_ERROR=timeout"); req.destroy(); resolve(); });
              req.on("error", e => { console.log("STAGING_WORDPRESS_HTTP_ERROR=" + String(e.code || e.name)); resolve(); });
              req.end();
            });
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE

      - name: Identify cPanel domain mapping for wp268 (read-only)
        env:
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const https=require("node:https");
          const {URL,URLSearchParams}=require("node:url");
          function call(path) {
            return new Promise((resolve,reject)=>{
              const u=new URL(process.env.CP_BASE);
              u.pathname="/execute/"+path;
              u.search=new URLSearchParams({}).toString();
              const req=https.request(u,{headers:{Authorization:"cpanel "+process.env.CP_USER+":"+process.env.CP_TOKEN,Accept:"application/json"},timeout:10000},res=>{
                let raw="";res.setEncoding("utf8");res.on("data",c=>raw+=c);res.on("end",()=>{
                  let data=null;try{data=JSON.parse(raw)}catch{}
                  resolve({http:res.statusCode,data,invalidJson:!data,bodyHint:!data?raw.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,160):""});
                });
              });
              req.on("timeout",()=>req.destroy(new Error("cPanel read-only inspection timed out.")));
              req.on("error",reject);req.end();
            });
          }
          function collect(value,section="",out=[]) {
            if(Array.isArray(value)){for(const v of value)collect(v,section,out);return out}
            if(!value||typeof value!=="object")return out;
            const domain=String(value.domain||value.domain_name||value.main_domain||value.name||"");
            const root=String(value.documentroot||value.document_root||value.docroot||value.root||"");
            if(domain)out.push({section,domain:domain.slice(0,180),document_root:root.slice(0,240)});
            for(const [k,v] of Object.entries(value))if(v&&typeof v==="object")collect(v,section?section+"."+k:k,out);
            return out;
          }
          (async()=>{
            const domains=await call("DomainInfo/list_domains");
            console.log("CPANEL_LIST_DOMAINS_HTTP="+domains.http);
            console.log("CPANEL_LIST_DOMAINS_STATUS="+String(domains.data?.status));
            console.log("CPANEL_LIST_DOMAINS_KEYS="+JSON.stringify(Object.keys(domains.data?.data||{})));
            console.log("CPANEL_LIST_DOMAINS_ROWS="+JSON.stringify(collect(domains.data?.data||{})).slice(0,5000));
            if(domains.invalidJson)console.log("CPANEL_LIST_DOMAINS_RESPONSE_HINT="+domains.bodyHint);
            const details=await call("DomainInfo/domains_data");
            console.log("CPANEL_DOMAINS_DATA_HTTP="+details.http);
            console.log("CPANEL_DOMAINS_DATA_STATUS="+String(details.data?.status));
            console.log("CPANEL_DOMAINS_DATA_KEYS="+JSON.stringify(Object.keys(details.data?.data||{})));
            console.log("CPANEL_DOMAIN_DOCUMENT_ROOTS="+JSON.stringify(collect(details.data?.data||{})).slice(0,5000));
            if(details.invalidJson)console.log("CPANEL_DOMAINS_DATA_RESPONSE_HINT="+details.bodyHint);
            if(domains.http!==200||domains.data?.status!==1)throw new Error("cPanel could not return domain mappings.");
          })().catch(e=>{console.error("cPanel mapping diagnostic unavailable: "+e.message);console.log("CPANEL_MAPPING_DIAGNOSTIC_UNAVAILABLE");});
          NODE


      - name: Inspect cPanel staging installation and reachable WordPress paths (read-only)
        continue-on-error: true
        env:
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const https=require("node:https");
          const dns=require("node:dns").promises;
          const {URL,URLSearchParams}=require("node:url");
          function get(url,headers={}) {
            return new Promise((resolve,reject)=>{
              const req=https.request(url,{headers,timeout:10000},res=>{
                let raw="";res.setEncoding("utf8");res.on("data",c=>raw+=c);res.on("end",()=>{let data;try{data=JSON.parse(raw)}catch{}resolve({http:res.statusCode,data,raw})});
              });
              req.on("timeout",()=>req.destroy(new Error("Inspection request timed out.")));
              req.on("error",reject);req.end();
            });
          }
          async function main(){
            const base=new URL(process.env.CP_BASE);
            const auth={Authorization:"cpanel "+process.env.CP_USER+":"+process.env.CP_TOKEN,Accept:"application/json"};
            const call=async(path,params={})=>{const u=new URL("/execute/"+path,base);u.search=new URLSearchParams(params).toString();return get(u,auth)};
            const info=await call("DomainInfo/domains_data");
            const root=String(info.data?.data?.main_domain?.documentroot||info.data?.data?.main_domain?.document_root||"");
            if(info.http!==200||info.data?.status!==1||!root) throw new Error("Could not resolve the cPanel main document root.");
            console.log("CPANEL_ROOT_CONFIRMED="+root.replace(/\/home\/[^/]+/,"/home/[account]"));
            for(const rel of ["staging","staging ","wp","wp-content","wp-admin","wp-includes"]){
              const dir=root+"/"+rel;
              const listing=await call("Fileman/list_files",{dir,showdotfiles:1});
              const rows=Array.isArray(listing.data?.data)?listing.data.data:[];
              console.log("CPANEL_INSTALL_DIR="+JSON.stringify({dir:dir.replace(/\/home\/[^/]+/,"/home/[account]"),status:listing.data?.status,files:rows.map(v=>String(v.file||v.name||"")).filter(Boolean).slice(0,80)}));
            }
            console.log("PRODUCTION_SITE_PROBES=SKIPPED_BY_STAGING_SCOPE");
          }
          main().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Correct staging-only WordPress home and site URL configuration
        env:
          WP_BASE: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
          CP_ROOT: ${{ secrets.STAGING_CPANEL_DOCUMENT_ROOT }}
          STAGING_DB_NAME: ${{ secrets.STAGING_WORDPRESS_DB_NAME }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_WORDPRESS_DB_NAME }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const https=require("node:https");
          const crypto=require("node:crypto");
          const {URL,URLSearchParams}=require("node:url");
          require("node:dns").setDefaultResultOrder("ipv4first");
          function request(url,method="GET",headers={},body){
            return new Promise((resolve,reject)=>{
              const u=new URL(url);
