name: Staging Gateway E2E and Deploy

on:
  push:
    branches:
      - repair-document-signature-pathway-20260929
    paths:
      - "drive-gateway/**"
      - "firebase.json"
      - ".github/workflows/staging-gateway-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-e2e:
    if: github.ref == 'refs/heads/repair-document-signature-pathway-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Install gateway dependencies
        working-directory: drive-gateway
        run: npm install --no-audit --no-fund

      - name: Run Wrangler local Worker with Firebase Firestore emulator
        run: |
          set -o pipefail
          npx firebase emulators:exec             --project demo-irpa-staging             --only firestore             "npm --prefix drive-gateway run test:e2e:local" | tee e2e-output.ndjson

      - name: Upload raw E2E output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-gateway-e2e-raw-output
          path: e2e-output.ndjson

  deploy-staging:
    needs: local-e2e
    if: github.ref == 'refs/heads/repair-document-signature-pathway-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Verify staging-only deployment boundary
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/repair-document-signature-pathway-20260929"

      - name: Require isolated staging Drive credentials
        env:
          STAGING_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_ID }}
          STAGING_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_SECRET }}
          STAGING_REFRESH_TOKEN: ${{ secrets.STAGING_GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$STAGING_CLIENT_ID" || { echo "Missing STAGING_GOOGLE_DRIVE_CLIENT_ID"; exit 1; }
          test -n "$STAGING_CLIENT_SECRET" || { echo "Missing STAGING_GOOGLE_DRIVE_CLIENT_SECRET"; exit 1; }
          test -n "$STAGING_REFRESH_TOKEN" || { echo "Missing STAGING_GOOGLE_DRIVE_REFRESH_TOKEN"; exit 1; }

      - name: Materialize staging secrets for Wrangler
        env:
          STAGING_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_ID }}
          STAGING_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_SECRET }}
          STAGING_REFRESH_TOKEN: ${{ secrets.STAGING_GOOGLE_DRIVE_REFRESH_TOKEN }}
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          umask 077
          cat > .staging-secrets <<EOF
STAGING_GOOGLE_DRIVE_CLIENT_ID=${STAGING_CLIENT_ID}
STAGING_GOOGLE_DRIVE_CLIENT_SECRET=${STAGING_CLIENT_SECRET}
STAGING_GOOGLE_DRIVE_REFRESH_TOKEN=${STAGING_REFRESH_TOKEN}
EOF

      - name: Deploy staging Worker only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: drive-gateway
          command: deploy --config wrangler.toml --env staging --secrets-file .staging-secrets

      - name: Verify exact staging URL
        run: |
          set -euo pipefail
          url="https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev/health"
          echo "STAGING_URL=$url"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$url" | tee staging-health.json
          grep -q '"ok":true' staging-health.json
