                      type:"pages",id:testPageId,title:original.title,content:original.content,excerpt:original.excerpt||"",
                      featuredMedia:Number(original.featuredMedia||0),status:original.status
                    })});
                    if(!recovery.success) throw new Error("Timed-out page edit could not be safely restored from its saved snapshot or original fields.");
                  }
                  current=(await call("/api/communications/website/content/pages/"+testPageId)).item;
                  if(!matchesOriginal()) throw new Error("Timed-out page edit recovery failed exact field verification.");
                }
              }
            }
