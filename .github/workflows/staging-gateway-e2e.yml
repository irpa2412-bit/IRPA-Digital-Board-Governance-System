name: Staging Gateway E2E Isolation

on:
  push:
    branches:
      - repair-document-signature-pathway-20260929
    paths:
      - "drive-gateway/**"
      - "firebase.json"
      - ".github/workflows/staging-gateway-e2e.yml"
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  staging-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        working-directory: drive-gateway
        run: npm install --no-audit --no-fund

      - name: Check Cloudflare credentials for namespace inspection
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_BINDING_PROOF=AVAILABLE"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_BINDING_PROOF=BLOCKED_MISSING_ACTIONS_SECRETS"
          fi

      - name: Create or reuse isolated staging DRIVE_KV
        if: steps.cloudflare.outputs.available == 'true'
        id: staging_kv
        working-directory: drive-gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          title="IRPA-DBGS-STAGING-DRIVE-KV"
          list="$(npx wrangler kv namespace list --json)"
          id="$(printf '%s' "$list" | jq -r --arg title "$title" '.[] | select(.title == $title) | .id' | head -n1)"
          if [ -z "$id" ]; then
            output="$(npx wrangler kv namespace create "$title" --binding DRIVE_KV --env staging 2>&1)"
            printf '%s\\n' "$output"
            id="$(printf '%s\\n' "$output" | grep -Eo '[0-9a-f]{32}' | tail -n1)"
          fi
          test -n "$id"
          echo "STAGING_DRIVE_KV_ID=$id"
          echo "staging_kv_id=$id" >> "$GITHUB_OUTPUT"

      - name: Generate staging dry-run config
        if: steps.cloudflare.outputs.available == 'true'
        id: config
        working-directory: drive-gateway
        env:
          STAGING_KV_ID: ${{ steps.staging_kv.outputs.staging_kv_id }}
        run: |
          set -euo pipefail
          cp wrangler.toml wrangler.staging.generated.toml
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path("wrangler.staging.generated.toml")
          s=p.read_text()
          marker='id = "STAGING_DRIVE_KV_NAMESPACE_ID_REQUIRED"'
          s=s.replace(marker, f'id = "{os.environ["STAGING_KV_ID"]}"')
          p.write_text(s)
          PY
          grep -n -A2 -B1 'kv_namespaces' wrangler.staging.generated.toml

      - name: Production Wrangler dry-run binding list
        if: steps.cloudflare.outputs.available == 'true'
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler.toml 2>&1 | tee production-dry-run.txt
          ! grep -q 'LOCAL_TEST_MODE' production-dry-run.txt || { echo "FAIL: production dry-run exposed LOCAL_TEST_MODE"; exit 1; }
          grep -E 'DRIVE_KV|FIRESTORE_COLLECTION_PREFIX|ENVIRONMENT|bindings' production-dry-run.txt || true

      - name: Staging Wrangler dry-run binding list
        if: steps.cloudflare.outputs.available == 'true'
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config wrangler.staging.generated.toml --env staging 2>&1 | tee staging-dry-run.txt
          grep -E 'DRIVE_KV|FIRESTORE_COLLECTION_PREFIX|ENVIRONMENT|bindings' staging-dry-run.txt || true
          if grep -q 'id = "ccdbffa662ac48bfbdf7f4b1f62ca941"' wrangler.staging.generated.toml; then
            echo "FAIL: staging DRIVE_KV reused production namespace ID"
            exit 1
          fi

      - name: Write binding-proof status
        if: always()
        working-directory: drive-gateway
        run: |
          if [ "${{ steps.cloudflare.outputs.available }}" = "true" ]; then echo "CLOUDFLARE_BINDING_PROOF=AVAILABLE" > binding-proof-status.txt; else echo "CLOUDFLARE_BINDING_PROOF=BLOCKED_MISSING_ACTIONS_SECRETS" > binding-proof-status.txt; fi

      - name: Upload dry-run binding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-binding-dry-run
          path: |
            drive-gateway/production-dry-run.txt
            drive-gateway/staging-dry-run.txt
            drive-gateway/wrangler.staging.generated.toml

  local-e2e:
    if: always()
    needs: staging-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Java runtime
        run: java -version
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Install gateway dependencies
        working-directory: drive-gateway
        run: npm install --no-audit --no-fund
      - name: Run auth matrix tests
        working-directory: drive-gateway
        run: npm run test:auth
      - name: Run Firestore isolation test
        working-directory: drive-gateway
        run: npm run test:firestore-isolation
      - name: Run Wrangler local Worker with Firebase Firestore emulator
        run: |
          set -o pipefail
          timeout 6m npx firebase-tools@15.29.0 emulators:exec --project demo-irpa-staging --only firestore "npm --prefix drive-gateway run test:e2e:local" | tee e2e-output.ndjson
      - name: Upload raw E2E output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-gateway-e2e-raw-output
          path: e2e-output.ndjson
