          if(sa.project_id!=="irpa-dbg-staging-a73ec"||!sa.client_email||!sa.private_key) {
            throw new Error("Refusing staging Hosting deploy: service account must belong to the isolated staging Firebase project.");
          }
          console.log("STAGING_FIREBASE_IDENTITY_VALID=true");
          NODE
      - name: Build frontend against isolated staging Firebase and Drive gateway
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyA6UmHtP-mRr99rBw57_-qrD4_mFSBnZ38"
          VITE_FIREBASE_AUTH_DOMAIN: "irpa-dbg-staging-a73ec.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "irpa-dbg-staging-a73ec"
          VITE_FIREBASE_STORAGE_BUCKET: "irpa-dbg-staging-a73ec.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1018976634858"
