          const valid = /^\d+$/.test(values[0]) && Boolean(values[1].trim()) && decoded.length === 32;
          if (!valid) throw new Error("Staging Meta configuration is partial or invalid; refusing to configure Worker secrets.");
          console.log("META_OAUTH_CONFIGURATION_SHAPE=VALID");
          NODE
          node <<'NODE'
          const {spawnSync}=require("node:child_process");
          for (const [name,value] of [["META_APP_SECRET",process.env.META_APP_SECRET],["META_TOKEN_ENCRYPTION_KEY",process.env.META_TOKEN_ENCRYPTION_KEY]]) {
