          const base=process.env.STAGING_URL;
          const token=process.env.ID_TOKEN;
          const marker="IRPA_STAGING_WEBSITE_CHECK_"+Date.now();
          async function call(path,options={}){
            const response=await fetch(base+path,{...options,headers:{Authorization:"Bearer "+token,Accept:"application/json",...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{})},redirect:"manual"});
            const body=await response.json().catch(()=>({}));
            if(response.status>=300&&response.status<400) throw new Error(path+" returned a redirect; no redirect target was requested.");
            if(!response.ok) {
              const detail=String(body?.error||body?.message||"").replace(/(password|token|secret|authorization)(\s*[:=]\s*)[^\s,;]+/ig,"$1$2[REDACTED]").replace(/[\\r\\n\\t]+/g," ").slice(0,180);
              const ray=String(response.headers.get("cf-ray")||"none").slice(0,60);
              throw new Error(path+" returned HTTP "+response.status+" (cf-ray "+ray+")"+(detail?"; error="+detail:""));
            }
            return body;
          }
          async function waitForPublicMarker(url){
            const target=new URL(url);
            if(target.protocol!=="https:"||target.hostname.toLowerCase()!=="staging.irpa.or.tz") throw new Error("ABORT: public-render verification must target staging.irpa.or.tz.");
            for(let i=0;i<6;i++){
              const check=new URL(target.href);
              check.searchParams.set("irpa_staging_check",String(Date.now()));
              const response=await fetch(check.href,{cache:"no-store",redirect:"manual"});
              if(response.status>=300&&response.status<400) throw new Error("ABORT: staging public-render verification encountered a redirect; no redirect target was requested.");
              if(response.ok && (await response.text()).includes(marker)) return true;
              await new Promise(r=>setTimeout(r,1500));
            }
            return false;
          }
          (async()=>{
            const status=await call("/api/communications/site/status");
            console.log("STAGING_CONNECTION_DIAGNOSTIC="+JSON.stringify({
              website:status.connections?.website||"unknown",
              websiteHttpStatus:status.connections?.websiteHttpStatus??null,
