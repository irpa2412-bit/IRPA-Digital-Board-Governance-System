            if(wp.protocol!=="https:"||wp.hostname.toLowerCase()!=="staging.irpa.or.tz"||wp.pathname!=="/"||wp.username||wp.password||wp.search||wp.hash)
              throw new Error("ABORT: setup is restricted to the HTTPS staging.irpa.or.tz origin.");
            if(cp.protocol!=="https:"||cp.port!=="2083"||cp.pathname!=="/"||cp.username||cp.password)
              throw new Error("ABORT: cPanel target must be HTTPS port 2083.");
            if(!process.env.CLOUDFLARE_API_TOKEN||!process.env.CLOUDFLARE_ACCOUNT_ID)
              throw new Error("Staging Cloudflare deployment credentials are missing.");
            const auth={Authorization:"cpanel "+process.env.CP_USER+":"+process.env.CP_TOKEN,Accept:"application/json"};
            async function uapi(fn,params={},method="GET",rawBody){
              const url=new URL("/execute/"+fn,cp),form=new URLSearchParams(params);
              if(method==="GET")url.search=form.toString();
              const r=await request(url.href,method,{...auth,...(method==="POST"?{"Content-Type":"application/x-www-form-urlencoded"}:{})},rawBody??(method==="POST"?form.toString():undefined));
              let data;try{data=JSON.parse(r.raw)}catch{}
              return {http:r.http,data};
            }
            async function readFile(dir,file){
              const r=await uapi("Fileman/get_file_content",{dir,file});
              return {ok:r.http===200&&r.data?.status===1,content:String(r.data?.data?.content??r.data?.data?.[0]?.content??r.data?.result?.data?.content??"")};
            }
            async function writeFile(dir,file,content){
              const saved=await uapi("Fileman/save_file_content",{dir,file,content,charset:"utf-8"},"POST");
              let check=await readFile(dir,file);
              if(saved.http===200&&saved.data?.status===1&&check.ok&&check.content===content)return;
              const boundary="----IRPAStagingAppPassword"+crypto.randomBytes(8).toString("hex");
              const payload=Buffer.concat([
                Buffer.from("--"+boundary+"\r\nContent-Disposition: form-data; name=\"dir\"\r\n\r\n"+dir+"\r\n"),
                Buffer.from("--"+boundary+"\r\nContent-Disposition: form-data; name=\"overwrite\"\r\n\r\n1\r\n"),
                Buffer.from("--"+boundary+"\r\nContent-Disposition: form-data; name=\"file-1\"; filename=\""+file+"\"\r\nContent-Type: application/octet-stream\r\n\r\n"),
                Buffer.from(content),
                Buffer.from("\r\n--"+boundary+"--\r\n")
              ]);
              const up=await request(new URL("/execute/Fileman/upload_files",cp).href,"POST",{...auth,"Content-Type":"multipart/form-data; boundary="+boundary,"Content-Length":String(payload.length)},payload);
              let data;try{data=JSON.parse(up.raw)}catch{}
              check=await readFile(dir,file);
              if(up.http!==200||data?.status!==1||!check.ok||check.content!==content)throw new Error("Temporary staging REST route could not be written and verified.");
            }
            const info=await uapi("DomainInfo/domains_data");
            const home=String(info.data?.data?.main_domain?.documentroot||info.data?.data?.main_domain?.document_root||"").replace(/\/+$/,"");
            const stage=home+"/staging";
            if(info.http!==200||info.data?.status!==1||!home.endsWith("/public_html")||String(process.env.CP_ROOT||"").replace(/\/+$/,"")!==stage)
              throw new Error("ABORT: cPanel document root does not resolve to the isolated staging directory.");
            if(!process.env.STAGING_DB_NAME||!process.env.PRODUCTION_DB_NAME||process.env.STAGING_DB_NAME===process.env.PRODUCTION_DB_NAME)
              throw new Error("ABORT: staging and production database isolation is not verified.");
            const cfg=await readFile(stage,"wp-config.php");
            const db=/define\s*\(\s*['"]DB_NAME['"]\s*,\s*(['"])(.*?)\1\s*\)/s.exec(cfg.content);
            if(!cfg.ok||!db||db[2]!==process.env.STAGING_DB_NAME)throw new Error("ABORT: staging wp-config.php database name does not match the isolated staging secret.");
            const pluginPath=stage+"/wp-content/mu-plugins/irpa-staging-rest-auth.php";
            const basePlugin=fs.readFileSync(process.env.GITHUB_WORKSPACE+"/staging-auth-bridge-base.php","utf8");
            if(!basePlugin.includes("HTTP_X_IRPA_STAGING_AUTHORIZATION")||!basePlugin.includes("PHP_AUTH_USER")||basePlugin.includes("irpa-staging/v1/setup"))
              throw new Error("ABORT: staging base authentication bridge source is missing or unexpected.");
            const current=await readFile(stage+"/wp-content/mu-plugins","irpa-staging-rest-auth.php");
            if(!current.ok||current.content!==basePlugin)throw new Error("ABORT: live staging authentication bridge does not match the verified base source.");
            const token=crypto.randomBytes(32).toString("hex");
            const route=[
              "",
              "// Temporary one-run staging setup route. CI removes this route immediately after provisioning.",
              "add_action('rest_api_init', function () {",
              "  register_rest_route('irpa-staging/v1', '/setup', [",
              "    'methods' => 'POST',",
              "    'permission_callback' => function ($request) { return hash_equals('"+token+"', (string) $request->get_header('x-irpa-staging-setup')); },",
              "    'callback' => function () {",
              "      if (strtolower((string) ($_SERVER['HTTP_HOST'] ?? '')) !== 'staging.irpa.or.tz') return new WP_Error('wrong_host', 'Not found', ['status' => 404]);",
              "      $login = 'irpa_staging_gateway'; $email = 'irpa-staging-gateway@irpa.or.tz';",
              "      $user = get_user_by('login', $login);",
              "      if (!$user) {",
              "        if (email_exists($email)) return new WP_Error('integration_email_in_use', 'Staging integration identity conflict', ['status' => 409]);",
              "        $created = wp_insert_user(['user_login' => $login, 'user_email' => $email, 'user_pass' => wp_generate_password(64, true, true), 'display_name' => 'IRPA Staging Gateway', 'role' => 'editor']);",
              "        if (is_wp_error($created)) return new WP_Error('editor_account_creation_failed', 'Staging Editor creation failed', ['status' => 500]);",
              "        $user = get_user_by('id', $created);",
              "      }",
              "      if (!$user || !in_array('editor', (array) $user->roles, true) || in_array('administrator', (array) $user->roles, true)) return new WP_Error('dedicated_account_role_mismatch', 'Staging integration account must be Editor only', ['status' => 409]);",
              "      if (!class_exists('WP_Application_Passwords') || !function_exists('wp_is_application_passwords_available') || !function_exists('wp_is_application_passwords_available_for_user') || !wp_is_application_passwords_available() || !wp_is_application_passwords_available_for_user($user)) return new WP_Error('application_passwords_unavailable', 'Application Passwords unavailable on staging', ['status' => 503]);",
              "      foreach (WP_Application_Passwords::get_user_application_passwords($user->ID) as $item) { if (($item['name'] ?? '') === 'IRPA Staging Gateway' && !empty($item['uuid'])) WP_Application_Passwords::delete_application_password($user->ID, $item['uuid']); }",
              "      $createdPassword = WP_Application_Passwords::create_new_application_password($user->ID, ['name' => 'IRPA Staging Gateway']);",
              "      if (is_wp_error($createdPassword) || !is_array($createdPassword) || empty($createdPassword[0])) return new WP_Error('application_password_creation_failed', 'Staging application password creation failed', ['status' => 500]);",
              "      $fixture = get_posts(['post_type' => 'page', 'post_status' => ['publish','draft','private','pending','future'], 'name' => 'irpa-staging-integration-check', 'numberposts' => -1, 'fields' => 'ids']);",
              "      if (count($fixture) > 1) return new WP_Error('staging_test_page_duplicate', 'Duplicate staging test pages found', ['status' => 409]);",
              "      if (count($fixture) === 0) {",
              "        $fixtureId = wp_insert_post(['post_type' => 'page', 'post_status' => 'publish', 'post_title' => 'IRPA Staging Integration Check', 'post_name' => 'irpa-staging-integration-check', 'post_content' => '<p>Staging-only page reserved for automated IRPA website integration acceptance. Its content is restored after each run.</p>', 'post_excerpt' => '', 'post_author' => $user->ID], true);",
              "        if (is_wp_error($fixtureId)) return new WP_Error('staging_test_page_creation_failed', 'Staging test page could not be created', ['status' => 500]);",
              "      } elseif (get_post_status((int) $fixture[0]) !== 'publish') {",
              "        return new WP_Error('staging_test_page_not_published', 'The existing staging test page is not published', ['status' => 409]);",
              "      }",
              "      if (count($fixture) === 1) $fixtureId = (int) $fixture[0];",
              "      if (!function_exists('wp_save_post_revision') || !function_exists('wp_get_post_revisions')) return new WP_Error('staging_test_revision_api_unavailable', 'WordPress revisions are unavailable for the staging test page', ['status' => 503]);",
              "      $fixtureRevisions = wp_get_post_revisions((int) $fixtureId);",
              "      if (empty($fixtureRevisions)) {",
              "        wp_save_post_revision((int) $fixtureId);",
              "        $fixtureRevisions = wp_get_post_revisions((int) $fixtureId);",
              "      }",
              "      if (empty($fixtureRevisions)) return new WP_Error('staging_test_revision_unavailable', 'Could not create a rollback revision for the staging test page', ['status' => 503]);",
              "      return new WP_REST_Response(['ok' => true, 'username' => $login, 'password' => str_replace(' ', '', (string) $createdPassword[0])], 200);",
              "    }",
              "  ]);",
              "});",
              ""
            ].join("\n");
            const routeAnchor="$header = trim((string) ($_SERVER['HTTP_X_IRPA_STAGING_AUTHORIZATION'] ?? ''));";
            const routeAnchorIndex=basePlugin.indexOf(routeAnchor);
            if(routeAnchorIndex<0)throw new Error("ABORT: staging bridge insertion point was not found.");
            const temporaryPlugin=basePlugin.slice(0,routeAnchorIndex)+route+"\n"+basePlugin.slice(routeAnchorIndex);
            let provisioned=null,routeResponse=null,restoreError=null;
            try {
              await writeFile(stage+"/wp-content/mu-plugins","irpa-staging-rest-auth.php",temporaryPlugin);
              const endpoint=new URL("/wp-json/irpa-staging/v1/setup",wp);
              routeResponse=await request(endpoint.href,"POST",{"Content-Length":"0","X-IRPA-Staging-Setup":token,"Cache-Control":"no-store"},"");
              try{provisioned=JSON.parse(routeResponse.raw)}catch{}
            } finally {
              try {
                await writeFile(stage+"/wp-content/mu-plugins","irpa-staging-rest-auth.php",basePlugin);
                const restored=await readFile(stage+"/wp-content/mu-plugins","irpa-staging-rest-auth.php");
                if(!restored.ok||restored.content!==basePlugin)throw new Error("Staging authentication bridge restoration failed.");
              } catch(e) { restoreError=e; }
            }
            if(restoreError)throw new Error("ABORT: temporary staging setup route cleanup could not be verified.");
            if(!routeResponse||routeResponse.http!==200||provisioned?.ok!==true||provisioned.username!=="irpa_staging_gateway"||!/^[a-z0-9]{24}$/i.test(String(provisioned.password||"")))
              throw new Error("WordPress staging REST setup route failed (HTTP "+String(routeResponse?.http||"unknown")+", code "+String(provisioned?.code||"invalid_response").slice(0,80)+").");
            const usernameResult=spawnSync("npx",["wrangler","secret","put","WORDPRESS_USERNAME","--config","wrangler.staging.generated.json"],{input:provisioned.username,encoding:"utf8",stdio:["pipe","ignore","pipe"],env:process.env});
            if(usernameResult.status!==0)throw new Error("Could not update the staging Worker username secret.");
            const passwordResult=spawnSync("npx",["wrangler","secret","put","WORDPRESS_APPLICATION_PASSWORD","--config","wrangler.staging.generated.json"],{input:provisioned.password,encoding:"utf8",stdio:["pipe","ignore","pipe"],env:process.env});
            provisioned.password="";
            if(passwordResult.status!==0)throw new Error("Could not update the staging Worker application-password secret.");
            console.log("STAGING_WORDPRESS_DEDICATED_EDITOR=PASS");
            console.log("STAGING_WORDPRESS_APPLICATION_PASSWORD_ROTATION=PASS (value redacted)");
          }
          main().catch(e=>{console.error("Staging application-password provisioning failed: "+String(e.message||e).replace(/[\r\n\t]+/g," ").slice(0,220));process.exit(1)});
          NODE

      - name: Prepare isolated staging reviewer identity
        env:
          PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
          TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
        run: |
          set -euo pipefail
          npm --prefix functions install --omit=dev --no-audit --no-fund
          NODE_PATH="$GITHUB_WORKSPACE/functions/node_modules" node <<'NODE'
          const {initializeApp,cert}=require("firebase-admin/app");
          const {getAuth}=require("firebase-admin/auth");
          const {getFirestore}=require("firebase-admin/firestore");
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          if(sa.project_id!==process.env.PROJECT) throw new Error("Staging service account project mismatch.");
          initializeApp({credential:cert(sa),projectId:process.env.PROJECT});
          (async()=>{
            const user=await getAuth().getUserByEmail(process.env.TEST_EMAIL);
            await getFirestore().collection("adminProfiles").doc(user.uid).set({uid:user.uid,email:user.email,role:"Administrator",active:true,updatedAt:new Date().toISOString()},{merge:true});
            console.log("STAGING_REVIEWER_IDENTITY_READY");
          })().catch(e=>{console.error("Unable to prepare isolated staging reviewer identity:",e.message);process.exit(1)});
          NODE

      - name: Verify staging health
        id: staging-health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Accept: application/json" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(node -e 'const a=JSON.parse(process.argv[1]); if(!a.success || !a.result?.subdomain) process.exit(1); process.stdout.write(a.result.subdomain)' "$subdomain_json")"
          test -n "$subdomain"
          url="https://irpa-google-drive-gateway-staging.$subdomain.workers.dev"
          echo "staging_url=$url" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$url/health" | tee staging-health.json
          grep -q '"ok":true' staging-health.json
          grep -q '"environment":"staging"' staging-health.json

      - name: Diagnose cPanel endpoint reachability
        env:
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const dns=require("dns").promises;
          const net=require("net");
          (async()=>{
            const u=new URL(process.env.CP_BASE);
            let addresses=[];
            try { addresses=(await dns.lookup(u.hostname,{all:true})).map(x=>x.address); }
            catch(e) { throw new Error("cPanel DNS lookup failed ("+(e.code||e.name)+") for "+u.hostname+"."); }
            console.log("CPANEL_DNS_RESOLVED="+addresses.length+" address(es)");
            async function probe(address){
              let last={address,result:"not-tested"};
              for(let attempt=1;attempt<=3;attempt++){
                last=await new Promise(resolve=>{
                  const socket=net.connect({host:address,port:Number(u.port||443)});
                  let settled=false;
                  const done=v=>{if(!settled){settled=true;socket.destroy();resolve(v)}};
                  socket.setTimeout(8000,()=>done({address,result:"timeout"}));
                  socket.once("connect",()=>done({address,result:"connected"}));
                  socket.once("error",e=>done({address,result:e.code||e.name||"error"}));
                });
                if(last.result==="connected"||last.result==="ENETUNREACH"||attempt===3)return last;
                await new Promise(resolve=>setTimeout(resolve,attempt*1500));
              }
              return last;
            }
            const result=await Promise.all(addresses.map(probe));
            console.log("CPANEL_TCP_REACHABILITY="+JSON.stringify(result));
            if(!result.some(x=>x.result==="connected")) {
              throw new Error("Runner cannot establish TCP connectivity to the configured cPanel endpoint on port "+(u.port||443)+". Check hosting-provider IP allowlisting, firewall rules, routing, and endpoint availability.");
            }
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Prepare isolated cPanel rollback test file
        env:
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
          CP_ROOT: ${{ secrets.STAGING_CPANEL_DOCUMENT_ROOT }}
          CP_TEST_FILE: ${{ secrets.STAGING_CPANEL_TEST_FILE }}
        run: |
          set -euo pipefail
          node <<'NODE'
          require("node:dns").setDefaultResultOrder("ipv4first");
          async function main(){
            let root=process.env.CP_ROOT.trim().replace(/^\/+|\/+$/g,"");
            const homePrefix="home/"+process.env.CP_USER+"/";
            if(root.startsWith(homePrefix)) root=root.slice(homePrefix.length);
            const parts=process.env.CP_TEST_FILE.split("/");
            const file=parts.pop();
            const dir=root+(parts.length?"/"+parts.join("/"):"");
            const base=new URL(process.env.CP_BASE);
            const auth="cpanel "+process.env.CP_USER+":"+process.env.CP_TOKEN;
            const https=require("node:https");
            async function httpsPost(url,headers,body){
              return await new Promise((resolve,reject)=>{
                const req=https.request({protocol:"https:",hostname:base.hostname,servername:base.hostname,port:Number(base.port||443),family:4,path:url.pathname+url.search,method:"POST",headers,timeout:20000},res=>{
                  const chunks=[];res.on("data",chunk=>chunks.push(Buffer.from(chunk)));
                  res.on("end",()=>resolve({status:res.statusCode,ok:res.statusCode>=200&&res.statusCode<300,headers:res.headers,raw:Buffer.concat(chunks).toString("utf8")}));
                });
                req.on("timeout",()=>req.destroy(Object.assign(new Error("cPanel request timed out"),{code:"ETIMEDOUT"})));
                req.on("error",reject);req.end(body);
              });
            }
            async function request(operation,values){
              const url=new URL("/execute/Fileman/"+operation,base);
              let response;
              let lastError;
              for(let attempt=1;attempt<=3;attempt++){
                try {
                  response=await httpsPost(url,{Authorization:auth,Accept:"application/json","Content-Type":"application/x-www-form-urlencoded"},new URLSearchParams(values).toString());
                  lastError=null;break;
                } catch(error) {
                  lastError=error;
                  const code=error.code||error.cause?.code||error.cause?.name||error.name||"unknown";
                  const transient=["ETIMEDOUT","ECONNRESET","EHOSTUNREACH","UND_ERR_CONNECT_TIMEOUT","TimeoutError"].includes(code);
                  if(!transient||attempt===3) throw new Error("Staging cPanel API connection failed ("+code+") at "+base.hostname+":"+base.port+" after "+attempt+" IPv4 attempt(s).");
                  await new Promise(resolve=>setTimeout(resolve,attempt*2000));
                }
              }
              if(lastError||!response) throw new Error("Staging cPanel API request did not return a response.");
              const raw=response.raw;
              let body=null;
              try { body=JSON.parse(raw); } catch {}
              if(!response.ok||!body) {
                const detail=String(body?.errors?.map?.(x=>x?.message).filter(Boolean).join("; ")||body?.error||body?.message||"").replace(/[\r\n\t]+/g," ").slice(0,220);
                const contentType=response.headers["content-type"]||"unknown";
                const lower=raw.toLowerCase();
                const titleStart=lower.indexOf("<title");
                const titleOpen=titleStart>=0?raw.indexOf(">",titleStart):-1;
                const titleEnd=titleOpen>=0?lower.indexOf("</title>",titleOpen):-1;
                const title=titleOpen>=0&&titleEnd>titleOpen?raw.slice(titleOpen+1,titleEnd).replace(/<[^>]*>/g," ").replace(/[\r\n\t]+/g," ").trim().slice(0,120):"";
                const excerpt=raw.replace(/<[^>]*>/g," ").replace(/&nbsp;/gi," ").replace(/&amp;/gi,"&").replace(/[\r\n\t]+/g," ").replace(/\s+/g," ").trim().slice(0,180);
                const diagnostic=[detail,title?"page title: "+title:"",excerpt?"response excerpt: "+excerpt:""].filter(Boolean).join("; ");
                throw new Error("Staging cPanel test-file preparation failed with HTTP "+response.status+" (content-type: "+contentType+")"+(diagnostic?"; "+diagnostic:"; response body was not valid cPanel JSON")+". Check cPanel API token validity, user association, token privileges, and hosting security rules.");
              }
              if(body.status!==1 && body.errors?.length) {
                const detail=String(body.errors.map(x=>typeof x==="string"?x:(x?.message||x?.error||JSON.stringify(x))).filter(Boolean).join("; ")).replace(/[\\r\\n\\t]+/g," ").slice(0,220);
                if(operation==="get_file_content" && body.status!==1 && body.errors?.length) { console.log("STAGING_CPANEL_TEST_FILE_NOT_READABLE_OR_MISSING; attempting isolated upload"); return body; }
                const meta="status="+String(body.status)+", error_keys="+Object.keys(body).filter(k=>/error|reason|status|message/i.test(k)).join(",");
                throw new Error("cPanel Fileman API rejected the request ("+meta+")"+(detail?": "+detail:"; no readable error detail returned")+".");
              }
              return body;
            }
            const existing=await request("get_file_content",{dir,file});
            if(existing.status===1){
              const content=existing.data?.content??existing.data?.[0]?.content;
              if(typeof content!=="string") throw new Error("Staging cPanel test file exists but is not readable.");
              console.log("STAGING_CPANEL_TEST_FILE_READY");
              return;
            }
            // Fileman::save_file_content updates an existing file on some cPanel builds.
            // Create a missing, dedicated staging test file using the documented multipart upload API.
            const uploadUrl=new URL("/execute/Fileman/upload_files",base);
            const boundary="----IRPAStagingUpload"+Date.now().toString(16);
            const uploadBody=Buffer.concat([
              Buffer.from("--"+boundary+"\r\nContent-Disposition: form-data; name=\"dir\"\r\n\r\n"+dir+"\r\n"),
              Buffer.from("--"+boundary+"\r\nContent-Disposition: form-data; name=\"file-1\"; filename=\""+file+"\"\r\nContent-Type: text/plain; charset=utf-8\r\n\r\n"),
              Buffer.from("IRPA staging cPanel rollback baseline\n"),
              Buffer.from("\r\n--"+boundary+"--\r\n")
            ]);
            let uploadResponse;
            let uploadError;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                uploadResponse=await httpsPost(uploadUrl,{Authorization:auth,Accept:"application/json","Content-Type":"multipart/form-data; boundary="+boundary,"Content-Length":String(uploadBody.length)},uploadBody);
                uploadError=null;break;
              }catch(error){
                uploadError=error;
                const code=error.code||error.cause?.code||error.cause?.name||error.name||"unknown";
                if(!["ETIMEDOUT","ECONNRESET","EHOSTUNREACH","UND_ERR_CONNECT_TIMEOUT","TimeoutError"].includes(code)||attempt===3){
                  throw new Error("Staging cPanel test-file upload failed ("+code+") after "+attempt+" IPv4 attempt(s).");
                }
                await new Promise(resolve=>setTimeout(resolve,attempt*2000));
              }
            }
            if(uploadError||!uploadResponse) throw new Error("Staging cPanel test-file upload returned no response.");
            const uploadRaw=uploadResponse.raw;
            let uploaded=null;
            try{uploaded=JSON.parse(uploadRaw)}catch{}
            if(!uploadResponse.ok||!uploaded||uploaded.status!==1){
              const detail=String(uploaded?.errors?.map?.(x=>typeof x==="string"?x:(x?.message||JSON.stringify(x))).filter(Boolean).join("; ")||uploaded?.messages?.join?.("; ")||"").replace(/[\\r\\n\\t]+/g," ").slice(0,220);
              throw new Error("cPanel Fileman upload_files failed (HTTP "+uploadResponse.status+", status="+String(uploaded?.status)+")"+(detail?": "+detail:"; invalid JSON response")+".");
            }
            console.log("STAGING_CPANEL_TEST_FILE_CREATED");
          }
          main().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Write redacted repair summary
        if: always()
        env:
          PREFLIGHT: ${{ steps.staging-preflight.outcome }}
          DEPLOY: ${{ steps.deploy-staging-worker.outcome }}
          HEALTH: ${{ steps.staging-health.outcome }}
        run: |
          set -euo pipefail
          { echo "# IRPA-DBGS staging repair"; echo ""; echo "- Target: staging.irpa.or.tz"; echo "- Preflight: ${PREFLIGHT:-not-run}"; echo "- WordPress credential source: preconfigured staging Worker secrets"; echo "- Staging Worker deployment: ${DEPLOY:-not-run}"; echo "- Staging health: ${HEALTH:-not-run}"; echo "- Production credentials/site/DNS: not accessed in this run"; echo "- Merge gate: CLOSED"; } | tee staging-repair-summary.md >> "$GITHUB_STEP_SUMMARY"
          cp staging-repair-summary.md staging-repair-diagnostics.txt
          if [ -f staging-wordpress-fatal-diagnostics.txt ]; then cat staging-wordpress-fatal-diagnostics.txt >> staging-repair-diagnostics.txt; fi
