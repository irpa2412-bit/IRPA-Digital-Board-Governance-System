               !verify.content.includes("application_password_did_authenticate")||
               !verify.content.includes("application_password_failed_authentication")||
               !verify.content.includes("get_user_by('login'")||
               !verify.content.includes("get_user_application_passwords")||
               !verify.content.includes("ap_in_use=")||
               !verify.content.includes("staging.irpa.or.tz"))throw new Error("Staging authentication bridge failed post-write verification.");
            console.log("STAGING_REST_AUTH_BRIDGE_REPAIR=PASS");
            console.log("STAGING_AUTH_BACKUP=VERIFIED_OUTSIDE_WEB_ROOT");
            console.log("STAGING_DATABASE_ISOLATION=PASS");
            console.log("STAGING_CREDENTIALS=NOT_LOGGED");
          }
          main().catch(e=>{console.error("Staging-only auth bridge repair failed: "+String(e.message||e).replace(/[\r\n\t]+/g," ").slice(0,220));process.exit(1)});
