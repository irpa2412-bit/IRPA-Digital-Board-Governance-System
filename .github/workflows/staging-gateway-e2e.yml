          if [ "$id" != "5ea76010553049a2b98c8493c37fbbc4" ]; then
            echo "STAGING_KV_NAMESPACE_ACTUAL_ID=$id"
            echo "Staging KV namespace ID does not match the approved isolated namespace; refusing deployment."
