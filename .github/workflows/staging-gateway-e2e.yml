            printf '%s' "$META_TOKEN_ENCRYPTION_KEY" | npx wrangler secret put META_TOKEN_ENCRYPTION_KEY --config wrangler.staging.generated.json
          fi

      - name: Install gateway dependencies for bundling
        working-directory: drive-gateway
        run: npm ci --no-audit --no-fund

      - name: Generate and inject an isolated staging signer key
        id: staging_crypto_key
        env:
          FIREBASE_WEB_API_KEY: "AIzaSyA6UmHtP-mRr99rBw57_-qrD4_mFSBnZ38"
          FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          TEST_EMAIL: ${{ secrets.STAGING_CRYPTO_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.STAGING_CRYPTO_TEST_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createHash,webcrypto} from "node:crypto";
          import fs from "node:fs";
          const project=process.env.FIREBASE_PROJECT_ID||"";
          if(!project||project==="irpa-digital-board-governance")throw new Error("Staging key generation refused a production Firebase project.");
          const response=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(process.env.FIREBASE_WEB_API_KEY||""),{
            method:"POST",headers:{"content-type":"application/json"},
            body:JSON.stringify({email:process.env.TEST_EMAIL,password:process.env.TEST_PASSWORD,returnSecureToken:true})
          });
          const auth=await response.json().catch(()=>({}));
          if(!response.ok||!auth.idToken||!auth.localId)throw new Error("Unable to authenticate the isolated staging crypto test account.");
          const claims=JSON.parse(Buffer.from(auth.idToken.split(".")[1],"base64url").toString("utf8"));
          if(claims.aud!==project||claims.iss!=="https://securetoken.google.com/"+project)throw new Error("Staging signer token audience/issuer mismatch.");
          const pair=await webcrypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]);
          const privateBytes=new Uint8Array(await webcrypto.subtle.exportKey("pkcs8",pair.privateKey));
          const publicJwk=await webcrypto.subtle.exportKey("jwk",pair.publicKey);
          const keyId="IRPA-STAGING-ACCEPTANCE-"+Date.now().toString(36);
          const record=JSON.stringify({
            version:1,keyId,
            privateKeyPkcs8:Buffer.from(privateBytes).toString("base64"),
            publicKeyJwk:{kty:publicJwk.kty,crv:publicJwk.crv,x:publicJwk.x,y:publicJwk.y,ext:true}
          });
          const secretName="IRPA_CRYPTO_KEY_"+createHash("sha256").update(auth.localId).digest("hex").slice(0,32).toUpperCase();
          fs.writeFileSync(process.env.RUNNER_TEMP+"/irpa-staging-crypto-key-record",record,{mode:0o600});
          fs.writeFileSync(process.env.RUNNER_TEMP+"/irpa-staging-crypto-secret-name",secretName,{mode:0o600});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,"signer_uid="+auth.localId+"\nkey_id="+keyId+"\n");
          console.log("STAGING_SIGNER_UID_BOUND=true");
          console.log("STAGING_CRYPTO_KEY_GENERATED=true");
          NODE
          secret_name="$(cat "$RUNNER_TEMP/irpa-staging-crypto-secret-name")"
          printf '%s' "$(cat "$RUNNER_TEMP/irpa-staging-crypto-key-record")" | npx wrangler secret put "$secret_name" --config wrangler.staging.generated.json
          rm -f "$RUNNER_TEMP/irpa-staging-crypto-key-record" "$RUNNER_TEMP/irpa-staging-crypto-secret-name"

      - name: Deploy staging Worker only
        id: wrangler_deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
        working-directory: drive-gateway
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.staging.generated.json 2>&1 | tee wrangler.log

      - name: Summarize Wrangler deploy output
        if: always()
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          {
            echo "## Wrangler deploy output"
            echo ""
            echo '```text'
            if [ -f wrangler.log ]; then
              tail -n 40 wrangler.log | perl -pe 's/Authorization:[^, ]+/Authorization: [REDACTED]/ig; s/Bearer[[:space:]]+[^[:space:],;]+/Bearer [REDACTED]/ig; s/(password|token|secret)(["=: ]+)[^", ]+/$1$2[REDACTED]/ig; s/([A-Za-z0-9_-]{32,})/[REDACTED_TOKEN]/g'
            else
              echo "wrangler.log was not produced."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if Wrangler deploy failed
        if: steps.wrangler_deploy.outcome == 'failure'
        run: |
          echo "Wrangler staging deploy failed; see the redacted summary above."
          exit 1

      - name: Verify staging health
        id: staging_health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Accept: application/json" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(node -e 'const a=JSON.parse(process.argv[1]); if(!a.success || !a.result?.subdomain) process.exit(1); process.stdout.write(a.result.subdomain)' "$subdomain_json")"
          test -n "$subdomain"
          gateway_url="https://irpa-google-drive-gateway-staging.$subdomain.workers.dev"
          url="$gateway_url/health"
          echo "gateway_url=$gateway_url" >> "$GITHUB_OUTPUT"
          echo "STAGING_HEALTH_URL=$url"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$url" | tee staging-health.json
          grep -q '"ok":true' staging-health.json

      - name: Prepare isolated staging media administrator
        env:
          PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
          TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
        run: |
          set -euo pipefail
          test "$PROJECT" = "irpa-dbg-staging-a73ec"
          npm --prefix functions install --omit=dev --no-audit --no-fund
          NODE_PATH="$GITHUB_WORKSPACE/functions/node_modules" node <<'NODE'
          const {initializeApp,cert}=require("firebase-admin/app");
          const {getAuth}=require("firebase-admin/auth");
          const {getFirestore}=require("firebase-admin/firestore");
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||"{}");
          if(sa.project_id!=="irpa-dbg-staging-a73ec") throw new Error("Staging admin fixture refused a non-staging service account.");
          initializeApp({credential:cert(sa),projectId:process.env.PROJECT});
          (async()=>{
            const user=await getAuth().getUserByEmail(process.env.TEST_EMAIL);
            await getFirestore().collection("adminProfiles").doc(user.uid).set({uid:user.uid,email:user.email,role:"Administrator",active:true,updatedAt:new Date().toISOString()},{merge:true});
            console.log("STAGING_MEDIA_ADMIN_IDENTITY_READY=true");
          })().catch(e=>{console.error("Unable to prepare staging media test identity: "+String(e.message||e).replace(/[\\r\\n\\t]+/g," ").slice(0,180));process.exit(1)});
          NODE

      - name: Verify signature mirror, signer trail, and document lifecycle approval
        id: signature-lifecycle
        if: always()
        continue-on-error: true
        env:
          STAGING_GATEWAY_URL: ${{ steps.staging_health.outputs.gateway_url }}
          STAGING_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          STAGING_FIREBASE_WEB_API_KEY: ${{ secrets.STAGING_FIREBASE_WEB_API_KEY }}
          STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          STAGING_CRYPTO_TEST_EMAIL: ${{ secrets.STAGING_CRYPTO_TEST_EMAIL }}
          STAGING_CRYPTO_TEST_PASSWORD: ${{ secrets.STAGING_CRYPTO_TEST_PASSWORD }}
          STAGING_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
        working-directory: drive-gateway
        run: |
          set -o pipefail
          node tests/staging-signature-lifecycle-acceptance.mjs 2>&1 | tee e2e.log

      - name: Summarize acceptance test output
        if: always()
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          {
            echo "## Acceptance test output"
            echo ""
            echo "Gateway version:"
            if [ -f ../staging-health.json ]; then
              node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("../staging-health.json","utf8")); console.log(String(h.version ?? "unknown"))'
            else
              echo "unknown (health response unavailable)"
            fi
            echo ""
            echo ' ```text'
            if [ -f e2e.log ]; then
              tail -n 40 e2e.log | perl -pe 's/Authorization:[^, ]+/Authorization: [REDACTED]/ig; s/Bearer\\s+[^\\s\\x22\\x27,;]+/Bearer [REDACTED]/ig; s/AIza[0-9A-Za-z_-]{20,}/[REDACTED_API_KEY]/g; s/(password|token|secret)(["=: ]+)[^", ]+/$1$2[REDACTED]/ig; s/([A-Za-z0-9_-]{32,})/[REDACTED_TOKEN]/g'
            else
              echo "drive-gateway/e2e.log was not produced."
            fi
            echo ' ```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Communication and Media Archive and controlled-PDF upload
        id: communication-media
        if: always()
        continue-on-error: true
        env:
          STAGING_GATEWAY_URL: ${{ steps.staging_health.outputs.gateway_url }}
          STAGING_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          STAGING_FIREBASE_WEB_API_KEY: ${{ secrets.STAGING_FIREBASE_WEB_API_KEY }}
          STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          STAGING_CRYPTO_TEST_EMAIL: ${{ secrets.STAGING_CRYPTO_TEST_EMAIL }}
          STAGING_CRYPTO_TEST_PASSWORD: ${{ secrets.STAGING_CRYPTO_TEST_PASSWORD }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' 2>&1 | tee communication-media.log
          const project=process.env.STAGING_FIREBASE_PROJECT_ID||"";
          const apiKey=process.env.STAGING_FIREBASE_WEB_API_KEY||"";
          const base=String(process.env.STAGING_GATEWAY_URL||"").replace(/\/$/,"");
          if(project!=="irpa-dbg-staging-a73ec"||!apiKey||!base.startsWith("https://irpa-google-drive-gateway-staging.")) throw new Error("Staging archive acceptance refused an unexpected project or gateway.");
          if(String(process.env.STAGING_TEST_EMAIL||"").toLowerCase()===String(process.env.STAGING_CRYPTO_TEST_EMAIL||"").toLowerCase()) throw new Error("Separate staging administrator and non-administrator test identities are required.");
          async function signIn(email,password){
            const response=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(apiKey),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email,password,returnSecureToken:true})});
            const body=await response.json().catch(()=>({}));
            if(!response.ok||!body.idToken||!body.localId) throw new Error("Staging test identity authentication failed (HTTP "+response.status+").");
            const claims=JSON.parse(Buffer.from(body.idToken.split(".")[1],"base64url").toString("utf8"));
            if(claims.aud!==project||claims.iss!=="https://securetoken.google.com/"+project) throw new Error("Staging Firebase token audience or issuer mismatch.");
            return body;
          }
          const nonAdmin=await signIn(process.env.STAGING_CRYPTO_TEST_EMAIL,process.env.STAGING_CRYPTO_TEST_PASSWORD);
          const denied=await fetch(base+"/api/communication-media-archive/provision",{method:"POST",headers:{Authorization:"Bearer "+nonAdmin.idToken,"content-type":"application/json"},body:"{}"});
          if(denied.status!==403) throw new Error("Media archive role-denial check failed; expected HTTP 403 and received HTTP "+denied.status+".");
          console.log("STAGING_COMMUNICATION_MEDIA_ROLE_DENIAL=PASS");
          const admin=await signIn(process.env.STAGING_TEST_EMAIL,process.env.STAGING_TEST_PASSWORD);
          const archiveResponse=await fetch(base+"/api/communication-media-archive/provision",{method:"POST",headers:{Authorization:"Bearer "+admin.idToken,"content-type":"application/json"},body:"{}"});
          const archiveText=await archiveResponse.text();
          const archive=(()=>{try{return JSON.parse(archiveText)}catch{return {}}})();
          const redactBody=value=>String(value||"").slice(0,300).replace(/Bearer\\s+[^\\s,;"]+/ig,"Bearer [REDACTED]").replace(/AIza[0-9A-Za-z_-]{20,}/g,"[REDACTED_API_KEY]").replace(/(password|token|secret)(["=: ]+)[^", ]+/ig,"$1$2[REDACTED]").replace(/[\\r\\n\\t]+/g," ");
          if(archiveResponse.status===503&&archive.code==="GOOGLE_DRIVE_NOT_AUTHORIZED") throw new Error("STAGING_GOOGLE_DRIVE_OAUTH=NOT_AUTHORIZED; an active IRPA administrator must complete Google Drive authorization in staging Settings.");
          if(!archiveResponse.ok||archive.archiveName!=="Communication and Media Archive"||!archive.folderId||archive.storageProvider!=="Google Drive") throw new Error("Communication and Media Archive provisioning failed; HTTP "+archiveResponse.status+"; response body: "+redactBody(archiveText));
          const pdf=Buffer.from("%PDF-1.4\n1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n2 0 obj\n<< /Type /Pages /Kids [] /Count 0 >>\nendobj\ntrailer\n<< /Root 1 0 R >>\n%%EOF\n","utf8");
          const fileName="IRPA-STAGING-ACCEPTANCE-"+String(process.env.RUN_ID||"test")+".pdf";
          const uploadResponse=await fetch(base+"/api/upload",{method:"POST",headers:{Authorization:"Bearer "+admin.idToken,"content-type":"application/json"},body:JSON.stringify({fileName,contentType:"application/pdf",fileSize:pdf.length,base64:pdf.toString("base64"),purpose:"Communication Media",folderId:archive.folderId})});
          const uploadText=await uploadResponse.text();
          const upload=(()=>{try{return JSON.parse(uploadText)}catch{return {}}})();
          if(!uploadResponse.ok||!upload.fileId||upload.storageProvider!=="Google Drive"||upload.fileName!==fileName||Number(upload.fileSize)!==pdf.length) throw new Error("Controlled-PDF upload to the verified media archive failed; HTTP "+uploadResponse.status+"; response body: "+redactBody(uploadText));
          const assetId="staging-acceptance-"+String(process.env.RUN_ID||"test");
          const now=new Date().toISOString();
          const fields={
            title:{stringValue:"STAGING AUTOMATED ACCEPTANCE - "+String(process.env.RUN_ID||"test")},
            originalFileName:{stringValue:fileName},
            contentType:{stringValue:"application/pdf"},
            fileSize:{integerValue:String(pdf.length)},
            fileId:{stringValue:upload.fileId},
            webViewLink:{stringValue:String(upload.webViewLink||"")},
            storageProvider:{stringValue:"Google Drive"},
            purpose:{stringValue:"Communication Media"},
            tags:{stringValue:"STAGING AUTOMATED ACCEPTANCE"},
            mediaKind:{stringValue:"Document / Other"},
            status:{stringValue:"Available"},
            recordOrigin:{stringValue:"STAGING"},
            uploadedByUid:{stringValue:admin.localId},
            uploadedByEmail:{stringValue:String(admin.email||process.env.STAGING_TEST_EMAIL||"")},
            createdAt:{timestampValue:now},
            updatedAt:{timestampValue:now}
          };
          const docUrl="https://firestore.googleapis.com/v1/projects/"+encodeURIComponent(project)+"/databases/(default)/documents/communicationMediaAssets/"+encodeURIComponent(assetId);
          const createResponse=await fetch("https://firestore.googleapis.com/v1/projects/"+encodeURIComponent(project)+"/databases/(default)/documents/communicationMediaAssets?documentId="+encodeURIComponent(assetId),{method:"POST",headers:{Authorization:"Bearer "+admin.idToken,"content-type":"application/json"},body:JSON.stringify({fields})});
          if(!createResponse.ok) throw new Error("Staging Firestore media register write failed with HTTP "+createResponse.status+"; verify the project-scoped rules and administrator role.");
          const verifyResponse=await fetch(docUrl,{headers:{Authorization:"Bearer "+admin.idToken}});
          const saved=await verifyResponse.json().catch(()=>({}));
          if(!verifyResponse.ok||saved.fields?.recordOrigin?.stringValue!=="STAGING"||saved.fields?.fileId?.stringValue!==upload.fileId||saved.fields?.storageProvider?.stringValue!=="Google Drive") throw new Error("Staging Firestore media register verification failed with HTTP "+verifyResponse.status+".");
          console.log("STAGING_COMMUNICATION_MEDIA_ARCHIVE_PROVISION=PASS");
          console.log("STAGING_CONTROLLED_PDF_UPLOAD=PASS");
          console.log("STAGING_FIRESTORE_MEDIA_REGISTER=PASS");
          NODE

      - name: Summarize deploy-staging failure
        if: failure()
        env:
          SIGNATURE_LIFECYCLE_OUTCOME: ${{ steps.signature-lifecycle.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## deploy-staging failure"
            echo ""
            if [ "$SIGNATURE_LIFECYCLE_OUTCOME" = "failure" ]; then
              echo "Failing step: Verify signature mirror, signer trail, and document lifecycle approval"
            else
              echo "Failing step: another step in deploy-staging (signature lifecycle step outcome: ${SIGNATURE_LIFECYCLE_OUTCOME:-not-run})"
            fi
            echo ""
            echo ' ```text'
            if [ -f drive-gateway/e2e.log ]; then
              tail -n 40 drive-gateway/e2e.log | perl -pe 's/Bearer\s+[^\s\x22\x27,;]+/Bearer [REDACTED]/ig; s/AIza[0-9A-Za-z_-]{20,}/[REDACTED_API_KEY]/g; s/(password|token|secret)(["=: ]+)[^", ]+/$1$2[REDACTED]/ig'
            else
              echo "drive-gateway/e2e.log was not produced."
            fi
            echo ' ```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run real-runtime staging cryptographic acceptance
        id: staging-runtime-acceptance
        if: always()
        continue-on-error: true
        env:
          STAGING_GATEWAY_URL: ${{ steps.staging_health.outputs.gateway_url }}
          STAGING_FIREBASE_WEB_API_KEY: "AIzaSyA6UmHtP-mRr99rBw57_-qrD4_mFSBnZ38"
          STAGING_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          STAGING_CRYPTO_TEST_EMAIL: ${{ secrets.STAGING_CRYPTO_TEST_EMAIL }}
          STAGING_CRYPTO_TEST_PASSWORD: ${{ secrets.STAGING_CRYPTO_TEST_PASSWORD }}
          STAGING_CRYPTO_TEST_AUTHORITY: ${{ secrets.STAGING_CRYPTO_TEST_AUTHORITY }}
          STAGING_CRYPTO_TEST_SIGNER_UID: ${{ steps.staging_crypto_key.outputs.signer_uid }}
          STAGING_CRYPTO_TEST_KEY_ID: ${{ steps.staging_crypto_key.outputs.key_id }}
        working-directory: drive-gateway
        run: node tests/staging-runtime-acceptance.mjs 2>&1 | tee runtime-acceptance.log

      - name: Final staging acceptance results
        if: always()
        env:
          SIGNATURE_RESULT: ${{ steps.signature-lifecycle.outcome }}
          MEDIA_RESULT: ${{ steps.communication-media.outcome }}
          CRYPTO_RESULT: ${{ steps.staging-runtime-acceptance.outcome }}
        run: |
          set -uo pipefail
          redact() {
            perl -pe 's/Authorization:[^, ]+/Authorization: [REDACTED]/ig; s/Bearer\\s+[^\\s\\x22\\x27,;]+/Bearer [REDACTED]/ig; s/AIza[0-9A-Za-z_-]{20,}/[REDACTED_API_KEY]/g; s/(password|token|secret)(["=: ]+)[^", ]+/$1$2[REDACTED]/ig; s/([A-Za-z0-9_-]{32,})/[REDACTED_TOKEN]/g; s/[\\r\\n\\t]+/ /g'
          }
          row() {
            portal="$1"; check="$2"; outcome="$3"; logfile="$4"
            if [ "$outcome" = "success" ]; then status=PASS; else status=FAIL; fi
            if [ -f "$logfile" ]; then
              error="$(tail -n 30 "$logfile" | redact | grep -Eai 'error|failed|failure|exception|HTTP [45][0-9][0-9]|=FAIL|not authorized' | tail -n 5 | tr '\\n' ' ' | cut -c1-900)"
              excerpt="$(tail -n 30 "$logfile" | redact | tr '\\n' ' ' | cut -c1-1400)"
            else
              error="No log file produced; step outcome=${outcome:-not-run}"
              excerpt="$error"
              status=FAIL
            fi
            [ -n "$error" ] || error="No error text recorded; step outcome=${outcome:-not-run}"
            printf '| %s | %s | %s | %s |\n' "$portal" "$check" "$status" "${error//|/\\|}" >> "$RUNNER_TEMP/acceptance-table.md"
            printf '\\n### %s — %s (%s)\\n\\nLast 30 redacted log lines:\\n\\n`%s`\\n' "$portal" "$check" "$status" "$excerpt" >> "$RUNNER_TEMP/acceptance-logs.md"
            if [ "$status" = "FAIL" ]; then failed=1; fi
          }
          failed=0
          printf '| Portal | Check | Result | Exact error text (redacted) |\\n|---|---|---|---|\\n' > "$RUNNER_TEMP/acceptance-table.md"
          : > "$RUNNER_TEMP/acceptance-logs.md"
          row "E-signature" "Signature lifecycle and signer trail" "${SIGNATURE_RESULT:-not-run}" "drive-gateway/e2e.log"
          row "Communication Media" "Role denial and controlled-PDF upload" "${MEDIA_RESULT:-not-run}" "communication-media.log"
          row "E-signature" "Real-runtime cryptographic acceptance" "${CRYPTO_RESULT:-not-run}" "drive-gateway/runtime-acceptance.log"
          {
            echo "## Staging acceptance results"
            cat "$RUNNER_TEMP/acceptance-table.md"
            cat "$RUNNER_TEMP/acceptance-logs.md"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

# Staging proof execution trigger — 2026-10-04


  deploy-staging-frontend:
    needs: [local-e2e, preflight-staging]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/fix/signature-trail-20261024') || (github.event_name == 'workflow_dispatch' && (inputs.deploy_staging == true || inputs.deploy_staging == 'true') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/member-signature-invitation-email-20261004' || github.ref == 'refs/heads/fix/signature-gateway-cryptographic-bridge-20261015' || github.ref == 'refs/heads/fix/communication-media-archive-drive-oauth' || github.ref == 'refs/heads/fix/signature-trail-20261024'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require isolated staging Firebase identity
        env:
          PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.LIVEKIT_STAGING_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test "$PROJECT" = "irpa-dbg-staging-a73ec"
          node <<'NODE'
          const sa=JSON.parse(process.env.SERVICE_ACCOUNT_JSON||"{}");
          if(sa.project_id!=="irpa-dbg-staging-a73ec"||!sa.client_email||!sa.private_key) {
            throw new Error("Refusing staging Hosting deploy: service account must belong to the isolated staging Firebase project.");
          }
          console.log("STAGING_FIREBASE_IDENTITY_VALID=true");
          NODE
      - name: Deploy approved Firestore rules to isolated staging only
        if: github.ref == 'refs/heads/fix/communication-media-archive-drive-oauth'
        env:
          PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.LIVEKIT_STAGING_FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: "470"
        run: |
          set -euo pipefail
          test "$PROJECT" = "irpa-dbg-staging-a73ec"
          files="$(gh api --paginate -H "Accept: application/vnd.github+json" "/repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          if grep -qx 'firestore.rules' <<< "$files"; then
            labels="$(gh api -H "Accept: application/vnd.github+json" "/repos/$REPO/pulls/$PR_NUMBER" --jq '.labels[].name')"
            if ! grep -Fxq 'firestore-rules-approved' <<< "$labels"; then
              echo "Explicit firestore-rules-approved label missing; refusing staging rules deployment."
              exit 1
            fi
