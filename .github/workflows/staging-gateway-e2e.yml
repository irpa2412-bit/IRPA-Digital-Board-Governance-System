              websiteResponseType:status.connections?.websiteResponseType||null,
              websiteResponseServer:status.connections?.websiteResponseServer||null,
              websiteCloudflareRay:status.connections?.websiteCloudflareRay||null,
              websiteAuthBridgeDiagnostic:status.connections?.websiteAuthBridgeDiagnostic||null,
