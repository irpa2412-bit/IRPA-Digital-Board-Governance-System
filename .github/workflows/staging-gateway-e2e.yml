            const denied=await fetch(base+"/api/communications/cpanel/files?path="+encodeURIComponent("../index.php"),{headers:{Authorization:"Bearer "+token,Accept:"application/json"}});
            if(denied.ok) throw new Error("cPanel traversal/executable path rejection failed.");
