            if(cp.protocol!=="https:"||cp.port!=="2083")throw new Error("ABORT: cPanel endpoint must be HTTPS port 2083.");
            const info=await uapi("DomainInfo/domains_data");
            const root=String(info.data?.data?.main_domain?.documentroot||info.data?.data?.main_domain?.document_root||"").replace(/\/+$/,"");
            if(info.http!==200||info.data?.status!==1||!root.endsWith("/public_html"))throw new Error("ABORT: could not verify the hosting document root.");
            const stage=root+"/staging",home=root.slice(0,-"/public_html".length),configuredRoot=String(process.env.CP_ROOT||"").replace(/\/+$/,"");
            if(configuredRoot!==stage)throw new Error("ABORT: cPanel document root is not the exact staging directory.");
            const config=await readFile(stage,"wp-config.php");
            if(!config.ok||!config.content.startsWith("<?php"))throw new Error("ABORT: staging wp-config.php could not be read.");
            const dbMatch=/define\s*\(\s*['"]DB_NAME['"]\s*,\s*(['"])(.*?)\1\s*\)/s.exec(config.content);
            const stagingDb=String(process.env.STAGING_DB_NAME||"").trim(),productionDb=String(process.env.PRODUCTION_DB_NAME||"").trim();
            if(!dbMatch||!stagingDb||!productionDb||dbMatch[2]!==stagingDb||stagingDb===productionDb)throw new Error("ABORT: staging database isolation is not verified.");
            const current=await readFile(stage+"/wp-content/mu-plugins","irpa-staging-rest-auth.php");
            const backup=await readFile(home,"irpa-staging-rest-auth.php.backup");
            if(!current.ok||current.content.length>10000||!current.content.includes("HTTP_X_IRPA_STAGING_AUTHORIZATION")||!current.content.includes("HTTP_AUTHORIZATION")||!current.content.includes("staging.irpa.or.tz")||current.content.includes("irpa_staging_rest_auth_user")||current.content.includes("hash_equals"))throw new Error("ABORT: staging REST bridge does not match the approved minimal header-forwarding implementation.");
            if(!backup.ok||backup.content.length>10000||!backup.content.includes("irpa_staging_rest_auth_user")||!backup.content.includes("hash_equals"))throw new Error("ABORT: original staging auth-plugin backup is missing or structurally unexpected.");
            console.log("STAGING_REST_AUTH_BRIDGE_VERIFICATION=PASS");
            console.log("STAGING_AUTH_BACKUP=VERIFIED_OUTSIDE_WEB_ROOT");
            console.log("STAGING_DATABASE_ISOLATION=PASS");
          }
          main().catch(e=>{console.error("Staging REST auth bridge verification failed: "+String(e.message||e).replace(/\s+/g," ").slice(0,220));process.exit(1)});
          NODE

      - name: Inject staging-only Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY: ${{ secrets.STAGING_GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
          WP_BASE: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_DRIVE_CLIENT_ID" | npx wrangler secret put GOOGLE_DRIVE_CLIENT_ID --config wrangler.staging.generated.json
          printf '%s' "$GOOGLE_DRIVE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_DRIVE_CLIENT_SECRET --config wrangler.staging.generated.json
          printf '%s' "$GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY" | npx wrangler secret put GOOGLE_DRIVE_TOKEN_ENCRYPTION_KEY --config wrangler.staging.generated.json
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON --config wrangler.staging.generated.json
          printf '%s' "$WP_BASE" | npx wrangler secret put WORDPRESS_BASE_URL --config wrangler.staging.generated.json
          printf '%s' "$CP_BASE" | npx wrangler secret put CPANEL_BASE_URL --config wrangler.staging.generated.json
          printf '%s' "$CP_USER" | npx wrangler secret put CPANEL_USERNAME --config wrangler.staging.generated.json
          printf '%s' "$CP_TOKEN" | npx wrangler secret put CPANEL_API_TOKEN --config wrangler.staging.generated.json

      - name: Install gateway dependencies for bundling
        working-directory: drive-gateway
        run: npm ci --no-audit --no-fund

      - name: Deploy staging Worker only
        id: deploy-staging-worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: drive-gateway
          command: deploy --config wrangler.staging.generated.json

      - name: Prepare isolated staging reviewer identity
        env:
          PROJECT: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT_JSON }}
          TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
        run: |
          set -euo pipefail
          npm --prefix functions install --omit=dev --no-audit --no-fund
          NODE_PATH="$GITHUB_WORKSPACE/functions/node_modules" node <<'NODE'
          const {initializeApp,cert}=require("firebase-admin/app");
          const {getAuth}=require("firebase-admin/auth");
          const {getFirestore}=require("firebase-admin/firestore");
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          if(sa.project_id!==process.env.PROJECT) throw new Error("Staging service account project mismatch.");
          initializeApp({credential:cert(sa),projectId:process.env.PROJECT});
          (async()=>{
            const user=await getAuth().getUserByEmail(process.env.TEST_EMAIL);
            await getFirestore().collection("adminProfiles").doc(user.uid).set({uid:user.uid,email:user.email,role:"Administrator",active:true,updatedAt:new Date().toISOString()},{merge:true});
            console.log("STAGING_REVIEWER_IDENTITY_READY");
          })().catch(e=>{console.error("Unable to prepare isolated staging reviewer identity:",e.message);process.exit(1)});
          NODE

      - name: Verify staging health
        id: staging-health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          subdomain_json="$(curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Accept: application/json" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(node -e 'const a=JSON.parse(process.argv[1]); if(!a.success || !a.result?.subdomain) process.exit(1); process.stdout.write(a.result.subdomain)' "$subdomain_json")"
          test -n "$subdomain"
          url="https://irpa-google-drive-gateway-staging.$subdomain.workers.dev"
          echo "staging_url=$url" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$url/health" | tee staging-health.json
          grep -q '"ok":true' staging-health.json
          grep -q '"environment":"staging"' staging-health.json

      - name: Diagnose cPanel endpoint reachability
        env:
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const dns=require("dns").promises;
          const net=require("net");
          (async()=>{
            const u=new URL(process.env.CP_BASE);
            let addresses=[];
            try { addresses=(await dns.lookup(u.hostname,{all:true})).map(x=>x.address); }
            catch(e) { throw new Error("cPanel DNS lookup failed ("+(e.code||e.name)+") for "+u.hostname+"."); }
            console.log("CPANEL_DNS_RESOLVED="+addresses.length+" address(es)");
            async function probe(address){
              let last={address,result:"not-tested"};
              for(let attempt=1;attempt<=3;attempt++){
                last=await new Promise(resolve=>{
                  const socket=net.connect({host:address,port:Number(u.port||443)});
                  let settled=false;
                  const done=v=>{if(!settled){settled=true;socket.destroy();resolve(v)}};
                  socket.setTimeout(8000,()=>done({address,result:"timeout"}));
                  socket.once("connect",()=>done({address,result:"connected"}));
                  socket.once("error",e=>done({address,result:e.code||e.name||"error"}));
                });
                if(last.result==="connected"||last.result==="ENETUNREACH"||attempt===3)return last;
                await new Promise(resolve=>setTimeout(resolve,attempt*1500));
              }
              return last;
            }
            const result=await Promise.all(addresses.map(probe));
            console.log("CPANEL_TCP_REACHABILITY="+JSON.stringify(result));
            if(!result.some(x=>x.result==="connected")) {
              throw new Error("Runner cannot establish TCP connectivity to the configured cPanel endpoint on port "+(u.port||443)+". Check hosting-provider IP allowlisting, firewall rules, routing, and endpoint availability.");
            }
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Prepare isolated cPanel rollback test file
        env:
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
          CP_ROOT: ${{ secrets.STAGING_CPANEL_DOCUMENT_ROOT }}
          CP_TEST_FILE: ${{ secrets.STAGING_CPANEL_TEST_FILE }}
        run: |
          set -euo pipefail
          node <<'NODE'
          require("node:dns").setDefaultResultOrder("ipv4first");
          async function main(){
            let root=process.env.CP_ROOT.trim().replace(/^\/+|\/+$/g,"");
            const homePrefix="home/"+process.env.CP_USER+"/";
            if(root.startsWith(homePrefix)) root=root.slice(homePrefix.length);
            const parts=process.env.CP_TEST_FILE.split("/");
            const file=parts.pop();
            const dir=root+(parts.length?"/"+parts.join("/"):"");
            const base=new URL(process.env.CP_BASE);
            const auth="cpanel "+process.env.CP_USER+":"+process.env.CP_TOKEN;
            const https=require("node:https");
            async function httpsPost(url,headers,body){
              return await new Promise((resolve,reject)=>{
                const req=https.request({protocol:"https:",hostname:base.hostname,servername:base.hostname,port:Number(base.port||443),family:4,path:url.pathname+url.search,method:"POST",headers,timeout:20000},res=>{
                  const chunks=[];res.on("data",chunk=>chunks.push(Buffer.from(chunk)));
                  res.on("end",()=>resolve({status:res.statusCode,ok:res.statusCode>=200&&res.statusCode<300,headers:res.headers,raw:Buffer.concat(chunks).toString("utf8")}));
                });
                req.on("timeout",()=>req.destroy(Object.assign(new Error("cPanel request timed out"),{code:"ETIMEDOUT"})));
                req.on("error",reject);req.end(body);
              });
            }
            async function request(operation,values){
              const url=new URL("/execute/Fileman/"+operation,base);
              let response;
              let lastError;
              for(let attempt=1;attempt<=3;attempt++){
                try {
                  response=await httpsPost(url,{Authorization:auth,Accept:"application/json","Content-Type":"application/x-www-form-urlencoded"},new URLSearchParams(values).toString());
                  lastError=null;break;
                } catch(error) {
                  lastError=error;
                  const code=error.code||error.cause?.code||error.cause?.name||error.name||"unknown";
                  const transient=["ETIMEDOUT","ECONNRESET","EHOSTUNREACH","UND_ERR_CONNECT_TIMEOUT","TimeoutError"].includes(code);
                  if(!transient||attempt===3) throw new Error("Staging cPanel API connection failed ("+code+") at "+base.hostname+":"+base.port+" after "+attempt+" IPv4 attempt(s).");
                  await new Promise(resolve=>setTimeout(resolve,attempt*2000));
                }
              }
              if(lastError||!response) throw new Error("Staging cPanel API request did not return a response.");
              const raw=response.raw;
              let body=null;
              try { body=JSON.parse(raw); } catch {}
              if(!response.ok||!body) {
                const detail=String(body?.errors?.map?.(x=>x?.message).filter(Boolean).join("; ")||body?.error||body?.message||"").replace(/[\r\n\t]+/g," ").slice(0,220);
                const contentType=response.headers["content-type"]||"unknown";
                const lower=raw.toLowerCase();
                const titleStart=lower.indexOf("<title");
                const titleOpen=titleStart>=0?raw.indexOf(">",titleStart):-1;
                const titleEnd=titleOpen>=0?lower.indexOf("</title>",titleOpen):-1;
                const title=titleOpen>=0&&titleEnd>titleOpen?raw.slice(titleOpen+1,titleEnd).replace(/<[^>]*>/g," ").replace(/[\r\n\t]+/g," ").trim().slice(0,120):"";
                const excerpt=raw.replace(/<[^>]*>/g," ").replace(/&nbsp;/gi," ").replace(/&amp;/gi,"&").replace(/[\r\n\t]+/g," ").replace(/\s+/g," ").trim().slice(0,180);
                const diagnostic=[detail,title?"page title: "+title:"",excerpt?"response excerpt: "+excerpt:""].filter(Boolean).join("; ");
                throw new Error("Staging cPanel test-file preparation failed with HTTP "+response.status+" (content-type: "+contentType+")"+(diagnostic?"; "+diagnostic:"; response body was not valid cPanel JSON")+". Check cPanel API token validity, user association, token privileges, and hosting security rules.");
              }
              if(body.status!==1 && body.errors?.length) {
                const detail=String(body.errors.map(x=>typeof x==="string"?x:(x?.message||x?.error||JSON.stringify(x))).filter(Boolean).join("; ")).replace(/[\\r\\n\\t]+/g," ").slice(0,220);
                if(operation==="get_file_content" && body.status!==1 && body.errors?.length) { console.log("STAGING_CPANEL_TEST_FILE_NOT_READABLE_OR_MISSING; attempting isolated upload"); return body; }
                const meta="status="+String(body.status)+", error_keys="+Object.keys(body).filter(k=>/error|reason|status|message/i.test(k)).join(",");
                throw new Error("cPanel Fileman API rejected the request ("+meta+")"+(detail?": "+detail:"; no readable error detail returned")+".");
              }
              return body;
            }
            const existing=await request("get_file_content",{dir,file});
            if(existing.status===1){
              const content=existing.data?.content??existing.data?.[0]?.content;
              if(typeof content!=="string") throw new Error("Staging cPanel test file exists but is not readable.");
              console.log("STAGING_CPANEL_TEST_FILE_READY");
              return;
            }
            // Fileman::save_file_content updates an existing file on some cPanel builds.
            // Create a missing, dedicated staging test file using the documented multipart upload API.
            const uploadUrl=new URL("/execute/Fileman/upload_files",base);
            const boundary="----IRPAStagingUpload"+Date.now().toString(16);
            const uploadBody=Buffer.concat([
              Buffer.from("--"+boundary+"\r\nContent-Disposition: form-data; name=\"dir\"\r\n\r\n"+dir+"\r\n"),
              Buffer.from("--"+boundary+"\r\nContent-Disposition: form-data; name=\"file-1\"; filename=\""+file+"\"\r\nContent-Type: text/plain; charset=utf-8\r\n\r\n"),
              Buffer.from("IRPA staging cPanel rollback baseline\n"),
              Buffer.from("\r\n--"+boundary+"--\r\n")
            ]);
            let uploadResponse;
            let uploadError;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                uploadResponse=await httpsPost(uploadUrl,{Authorization:auth,Accept:"application/json","Content-Type":"multipart/form-data; boundary="+boundary,"Content-Length":String(uploadBody.length)},uploadBody);
                uploadError=null;break;
              }catch(error){
                uploadError=error;
                const code=error.code||error.cause?.code||error.cause?.name||error.name||"unknown";
                if(!["ETIMEDOUT","ECONNRESET","EHOSTUNREACH","UND_ERR_CONNECT_TIMEOUT","TimeoutError"].includes(code)||attempt===3){
                  throw new Error("Staging cPanel test-file upload failed ("+code+") after "+attempt+" IPv4 attempt(s).");
                }
                await new Promise(resolve=>setTimeout(resolve,attempt*2000));
              }
            }
            if(uploadError||!uploadResponse) throw new Error("Staging cPanel test-file upload returned no response.");
            const uploadRaw=uploadResponse.raw;
            let uploaded=null;
            try{uploaded=JSON.parse(uploadRaw)}catch{}
            if(!uploadResponse.ok||!uploaded||uploaded.status!==1){
              const detail=String(uploaded?.errors?.map?.(x=>typeof x==="string"?x:(x?.message||JSON.stringify(x))).filter(Boolean).join("; ")||uploaded?.messages?.join?.("; ")||"").replace(/[\\r\\n\\t]+/g," ").slice(0,220);
              throw new Error("cPanel Fileman upload_files failed (HTTP "+uploadResponse.status+", status="+String(uploaded?.status)+")"+(detail?": "+detail:"; invalid JSON response")+".");
            }
            console.log("STAGING_CPANEL_TEST_FILE_CREATED");
          }
          main().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Write redacted repair summary
        if: always()
        env:
          PREFLIGHT: ${{ steps.staging-preflight.outcome }}
          DEPLOY: ${{ steps.deploy-staging-worker.outcome }}
          HEALTH: ${{ steps.staging-health.outcome }}
        run: |
          set -euo pipefail
          { echo "# IRPA-DBGS staging repair"; echo ""; echo "- Target: staging.irpa.or.tz"; echo "- Preflight: ${PREFLIGHT:-not-run}"; echo "- WordPress credential source: preconfigured staging Worker secrets"; echo "- Staging Worker deployment: ${DEPLOY:-not-run}"; echo "- Staging health: ${HEALTH:-not-run}"; echo "- Production credentials/site/DNS: not accessed in this run"; echo "- Merge gate: CLOSED"; } | tee staging-repair-summary.md >> "$GITHUB_STEP_SUMMARY"
          cp staging-repair-summary.md staging-repair-diagnostics.txt
          if [ -f staging-wordpress-fatal-diagnostics.txt ]; then cat staging-wordpress-fatal-diagnostics.txt >> staging-repair-diagnostics.txt; fi
      - name: Upload redacted repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-repair-redacted-diagnostics
          path: staging-repair-diagnostics.txt
          if-no-files-found: error

  acceptance-staging:
    needs: repair-staging
    if: needs.repair-staging.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assert staging-only target before acceptance
        id: acceptance-preflight
        env:
          WP_BASE: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          STAGING_URL: ${{ needs.repair-staging.outputs.staging_url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const wp=new URL(process.env.WP_BASE||""),cp=new URL(process.env.CP_BASE||""),worker=new URL(process.env.STAGING_URL||"");
          if(wp.protocol!=="https:"||wp.hostname.toLowerCase()!=="staging.irpa.or.tz") throw new Error("ABORT: WordPress target is not the approved staging host.");
          if(cp.protocol!=="https:"||cp.port!=="2083") throw new Error("ABORT: cPanel target is not HTTPS port 2083.");
          if(worker.protocol!=="https:"||!worker.hostname.startsWith("irpa-google-drive-gateway-staging.")||!worker.hostname.endsWith(".workers.dev")) throw new Error("ABORT: Worker target is not the isolated staging Worker.");
          console.log("STAGING_ACCEPTANCE_TARGETS=PASS");
          NODE
      - name: Verify WordPress and cPanel read-write-rollback integration
        id: acceptance
        env:
          STAGING_URL: ${{ needs.repair-staging.outputs.staging_url }}
          FIREBASE_WEB_API_KEY: ${{ secrets.STAGING_FIREBASE_WEB_API_KEY }}
          TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          WP_BASE: ${{ secrets.STAGING_WORDPRESS_BASE_URL }}
          CP_BASE: ${{ secrets.STAGING_CPANEL_BASE_URL }}
          CP_USER: ${{ secrets.STAGING_CPANEL_USERNAME }}
          CP_TOKEN: ${{ secrets.STAGING_CPANEL_API_TOKEN }}
          CP_ROOT: ${{ secrets.STAGING_CPANEL_DOCUMENT_ROOT }}
          CP_TEST_FILE: ${{ secrets.STAGING_CPANEL_TEST_FILE }}
        run: |
          set -euo pipefail
          ID_TOKEN="$(node <<'NODE'
          const https=require("https");
          const body=JSON.stringify({email:process.env.TEST_EMAIL,password:process.env.TEST_PASSWORD,returnSecureToken:true});
          const req=https.request("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(process.env.FIREBASE_WEB_API_KEY),{method:"POST",headers:{"Content-Type":"application/json","Content-Length":Buffer.byteLength(body)}},res=>{
            let raw="";res.setEncoding("utf8");res.on("data",c=>raw+=c);res.on("end",()=>{let data;try{data=JSON.parse(raw)}catch{console.error("Staging Firebase sign-in returned invalid JSON.");process.exit(1)}if(res.statusCode!==200||!data.idToken){console.error("Staging Firebase sign-in failed with HTTP "+res.statusCode);process.exit(1)}process.stdout.write(data.idToken)});
          });req.on("error",e=>{console.error("Staging Firebase sign-in request failed:",e.message);process.exit(1)});req.end(body);
          NODE
          )"
          export ID_TOKEN
          node <<'NODE'
          const base=process.env.STAGING_URL;
          const token=process.env.ID_TOKEN;
          const marker="IRPA_STAGING_WEBSITE_CHECK_"+Date.now();
          async function call(path,options={}){
            const response=await fetch(base+path,{...options,headers:{Authorization:"Bearer "+token,Accept:"application/json",...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{})},redirect:"manual"});
            const body=await response.json().catch(()=>({}));
            if(response.status>=300&&response.status<400) throw new Error(path+" returned a redirect; no redirect target was requested.");
            if(!response.ok) throw new Error(path+" returned HTTP "+response.status);
            return body;
          }
          async function waitForPublicMarker(url){
            const target=new URL(url);
            if(target.protocol!=="https:"||target.hostname.toLowerCase()!=="staging.irpa.or.tz") throw new Error("ABORT: public-render verification must target staging.irpa.or.tz.");
            for(let i=0;i<6;i++){
              const check=new URL(target.href);
              check.searchParams.set("irpa_staging_check",String(Date.now()));
              const response=await fetch(check.href,{cache:"no-store",redirect:"manual"});
              if(response.status>=300&&response.status<400) throw new Error("ABORT: staging public-render verification encountered a redirect; no redirect target was requested.");
              if(response.ok && (await response.text()).includes(marker)) return true;
              await new Promise(r=>setTimeout(r,1500));
            }
            return false;
          }
          (async()=>{
            const status=await call("/api/communications/site/status");
            console.log("STAGING_CONNECTION_DIAGNOSTIC="+JSON.stringify({
              website:status.connections?.website||"unknown",
              websiteHttpStatus:status.connections?.websiteHttpStatus??null,
              websiteErrorCode:status.connections?.websiteErrorCode||null,
              websiteResponseType:status.connections?.websiteResponseType||null,
              websiteResponseServer:status.connections?.websiteResponseServer||null,
              websiteCloudflareRay:status.connections?.websiteCloudflareRay||null,
              cpanel:status.connections?.cpanel||"unknown"
            }));
            if(status.connections?.website!=="connected"||status.connections?.websiteHttpStatus!==200||status.connections?.cpanel!=="connected") throw new Error("Staging connection acceptance failed with HTTP "+(status.connections?.websiteHttpStatus??"unknown")+".");
            console.log("STAGING_WORDPRESS_USERS_ME_HTTP="+status.connections.websiteHttpStatus);
            const listed=await call("/api/communications/website/content?type=pages&search="+encodeURIComponent("IRPA Staging Integration Check"));
            const candidates=(listed.items||[]).filter(item=>String(item.title||"").startsWith("IRPA Staging Integration Check"));
            if(candidates.length!==1) throw new Error("A single pre-provisioned staging page titled IRPA Staging Integration Check is required.");
            const testPageId=Number(candidates[0].id);
            const before=await call("/api/communications/website/content/pages/"+testPageId);
            const original=before.item;
            if(!original||original.type!=="pages"||!original.title||typeof original.content!=="string") throw new Error("The pre-provisioned staging test page could not be read.");
            console.log("STAGING_WORDPRESS_PAGE_READ_HTTP=200");
            let snapshotId="";
            try{
              const updated=await call("/api/communications/website/content",{method:"PUT",body:JSON.stringify({
                id:testPageId,type:"pages",title:original.title+" "+marker,
                content:original.content+"<p>"+marker+"</p>",excerpt:original.excerpt||"",
                featuredMedia:Number(original.featuredMedia||0),status:"publish"
              })});
              snapshotId=String(updated.snapshotId||"");
              if(!updated.success||!snapshotId||!updated.item?.link||!await waitForPublicMarker(updated.item.link)) throw new Error("The staged edit was not publicly verified or did not return a restorable snapshot.");
              console.log("STAGING_WORDPRESS_PAGE_EDIT_VERIFY_HTTP=200");
              const restored=await call("/api/communications/website/restore",{method:"POST",body:JSON.stringify({type:"pages",id:testPageId,snapshotId})});
              if(!restored.success||!restored.safetySnapshotId) throw new Error("The one-click revision restore failed.");
              snapshotId="";
              const restoredRead=await call("/api/communications/website/content/pages/"+testPageId);
              if(restoredRead.item?.title!==original.title||restoredRead.item?.content!==original.content||
                 restoredRead.item?.excerpt!==original.excerpt||
                 Number(restoredRead.item?.featuredMedia||0)!==Number(original.featuredMedia||0)||
                 restoredRead.item?.status!==original.status) throw new Error("The restored staging page does not exactly match its original allowed fields.");
              console.log("STAGING_WORDPRESS_RESTORE_HTTP=200");
            }finally{
              if(snapshotId){
                await call("/api/communications/website/restore",{method:"POST",body:JSON.stringify({type:"pages",id:testPageId,snapshotId})});
              }
            }
          })().catch(e=>{console.error("Staging website integration acceptance failed:",e.message);process.exit(1)});
          NODE

            const cpanelPath=process.env.CP_TEST_FILE;
            const before=await call("/api/communications/cpanel/files?path="+encodeURIComponent(cpanelPath));
            if(typeof before.content!=="string") throw new Error("The designated staging cPanel test file could not be read.");
            let backupId="";
            try{
              const write=await call("/api/communications/cpanel/files",{method:"PUT",body:JSON.stringify({path:cpanelPath,content:marker})});
              backupId=write.backupId||"";
              if(!backupId) throw new Error("The cPanel write did not return a rollback snapshot.");
              const after=await call("/api/communications/cpanel/files?path="+encodeURIComponent(cpanelPath));
              if(after.content!==marker) throw new Error("The cPanel file content did not match the staged write.");
            }finally{
              if(backupId){
                await call("/api/communications/cpanel/rollback",{method:"POST",body:JSON.stringify({path:cpanelPath,backupId})});
              }else{
                const root=process.env.CP_ROOT.replace(/^\/+|\/+$/g,"");
                const cpFile=cpanelPath.split("/").pop();
                const response=await fetch(new URL("/execute/Fileman/save_file_content",process.env.CP_BASE),{method:"POST",headers:{Authorization:"cpanel "+process.env.CP_USER+":"+process.env.CP_TOKEN,Accept:"application/json","Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({dir:root,file:cpFile,content:before.content,charset:"utf-8"})});
                const result=await response.json().catch(()=>null);
                if(!response.ok||result?.status!==1) throw new Error("Emergency restoration of the staging cPanel test file failed.");
              }
            }
            const restored=await call("/api/communications/cpanel/files?path="+encodeURIComponent(cpanelPath));
            if(restored.content!==before.content) throw new Error("The cPanel rollback did not restore the original content.");
            const denied=await fetch(base+"/api/communications/cpanel/files?path="+encodeURIComponent("../index.php"),{headers:{Authorization:"Bearer "+token,Accept:"application/json"}});
            if(denied.ok) throw new Error("cPanel traversal/executable path rejection failed.");
            console.log("STAGING_WORDPRESS_READ_WRITE_PUBLIC_RENDER_RESTORE_PASS");
            console.log("STAGING_CPANEL_READ_WRITE_ROLLBACK_PATH_REJECTION_PASS");
          })().catch(e=>{console.error("Staging website integration acceptance failed:",e.message);process.exit(1)});
          NODE

      - name: Write redacted acceptance summary
        if: always()
        env:
          PREFLIGHT: ${{ steps.acceptance-preflight.outcome }}
          ACCEPTANCE: ${{ steps.acceptance.outcome }}
        run: |
          set -euo pipefail
          { echo "# IRPA-DBGS staging acceptance"; echo ""; echo "- Target: staging only"; echo "- Target preflight: ${PREFLIGHT:-not-run}"; echo "- Read/write/restore acceptance: ${ACCEPTANCE:-not-run}"; echo "- Production site/DNS/credentials: not accessed in this run"; echo "- Merge gate: CLOSED"; } | tee staging-acceptance-summary.md >> "$GITHUB_STEP_SUMMARY"
          cp staging-acceptance-summary.md staging-acceptance-diagnostics.txt
      - name: Upload redacted acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-acceptance-redacted-diagnostics
          path: staging-acceptance-diagnostics.txt
          if-no-files-found: error

