            const dbMatch=/define\s*\(\s*['"]DB_NAME['"]\s*,\s*(['"])(.*?)\1\s*\)/s.exec(config.content);
            const stagingDb=String(process.env.STAGING_DB_NAME||"").trim(),productionDb=String(process.env.PRODUCTION_DB_NAME||"").trim();
