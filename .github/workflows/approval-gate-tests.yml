name: Approval Gate and Five-Portal Chain Tests

on:
  push:
    branches:
      - integration/five-portal-chain-20261018

permissions:
  contents: read

jobs:
  approval-and-chain-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Run approval gate unit tests
        run: node --test drive-gateway/tests/document-approval.test.mjs
      - name: Install test-only Firebase Admin SDK
        run: npm install --no-save firebase-admin
      - name: Run five-portal chain against Firestore emulator
        env:
          GCLOUD_PROJECT: demo-irpa-staging
        run: |
          if [ -f tests/five-portal-chain.test.mjs ]; then
            npx firebase emulators:exec --project demo-irpa-staging --only firestore "node --test tests/five-portal-chain.test.mjs"
          else
            echo "SKIP: chain test is added only after the approval gate is green (Step 3)."
          fi
