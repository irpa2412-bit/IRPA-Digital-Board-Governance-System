name: Production Browser Smoke Tests

on:
  workflow_run:
    workflows: ["Deploy IRPA Governance Frontend to Cloudflare Workers"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployed frontend commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Rebuild exact frontend commit for asset verification
        env:
          VITE_BUILD_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_DRIVE_GATEWAY_URL: ${{ secrets.VITE_GOOGLE_DRIVE_GATEWAY_URL }}
          VITE_GATEWAY_ORIGIN: ${{ secrets.VITE_GATEWAY_ORIGIN || 'https://irpa-google-drive-gateway.irpa-governance.workers.dev' }}
          VITE_GOOGLE_WEATHER_API_KEY: ${{ secrets.VITE_GOOGLE_WEATHER_API_KEY }}
          VITE_GRANT_CRAWLER_WORKER_URL: https://irpa-grant-crawler-production.irpa-governance.workers.dev
          VITE_GRANT_ASSISTANT_WORKER_URL: https://irpa-dbgs-grant-crawler.irpa-governance.workers.dev
        run: VITE_BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Smoke-test production sites in Chromium
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";

          const urls = [
            "https://irpa-digital-board-governance.web.app/",
            "https://irpa-digital-board-governance-frontend.irpa-governance.workers.dev/"
          ];
          const viewportWidths = [360, 390, 768, 1024, 1366, 1920];
          const browser = await chromium.launch({ headless: true });
          let failed = false;

          try {
            for (const url of urls) {
              const page = await browser.newPage();
              const pageErrors = [];
              page.on("pageerror", error => pageErrors.push(error.message));

              try {
                const response = await page.goto(url, {
                  waitUntil: "domcontentloaded",
                  timeout: 60000
                });
                if (!response || response.status() !== 200) {
                  throw new Error(`Expected HTTP 200; received ${response?.status() ?? "no response"}`);
                }
                await page.waitForFunction(() => {
                  const root = document.querySelector("#root");
                  return Boolean(root && root.children.length > 0);
                }, { timeout: 30000 });
                await page.waitForTimeout(1500);

                const viewportResults = [];
                for (const width of viewportWidths) {
                  await page.setViewportSize({ width, height: 900 });
                  await page.waitForTimeout(150);
                  const audit = await page.evaluate(() => ({
                    viewportWidth: window.innerWidth,
                    documentWidth: document.documentElement.scrollWidth,
                    bodyWidth: document.body.scrollWidth,
                    viewportMeta: document.querySelector('meta[name="viewport"]')?.content ?? null
                  }));
                  viewportResults.push({ requestedWidth: width, ...audit });
                  if (audit.documentWidth > audit.viewportWidth) {
                    failed = true;
                    console.error(JSON.stringify({ url, viewportOverflow: true, ...viewportResults.at(-1) }));
                  }
                  if (!audit.viewportMeta || !audit.viewportMeta.includes("width=device-width")) {
                    failed = true;
                    console.error(JSON.stringify({ url, missingOrInvalidViewportMeta: true, ...viewportResults.at(-1) }));
                  }
                }
                const navigationAudits = [];
                for (const width of [360, 390, 768, 1366]) {
                  await page.setViewportSize({ width, height: 900 });
                  const audit = await page.evaluate(async () => {
                    const root = document.querySelector("#root");
                    const fixture = document.createElement("div");
                    fixture.className = "app-shell";
                    fixture.style.cssText = "display:block;position:relative;width:100%;min-height:1500px;margin:24px 0 0;overflow:visible";
                    const main = document.createElement("section");
                    main.className = "main-area";
                    main.style.cssText = "display:block;position:relative;width:100%;min-height:1500px;margin:0;padding:0;overflow:visible";
                    const roller = document.createElement("div");
                    roller.className = "desktop-webapp-navigation-roller";
                    roller.innerHTML = '<div class="webapp-navigation-live-clock"><strong>Friday</strong><span>16 Oct 2026</span><b>04:00</b><button type="button">24H</button></div><span class="webapp-navigation-roller-kicker">IN-PORTAL NAVIGATION</span><strong>Parent Portal · Finance</strong><select aria-label="Portal test selector"><option>Finance</option></select><span class="webapp-navigation-roller-chevron">⌄</span>';
                    const nav = document.createElement("nav");
                    nav.className = "page-back-next-navigation";
                    nav.setAttribute("aria-label", "Page Back and Next navigation");
                    nav.innerHTML = '<button type="button">Back</button><div class="page-back-next-status"><span>PAGE NAVIGATION</span><strong>Finance</strong><small>2 of 10</small></div><button type="button">Next</button>';
                    const spacer = document.createElement("div");
                    spacer.style.height = "1200px";
                    main.append(roller, nav, spacer);
                    fixture.append(main);
                    root.append(fixture);
                    const frame = () => new Promise(resolve => requestAnimationFrame(() => resolve()));
                    await frame();
                    const styles = getComputedStyle(roller);
                    main.style.setProperty("--irpa-portal-navigation-height", `${Math.ceil(roller.getBoundingClientRect().height + parseFloat(styles.marginBottom || "0"))}px`);
                    fixture.scrollIntoView({ block: "start", behavior: "auto" });
                    await frame(); await frame();
                    const first = {
                      rollerDisplay: getComputedStyle(roller).display,
                      rollerPosition: getComputedStyle(roller).position,
                      navPosition: getComputedStyle(nav).position,
                      rollerTop: roller.getBoundingClientRect().top,
                      navTop: nav.getBoundingClientRect().top,
                      rollerBottom: roller.getBoundingClientRect().bottom,
                      rollerMarginBottom: parseFloat(getComputedStyle(roller).marginBottom || "0")
                    };
                    window.scrollBy(0, 260);
                    await frame(); await frame();
                    const second = {
                      rollerTop: roller.getBoundingClientRect().top,
                      navTop: nav.getBoundingClientRect().top,
                      rollerBottom: roller.getBoundingClientRect().bottom,
                      rollerMarginBottom: parseFloat(getComputedStyle(roller).marginBottom || "0")
                    };
                    fixture.remove();
                    return { first, second };
                  });
                  const close = (a, b) => Math.abs(a - b) <= 3;
                  const ok = audit.first.rollerDisplay !== "none" &&
                    audit.first.rollerPosition === "sticky" &&
                    audit.first.navPosition === "sticky" &&
                    close(audit.first.rollerTop, 0) &&
                    close(audit.first.navTop, audit.first.rollerBottom + audit.first.rollerMarginBottom) &&
                    close(audit.second.rollerTop, 0) &&
                    close(audit.second.navTop, audit.second.rollerBottom + audit.second.rollerMarginBottom);
                  navigationAudits.push({ width, ...audit, passed: ok });
                  if (!ok) {
                    failed = true;
                    console.error(JSON.stringify({ url, stickyNavigationFailure: true, width, audit }));
                  }
                }
                await page.evaluate(() => window.scrollTo(0, 0));
                await page.setViewportSize({ width: 1366, height: 900 });
                const result = await page.evaluate(() => ({
                  title: document.title,
                  rootChildren: document.querySelector("#root")?.children.length ?? 0,
                  textLength: document.querySelector("#root")?.innerText?.trim().length ?? 0,
                  buildVersion: document.querySelector('meta[name="irpa-build-version"]')?.content ?? null
                }));

                if (!result.title.toLowerCase().includes("irpa")) {
                  throw new Error(`Unexpected page title: ${result.title}`);
                }
                if (result.rootChildren < 1 || result.textLength < 1) {
                  throw new Error("React application root did not render visible content.");
                }
                if (pageErrors.length) {
                  throw new Error(`Uncaught browser errors: ${pageErrors.join(" | ")}`);
                }
                console.log(JSON.stringify({ url, status: response.status(), ...result, viewportResults, pageErrors }));
              } catch (error) {
                failed = true;
                console.error(JSON.stringify({ url, error: error.message, pageErrors }));
              } finally {
                await page.close();
              }
            }
          } finally {
            await browser.close();
          }

          if (failed) process.exit(1);
          console.log("Production Chromium smoke tests and six-width viewport audits completed for all configured frontend endpoints.");
          NODE
      - name: Verify Cloudflare signing-path assets and lazy Documents workspace
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import fs from "node:fs";
          import path from "node:path";
          import crypto from "node:crypto";

          const base = "https://irpa-digital-board-governance-frontend.irpa-governance.workers.dev";
          const expectedCommit = process.env.TARGET_SHA;
          const assetsDir = path.resolve("dist/assets");
          const jsAssets = fs.readdirSync(assetsDir).filter(name => name.endsWith(".js")).sort();
          const documentChunk = jsAssets.find(name => name.includes("DocumentLifecycleModule"));
          if (!expectedCommit || !documentChunk) {
            throw new Error("Expected deployed commit or built DocumentLifecycleModule chunk is missing.");
          }

          const localChunk = fs.readFileSync(path.join(assetsDir, documentChunk));
          const localHash = crypto.createHash("sha256").update(localChunk).digest("hex");
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const pageErrors = [];
          page.on("pageerror", error => pageErrors.push(error.message));

          try {
            const response = await page.goto(base + "/", { waitUntil: "domcontentloaded", timeout: 60000 });
            if (!response || response.status() !== 200) {
              throw new Error("Cloudflare frontend did not return HTTP 200.");
            }
            await page.waitForFunction(() => {
              const root = document.querySelector("#root");
              return Boolean(root && root.children.length > 0);
            }, { timeout: 30000 });

            const liveStamp = await page.locator('meta[name="irpa-build-version"]').getAttribute("content");
            if (liveStamp !== expectedCommit) {
              throw new Error("Live Cloudflare build stamp mismatch: expected " + expectedCommit + ", received " + liveStamp);
            }

            const assetResults = await page.evaluate(async names => {
              const results = [];
              for (const name of names) {
                const response = await fetch("/assets/" + encodeURIComponent(name) + "?__irpa_signing_check=" + Date.now());
                const bytes = await response.arrayBuffer();
                const digest = await crypto.subtle.digest("SHA-256", bytes);
                const hash = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, "0")).join("");
                results.push({ name, status: response.status, hash });
              }
              return results;
            }, jsAssets);

            const failedAssets = assetResults.filter(asset => asset.status !== 200);
            if (failedAssets.length) throw new Error("JavaScript assets did not all return HTTP 200: " + JSON.stringify(failedAssets));
            const liveChunk = assetResults.find(asset => asset.name === documentChunk);
            if (!liveChunk || liveChunk.status !== 200 || liveChunk.hash !== localHash) {
              throw new Error("DocumentLifecycleModule SHA-256 mismatch: local=" + localHash + " live=" + (liveChunk?.hash || "missing"));
            }
            console.log(JSON.stringify({
              check: "all-built-JavaScript-assets",
              count: assetResults.length,
              allHttp200: true,
              documentLifecycleModule: documentChunk,
              localSha256: localHash,
              liveSha256: liveChunk.hash,
              hashMatch: true,
              liveBuildStamp: liveStamp
            }));

            const signedOut = await page.evaluate(() => {
              const visible = element => Boolean(element && element.getClientRects().length && getComputedStyle(element).visibility !== "hidden");
              return [...document.querySelectorAll('input[type="email"], input[type="password"], input[autocomplete="username"]')].some(visible);
            });

            if (signedOut) {
              console.log("signed-in signing view not tested");
            } else {
              const documentsButton = page.getByRole("button", { name: /^Documents$/i }).first();
              if (await documentsButton.count()) {
                await documentsButton.click();
              } else {
                const documentsLink = page.getByRole("link", { name: /^Documents$/i }).first();
                if (!(await documentsLink.count())) throw new Error("Signed-in browser has no Documents navigation control.");
                await documentsLink.click();
              }
              await page.getByText("Documents Workspace", { exact: false }).waitFor({ state: "visible", timeout: 30000 });
              const signingTab = page.getByRole("button", { name: "Signing", exact: true }).first();
              if (await signingTab.count()) await signingTab.click();
              const openSigning = page.getByRole("button", { name: "Open Signing Workspace", exact: true }).first();
              if (await openSigning.count()) {
                await openSigning.click();
                await page.getByText("SIGNATURE WORKSPACE", { exact: false }).waitFor({ state: "visible", timeout: 30000 });
                console.log("PASS: signed-in Documents → Signing → Open Signing Workspace rendered.");
              } else {
                console.log("Documents lazy module loaded and Signing tab opened; no pending-signature document was available to open the per-document signing workspace.");
              }
            }

            if (pageErrors.length) throw new Error("Production browser pageErrors: " + pageErrors.join(" | "));
            console.log(JSON.stringify({ pageErrors, signingPathChecked: !signedOut, liveBuildStamp: liveStamp }));
          } finally {
            await browser.close();
          }
          NODE
