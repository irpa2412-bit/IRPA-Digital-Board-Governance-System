name: Deploy IRPA Cloudflare Staging

on:
  push:
    branches:
      - repair/cloudflare-auth-functions-20261004
    paths:
      - "drive-gateway/**"
      - ".github/workflows/cloudflare-staging-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: drive-gateway

    steps:
      - name: Checkout controlled staging branch
        uses: actions/checkout@v4

      - name: Verify isolated staging configuration
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("wrangler.toml", "utf8");
          if (!/\[env\.staging\]/.test(text)) throw new Error("Staging environment is missing.");
          if (!/name = "irpa-google-drive-gateway-staging"/.test(text)) throw new Error("Staging Worker name is incorrect.");
          if (!/\[env\.staging\.vars\][\s\S]*CLOUDFLARE_AUTH_FUNCTIONS_ENABLED = "true"/.test(text)) {
            throw new Error("Staging migration flag must be exactly true.");
          }
          if (!/\[env\.staging\.vars\][\s\S]*DRIVE_MOCK = "true"/.test(text)) {
            throw new Error("Staging must use DRIVE_MOCK=true for this controlled runtime verification.");
          }
          if (!/\[env\.staging\.kv_namespaces\][\s\S]*binding = "DRIVE_KV"/.test(text)) {
            throw new Error("Staging DRIVE_KV binding is missing.");
          }
          if (!/\[\[env\.staging\.durable_objects\.bindings\]\][\s\S]*name = "ESIGN_DO"[\s\S]*class_name = "EsignRecordDurableObject"/.test(text)) {
            throw new Error("Staging ESIGN_DO binding is missing or incorrect.");
          }
          if (!/\[\[env\.staging\.migrations\]\][\s\S]*tag = "esign-do-staging-v1"/.test(text)) {
            throw new Error("Staging Durable Object migration is missing or incorrect.");
          }
          const top = text.split("[env.staging]")[0];
          if (!/CLOUDFLARE_AUTH_FUNCTIONS_ENABLED = "false"/.test(top)) {
            throw new Error("Production/top-level migration flag must remain false.");
          }
          NODE

      - name: Install gateway dependencies
        run: npm ci

      - name: Validate staging deployment configuration
        run: npx wrangler deploy --env staging --dry-run

      - name: Deploy isolated staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: drive-gateway
          command: deploy --env staging

      - name: Verify staging Worker bindings and flag
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          response="$(curl --fail --silent --show-error             -H "Authorization: Bearer $CF_API_TOKEN"             -H "Accept: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/irpa-google-drive-gateway-staging/settings")"
          node - "$response" <<'NODE'
          const response = JSON.parse(process.argv[2]);
          if (response.success !== true) throw new Error("Cloudflare rejected the staging Worker settings request.");
          const bindings = Array.isArray(response.result?.bindings) ? response.result.bindings : [];
          const auth = bindings.find(b => b.name === "CLOUDFLARE_AUTH_FUNCTIONS_ENABLED");
          if (!auth || auth.type !== "plain_text" || auth.text !== "true") {
            throw new Error("Staging Worker migration flag is not exactly true.");
          }
          const driveKv = bindings.find(b => b.name === "DRIVE_KV");
          if (!driveKv || driveKv.type !== "kv_namespace" || !driveKv.namespace_id) {
            throw new Error("Staging DRIVE_KV binding is missing.");
          }
          const esign = bindings.find(b => b.name === "ESIGN_DO");
          if (!esign || esign.type !== "durable_object_namespace" || esign.class_name !== "EsignRecordDurableObject") {
            throw new Error("Staging ESIGN_DO binding is missing or incorrect.");
          }
          const prodFlag = bindings.find(b => b.name === "CLOUDFLARE_AUTH_FUNCTIONS_ENABLED" && b.script_name === "irpa-google-drive-gateway");
          if (prodFlag?.text === "true") throw new Error("Safety stop: production Worker flag appears enabled.");
          console.log("Staging Worker has isolated DRIVE_KV/ESIGN_DO bindings and auth migration flag=true.");
          NODE

      - name: Verify staging health
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 8 --retry-delay 2             https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev/health)"
          echo "$body"
          echo "$body" | grep -q '"ok":true'

      - name: Verify migrated auth runtime
        run: |
          set -euo pipefail
          base="https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev"
          email="staging-runtime-$(date +%s)-$RANDOM@example.com"

          state="$(curl --fail --silent --show-error             -H "Content-Type: application/json"             -d "{\"email\":\"$email\"}"             "$base/api/auth/password-attempt-state")"
          echo "$state"
          echo "$state" | grep -q '"status":"FIRST"'

          for expected in 2 1; do
            failure="$(curl --fail --silent --show-error               -H "Content-Type: application/json"               -d "{\"email\":\"$email\"}"               "$base/api/auth/password-failure")"
            echo "$failure"
            echo "$failure" | grep -q "\"remainingAttempts\":$expected"
          done

          locked="$(curl --fail --silent --show-error             -H "Content-Type: application/json"             -d "{\"email\":\"$email\"}"             "$base/api/auth/password-failure")"
          echo "$locked"
          echo "$locked" | grep -q '"status":"LOCKED"'

          cleared="$(curl --fail --silent --show-error             -H "Content-Type: application/json"             -d "{\"email\":\"$email\"}"             "$base/api/auth/password-attempt-clear")"
          echo "$cleared"
          echo "$cleared" | grep -q '"ok":true'

          reset="$(curl --fail --silent --show-error             -H "Content-Type: application/json"             -d "{\"email\":\"$email\"}"             "$base/api/auth/password-attempt-state")"
          echo "$reset"
          echo "$reset" | grep -q '"status":"FIRST"'

      - name: Verify document-reference authentication gate and CORS
        run: |
          set -euo pipefail
          base="https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev"

          unauth="$(curl --silent --show-error -o /tmp/ref.json -w "%{http_code}"             -H "Content-Type: application/json"             -d "{}"             "$base/api/documents/next-reference")"
          cat /tmp/ref.json
          test "$unauth" = "401"

          cors="$(curl --silent --show-error -D - -o /dev/null             -X OPTIONS             -H "Origin: https://irpa-digital-board-governance.web.app"             "$base/api/sign/open")"
          echo "$cors" | grep -i '^access-control-allow-headers:' | grep -qi 'x-signing-token'

          echo "Staging runtime verification passed."
