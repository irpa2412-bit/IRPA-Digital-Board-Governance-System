name: LiveKit Production Worker Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/livekit-production/**"
      - "tests/livekit-production-worker.test.mjs"
      - "wrangler.livekit-production.jsonc"
      - "src/components/IRPADGBSMeetingRoomMedia.jsx"
      - "src/firebase/meetingRecords.js"
      - "firestore.rules"
      - "scripts/check-meeting-media-governance.mjs"
      - ".github/workflows/livekit-production-worker-ci.yml"
  push:
    branches: [release/livekit-production-recording-20261014]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-production-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify production token and recording worker
        run: node --test tests/livekit-production-worker.test.mjs
      - name: Verify meeting media governance contracts
        run: npm run check:meeting-media
      - name: Verify readability policy
        run: npm run check:production-readability
      - name: Build frontend
        run: npm run build
      - name: Validate deployment configuration syntax
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("wrangler.livekit-production.jsonc","utf8"))'
          bash -n infra/livekit/deploy-staging.sh infra/livekit/preflight.sh

  production-secret-preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/livekit-production-recording-20261014'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check production release configuration without revealing secret values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVEKIT_PRODUCTION_URL: ${{ secrets.LIVEKIT_PRODUCTION_URL }}
          LIVEKIT_PRODUCTION_API_KEY: ${{ secrets.LIVEKIT_PRODUCTION_API_KEY }}
          LIVEKIT_PRODUCTION_API_SECRET: ${{ secrets.LIVEKIT_PRODUCTION_API_SECRET }}
          LIVEKIT_PRODUCTION_RECORDING_BUCKET: ${{ secrets.LIVEKIT_PRODUCTION_RECORDING_BUCKET }}
          LIVEKIT_PRODUCTION_RECORDING_GCP_CREDENTIALS_JSON: ${{ secrets.LIVEKIT_PRODUCTION_RECORDING_GCP_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LIVEKIT_PRODUCTION_URL LIVEKIT_PRODUCTION_API_KEY LIVEKIT_PRODUCTION_API_SECRET LIVEKIT_PRODUCTION_RECORDING_BUCKET LIVEKIT_PRODUCTION_RECORDING_GCP_CREDENTIALS_JSON; do
            if [ -n "${!name:-}" ]; then
              echo "$name: configured"
            else
              echo "::notice title=Production configuration::$name is not configured yet"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "Production worker credentials are present; live deployment can proceed after review and merge."
          else
            echo "Production deployment will remain gated until all required credentials and recording storage are configured."
          fi
