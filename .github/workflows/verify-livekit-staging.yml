name: Verify IRPA LiveKit Staging Control Plane

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install server SDK
        run: npm --prefix functions install --omit=dev
      - name: Verify secure endpoint and API credentials
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_STAGING_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_STAGING_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_STAGING_API_SECRET }}
        run: |
          set -euo pipefail
          for name in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing GitHub Actions secret ${name}"; exit 1; fi
          done
          node functions/scripts/verify-livekit-control-plane.js
