name: Diagnose DocumentLifecycleModule asset hashes

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/document-lifecycle-hash-diagnostic.yml"

permissions:
  contents: read

jobs:
  compare-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact release commit into build one
        uses: actions/checkout@v4
        with:
          ref: 17bba848
          path: build-one
      - name: Checkout exact release commit into build two
        uses: actions/checkout@v4
        with:
          ref: 17bba848
          path: build-two
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read deployed build timestamp
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 -H 'Cache-Control: no-cache' \
            "https://irpa-digital-board-governance-frontend.irpa-governance.workers.dev/?__irpa_hash_diagnostic=$(date +%s)" \
            -o "$RUNNER_TEMP/live-index.html"
          node -e 'const h=require("fs").readFileSync(process.argv[1],"utf8");const m=h.match(/<meta name="irpa-build-time" content="([^"]+)"/i);if(!m)process.exit(2);process.stdout.write(m[1]);' "$RUNNER_TEMP/live-index.html" >> "$GITHUB_ENV"
      - name: Build two clean copies with identical release inputs
        env:
          VITE_BUILD_COMMIT: 17bba848
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_DRIVE_GATEWAY_URL: ${{ secrets.VITE_GOOGLE_DRIVE_GATEWAY_URL }}
          VITE_GATEWAY_ORIGIN: ${{ secrets.VITE_GATEWAY_ORIGIN || 'https://irpa-google-drive-gateway.irpa-governance.workers.dev' }}
          VITE_GOOGLE_WEATHER_API_KEY: ${{ secrets.VITE_GOOGLE_WEATHER_API_KEY }}
          VITE_GRANT_CRAWLER_WORKER_URL: https://irpa-grant-crawler-production.irpa-governance.workers.dev
          VITE_GRANT_ASSISTANT_WORKER_URL: https://irpa-dbgs-grant-crawler.irpa-governance.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          (cd build-one && npm ci && npm run build)
          (cd build-two && npm ci && npm run build)
      - name: Download live assets and compare SHA-256, sizes, headers and text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic-output
          find build-one/dist/assets -type f -name '*DocumentLifecycleModule*.js' -print -quit | xargs -r -I{} cp "{}" diagnostic-output/build-one.js
          find build-two/dist/assets -type f -name '*DocumentLifecycleModule*.js' -print -quit | xargs -r -I{} cp "{}" diagnostic-output/build-two.js
          test -s diagnostic-output/build-one.js
          test -s diagnostic-output/build-two.js
          asset="$(basename "$(find build-one/dist/assets -type f -name '*DocumentLifecycleModule*.js' -print -quit)")"
          for host in cloudflare firebase; do
            if [ "$host" = cloudflare ]; then base='https://irpa-digital-board-governance-frontend.irpa-governance.workers.dev'; else base='https://irpa-digital-board-governance.web.app'; fi
            url="$base/assets/$asset?__irpa_hash_diagnostic=$(date +%s%N)"
            curl --fail --silent --show-error --retry 3 -D "diagnostic-output/$host.headers" "$url" -o "diagnostic-output/$host.js"
            for header in cache-control age etag date; do
              grep -i "^$header:" "diagnostic-output/$host.headers" | tail -1 || true
            done
          done
          printf '\n%-12s %-64s %12s\n' 'SOURCE' 'SHA-256' 'SIZE_BYTES'
          for f in diagnostic-output/build-one.js diagnostic-output/build-two.js diagnostic-output/cloudflare.js diagnostic-output/firebase.js; do
            sha="$(sha256sum "$f" | awk '{print $1}')"; size="$(wc -c < "$f" | tr -d ' ')"
            printf '%-12s %-64s %12s\n' "$(basename "$f" .js)" "$sha" "$size"
          done | tee diagnostic-output/hash-table.txt
          printf '\n--- BUILD 1 vs BUILD 2 ---\n'
          diff -u -U 3 diagnostic-output/build-one.js diagnostic-output/build-two.js > diagnostic-output/build-diff.txt || true
          cat diagnostic-output/build-diff.txt
          for host in cloudflare firebase; do
            printf '\n--- BUILD 1 vs %s ---\n' "$host"
            diff -u -U 3 diagnostic-output/build-one.js "diagnostic-output/$host.js" > "diagnostic-output/build-one-vs-$host.diff" || true
            cat "diagnostic-output/build-one-vs-$host.diff"
          done
          printf '\n--- RESPONSE HEADERS ---\n'
          for host in cloudflare firebase; do echo "[$host]"; grep -i -E '^(HTTP/|cache-control:|age:|etag:|date:)' "diagnostic-output/$host.headers" || true; done
          cp diagnostic-output/build-one.js diagnostic-output/build-one-asset.js
          cp diagnostic-output/build-two.js diagnostic-output/build-two-asset.js
      - name: Upload both builds and both live assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-lifecycle-hash-diagnostic
          path: |
            build-one/dist/
            build-two/dist/
            diagnostic-output/
          if-no-files-found: warn
          retention-days: 14
