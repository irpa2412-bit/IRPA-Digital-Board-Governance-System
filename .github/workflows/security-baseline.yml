name: IRPA Security Baseline Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify security baseline
        run: node scripts/security-baseline-check.js
      - name: Verify Functions syntax
        run: node --check functions/index.js
      - name: Install dependencies
        run: npm install
      - name: Verify web build
        run: npm run build
      - name: Run Firestore security rules regression tests
        run: npx firebase emulators:exec --only firestore "node tests/firestore.rules.test.cjs"
