name: IRPA Security Baseline Gate

on:
  push:
    branches: [main, integration/five-portal-chain-20261018]
  pull_request:
    branches: [main]

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify security baseline
        run: node scripts/security-baseline-check.js
      - name: Verify Functions syntax
        run: node --check functions/index.js
      - name: Install dependencies
        run: npm install
      - name: Verify web build
        run: npm run build
      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run Firestore security rules regression tests
        run: npx firebase emulators:exec --only firestore "node tests/firestore.rules.test.cjs && node --test --test-concurrency=1 tests/meeting-category-policy.test.mjs tests/meeting-category-firestore-rules.test.cjs tests/finance-portal-policy.test.cjs && npm run test:security-rules && npm run test:finance-policy && npm run test:meeting-category"
