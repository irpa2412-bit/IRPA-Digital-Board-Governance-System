name: IRPA Security Baseline Gate

permissions:
  actions: read
  contents: read
  issues: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify security baseline
        run: node scripts/security-baseline-check.js
      - name: Enforce protected portal repair policy with live run verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/portal-protection-check.mjs
      - name: Test protected portal policy scenarios
        run: node --test tests/portal-protection-policy.test.mjs
      - name: Verify Functions syntax
        run: node --check functions/index.js
      - name: Install dependencies
        run: npm install
      - name: Verify web build
        run: npm run build
      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase Admin SDK for emulator-only startup fixture
        run: npm --prefix functions install --omit=dev
      - name: Install Playwright browser for startup smoke
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Run startup smoke and 500-document self-test stress test
        run: |
          node --test tests/signature-self-test-safety.test.mjs
          npx firebase emulators:exec --config firebase.emulator.test.json --only auth,firestore --project demo-irpa-dgbs "node scripts/seed-authenticated-browser-fixture.cjs && npx playwright test --config=playwright.authenticated-governance.config.mjs tests/browser/startup-smoke.spec.mjs --workers=1"
      - name: Run Firestore security rules regression tests
        run: npx firebase emulators:exec --only firestore "node tests/firestore.rules.test.cjs && node --test --test-concurrency=1 tests/meeting-category-policy.test.mjs tests/meeting-category-firestore-rules.test.cjs tests/finance-portal-policy.test.cjs"
