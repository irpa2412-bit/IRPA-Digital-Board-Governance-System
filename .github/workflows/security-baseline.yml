name: IRPA Security Baseline Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify security baseline
        run: node scripts/security-baseline-check.js
      - name: Verify Functions syntax
        run: node --check functions/index.js
      - name: Verify web build
        run: |
          npm install
          npm run build
