name: IRPA Security Baseline Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify security baseline
        run: node scripts/security-baseline-check.js
      - name: Verify Functions index syntax
        run: node --check functions/index.js
      - name: Verify Live Meeting syntax
        run: node --check functions/liveMeeting.js
      - name: Verify MFA audit syntax
        run: node --check functions/mfaSecurityAudit.js
      - name: Verify grant deadline function syntax
        run: node --check functions/grantReportingDeadlines.js
      - name: Verify Drive gateway syntax
        run: node --check drive-gateway/src/index.js
      - name: Install dependencies
        run: npm install
      - name: Verify web build
        run: npm run build
      - name: Verify meeting and Drive gateway security invariants
        run: node scripts/subsystem-security-check.js
      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run Firestore security rules regression tests
        run: npx firebase emulators:exec --only firestore "node tests/firestore.rules.test.cjs"