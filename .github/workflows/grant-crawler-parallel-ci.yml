name: Grant Crawler Parallel CI

on:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/grant-crawler-parallel/**"
      - ".github/workflows/grant-crawler-production.yml"
      - ".github/workflows/grant-crawler-parallel-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/grant-crawler-parallel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Worker syntax, isolation and regression tests
        run: npm run check
      - name: Syntax-check branch diagnostic runner
        run: node --check ../../scripts/grant-intelligence-diagnostics.mjs
      - name: Verify environment-specific Firebase token audiences
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const worker = fs.readFileSync('src/index.js', 'utf8');
          const config = fs.readFileSync('wrangler.toml', 'utf8');
          if (!worker.includes('env.FIREBASE_PROJECT_ID || FIREBASE_PROJECT_ID')) throw new Error('Worker does not validate Firebase tokens against environment configuration.');
          if (!config.includes('FIREBASE_PROJECT_ID = "irpa-dbg-staging-a73ec"')) throw new Error('Staging Firebase project audience is missing.');
          if (!config.includes('FIREBASE_PROJECT_ID = "irpa-digital-board-governance"')) throw new Error('Production Firebase project audience is missing.');
          console.log('Environment-specific Firebase token audiences are configured.');
          NODE
      - name: Validate production Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --config wrangler.toml --dry-run --env production
      - name: Verify production smoke test reports fallback as degraded operation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const workflow = fs.readFileSync('../../.github/workflows/grant-crawler-production.yml', 'utf8');
          for (const marker of [
            "draft_source === 'deterministic_fallback'",
            "requires_human_completion !== true",
            "Workers AI daily quota is exhausted"
          ]) {
            if (!workflow.includes(marker)) throw new Error('Production smoke workflow is missing fallback safety assertion: ' + marker);
          }
          console.log('Production smoke workflow distinguishes AI-generated drafts from human-review fallback scaffolds.');
          NODE
