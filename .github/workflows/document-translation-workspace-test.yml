name: Document Translation Workspace Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/components/DocumentTranslationWorkspace.jsx"
      - "src/firebase/documentTranslation.js"
      - "src/pages/DocumentLifecycleModule.jsx"
      - "live-interpreter/**"
      - "firestore.rules"
      - ".github/workflows/document-translation-workspace-test.yml"
  push:
    branches: [main]
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/components/DocumentTranslationWorkspace.jsx"
      - "src/firebase/documentTranslation.js"
      - "src/pages/DocumentLifecycleModule.jsx"
      - "live-interpreter/**"
      - "firestore.rules"
      - ".github/workflows/document-translation-workspace-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-translation-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Check interpreter syntax
        run: |
          node --check live-interpreter/src/index.js
          node --check live-interpreter/src/maaDictionary.js
          node --check src/firebase/documentTranslation.js
      - name: Test provisional Maa dictionary behavior
        run: node --test live-interpreter/tests/*.test.mjs
      - name: Build production frontend
        env:
        VITE_IRPA_ENV: staging
        VITE_FIREBASE_API_KEY: "AIzaSyA6UmHtP-mRr99rBw57_-qrD4_mFSBnZ38"
        VITE_FIREBASE_AUTH_DOMAIN: "irpa-dbg-staging-a73ec.firebaseapp.com"
        VITE_FIREBASE_PROJECT_ID: "irpa-dbg-staging-a73ec"
        VITE_FIREBASE_MESSAGING_SENDER_ID: "1018976634858"
        VITE_FIREBASE_APP_ID: "1:1018976634858:web:e73e9e09f55a76ade25493"
        VITE_FIREBASE_MEASUREMENT_ID: ""
        run: npm run build
