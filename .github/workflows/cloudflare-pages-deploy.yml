name: Deploy IRPA Governance to Cloudflare Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "drive-gateway/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: irpa-cloudflare-pages-production
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production application
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_DRIVE_GATEWAY_URL: ${{ secrets.VITE_GOOGLE_DRIVE_GATEWAY_URL }}
          VITE_GATEWAY_ORIGIN: ${{ secrets.VITE_GATEWAY_ORIGIN || 'https://irpa-google-drive-gateway.irpa-governance.workers.dev' }}
          VITE_GOOGLE_WEATHER_API_KEY: ${{ secrets.VITE_GOOGLE_WEATHER_API_KEY }}
        run: npm run build
      - name: Verify build output
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -qi '<html' dist/index.html
          test -d dist/assets
          echo "Production bundle exists; Firebase Auth and Firestore configuration remains unchanged."
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Accept: application/json" \
            https://api.cloudflare.com/client/v4/user/tokens/verify > "$RUNNER_TEMP/cf-token.json"
          node -e 'const x=require(process.argv[1]); if(!x.success) process.exit(1);' "$RUNNER_TEMP/cf-token.json"
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: irpa-digital-board-governance
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" > "$RUNNER_TEMP/pages-projects.json"
          if node -e 'const x=require(process.argv[1]); process.exit(x.success && (x.result||[]).some(p=>p.name===process.argv[2]) ? 0 : 1)' "$RUNNER_TEMP/pages-projects.json" "$CF_PAGES_PROJECT"; then
            echo "Existing Cloudflare Pages project found."
          else
            echo "Creating the isolated Cloudflare Pages project; no DNS or Firebase resources will be changed."
            npx --yes wrangler pages project create "$CF_PAGES_PROJECT" --production-branch main
          fi
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages deploy dist --project-name irpa-digital-board-governance --branch main --commit-hash "$GITHUB_SHA" --commit-message "IRPA-DBGS production build $GITHUB_SHA"
      - name: Verify Cloudflare Pages production endpoint
        run: |
          set -euo pipefail
          url="https://irpa-digital-board-governance.pages.dev"
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 30 "$url/" -o "$RUNNER_TEMP/cloudflare-live.html"
          grep -qi '<html' "$RUNNER_TEMP/cloudflare-live.html"
          echo "Cloudflare Pages production endpoint serves HTML successfully."
      - name: Publish migration boundary
        run: |
          echo "Cloudflare Pages hosts the frontend. Firebase Authentication and Firestore remain the authoritative identity/data services during this safe migration."
          echo "No DNS cutover, Firebase data deletion, or Firebase Auth-domain change is performed by this workflow."
