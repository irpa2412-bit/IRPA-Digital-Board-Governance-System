name: Read-only member profile role audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: member-profile-role-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase Admin SDK
        working-directory: functions
        run: npm install --omit=dev --ignore-scripts

      - name: Read member profiles and calculate counts only
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          EXPECTED_PROJECT_ID: irpa-digital-board-governance
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE is unavailable to this GitHub Actions run."
            exit 1
          fi
          cd functions
          node <<'NODE'
          const fs = require("node:fs");
          const { initializeApp, cert } = require("firebase-admin/app");
          const { getFirestore } = require("firebase-admin/firestore");

          (async () => {
            const raw = process.env.FIREBASE_SERVICE_ACCOUNT;
            const sa = JSON.parse(raw);
            if (sa.project_id !== process.env.EXPECTED_PROJECT_ID) {
              throw new Error("Firebase service-account project mismatch.");
            }
            initializeApp({ credential: cert(sa), projectId: process.env.EXPECTED_PROJECT_ID });
            const snapshot = await getFirestore().collection("members").get();

            let profilesWithRoleEntries = 0;
            for (const doc of snapshot.docs) {
              const profile = doc.data() || {};
              const entries = ["roles", "assignedRoles", "selectedRoles"].flatMap(key =>
                Array.isArray(profile[key]) ? profile[key].filter(value => typeof value === "string" && value.trim()) : []
              );
              if (entries.length) profilesWithRoleEntries++;
            }

            // A legitimate grant is stored separately in authorizationGrants and
            // role permissions in authorizationRolePermissions. This run is
            // deliberately restricted to the members collection, so that count
            // cannot be truthfully evaluated without violating the read scope.
            const report = {
              profiles_scanned: snapshot.size,
              profiles_with_role_entries: profilesWithRoleEntries,
              profiles_with_role_entries_lacking_legitimate_grant: profilesWithRoleEntries === 0 ? 0 : null
            };
            fs.mkdirSync("../reports", { recursive: true });
            fs.writeFileSync("../reports/member-profile-role-audit.json", JSON.stringify(report, null, 2) + "\n", { mode: 0o644 });
            console.log(JSON.stringify(report));
          })().catch(error => {
            console.error("READ_ONLY_MEMBER_PROFILE_AUDIT_FAILED:", error.code || "UNCLASSIFIED_ERROR");
            process.exit(1);
          });
          NODE

      - name: Commit counts-only report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/member-profile-role-audit.json
          git commit -m "chore(security): record counts-only member role audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
