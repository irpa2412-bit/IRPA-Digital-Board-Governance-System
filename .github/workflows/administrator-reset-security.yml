name: Administrator Registration Reset Security

on:
  pull_request:
    paths:
      - "drive-gateway/src/adminRegistrationReset.mjs"
      - "drive-gateway/src/index.js"
      - "drive-gateway/tests/admin-registration-reset.test.mjs"
      - "drive-gateway/wrangler.toml"
      - "drive-gateway/ADMIN-REGISTRATION-RESET.md"
      - "functions/systemControl.js"
      - ".github/workflows/administrator-reset-security.yml"
  push:
    branches: [main]
    paths:
      - "drive-gateway/src/adminRegistrationReset.mjs"
      - "drive-gateway/src/index.js"
      - "drive-gateway/tests/admin-registration-reset.test.mjs"
      - "drive-gateway/wrangler.toml"
      - "drive-gateway/ADMIN-REGISTRATION-RESET.md"
      - "functions/systemControl.js"
      - ".github/workflows/administrator-reset-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-admin-reset-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: drive-gateway/package-lock.json
      - name: Install Cloudflare Worker dependencies
        run: npm ci --prefix drive-gateway --no-audit --no-fund
      - name: Test administrator recovery authorization, scope, idempotency and audit integrity
        run: node --test drive-gateway/tests/admin-registration-reset.test.mjs
      - name: Ensure retired Firebase reset module has no defineSecret binding
        shell: bash
        run: |
          ! grep -q 'defineSecret' functions/systemControl.js
          ! grep -q 'exports.resetAdministratorRegistration' functions/systemControl.js
