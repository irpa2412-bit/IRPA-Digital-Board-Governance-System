name: Administrator Registration Reset Security

on:
  pull_request:
    paths:
      - "functions/systemControl.js"
      - "functions/adminRegistrationResetPolicy.cjs"
      - "functions/adminRegistrationResetService.js"
      - "functions/adminRegistrationReset.policy.test.cjs"
      - "functions/adminRegistrationReset.emulator.test.cjs"
      - ".github/workflows/administrator-reset-security.yml"
  push:
    branches: [main]
    paths:
      - "functions/systemControl.js"
      - "functions/adminRegistrationResetPolicy.cjs"
      - "functions/adminRegistrationResetService.js"
      - "functions/adminRegistrationReset.policy.test.cjs"
      - "functions/adminRegistrationReset.emulator.test.cjs"
      - ".github/workflows/administrator-reset-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-reset-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --prefix functions --no-audit --no-fund
      - name: Verify authorization policy
        run: node --test functions/adminRegistrationReset.policy.test.cjs
      - name: Verify isolated Firestore reset, preservation, idempotency, and audit integrity
        run: npx firebase emulators:exec --project demo-irpa-admin-reset-isolated --only firestore "node --test functions/adminRegistrationReset.emulator.test.cjs"
