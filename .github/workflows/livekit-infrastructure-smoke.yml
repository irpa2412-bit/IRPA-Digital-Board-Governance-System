name: LiveKit Infrastructure Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches: [integration/collective-portals-20261009, main]
    paths:
      - "functions/scripts/check-livekit-infrastructure.mjs"
      - ".github/workflows/livekit-infrastructure-smoke.yml"

permissions:
  contents: read

jobs:
  static-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check functions/scripts/check-livekit-infrastructure.mjs

  endpoint-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Validate LiveKit endpoint and server credentials
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: node functions/scripts/check-livekit-infrastructure.mjs
