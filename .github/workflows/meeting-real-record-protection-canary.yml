name: Live Meeting REAL Record Protection Verification

on:
  workflow_run:
    workflows:
      - "Deploy IRPA Gateway to Cloudflare Production"
      - "Deploy IRPA Governance Frontend to Cloudflare Workers"
      - "Deploy IRPA Governance to Firebase"
    branches: [main]
    types: [completed]
  schedule:
    - cron: "17 3 * * *"
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - ".github/workflows/meeting-real-record-protection-canary.yml"
      - "scripts/live-meeting-real-readonly.cjs"
      - "scripts/live-meeting-real-canary.cjs"
      - "scripts/canary-comment-authorized.cjs"
      - "tests/canary-comment-trigger.test.cjs"
  workflow_dispatch:
    inputs:
      CANARY:
        description: "READ_ONLY only, or type RUN CANARY after the owner separately authorizes the canary in chat"
        required: true
        type: choice
        options:
          - READ_ONLY
          - RUN CANARY
        default: READ_ONLY

permissions:
  contents: read

concurrency:
  group: irpa-live-meeting-real-record-protection-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate canary scripts without production credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check verification scripts and run owner-comment trigger tests
        run: |
          node --check scripts/live-meeting-real-readonly.cjs
          node --check scripts/live-meeting-real-canary.cjs
          node --check scripts/canary-comment-authorized.cjs
          node --test tests/canary-comment-trigger.test.cjs

  live-read-only:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.CANARY == 'READ_ONLY' || inputs.CANARY == 'RUN CANARY'))
    name: Read-only production version and rules inspection
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    outputs:
      canary_credential_available: ${{ steps.inspect.outputs.canary_credential_available }}
    steps:
      - name: Checkout full history for build ancestry verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install existing Firebase Admin SDK dependency
        run: npm --prefix functions install --omit=dev --no-audit --no-fund

      - name: Syntax-check live verification scripts
        run: |
          node --check scripts/live-meeting-real-readonly.cjs
          node --check scripts/live-meeting-real-canary.cjs

      - name: Read live Worker versions, web build stamp and Firestore Rules release
        id: inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          FIREBASE_WEB_API_KEY: "AIzaSyC2aMdxHD14nMnGiRyf4mSL1ixXdzBoOtE"
          GATEWAY_URL: "https://irpa-google-drive-gateway.irpa-governance.workers.dev"
          FRONTEND_URL: "https://irpa-digital-board-governance-frontend.irpa-governance.workers.dev"
          WEB_URL: "https://irpa-digital-board-governance.web.app"
        run: NODE_PATH="$GITHUB_WORKSPACE/functions/node_modules" node scripts/live-meeting-real-readonly.cjs

  canary:
    name: One-record REAL meeting protection canary
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.CANARY == 'RUN CANARY') ||
      (github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.number == 876 && github.event.issue.pull_request == null && github.event.comment.user.id == 319164319 && github.event.comment.user.login == 'irpa2412-bit')
    concurrency:
      group: irpa-live-meeting-real-protection-canary
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout production revision
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install existing Firebase Admin SDK dependency
        run: npm --prefix functions install --omit=dev --no-audit --no-fund

      - name: Authorize owner comment or exact manual input without shell interpolation
        id: authorize
        env:
          CANARY_MANUAL_INPUT: ${{ inputs.CANARY }}
        run: node scripts/canary-comment-authorized.cjs

      - name: Fresh read-only production preflight
        id: preflight
        if: steps.authorize.outputs.authorized == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          FIREBASE_WEB_API_KEY: "AIzaSyC2aMdxHD14nMnGiRyf4mSL1ixXdzBoOtE"
          GATEWAY_URL: "https://irpa-google-drive-gateway.irpa-governance.workers.dev"
          FRONTEND_URL: "https://irpa-digital-board-governance-frontend.irpa-governance.workers.dev"
          WEB_URL: "https://irpa-digital-board-governance.web.app"
        run: NODE_PATH="$GITHUB_WORKSPACE/functions/node_modules" node scripts/live-meeting-real-readonly.cjs

      - name: Syntax-check canary script
        if: steps.authorize.outputs.authorized == 'true' && steps.preflight.outputs.canary_credential_available == 'true'
        run: node --check scripts/live-meeting-real-canary.cjs

      - name: Create one missing-environment canary and test REAL protections
        id: canary
        if: steps.authorize.outputs.authorized == 'true' && steps.preflight.outputs.canary_credential_available == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          FIREBASE_WEB_API_KEY: "AIzaSyC2aMdxHD14nMnGiRyf4mSL1ixXdzBoOtE"
          GATEWAY_URL: "https://irpa-google-drive-gateway.irpa-governance.workers.dev"
          WEB_ORIGIN: "https://irpa-digital-board-governance.web.app"
        run: NODE_PATH="$GITHUB_WORKSPACE/functions/node_modules" node scripts/live-meeting-real-canary.cjs

      - name: Preserve canary failure evidence; never use the pre-#845 Gateway version
        if: failure()
        run: |
          echo "CANARY_FAILED_OR_PREFLIGHT_FAILED"
          echo "Gateway dd4637ea-0804-4b85-a455-1e691f1f0d72 is pre-#845, unsafe, do not roll back to it."
          echo "Do not claim live protection; fail-closed delete/purge route remediation and approved deployment are required."
