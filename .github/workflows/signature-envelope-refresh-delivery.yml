name: Signature Envelope Refresh and Delivery Regression

on:
  push:
    branches:
      - fix/signature-envelope-refresh-delivery-20261118
  pull_request:
    paths:
      - "src/pages/SignaturePlatform.jsx"
      - "src/styles/signature-portal.css"
      - "drive-gateway/**"
      - "tests/signature-workflow-policy.test.mjs"
      - ".github/workflows/signature-envelope-refresh-delivery.yml"

permissions:
  contents: read

concurrency:
  group: signature-envelope-refresh-delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signature-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Gateway dependencies
        run: npm ci --prefix drive-gateway --no-audit --no-fund
      - name: Run complete Gateway regression suite
        run: npm test --prefix drive-gateway
      - name: Run Signature Portal workflow and refresh contracts
        run: node --test tests/signature-workflow-policy.test.mjs
      - name: Build web application
        run: npm run build
