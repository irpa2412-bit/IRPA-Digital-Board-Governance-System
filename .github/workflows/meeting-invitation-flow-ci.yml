name: Meeting Invitation Flow CI
# Build and entry-policy verification only; this workflow never deploys.
# Verification-only regression workflow; no production deployment is performed.

on:
  push:
    branches:
      - feat/secure-meeting-invitation-flow-20261013
      - integration/five-portal-chain-20261018
      - stage/1-invitation
    paths:
      - "src/styles/portal-readability-standard.css"
      - ".github/workflows/meeting-invitation-flow-ci.yml"
      - "functions/meetingEntryPolicy.js"
      - "functions/meetingEntryPolicy.test.cjs"
      - "functions/meetingGateway.js"
      - "src/components/MeetingAccessControl.jsx"
      - "src/pages/MeetingEntryGateway.jsx"
      - "src/pages/MeetingRoom.jsx"
      - "src/pages/Meetings.jsx"
      - "src/pages/OperationalGatewaysParticipants.jsx"
      - "package.json"
      - "package-lock.json"
      - "drive-gateway/src/index.js"
      - "drive-gateway/src/meetingPortal.mjs"
      - "drive-gateway/tests/meeting-portal.test.mjs"
      - "src/firebase/meetingGatewayApi.js"
      - "drive-gateway/src/invitationEmail.mjs"
      - "drive-gateway/src/invitationRedemption.mjs"
      - "drive-gateway/tests/mail-invitation.unit.mjs"
      - "drive-gateway/tests/invitation-redemption.test.mjs"
      - "functions/meetingGateway.emulator.test.cjs"
      - "tests/meeting-invitation-resend-quorum.test.mjs"
  pull_request:
    branches:
      - main
      - integration/five-portal-chain-20261018
    paths:
      - "src/styles/portal-readability-standard.css"
      - ".github/workflows/meeting-invitation-flow-ci.yml"
      - "functions/meetingEntryPolicy.js"
      - "functions/meetingEntryPolicy.test.cjs"
      - "functions/meetingGateway.js"
      - "src/components/MeetingAccessControl.jsx"
      - "src/pages/MeetingEntryGateway.jsx"
      - "src/pages/MeetingRoom.jsx"
      - "src/pages/Meetings.jsx"
      - "src/pages/OperationalGatewaysParticipants.jsx"
      - "package.json"
      - "package-lock.json"
      - "drive-gateway/src/index.js"
      - "drive-gateway/src/meetingPortal.mjs"
      - "drive-gateway/tests/meeting-portal.test.mjs"
      - "src/firebase/meetingGatewayApi.js"
      - "drive-gateway/src/invitationEmail.mjs"
      - "drive-gateway/src/invitationRedemption.mjs"
      - "drive-gateway/tests/mail-invitation.unit.mjs"
      - "drive-gateway/tests/invitation-redemption.test.mjs"
      - "functions/meetingGateway.emulator.test.cjs"
      - "tests/meeting-invitation-resend-quorum.test.mjs"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-meeting-invitation-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Cloudflare gateway dependencies
        run: npm --prefix drive-gateway ci
      - name: Test Cloudflare gateway and meeting access routes
        run: npm --prefix drive-gateway test
      - name: Test meeting entry policy
        run: npm run test:meeting-entry-policy
      - name: Test failed invitation resend and quorum exclusion
        run: npm run test:meeting-invitation-resend
      - name: Build web application
        env:
          VITE_IRPA_ENV: staging
          VITE_FIREBASE_API_KEY: "fixture-staging-api-key"
          VITE_FIREBASE_AUTH_DOMAIN: "irpa-dbg-staging-a73ec.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "irpa-dbg-staging-a73ec"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "fixture-staging-sender"
          VITE_FIREBASE_APP_ID: "fixture-staging-app"
          VITE_FIREBASE_MEASUREMENT_ID: "G-STAGING-FIXTURE"
        run: npm run build
