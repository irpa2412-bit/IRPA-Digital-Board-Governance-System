name: Deploy IRPA Gateway to Cloudflare Production (No Secret Sync)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-gateway
  cancel-in-progress: false

env:
  TARGET_SHA: ad9f57ebcd23a7209e73db20bcb50f845e254be5

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact merged signature-portal commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Assert checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$TARGET_SHA"
          echo "Checked out exact approved target commit: $actual"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drive-gateway/package-lock.json

      - name: Verify production gateway configuration
        shell: bash
        run: |
          set -euo pipefail
          config=drive-gateway/wrangler.toml
          test -f "$config"
          default_config="$(awk '/^\[env\./ { exit } { print }' "$config")"
          grep -q '^name = "irpa-google-drive-gateway"$' <<< "$default_config"
          grep -q '^keep_vars = true$' <<< "$default_config"
          grep -q '^FIREBASE_PROJECT_ID = "irpa-digital-board-governance"$' <<< "$default_config"
          grep -q '^IRPA_WORKER_NAME = "irpa-google-drive-gateway"$' <<< "$default_config"
          grep -q '^IRPA_WORKER_ENVIRONMENT = "production"$' <<< "$default_config"
          grep -q '^DRIVE_MOCK = "false"$' <<< "$default_config"
          grep -q '^LOCAL_TEST_MODE = "false"$' <<< "$default_config"
          ! grep -Eq '^FIREBASE_SERVICE_ACCOUNT_JSON[[:space:]]*=' <<< "$default_config"
          ! grep -Eq '^IRPA_ENVIRONMENT[[:space:]]*=[[:space:]]*"staging"$' <<< "$default_config"
          ! grep -q '^FIREBASE_PROJECT_ID = "irpa-dbg-staging-a73ec"$' <<< "$default_config"
          default_kv_id="$(awk '
            /^\[\[kv_namespaces\]\]/ { in_kv=1; next }
            /^\[/ { in_kv=0 }
            in_kv && /^id[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*"/, "")
              sub(/".*$/, "")
              print
              exit
            }
          ' <<< "$default_config")"
          test "$default_kv_id" = "ccdbffa662ac48bfbdf7f4b1f62ca941"
          test "$default_kv_id" != "5ea76010553049a2b98c8493c37fbbc4"
          echo "Production Worker configuration verified."

      - name: Install Gateway dependencies
        working-directory: drive-gateway
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee /tmp/irpa-install.log

      - name: Run Gateway test gate on exact target commit
        working-directory: drive-gateway
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/irpa-tests.log

      - name: Verify Cloudflare credentials without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" >/tmp/token.json
          node -e 'const x=require("/tmp/token.json"); if(!x.success) process.exit(1);'
          echo "Cloudflare token verification passed; credential values were not printed."

      - name: Deploy exact target commit to production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_SHA: ${{ env.TARGET_SHA }}
        working-directory: drive-gateway
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying exact approved commit $GIT_SHA to the production Worker."
          npx wrangler deploy --config wrangler.toml --name irpa-google-drive-gateway --var "GIT_SHA:$GIT_SHA" 2>&1 | tee /tmp/irpa-deploy.log

      - name: Verify live production health reports exact target commit
        env:
          GIT_SHA: ${{ env.TARGET_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://irpa-google-drive-gateway.irpa-governance.workers.dev/health"
          deadline=$((SECONDS + 180))
          attempt=0
          last_status="not checked"
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            last_status="$(curl --silent --show-error --max-time 10 --output /tmp/health.json --write-out '%{http_code}' "$url" 2>/dev/null || true)"
            if [[ "$last_status" == "200" ]] && node -e '
              const fs = require("node:fs");
              try {
                const health = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
                if (health.ok === true && health.environment !== "staging" && health.commit === process.env.GIT_SHA) process.exit(0);
              } catch {}
              process.exit(1);
            '; then
              echo "PASS: live production health is HTTP 200 and reports exact commit $GIT_SHA (attempt $attempt)."
              exit 0
            fi
            echo "Health check attempt $attempt not ready (HTTP $last_status); retrying."
            sleep 5
          done
          echo "FAIL: production health did not confirm exact commit $GIT_SHA; last HTTP status: $last_status"
          if [[ -f /tmp/health.json ]]; then
            node -e 'try { const h=require("/tmp/health.json"); console.log(JSON.stringify({ok:h.ok,environment:h.environment,commit:h.commit})); } catch {}'
          fi
          exit 1

      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          for item in "dependency installation:/tmp/irpa-install.log" "Gateway tests:/tmp/irpa-tests.log" "Worker deployment:/tmp/irpa-deploy.log"; do
            label="${item%%:*}"
            file="${item#*:}"
            if [[ -f "$file" ]]; then
              echo "OUTPUT: $label (last 30 lines)"
              tail -30 "$file"
            fi
          done
          if [[ -f /tmp/health.json ]]; then
            echo "HEALTH SUMMARY (selected fields only)"
            node -e 'try { const h=require("/tmp/health.json"); console.log(JSON.stringify({ok:h.ok,environment:h.environment,commit:h.commit})); } catch {}'
          fi
