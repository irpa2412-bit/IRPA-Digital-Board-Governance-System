name: Deploy IRPA Gateway to Cloudflare Production (No Secret Sync)

on:
  push:
    branches:
      - main
    paths:
      - 'drive-gateway/**'
      - '.github/workflows/cloudflare-production-gateway-no-secret-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Assert checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Checked out triggering commit: $actual"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drive-gateway/package-lock.json

      - name: Verify production gateway configuration
        shell: bash
        run: |
          set -euo pipefail
          config=drive-gateway/wrangler.toml
          test -f "$config"
          default_config="$(awk '/^\[env\./ { exit } { print }' "$config")"
          grep -q '^name = "irpa-google-drive-gateway"$' <<< "$default_config"
          grep -q '^keep_vars = true$' <<< "$default_config"
          grep -q '^FIREBASE_PROJECT_ID = "irpa-digital-board-governance"$' <<< "$default_config"
          grep -q '^IRPA_WORKER_NAME = "irpa-google-drive-gateway"$' <<< "$default_config"
          grep -q '^IRPA_WORKER_ENVIRONMENT = "production"$' <<< "$default_config"
          grep -q '^DRIVE_MOCK = "false"$' <<< "$default_config"
          grep -q '^LOCAL_TEST_MODE = "false"$' <<< "$default_config"
          ! grep -Eq '^IRPA_ENVIRONMENT[[:space:]]*=[[:space:]]*"staging"$' <<< "$default_config"
          ! grep -q '^FIREBASE_PROJECT_ID = "irpa-dbg-staging-a73ec"$' <<< "$default_config"
          default_kv_id="$(awk '
            /^\[\[kv_namespaces\]\]/ { in_kv=1; next }
            /^\[/ { in_kv=0 }
            in_kv && /^id[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*"/, "")
              sub(/".*$/, "")
              print
              exit
            }
          ' <<< "$default_config")"
          test "$default_kv_id" = "ccdbffa662ac48bfbdf7f4b1f62ca941"
          test "$default_kv_id" != "5ea76010553049a2b98c8493c37fbbc4"
          echo "Production Worker configuration verified."

      - name: Install Gateway dependencies
        working-directory: drive-gateway
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee /tmp/irpa-install.log

      - name: Run Gateway test gate on exact target commit
        working-directory: drive-gateway
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee /tmp/irpa-tests.log

      - name: Verify Cloudflare credentials without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" >/tmp/token.json
          node -e 'const x=require("/tmp/token.json"); if(!x.success) process.exit(1);'
          echo "Cloudflare token verification passed; credential values were not printed."

      - name: Capture previous production Worker version and health
        id: previous
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/irpa-google-drive-gateway/deployments"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url" >/tmp/previous-deployments.json
          health_status="$(curl --silent --show-error --max-time 10 --output /tmp/previous-health.json --write-out '%{http_code}' https://irpa-google-drive-gateway.irpa-governance.workers.dev/health)"
          test "$health_status" = "200"
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data=JSON.parse(fs.readFileSync("/tmp/previous-deployments.json","utf8"));
          const health=JSON.parse(fs.readFileSync("/tmp/previous-health.json","utf8"));
          const deployment=data.result?.deployments?.[0];
          const versions=deployment?.versions||[];
          const previous=versions.slice().sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0];
          if(!data.success||!previous?.version_id||!health.ok||health.environment==="staging"||!health.commit) throw new Error("PREVIOUS_WORKER_VERSION_NOT_VERIFIED");
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`version_id=${previous.version_id}\ncommit=${health.commit}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`### Production Worker before deployment\n- Version ID: ${previous.version_id}\n- Commit: ${health.commit}\n`);
          console.log(JSON.stringify({previousVersionId:previous.version_id,previousCommit:health.commit}));
          NODE

      - name: Deploy exact target commit to production Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_SHA: ${{ github.sha }}
        working-directory: drive-gateway
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying triggering commit $GIT_SHA to the production Worker."
          npx wrangler deploy --config wrangler.toml --name irpa-google-drive-gateway --var "GIT_SHA:$GIT_SHA" 2>&1 | tee /tmp/irpa-deploy.log

      - name: Verify live production health reports exact target commit
        id: health
        env:
          GIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://irpa-google-drive-gateway.irpa-governance.workers.dev/health"
          deadline=$((SECONDS + 180))
          attempt=0
          last_status="not checked"
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            last_status="$(curl --silent --show-error --max-time 10 --output /tmp/health.json --write-out '%{http_code}' "$url" 2>/dev/null || true)"
            if [[ "$last_status" == "200" ]] && node -e '
              const fs = require("node:fs");
              try {
                const health = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
                if (health.ok === true && health.environment !== "staging" && health.commit === process.env.GIT_SHA) process.exit(0);
              } catch {}
              process.exit(1);
            '; then
              echo "PASS: live production health is HTTP 200 and reports exact commit $GIT_SHA (attempt $attempt)."
              exit 0
            fi
            echo "Health check attempt $attempt not ready (HTTP $last_status); retrying."
            sleep 5
          done
          echo "FAIL: production health did not confirm triggering commit $GIT_SHA; last HTTP status: $last_status"
          if [[ -f /tmp/health.json ]]; then
            node -e 'try { const h=require("/tmp/health.json"); console.log(JSON.stringify({ok:h.ok,environment:h.environment,commit:h.commit})); } catch {}'
          fi
          exit 1

      - name: Record deployed production Worker version
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/irpa-google-drive-gateway/deployments"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url" >/tmp/current-deployments.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data=JSON.parse(fs.readFileSync("/tmp/current-deployments.json","utf8"));
          const deployment=data.result?.deployments?.[0];
          const version=deployment?.versions?.slice().sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0]?.version_id;
          if(!data.success||!version)throw new Error("DEPLOYED_WORKER_VERSION_NOT_FOUND");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`### Production Worker after deployment\n- Version ID: ${version}\n- Commit: ${process.env.GIT_SHA}\n`);
          console.log(JSON.stringify({deployedVersionId:version,commit:process.env.GIT_SHA}));
          NODE

      - name: Roll back production Worker if post-deploy health fails
        if: failure() && steps.previous.outputs.version_id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_VERSION_ID: ${{ steps.previous.outputs.version_id }}
          PREVIOUS_COMMIT: ${{ steps.previous.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/irpa-google-drive-gateway/deployments"
          payload="$(node -e 'process.stdout.write(JSON.stringify({strategy:"percentage",versions:[{version_id:process.env.PREVIOUS_VERSION_ID,percentage:100}],annotations:{"workers/message":"Automatic rollback after failed production health check"}}))')"
          curl --fail --silent --show-error -X POST "$url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "$payload" >/tmp/rollback.json
          node -e 'const x=require("/tmp/rollback.json");if(!x.success)process.exit(1);const v=x.result?.versions?.[0]?.version_id;if(v!==process.env.PREVIOUS_VERSION_ID)process.exit(1);console.log(JSON.stringify({rollbackVersionId:v,rollbackDeploymentId:x.result?.id}));'
          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            status="$(curl --silent --show-error --max-time 10 --output /tmp/rollback-health.json --write-out '%{http_code}' https://irpa-google-drive-gateway.irpa-governance.workers.dev/health 2>/dev/null || true)"
            if [[ "$status" == "200" ]] && node -e 'const h=require("/tmp/rollback-health.json");if(h.ok&&h.commit===process.env.PREVIOUS_COMMIT)process.exit(0);process.exit(1);'; then
              echo "PASS: Worker rollback restored previous commit $PREVIOUS_COMMIT."
              exit 0
            fi
            sleep 5
          done
          echo "FAIL: Worker rollback did not restore previous health commit."
          exit 1

      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          set +e
          for item in "dependency installation:/tmp/irpa-install.log" "Gateway tests:/tmp/irpa-tests.log" "Worker deployment:/tmp/irpa-deploy.log"; do
            label="${item%%:*}"
            file="${item#*:}"
            if [[ -f "$file" ]]; then
              echo "OUTPUT: $label (last 30 lines)"
              tail -30 "$file"
            fi
          done
          if [[ -f /tmp/health.json ]]; then
            echo "HEALTH SUMMARY (selected fields only)"
            node -e 'try { const h=require("/tmp/health.json"); console.log(JSON.stringify({ok:h.ok,environment:h.environment,commit:h.commit})); } catch {}'
          fi
