name: Build IRPA Android APK
on:
  pull_request:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "public/**"
      - "tests/offline-build-workflow-policy.test.mjs"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "public/**"
      - "tests/offline-build-workflow-policy.test.mjs"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-8.14.3-v1
      - name: Verify build workflow isolation policy
        run: node --test tests/offline-build-workflow-policy.test.mjs
      - name: Install locked root application and Capacitor dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web assets for the bundled Android application
        run: npm run build
      - name: Create and synchronize native Android wrapper
        run: npx cap add android && npx cap sync android
      - name: Verify Gradle wrapper with bounded retry
        working-directory: android
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --version --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 10))
              echo "Gradle wrapper bootstrap failed on attempt $attempt; retrying in $delay seconds."
              sleep "$delay"
            fi
          done
          echo "Gradle wrapper bootstrap failed after 3 attempts."
          exit 1
      - name: Build debug APK only (no deployment or publishing)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: IRPA-DBGS-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
