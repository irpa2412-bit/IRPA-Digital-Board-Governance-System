name: Deploy IRPA Live AI Interpreter
on:
  push:
    branches: [main]
    paths:
      - "live-interpreter/**"
      - "src/pages/MeetingRoom.jsx"
      - "src/firebase/liveInterpreter.js"
      - ".github/workflows/cloudflare-interpreter-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: irpa-live-interpreter-production
  cancel-in-progress: false
jobs:
  deploy-interpreter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: live-interpreter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify > "$RUNNER_TEMP/cf-token.json"
          node -e 'const x=require(process.argv[1]);if(!x.success)process.exit(1)' "$RUNNER_TEMP/cf-token.json"
      - name: Deploy AI interpreter Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy --config wrangler.jsonc
      - name: Verify live interpreter health endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 3 --max-time 30 https://irpa-live-interpreter.irpa-governance.workers.dev/health > "$RUNNER_TEMP/interpreter-health.json"
          cat "$RUNNER_TEMP/interpreter-health.json"
          grep -q '"ok":true' "$RUNNER_TEMP/interpreter-health.json"
          grep -q '"provider":"Cloudflare Workers AI"' "$RUNNER_TEMP/interpreter-health.json"
