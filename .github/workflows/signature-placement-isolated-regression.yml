name: Isolated Signature Placement Regression

on:
  push:
    branches: ["fix/signature-placement-isolated-multisigner-20261118"]
    paths:
      - "src/**"
      - "drive-gateway/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/signature-placement-isolated-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "drive-gateway/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/signature-placement-isolated-regression.yml"

permissions:
  contents: read

jobs:
  signature-placement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Install Gateway dependencies
        working-directory: drive-gateway
        run: npm ci --no-audit --no-fund
      - name: Run complete repository test suite
        run: npx firebase emulators:exec --only firestore --project demo-irpa-signature "npm run test:all"
      - name: Run coordinate and multi-signer regression suite
        run: npm run test:signature-coordinate-system
      - name: Run complete Gateway test suite
        working-directory: drive-gateway
        run: npm test
      - name: Build production application
        run: npm run build
      - name: Install Chromium for browser regression
        run: npx playwright install --with-deps chromium
      - name: Run browser placement regression
        run: npm run test:signature-coordinate-browser