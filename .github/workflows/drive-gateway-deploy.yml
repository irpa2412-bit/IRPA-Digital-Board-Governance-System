name: Deploy IRPA Drive Gateway

on:
  push:
    branches: [main, invitation-only-signer]
    paths:
      - "drive-gateway/**"
      - ".github/workflows/drive-gateway-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drive-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: drive-gateway/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
