name: Court envelope owner verification v2 (read only)

on:
  push:
    branches:
      - incident/owner-access-20261126
    paths-ignore:
      - docs/incident/results-20261126.md
      - docs/signature-recovery/owner-access-backup-manifest.json
      - .github/workflows/court-owner-access-backup.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: court-owner-verification-v2
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Court candidate through production Gateway as the personal owner
        env:
          GH_TOKEN: ${{ github.token }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          OWNER_UID: UQxfLOXCl7bEQ7KNM6Tt4eKoJlg1
          GATEWAY_URL: https://irpa-google-drive-gateway.irpa-governance.workers.dev
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-pdfs
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          const repo=process.env.GITHUB_REPOSITORY,uid=process.env.OWNER_UID,base=process.env.GATEWAY_URL;
          const candidateId="IRPA-ENV-2026-54530056";
          const excluded=new Set(["IRPA-ENV-2026-11501354","ENV-4b06e60941f8eb1d"]);
          const out={status:"PENDING",ownerUid:uid,candidateId,routes:[],pdfs:[]};
          const callRaw=(path,options={})=>fetch(base+path,options);
          const prResponse=await fetch(`https://api.github.com/repos/${repo}/pulls/987`,{headers:{Authorization:"Bearer "+process.env.GH_TOKEN,Accept:"application/vnd.github+json"}});
          if(!prResponse.ok)throw new Error("FIX_PR_LOOKUP_FAILED");
          const pr=await prResponse.json();
          if(!pr.merged){
            out.status="WAITING_FOR_FIX_PR_MERGE";
            out.routes.push({route:"deployment-gate",status:409,code:"FIX_PR_NOT_MERGED"});
          }else{
            const expected=pr.merge_commit_sha,deadline=Date.now()+180000;
            let health={httpStatus:0,commit:null};
            while(Date.now()<deadline){
              const r=await callRaw("/health"),h=await r.json().catch(()=>({}));
              health={httpStatus:r.status,commit:h.commit||h.version||null};
              if(r.status===200&&health.commit===expected)break;
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            out.workerBefore=health;
            if(health.httpStatus!==200||health.commit!==expected){
              out.status="WORKER_DEPLOY_NOT_CONFIRMED";
              out.routes.push({route:"deployment-gate",status:health.httpStatus,code:"WORKER_COMMIT_MISMATCH"});
            }else{
              const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||"{}");
              if(sa.project_id!=="irpa-digital-board-governance"||!sa.client_email||!sa.private_key)throw new Error("SERVICE_ACCOUNT_CONFIG_INVALID");
              const html=fs.readFileSync("public/administrator.html","utf8");
              const apiKey=html.match(/apiKey\s*:\s*["']([^"']+)["']/)?.[1];
              if(!apiKey)throw new Error("FIREBASE_API_KEY_NOT_FOUND");
              const now=Math.floor(Date.now()/1000),b64=x=>Buffer.from(JSON.stringify(x)).toString("base64url");
              const unsigned=b64({alg:"RS256",typ:"JWT"})+"."+b64({iss:sa.client_email,sub:sa.client_email,aud:"https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit",iat:now,exp:now+3600,uid});
              const custom=unsigned+"."+crypto.sign("RSA-SHA256",Buffer.from(unsigned),sa.private_key).toString("base64url");
              const login=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key="+encodeURIComponent(apiKey),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:custom,returnSecureToken:true})});
              const auth=await login.json().catch(()=>({}));
              if(!login.ok||!auth.idToken)throw new Error("OWNER_AUTH_EXCHANGE_FAILED");
              const headers={Authorization:"Bearer "+auth.idToken};
              const call=async(label,path,method="GET")=>{
                const r=await callRaw(path,{method,headers});
                const type=r.headers.get("content-type")||"";
                if(type.includes("application/pdf")){
                  const bytes=new Uint8Array(await r.arrayBuffer()),sha=crypto.createHash("sha256").update(bytes).digest("hex");
                  const file=label.replace(/[^a-z0-9-]/gi,"-")+".pdf";
                  fs.writeFileSync("verification-pdfs/"+file,bytes);
                  const item={route:label,status:r.status,code:null,sha256:sha,bytes:bytes.length,file};
                  out.routes.push(item);out.pdfs.push(item);return {item,body:null};
                }
                const body=await r.json().catch(()=>({}));
                const item={route:label,status:r.status,code:body.code||body.errorCode||null,requestId:body.requestId||null,
                  auditChainStatus:body.auditChain?.status||null,auditChainCode:body.auditChain?.code||null,
                  sourceHashStatus:body.sourceHashStatus||null,sourceHashCode:body.sourceHashCode||null,sourceHash:body.sourceHash||null,
                  summary:body.summary||null,total:body.total??null};
                out.routes.push(item);return {item,body};
              };
              const list=await call("my-envelope-list","/api/signature-workflow/list");
              const items=Array.isArray(list.body?.envelopes)?list.body.envelopes:[];
              const candidate=items.find(e=>String(e.id||e.envelopeId||"")===candidateId);
              out.listResult={returned:items.length,candidateFound:Boolean(candidate)};
              if(candidate){
                out.candidate={collection:candidate.collection||null,envelopeId:candidate.id||candidate.envelopeId,documentId:candidate.documentId||null,title:candidate.title||candidate.documentTitle||null,
                  environment:candidate.dataEnvironment||candidate.environment||candidate.recordOrigin||null,status:candidate.status||null,
                  createdAt:candidate.createdAt||null,ownerUid:candidate.ownerUid||candidate.createdByUid||candidate.createdBy||null,
                  senderUid:candidate.senderUid||null,ownerEmail:candidate.ownerEmail||candidate.senderEmail||null};
                const id=encodeURIComponent(candidateId);
                let recoveryOffset=0,recoveryTotal=0,recoveryPages=0,recoveryItems=[];
                do {
                  const recovery=await call(`recovery-envelope-list-page-${recoveryPages+1}`,`/api/recovery/envelopes?limit=100&offset=${recoveryOffset}&diagnostic=1`);
                  recoveryItems.push(...(recovery.body?.items||[]));
                  recoveryTotal=Number(recovery.body?.total||0);
                  recoveryOffset+=100;
                  recoveryPages+=1;
                } while(recoveryOffset<recoveryTotal&&recoveryPages<50);
                out.recoveryQueueCandidateFound=recoveryItems.some(e=>String(e.envelopeId||e.id||"")===candidateId);
                out.recoveryQueueTotal=recoveryTotal;
                out.recoveryQueuePages=recoveryPages;
                await call("court-evidence","/api/recovery/envelopes/"+id+"/evidence?diagnostic=1");
                await call("emergency-retrieval","/api/recovery/envelopes/"+id+"/emergency-retrieval","POST");
                await call("completed-copy","/api/recovery/envelopes/"+id+"/completed-copy.pdf");
                out.status="VERIFICATION_COMPLETED";
              }else{
                out.status="CANDIDATE_NOT_IN_OWNER_LIST";
                out.routes.push({route:"court-candidate-owner-list",status:404,code:"CANDIDATE_NOT_LISTED"});
              }
              out.workerAfter=health;
            }
          }
          fs.writeFileSync("verification-results.json",JSON.stringify(out,null,2));
          const lines=["# Court owner-access Gateway verification — 2026-11-26","",`- Status: ${out.status}`,`- Personal login UID: ${uid}`,`- Candidate envelope: ${candidateId}`,
            `- Worker commit: ${out.workerBefore?.commit||"NOT_VERIFIED"}`,`- Candidate found in personal list: ${out.listResult?.candidateFound?"YES":"NO"}`,
            `- Stored owner UID: ${out.candidate?.ownerUid||"NOT_RETURNED"}`,`- Stored owner email: ${out.candidate?.ownerEmail||"NOT_RETURNED"}`,"",
            "## Route results","| Route | HTTP | Error code | Request ID | Evidence / source hash | SHA-256 |","|---|---:|---|---|---|---|",
            ...out.routes.map(x=>`| ${x.route} | ${x.status} | ${x.code||""} | ${x.requestId||""} | ${x.auditChainStatus||x.sourceHashStatus||x.total||""} ${x.auditChainCode||x.sourceHashCode||""} | ${x.sha256||x.sourceHash||""} |`),"",
            "## PDF outputs",...(out.pdfs.length?out.pdfs.map(x=>`- ${x.file}: SHA-256 ${x.sha256} (${x.bytes} bytes)`):["- No PDF was returned by the read-only routes."])];
          fs.writeFileSync("docs-results.md",lines.join("\n")+"\n");
          console.log(JSON.stringify({status:out.status,candidate:out.candidate||null,routes:out.routes,pdfs:out.pdfs}));
          NODE
      - name: Append metadata-only results and comment on PR #982
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/incident
          if [[ ! -f docs-results.md ]]; then
            printf '%s\\n' '# Court owner-access Gateway verification' '- Status: VERIFICATION_WORKFLOW_FAILED_BEFORE_RESULTS' '- Error code: CHECK_VERIFY_STEP_LOGS' > docs-results.md
          fi
          if [[ -f docs-results.md ]]; then
            node --input-type=module -e 'import fs from "node:fs";const p="docs/incident/results-20261126.md";const next=fs.readFileSync("docs-results.md","utf8");if(fs.existsSync(p))fs.appendFileSync(p,"\n---\n\n"+next);else fs.writeFileSync(p,next);'
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/incident/results-20261126.md
          git commit -m "Append Court owner-access Gateway verification" || true
          git fetch origin incident/owner-access-20261126
          git rebase origin/incident/owner-access-20261126
          git push origin "HEAD:incident/owner-access-20261126"
          gh pr comment 982 --repo "$GITHUB_REPOSITORY" --body-file docs-results.md
      - name: Publish verified PDF outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-owner-access-gateway-pdfs-${{ github.sha }}
          path: verification-pdfs/
          if-no-files-found: ignore
          retention-days: 90
