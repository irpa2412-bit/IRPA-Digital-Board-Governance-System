name: Publish Isolated Staging Firestore Rules Only

run-name: Publish staging Firestore rules only (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      confirm_staging_rules_publication:
        description: "Explicitly confirm publication of firestore.staging.rules to irpa-dbg-staging-a73ec"
        required: true
        type: choice
        options:
          - "no"
          - "publish-staging-rules"
        default: "no"

permissions:
  contents: read

concurrency:
  group: irpa-staging-firestore-rules-publication
  cancel-in-progress: false

jobs:
  publish-staging-rules:
    if: ${{ github.ref == 'refs/heads/fix/signature-trail-20261024' && inputs.confirm_staging_rules_publication == 'publish-staging-rules' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved staging rules source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Enforce staging-only workflow and source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/signature-trail-20261024"
          test -s firestore.staging.rules
          test -s functions/scripts/deploy-staging-firestore-rules.js
          source_path="$(grep -oE 'path.resolve\("[^"]+"\)' functions/scripts/deploy-staging-firestore-rules.js | head -n 1)"
          test "$source_path" = 'path.resolve("firestore.staging.rules")'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase publisher runtime dependencies
        run: npm --prefix functions install --omit=dev --no-audit --no-fund

      - name: Test staging rules backup and rollback helpers
        run: node --test functions/scripts/staging-firestore-rules-release.test.js

      - name: Capture active staging rules backup before publication
        id: backup
        env:
          STAGING_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.LIVEKIT_STAGING_FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_FIREBASE_SERVICE_ACCOUNT"
          credential_file="$RUNNER_TEMP/staging-firebase-service-account.json"
          backup_file="$RUNNER_TEMP/staging-firestore-rules-backup.json"
          trap 'rm -f "$credential_file"' EXIT
          printf '%s' "$STAGING_FIREBASE_SERVICE_ACCOUNT" > "$credential_file"
          node - "$credential_file" <<'NODE'
          const fs = require("node:fs");
          const credentials = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (credentials.project_id !== "irpa-dbg-staging-a73ec") {
            console.error("Refusing backup: service account is not for the fixed staging project.");
            process.exit(1);
          }
          NODE
          export GOOGLE_APPLICATION_CREDENTIALS="$credential_file"
          node functions/scripts/backup-staging-firestore-rules.js "$backup_file"
          test -s "$backup_file"
          echo "backup_path=$backup_file" >> "$GITHUB_OUTPUT"

      - name: Save pre-publication staging rules backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-firestore-rules-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-firestore-rules-backup.json
          retention-days: 90
          if-no-files-found: error

      - name: Publish staging rules to the fixed staging Firebase project
        id: publish
        env:
          STAGING_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.LIVEKIT_STAGING_FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_FIREBASE_SERVICE_ACCOUNT"
          credential_file="$RUNNER_TEMP/staging-firebase-service-account.json"
          trap 'rm -f "$credential_file"' EXIT
          printf '%s' "$STAGING_FIREBASE_SERVICE_ACCOUNT" > "$credential_file"
          node - "$credential_file" <<'NODE'
          const fs = require("node:fs");
          const credentials = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (credentials.project_id !== "irpa-dbg-staging-a73ec") {
            console.error("Refusing publication: service account is not for the fixed staging project.");
            process.exit(1);
          }
          NODE
          export GOOGLE_APPLICATION_CREDENTIALS="$credential_file"
          node functions/scripts/deploy-staging-firestore-rules.js

      - name: Verify active staging release matches the staging source
        id: verify
        env:
          STAGING_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.LIVEKIT_STAGING_FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_FIREBASE_SERVICE_ACCOUNT"
          credential_file="$RUNNER_TEMP/staging-firebase-service-account.json"
          trap 'rm -f "$credential_file"' EXIT
          printf '%s' "$STAGING_FIREBASE_SERVICE_ACCOUNT" > "$credential_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credential_file"
          node <<'NODE'
          const fs = require("node:fs");
          const { GoogleAuth } = require("google-auth-library");
          const project = "irpa-dbg-staging-a73ec";
          const releaseName = "projects/" + project + "/releases/cloud.firestore";
          (async () => {
            const credentials = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, "utf8"));
            if (credentials.project_id !== project) throw new Error("Service account project mismatch.");
            const auth = new GoogleAuth({
              credentials,
              scopes: ["https://www.googleapis.com/auth/cloud-platform"]
            });
            const client = await auth.getClient();
            const request = async url => (await client.request({ url: "https://firebaserules.googleapis.com/v1/" + url })).data;
            const release = await request(releaseName);
            if (!release.rulesetName) throw new Error("Staging release has no active ruleset.");
            const ruleset = await request(release.rulesetName);
            const actual = ruleset.source?.files?.find(file => file.name === "firestore.rules")?.content;
            const expected = fs.readFileSync("firestore.staging.rules", "utf8");
            if (actual !== expected) throw new Error("Active staging rules do not match firestore.staging.rules.");
            process.stdout.write(JSON.stringify({
              ok: true,
              project,
              release: releaseName,
              verification: "active-rules-match-firestore.staging.rules"
            }) + "\n");
          })().catch(error => {
            process.stderr.write(JSON.stringify({ ok: false, error: error.message || "verification failed" }) + "\n");
            process.exitCode = 1;
          });
          NODE

      - name: Roll back staging rules to saved backup if publication or verification fails
        if: ${{ always() && steps.backup.outcome == 'success' && (steps.publish.outcome != 'success' || steps.verify.outcome != 'success') }}
        env:
          STAGING_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.LIVEKIT_STAGING_FIREBASE_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_FIREBASE_SERVICE_ACCOUNT"
          credential_file="$RUNNER_TEMP/staging-firebase-service-account.json"
          backup_file="$RUNNER_TEMP/staging-firestore-rules-backup.json"
          trap 'rm -f "$credential_file"' EXIT
          test -s "$backup_file"
          printf '%s' "$STAGING_FIREBASE_SERVICE_ACCOUNT" > "$credential_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credential_file"
          node functions/scripts/restore-staging-firestore-rules.js "$backup_file"
