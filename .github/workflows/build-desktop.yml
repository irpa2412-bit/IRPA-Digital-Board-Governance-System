name: Build IRPA-DBGS Windows installer
on:
  pull_request:
    branches: [main]
    paths: ["package.json","electron/**","vite.config.js","index.html","src/**","public/**",".github/workflows/build-desktop.yml"]
  push:
    branches: [main]
    paths: ["package.json","electron/**","vite.config.js","index.html","src/**","public/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm install
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v4
        with:
          name: IRPA-DBGS-Windows-Installer
          path: release/IRPA-DBGS-Setup-1.0.0.exe
          if-no-files-found: error