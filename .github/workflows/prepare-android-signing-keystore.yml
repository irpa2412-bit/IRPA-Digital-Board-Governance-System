name: Prepare IRPA Android signing keystore (isolated)

on:
  push:
    branches:
      - irpa/android-signing-keystore-setup

permissions:
  contents: read

jobs:
  prepare-signing-material:
    name: Generate and encrypt Android signing material
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SIGNING_PASSWORD: ${{ secrets.IRPA_SIGNING_BOOTSTRAP_PASSWORD }}
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate the administrator-provided bootstrap secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_PASSWORD}" ]]; then
            echo "::error::Repository secret IRPA_SIGNING_BOOTSTRAP_PASSWORD is not configured. Add it in Settings > Secrets and variables > Actions, then rerun this job."
            exit 1
          fi
          if [[ ${#SIGNING_PASSWORD} -lt 20 ]]; then
            echo "::error::IRPA_SIGNING_BOOTSTRAP_PASSWORD must contain at least 20 characters."
            exit 1
          fi

      - name: Generate and verify JKS, then encrypt Base64 material
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/irpa-android-signing"
          mkdir -m 700 -p "$WORK"
          trap 'rm -rf "$WORK"' EXIT

          keytool -genkeypair \
            -storetype JKS \
            -keystore "$WORK/irpa-governance-release.jks" \
            -alias irpa-governance-release \
            -keyalg RSA \
            -keysize 2048 \
            -sigalg SHA256withRSA \
            -validity 10000 \
            -dname "CN=IRPA Digital Governance, OU=Information Technology, O=Improvement of Rangeland in Pastoral Areas, L=Longido, ST=Arusha, C=TZ" \
            -storepass:env SIGNING_PASSWORD \
            -keypass:env SIGNING_PASSWORD

          keytool -list -v \
            -keystore "$WORK/irpa-governance-release.jks" \
            -storetype JKS \
            -storepass:env SIGNING_PASSWORD \
            -alias irpa-governance-release > "$WORK/verification.txt"

          grep -q "SHA256withRSA" "$WORK/verification.txt"
          grep -q "PrivateKeyEntry" "$WORK/verification.txt"

          base64 -w 0 "$WORK/irpa-governance-release.jks" > "$WORK/ANDROID_KEYSTORE_BASE64.txt"

          # The repository is public. Never upload an unencrypted keystore or Base64 file.
          # AES-256-CBC + PBKDF2 protects the artifact with the administrator-held secret.
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -md sha256 \
            -pass env:SIGNING_PASSWORD \
            -in "$WORK/ANDROID_KEYSTORE_BASE64.txt" \
            -out "$RUNNER_TEMP/IRPA-ANDROID-SIGNING-MATERIAL.enc"

          echo "JKS generation and alias/signature verification succeeded." >> "$GITHUB_STEP_SUMMARY"
          echo "Only an AES-256 encrypted Base64 file will be retained as a short-lived artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "The keystore and plaintext Base64 were removed from the runner workspace." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted signing material (one-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: IRPA-Android-Signing-Material-Encrypted
          path: ${{ runner.temp }}/IRPA-ANDROID-SIGNING-MATERIAL.enc
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/irpa-android-signing"
          rm -f "$RUNNER_TEMP/IRPA-ANDROID-SIGNING-MATERIAL.enc"
