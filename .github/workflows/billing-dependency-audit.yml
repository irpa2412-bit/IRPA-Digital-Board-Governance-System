name: IRPA Billing Dependency and Undefined-Name Audit

on:
  push:
    branches: [integration/five-portal-chain-20261018]
    paths:
      - "src/**"
      - "functions/**"
      - "drive-gateway/src/**"
      - "public/**"
      - "tests/**"
      - "scripts/check-no-billing-deps.mjs"
      - "src/firebase/meetingRecords.js"
      - "drive-gateway/src/meetingServices.mjs"
      - "tests/meeting-worker-route-migration.test.mjs"
      - "firestore.rules.proposed"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/billing-dependency-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "functions/**"
      - "drive-gateway/src/**"
      - "public/**"
      - "scripts/check-no-billing-deps.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/billing-dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install ephemeral static-analysis tools without changing the lockfile
        run: npm install --no-save --package-lock=false eslint@9 globals@15
      - name: Check Worker syntax and meeting route migration
        run: |
          node --check drive-gateway/src/meetingServices.mjs
          npm run test:meeting-worker-routes
          node --test tests/meeting-isolation-guard.test.mjs
          node --test tests/invitation-removal-policy.test.mjs
      - name: Inventory billing dependencies and enforce no-undef in src/firebase
        run: node scripts/check-no-billing-deps.mjs
      - name: Build with staging-only environment pairing
        env:
          VITE_IRPA_DEPLOYMENT_ENV: staging
          VITE_FIREBASE_API_KEY: staging-ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: irpa-dbg-staging-a73ec.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: irpa-dbg-staging-a73ec
          VITE_FIREBASE_MESSAGING_SENDER_ID: staging-ci-sender
          VITE_FIREBASE_APP_ID: staging-ci-app
          VITE_GATEWAY_ORIGIN: https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev
          VITE_GOOGLE_DRIVE_GATEWAY_URL: https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev
          VITE_GOOGLE_DRIVE_GATEWAY_STAGING_URL: https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev
          VITE_META_STAGING_GATEWAY_URL: https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev
        run: npm run build
      - name: Upload static dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irpa-billing-dependency-audit
          path: artifacts/billing-dependency-audit.md
          if-no-files-found: warn
