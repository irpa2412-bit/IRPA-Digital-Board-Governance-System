name: Readability CI

on:
  push:
    branches:
      - audit/app-wide-readability-form-layout-20261008
  pull_request:
    branches:
      - main
      - audit/app-wide-readability-form-layout-20261008

permissions:
  contents: write

jobs:
  readability:
    name: Build and token contrast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh committed lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m "ci: refresh package lock"
          git push

      - name: Clean dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Token contrast gate
        run: npm run check:token-contrast

      - name: Production build
        run: npm run build
