name: Signature Portal Migration Build Test

on:
  push:
    branches:
      - feature/signer-identity-migration
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "Explicitly authorize deployment to isolated Cloudflare staging"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify migration safety invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f src/firebase/signerIdentity.js
          test -f src/firebase/signaturePlatform.js
          grep -Fq 'SIGNER_IDENTITY_COLLECTION = "signerIdentities"' src/firebase/signerIdentity.js
          grep -Fq 'signatureProfiles' src/firebase/signaturePlatform.js
          grep -Fq 'migrateExistingSignatureProfile' src/firebase/signaturePlatform.js
          if grep -Fq 'deleteField' src/firebase/signaturePlatform.js; then
            echo "ERROR: destructive deleteField usage remains in Signature Portal migration source."
            exit 1
          fi
          node --input-type=module -e 'import fs from "node:fs"; const s=fs.readFileSync("src/firebase/signaturePlatform.js","utf8"); const identity=s.indexOf("const signerIdentity=await ensureMySignerIdentity"); const upload=s.indexOf("await uploadBytes(storageRef,signedBytes"); if(identity<0||upload<0||identity>=upload) { console.error({identity,upload}); process.exit(1); } if(!s.includes("recordSignerAuthenticationEvidence")) process.exit(1); console.log("Signature migration safety invariants passed.",{identity,upload});'

      - name: Run Signature Portal gateway and authorization regression tests
        working-directory: drive-gateway
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Run Signature Portal routing policy tests
        run: node --test tests/signature-workflow-policy.test.mjs

      - name: Build web application
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_DRIVE_GATEWAY_URL: ${{ secrets.VITE_GOOGLE_DRIVE_GATEWAY_URL }}
        run: npm run build


  staging-isolation-preflight:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated staging Firebase project and dedicated KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          STAGING_DRIVE_KV_ID: "7b50627e29fc4fe1abaa8dc8665edd02"
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$STAGING_FIREBASE_PROJECT_ID"
          test "$STAGING_FIREBASE_PROJECT_ID" != "irpa-digital-board-governance"
          test "$STAGING_DRIVE_KV_ID" != "ccdbffa662ac48bfbdf7f4b1f62ca941"
          node <<'NODE'
          const fs = require("node:fs");
          const config = fs.readFileSync("drive-gateway/wrangler.toml", "utf8");
          const staging = config.split("[env.staging]")[1] || "";
          if (!staging.includes('id = "' + process.env.STAGING_DRIVE_KV_ID + '"')) {
            throw new Error("Staging DRIVE_KV must use the explicitly dedicated namespace ID.");
          }
          if (staging.includes('id = "ccdbffa662ac48bfbdf7f4b1f62ca941"')) {
            throw new Error("Production DRIVE_KV cannot be used by staging.");
          }
          NODE
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=1000" \
            -o "$RUNNER_TEMP/kv-namespaces.json"
          node <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/kv-namespaces.json", "utf8"));
          const expected = process.env.STAGING_DRIVE_KV_ID;
          if (payload.success !== true || !Array.isArray(payload.result)) {
            throw new Error("Cloudflare did not return a verified KV namespace inventory.");
          }
          if (!payload.result.some(namespace => namespace.id === expected)) {
            throw new Error("The dedicated staging DRIVE_KV namespace is not present in this Cloudflare account.");
          }
          console.log(JSON.stringify({stagingKV:"verified",productionKVRejected:true,stagingFirebaseProject:"non-production"}));
          NODE

  deploy-cloudflare-staging:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_staging == true }}
    needs: [build, staging-isolation-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: drive-gateway
    steps:
      - name: Checkout controlled repair branch
        uses: actions/checkout@v4

      - name: Verify isolated staging configuration
        env:
          STAGING_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("wrangler.toml", "utf8");
          if (!/\[env\.staging\]/.test(text)) throw new Error("Staging environment is missing.");
          if (!/name = "irpa-google-drive-gateway-staging"/.test(text)) throw new Error("Staging Worker name is incorrect.");
          if (!/\[env\.staging\.vars\][\s\S]*CLOUDFLARE_AUTH_FUNCTIONS_ENABLED = "true"/.test(text)) throw new Error("Staging migration flag must be true.");
          if (!/\[env\.staging\.vars\][\s\S]*DRIVE_MOCK = "false"/.test(text)) throw new Error("Staging must use real Durable Object state (DRIVE_MOCK=false).");
          if (!/\[\[env\.staging\.kv_namespaces\]\][\s\S]*binding = "DRIVE_KV"[\s\S]*id = "7b50627e29fc4fe1abaa8dc8665edd02"/.test(text)) throw new Error("Dedicated staging DRIVE_KV binding is missing.");
          if (process.env.STAGING_FIREBASE_PROJECT_ID !== process.env.STAGING_FIREBASE_PROJECT_ID.trim() || !/^[a-z0-9-]{6,63}$/.test(process.env.STAGING_FIREBASE_PROJECT_ID) || process.env.STAGING_FIREBASE_PROJECT_ID === "irpa-digital-board-governance") throw new Error("Staging Firebase project must be explicitly configured and separate from production.");
          if (!/\[\[env\.staging\.durable_objects\.bindings\]\][\s\S]*name = "ESIGN_DO"[\s\S]*class_name = "EsignRecordDurableObject"/.test(text)) throw new Error("Staging ESIGN_DO binding is missing.");
          if (!/\[\[env\.staging\.migrations\]\][\s\S]*tag = "esign-do-staging-v1"/.test(text)) throw new Error("Staging DO migration is missing.");
          const top = text.split("[env.staging]")[0];
          if (!/CLOUDFLARE_AUTH_FUNCTIONS_ENABLED = "true"/.test(top)) throw new Error("Production/top-level migration flag must be explicitly enabled after cutover.");
          if (!/IRPA_PRODUCTION_CUTOVER = "true"/.test(top)) throw new Error("Explicit production cutover marker is missing.");
          NODE

      - name: Install gateway dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate staging configuration
        env:
          STAGING_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
        run: npx wrangler deploy --env staging --var "FIREBASE_PROJECT_ID:$STAGING_FIREBASE_PROJECT_ID" --dry-run

      - name: Deploy isolated Cloudflare staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: drive-gateway
          command: deploy --env staging --var FIREBASE_PROJECT_ID:${{ secrets.STAGING_FIREBASE_PROJECT_ID }}

      - name: Confirm deployed staging environment
        run: |
          set -euo pipefail
          echo "Cloudflare staging Worker deployed as irpa-google-drive-gateway-staging."
          echo "Dedicated staging DRIVE_KV and non-production Firebase project were verified before deployment."
          echo "Live endpoint checks below are the authoritative runtime verification."
          
      - name: Verify staging health
        run: |
          set -euo pipefail
          base="https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev"
          body="$(curl --fail --silent --show-error --retry 8 --retry-delay 2 "$base/health")"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"environment":"staging"'
          echo "$body" | grep -q '"esignModuleEnabled":true'
          echo "$body" | grep -q '"authFunctionsEnabled":true'
          echo "$body" | grep -q '"driveMock":false'

      - name: Verify migrated authentication runtime
        run: |
          set -euo pipefail
          base="https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev"
          email="staging-runtime-$(date +%s)-$RANDOM@example.com"
          state="$(curl --fail --silent --show-error -H "Content-Type: application/json" -d "{\"email\":\"$email\"}" "$base/api/auth/password-attempt-state")"
          echo "$state"
          echo "$state" | grep -q '"status":"FIRST"'
          for expected in 2 1; do
            failure="$(curl --fail --silent --show-error -H "Content-Type: application/json" -d "{\"email\":\"$email\"}" "$base/api/auth/password-failure")"
            echo "$failure"
            echo "$failure" | grep -q "\"remainingAttempts\":$expected"
          done
          locked="$(curl --fail --silent --show-error -H "Content-Type: application/json" -d "{\"email\":\"$email\"}" "$base/api/auth/password-failure")"
          echo "$locked"
          echo "$locked" | grep -q '"status":"LOCKED"'
          cleared="$(curl --fail --silent --show-error -H "Content-Type: application/json" -d "{\"email\":\"$email\"}" "$base/api/auth/password-attempt-clear")"
          echo "$cleared"
          echo "$cleared" | grep -q '"ok":true'
          reset="$(curl --fail --silent --show-error -H "Content-Type: application/json" -d "{\"email\":\"$email\"}" "$base/api/auth/password-attempt-state")"
          echo "$reset"
          echo "$reset" | grep -q '"status":"FIRST"'

      - name: Verify document-reference authentication gate and CORS
        run: |
          set -euo pipefail
          base="https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev"
          code="$(curl --silent --show-error -o /tmp/ref.json -w "%{http_code}" -H "Content-Type: application/json" -d "{}" "$base/api/documents/next-reference")"
          cat /tmp/ref.json
          test "$code" = "401"
          headers="$(curl --silent --show-error -D - -o /dev/null -X OPTIONS -H "Origin: https://irpa-digital-board-governance.web.app" "$base/api/sign/open")"
          echo "$headers" | grep -i '^access-control-allow-headers:' | grep -qi 'x-signing-token'
          echo "Cloudflare staging runtime verification passed."
