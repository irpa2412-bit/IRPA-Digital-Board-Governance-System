name: Signature Portal Migration Build Test

on:
  push:
    branches:
      - feature/signer-identity-migration
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify migration safety invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f src/firebase/signerIdentity.js
          test -f src/firebase/signaturePlatform.js
          grep -Fq 'SIGNER_IDENTITY_COLLECTION = "signerIdentities"' src/firebase/signerIdentity.js
          grep -Fq 'signatureProfiles' src/firebase/signaturePlatform.js
          grep -Fq 'migrateExistingSignatureProfile' src/firebase/signaturePlatform.js
          if grep -Fq 'deleteField' src/firebase/signaturePlatform.js; then
            echo "ERROR: destructive deleteField usage remains in Signature Portal migration source."
            exit 1
          fi
          node --input-type=module -e 'import fs from "node:fs"; const s=fs.readFileSync("src/firebase/signaturePlatform.js","utf8"); const identity=s.indexOf("const signerIdentity=await ensureMySignerIdentity"); const upload=s.indexOf("await uploadBytes(storageRef,signedBytes"); if(identity<0||upload<0||identity>=upload) { console.error({identity,upload}); process.exit(1); } if(!s.includes("recordSignerAuthenticationEvidence")) process.exit(1); console.log("Signature migration safety invariants passed.",{identity,upload});'

      - name: Build web application
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_DRIVE_GATEWAY_URL: ${{ secrets.VITE_GOOGLE_DRIVE_GATEWAY_URL }}
        run: npm run build


  deploy-cloudflare-staging:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: drive-gateway
    steps:
      - name: Checkout controlled repair branch
        uses: actions/checkout@v4

      - name: Verify isolated staging configuration
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const text = fs.readFileSync("wrangler.toml", "utf8");
          if (!/\[env\.staging\]/.test(text)) throw new Error("Staging environment is missing.");
          if (!/name = "irpa-google-drive-gateway-staging"/.test(text)) throw new Error("Staging Worker name is incorrect.");
          if (!/\[env\.staging\.vars\][\s\S]*CLOUDFLARE_AUTH_FUNCTIONS_ENABLED = "true"/.test(text)) throw new Error("Staging migration flag must be true.");
          if (!/\[env\.staging\.vars\][\s\S]*DRIVE_MOCK = "true"/.test(text)) throw new Error("Staging must use DRIVE_MOCK=true.");
          if (!/\[\[env\.staging\.kv_namespaces\]\][\s\S]*binding = "DRIVE_KV"/.test(text)) throw new Error("Staging DRIVE_KV binding is missing.");
          if (!/\[\[env\.staging\.durable_objects\.bindings\]\][\s\S]*name = "ESIGN_DO"[\s\S]*class_name = "EsignRecordDurableObject"/.test(text)) throw new Error("Staging ESIGN_DO binding is missing.");
          if (!/\[\[env\.staging\.migrations\]\][\s\S]*tag = "esign-do-staging-v1"/.test(text)) throw new Error("Staging DO migration is missing.");
          const top = text.split("[env.staging]")[0];
          if (!/CLOUDFLARE_AUTH_FUNCTIONS_ENABLED = "false"/.test(top)) throw new Error("Production/top-level migration flag must remain false.");
          NODE

      - name: Install gateway dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate staging configuration
        run: npx wrangler deploy --env staging --dry-run

      - name: Deploy isolated Cloudflare staging Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: drive-gateway
          command: deploy --env staging

      - name: Verify staging Worker bindings and flag
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          response="$(curl --fail --silent --show-error -H "Authorization: Bearer $CF_API_TOKEN" -H "Accept: application/json" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/irpa-google-drive-gateway-staging/settings")"
          node - "$response" <<'NODE'
          const response = JSON.parse(process.argv[2]);
          if (response.success !== true) throw new Error("Cloudflare rejected the staging Worker settings request.");
          const bindings = Array.isArray(response.result?.bindings) ? response.result.bindings : [];
          const auth = bindings.find(b => b.name === "CLOUDFLARE_AUTH_FUNCTIONS_ENABLED");
          if (!auth || auth.type !== "plain_text" || auth.text !== "true") throw new Error("Staging auth migration flag is not exactly true.");
          const driveKv = bindings.find(b => b.name === "DRIVE_KV");
          if (!driveKv || driveKv.type !== "kv_namespace" || !driveKv.namespace_id) throw new Error("Staging DRIVE_KV binding is missing.");
          const esign = bindings.find(b => b.name === "ESIGN_DO");
          if (!esign || esign.type !== "durable_object_namespace" || esign.class_name !== "EsignRecordDurableObject") throw new Error("Staging ESIGN_DO binding is missing or incorrect.");
          console.log("Staging Worker configuration verified without exposing credentials.");
          NODE

      - name: Verify staging health
        run: |
          set -euo pipefail
          base="https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev"
          body="$(curl --fail --silent --show-error --retry 8 --retry-delay 2 "$base/health")"
          echo "$body"
          echo "$body" | grep -q '"ok":true'

      - name: Verify migrated authentication runtime
        run: |
          set -euo pipefail
          base="https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev"
          email="staging-runtime-$(date +%s)-$RANDOM@example.com"
          state="$(curl --fail --silent --show-error -H "Content-Type: application/json" -d "{\"email\":\"$email\"}" "$base/api/auth/password-attempt-state")"
          echo "$state"
          echo "$state" | grep -q '"status":"FIRST"'
          for expected in 2 1; do
            failure="$(curl --fail --silent --show-error -H "Content-Type: application/json" -d "{\"email\":\"$email\"}" "$base/api/auth/password-failure")"
            echo "$failure"
            echo "$failure" | grep -q "\"remainingAttempts\":$expected"
          done
          locked="$(curl --fail --silent --show-error -H "Content-Type: application/json" -d "{\"email\":\"$email\"}" "$base/api/auth/password-failure")"
          echo "$locked"
          echo "$locked" | grep -q '"status":"LOCKED"'
          cleared="$(curl --fail --silent --show-error -H "Content-Type: application/json" -d "{\"email\":\"$email\"}" "$base/api/auth/password-attempt-clear")"
          echo "$cleared"
          echo "$cleared" | grep -q '"ok":true'
          reset="$(curl --fail --silent --show-error -H "Content-Type: application/json" -d "{\"email\":\"$email\"}" "$base/api/auth/password-attempt-state")"
          echo "$reset"
          echo "$reset" | grep -q '"status":"FIRST"'

      - name: Verify document-reference authentication gate and CORS
        run: |
          set -euo pipefail
          base="https://irpa-google-drive-gateway-staging.irpa-governance.workers.dev"
          code="$(curl --silent --show-error -o /tmp/ref.json -w "%{http_code}" -H "Content-Type: application/json" -d "{}" "$base/api/documents/next-reference")"
          cat /tmp/ref.json
          test "$code" = "401"
          headers="$(curl --silent --show-error -D - -o /dev/null -X OPTIONS -H "Origin: https://irpa-digital-board-governance.web.app" "$base/api/sign/open")"
          echo "$headers" | grep -i '^access-control-allow-headers:' | grep -qi 'x-signing-token'
          echo "Cloudflare staging runtime verification passed."
