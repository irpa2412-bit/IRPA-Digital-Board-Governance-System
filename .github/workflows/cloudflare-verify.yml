name: Cloudflare live verification (diagnostic branch only)

on:
  workflow_dispatch:
  push:
    branches:
      - diagnose/cloudflare-verify-20261029

permissions:
  contents: write

concurrency:
  group: cloudflare-verify-diagnostic
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnose/cloudflare-verify-20261029
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler for authenticated tail
        working-directory: drive-gateway
        run: npm ci
      - name: Probe live routes, query analytics/settings, capture tail, and commit report on this branch only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p docs/diagnostics
          OUT="$GITHUB_WORKSPACE/docs/diagnostics/cloudflare-verify.txt"
          : > "$OUT"
          exec 3>&1
          {
            echo "IRPA Cloudflare live verification"
            echo "UTC: $(date -u +%FT%TZ)"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Target: https://irpa-google-drive-gateway.irpa-governance.workers.dev"
            echo
          } >> "$OUT"

          BASE="https://irpa-google-drive-gateway.irpa-governance.workers.dev"
          probe() {
            local path="$1" method="$2" label="$3" tmp status
            tmp="$(mktemp)"
            local -a args
            args=(--silent --show-error --max-time 12 --dump-header "$tmp.headers" --output "$tmp.body" --write-out '%{http_code}')
            if [[ "$method" == "OPTIONS" ]]; then
              args+=(-X OPTIONS -H 'Origin: https://irpa-digital-board-governance.web.app' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type')
            elif [[ "$method" == "POST" ]]; then
              args+=(-X POST -H 'Origin: https://irpa-digital-board-governance.web.app' -H 'Content-Type: application/json' --data '{}')
            fi
            status="$(curl "${args[@]}" "$BASE$path" 2>"$tmp.curlerr" || true)"
            {
              echo "=== $label $method $path ==="
              echo "HTTP status: ${status:-no HTTP status (transport/TLS/timeout failure)}"
              echo "Response headers (all):"
              if [[ -f "$tmp.headers" ]]; then cat "$tmp.headers"; else echo "(none)"; fi
              echo "Body first 400 characters:"
              if [[ -f "$tmp.body" ]]; then head -c 400 "$tmp.body"; else echo "(no body)"; fi
              echo
              if [[ -s "$tmp.curlerr" ]]; then echo "curl diagnostic: $(head -c 300 "$tmp.curlerr")"; echo; fi
              if grep -Eqi 'error 1101|Worker threw exception|error 1102|exceeded.*resources|cloudflare.*error' "$tmp.body" 2>/dev/null; then
                echo "Classification: Cloudflare error page / platform failure"
              elif grep -Eq '"(ok|error|success|message|code)"[[:space:]]*:' "$tmp.body" 2>/dev/null; then
                echo "Classification: Worker's JSON or JSON-like response"
              else
                echo "Classification: unclassified response"
              fi
              echo
            } >> "$OUT"
            rm -f "$tmp" "$tmp.headers" "$tmp.body" "$tmp.curlerr"
          }

          # Start tail before requests so it observes this exact probe window.
          (
            cd "$GITHUB_WORKSPACE/drive-gateway"
            timeout 90s npx wrangler tail irpa-google-drive-gateway --format json > "$RUNNER_TEMP/irpa-tail.jsonl" 2>"$RUNNER_TEMP/irpa-tail.err" || true
          ) &
          TAIL_PID=$!
          sleep 5
          probe /health GET "LIVE PROBE"
          for route in /api/signature-pathway/reconcile /api/upload-controlled-document/policy-check /api/system/release-readiness; do
            probe "$route" OPTIONS "LIVE PROBE"
            probe "$route" POST "LIVE PROBE"
          done
          wait "$TAIL_PID" || true
          {
            echo "=== LIVE TAIL (90-second capture; exceptions and target route lines) ==="
            if [[ -f "$RUNNER_TEMP/irpa-tail.jsonl" ]]; then
              grep -Ei 'exception|uncaught|error|signature-pathway/reconcile|upload-controlled-document/policy-check|system/release-readiness|1101|1102' "$RUNNER_TEMP/irpa-tail.jsonl" | head -c 24000 || echo "(no matching tail lines)"
            else echo "(tail produced no output)"; fi
            echo
            if [[ -s "$RUNNER_TEMP/irpa-tail.err" ]]; then
              echo "Tail stderr (last 30 lines; credential values are not intentionally logged):"
              tail -30 "$RUNNER_TEMP/irpa-tail.err"
            fi
            echo
          } >> "$OUT"

          {
            echo "=== CLOUDFLARE ANALYTICS: last 24 hours ==="
            if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
              echo "Analytics unavailable: repository secret CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured (names only)."
            else
              cat > "$RUNNER_TEMP/analytics.json" <<'JSON'
          {"query":"query { viewer { accounts(filter: { accountTag: \"PLACEHOLDER\" }) { workersInvocationsAdaptive(limit: 10000, filter: { datetime_geq: \"START\", datetime_lt: \"END\", scriptName: \"irpa-google-drive-gateway\" }) { dimensions { status } sum { requests errors subrequests } quantiles { cpuTimeP50 cpuTimeP90 cpuTimeP99 } max { cpuTime subrequests } } } } }"}
          JSON
              START="$(date -u -d '24 hours ago' +%FT%TZ)"
              END="$(date -u +%FT%TZ)"
              node - "$RUNNER_TEMP/analytics.json" "$CLOUDFLARE_ACCOUNT_ID" "$START" "$END" <<'NODE'
          const fs=require('fs'); const p=process.argv[2]; let x=JSON.parse(fs.readFileSync(p,'utf8'));
          x.query=x.query.replace('PLACEHOLDER',process.argv[3]).replace('START',process.argv[4]).replace('END',process.argv[5]);
          fs.writeFileSync(p,JSON.stringify(x));
          NODE
              CODE="$(curl --silent --show-error --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/analytics.json" https://api.cloudflare.com/client/v4/graphql -o "$RUNNER_TEMP/analytics-response.json" -w '%{http_code}' || true)"
              echo "GraphQL HTTP status: ${CODE:-no HTTP status}"
              node - "$RUNNER_TEMP/analytics-response.json" >> "$OUT" <<'NODE'
          const fs=require('fs'); let x={}; try{x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'))}catch{}
          if(x.errors?.length){ for(const e of x.errors) console.log("GraphQL error: "+String(e.message||"unknown").slice(0,500)); if(x.errors.some(e=>/permission|not authorized|forbidden/i.test(e.message||""))) console.log("Missing permission: Cloudflare API token needs Analytics Read permission for the account (Workers Analytics/Workers Scripts analytics read).");}
          else { console.log(JSON.stringify(x.data||x, null, 2)); const s=JSON.stringify(x); console.log("Exceeded-CPU counts: "+(/exceeded.?cpu/i.test(s)? "present in returned analytics": "not separately exposed by this query")); console.log("Exceeded-subrequest counts: "+(/exceeded.?subrequest/i.test(s)? "present in returned analytics": "not separately exposed by this query")); console.log("Uncaught-exception counts: "+(/uncaught.?exception/i.test(s)? "present in returned analytics": "not separately exposed by this query")); }
          NODE
            fi
            echo
            echo "=== WORKER SETTINGS (binding names only) ==="
            if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
              echo "Settings unavailable: required repository secrets are not configured (names only)."
            else
              for endpoint in \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/irpa-google-drive-gateway/settings" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; do
                code="$(curl --silent --show-error --max-time 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$endpoint" -o "$RUNNER_TEMP/cf-setting.json" -w '%{http_code}' || true)"
                echo "Endpoint category: $([[ "$endpoint" == *"/settings" ]] && echo worker-settings || echo account-plan); HTTP status: ${code:-no HTTP status}"
                node - "$RUNNER_TEMP/cf-setting.json" "$endpoint" >> "$OUT" <<'NODE'
          const fs=require('fs');let x={};try{x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'))}catch{}
          const endpoint=process.argv[3];
          if(!x.success){console.log("API read failed: "+(x.errors||[]).map(e=>String(e.code)+": "+String(e.message||"").slice(0,250)).join("; ")); if((x.errors||[]).some(e=>/permission|forbidden|unauthorized/i.test(e.message||"")))console.log("Required permission likely missing: Workers Scripts Read for settings; Account Settings Read for plan metadata.");}
          else if(endpoint.includes('/settings')) {const r=x.result||{}; const b=(r.bindings||[]).map(v=>v.name).filter(Boolean); console.log(JSON.stringify({binding_names:b,compatibility_date:r.compatibility_date||r.compatibilityDate||null,usage_model:r.usage_model||r.usageModel||null,limits:r.limits||null},null,2));}
          else {const r=x.result||{}; console.log(JSON.stringify({account_name:r.name||null,plan: r.plan?.name||r.plan?.id||r.type||"not exposed",plan_details:r.plan||null},null,2));}
          NODE
              done
            fi
            echo
          } >> "$OUT"

          {
            echo "=== SAFE SUMMARY ==="
            echo "Only binding names are reported. No secret values are printed."
            echo "Review status codes, CORS headers, analytics permission/errors, and tail exceptions above."
          } >> "$OUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/cloudflare-verify.txt
          git commit -m "capture Cloudflare live verification diagnostics"
          git push origin HEAD:diagnose/cloudflare-verify-20261029
