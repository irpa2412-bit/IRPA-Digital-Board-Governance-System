name: Firebase Functions Entrypoint Integrity Test

on:
  push:
    branches: [repair/functions-entrypoint-integrity-2026-09-24]
  pull_request:
    branches: [main]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install
      - name: Validate shared Functions entrypoint syntax
        run: node --check functions/index.js
      - name: Validate Firebase Functions package entrypoint syntax
        run: node --check functions/bootstrap.js
      - name: Validate Authorization gateway syntax in isolation
        run: node --check functions/authorizationFunctions.js
      - name: Verify reset gate remains trial-only
        run: node - <<'NODE'
const fs=require("fs");
const s=fs.readFileSync("functions/index.js","utf8");
const required=[
  'trialOnly:true',
  'boardMembersPreserved:true',
  'RESET IRPA TRIAL DATA',
  'exports.resetTrialData'
];
for(const token of required){
  if(!s.includes(token)) throw new Error("Missing reset safety marker: "+token);
}
console.log("Trial-only reset safety markers present.");
NODE
