name: Firebase Functions Entrypoint Integrity Test

on: [push, pull_request]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install
      - name: Validate shared Functions entrypoint syntax
        run: node --check functions/index.js
      - name: Validate Firebase Functions package entrypoint syntax
        run: node --check functions/bootstrap.js
      - name: Validate Authorization gateway syntax in isolation
        run: node --check functions/authorizationFunctions.js
      - name: Verify reset gate remains trial-only
        run: node scripts/verify-functions-entrypoint-integrity.js

  gateway-e2e:
    if: github.ref == 'refs/heads/repair-document-signature-pathway-20260929' || github.head_ref == 'repair-document-signature-pathway-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Java runtime
        run: java -version
      - name: Install root dependencies
        run: npm install --no-audit --no-fund
      - name: Install gateway dependencies
        working-directory: drive-gateway
        run: npm install --no-audit --no-fund
      - name: Run Wrangler local Worker with Firestore emulator
        run: |
          set -o pipefail
          npx firebase-tools@15.29.0 emulators:exec --project demo-irpa-staging --only firestore "npm --prefix drive-gateway run test:e2e:local" | tee gateway-e2e-output.ndjson
      - name: Upload raw gateway E2E output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-e2e-raw-output
          path: gateway-e2e-output.ndjson
