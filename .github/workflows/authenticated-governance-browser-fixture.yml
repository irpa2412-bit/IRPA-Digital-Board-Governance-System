name: Authenticated Cross-Portal Browser Fixture

on:
  push:
    branches: [integration/five-portal-chain-20261018]
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/firebase/config.js"
      - "src/App.jsx"
      - "tests/browser/**"
      - "scripts/seed-authenticated-browser-fixture.cjs"
      - "playwright.authenticated-governance.config.mjs"
      - "firebase.json"
      - "firebase.emulator.test.json"
      - "firestore.rules"
      - ".github/workflows/authenticated-governance-browser-fixture.yml"
  pull_request:
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/firebase/config.js"
      - "src/App.jsx"
      - "src/pages/GrantIntelligencePortal.jsx"
      - "src/pages/grant-fundraising/**"
      - "src/styles/app.css"
      - "tests/browser/**"
      - "scripts/seed-authenticated-browser-fixture.cjs"
      - "playwright.authenticated-governance.config.mjs"
      - ".github/workflows/authenticated-governance-browser-fixture.yml"
      - "firebase.json"
      - "firebase.emulator.test.json"
      - "firestore.rules"
permissions:
  contents: read

concurrency:
  group: authenticated-cross-portal-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: demo-irpa-dgbs
    steps:
      - name: Checkout isolated pull request
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked application dependencies
        run: npm ci
      - name: Install Firebase Admin SDK for emulator-only fixture seeding
        run: npm --prefix functions install --omit=dev
      - name: Install Playwright runner without changing lockfile
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Authenticate against isolated Firebase Auth and Firestore emulators; test mobile and desktop
        run: npx firebase emulators:exec --config firebase.emulator.test.json --only auth,firestore --project demo-irpa-dgbs "node scripts/seed-authenticated-browser-fixture.cjs && npx playwright test --config=playwright.authenticated-governance.config.mjs"
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-cross-portal-browser-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
