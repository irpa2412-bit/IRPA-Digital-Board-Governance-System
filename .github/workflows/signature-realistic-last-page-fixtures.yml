name: Signature Realistic Last-Page Fixtures

on:
  pull_request:
    branches: [fix/last-page-diagnostics-20261102]
  push:
    branches: [fix/last-page-fixtures-20261102]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  realistic-last-page-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice and PDF fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice fonts-dejavu-core poppler-utils
      - name: Install Python fixture dependencies
        run: python -m pip install --break-system-packages python-docx pillow pikepdf
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate realistic Word and PDF fixtures
        run: python scripts/create-signature-realistic-fixtures.py
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Run PDF page-rendering unit tests
        run: npm run test:pdf-page-rendering
      - name: Run realistic last-page viewer acceptance
        run: node tests/signature-last-page-render.playwright.mjs
      - name: Run authenticated Add Signer and envelope pipeline using the realistic PDF
        run: node tests/signature-envelope-content.playwright.mjs
      - name: Upload fixture and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signature-realistic-last-page-evidence
          path: test-results/
          if-no-files-found: warn
