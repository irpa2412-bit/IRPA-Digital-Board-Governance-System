name: Meeting Room Authorization Boundary
# Verification-only regression workflow; no production deployment is performed.
on:
  push:
    branches: [feat/secure-meeting-invitation-flow-20261013, integration/five-portal-chain-20261018, stage/1-invitation]
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/pages/MeetingRoom.jsx"
      - "src/components/ControlledDocumentUpload.jsx"
      - "src/firebase/meetingRecords.js"
      - "functions/meetingRecords.js"
      - "functions/index.js"
      - "tests/meeting-room-authorization-boundary.test.mjs"
      - "tests/meeting-working-documents-security.test.mjs"
      - "tests/meeting-route-authorization.test.mjs"
      - "drive-gateway/src/meetingServices.mjs"
      - ".github/workflows/meeting-room-authorization-boundary.yml"
  pull_request:
    branches: [main, integration/five-portal-chain-20261018]
    paths:
      - "src/styles/portal-readability-standard.css"
      - "src/pages/MeetingRoom.jsx"
      - "src/components/ControlledDocumentUpload.jsx"
      - "src/firebase/meetingRecords.js"
      - "functions/meetingRecords.js"
      - "functions/index.js"
      - "tests/meeting-room-authorization-boundary.test.mjs"
      - "tests/meeting-working-documents-security.test.mjs"
      - "tests/meeting-route-authorization.test.mjs"
      - "drive-gateway/src/meetingServices.mjs"
      - ".github/workflows/meeting-room-authorization-boundary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-room-authorization-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify host and participant separation
        run: node --test tests/meeting-room-authorization-boundary.test.mjs tests/meeting-working-documents-security.test.mjs
      - name: Verify real Worker meeting route authorization
        run: node --test tests/meeting-route-authorization.test.mjs
