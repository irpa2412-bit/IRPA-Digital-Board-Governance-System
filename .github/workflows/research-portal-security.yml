name: Research Portal Security Gate
# Research security gate: dependency, Java, Firestore authorization tests, and production build.

on:
  push:
    branches:
      - repair/research-portal-access-control-20261008
  pull_request:
    branches:
      - feat/signature-trust-platform-20261007

jobs:
  research-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx firebase emulators:exec --only firestore --project demo-irpa-research-security "node --test tests/research-portal-security.test.mjs"
      - name: Build production application
        env:
          VITE_IRPA_ENV: production
          VITE_FIREBASE_API_KEY: "AIzaSyC2aMdxHD14nMnGiRyf4mSL1ixXdzBoOtE"
          VITE_FIREBASE_AUTH_DOMAIN: "irpa-digital-board-governance.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "irpa-digital-board-governance"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "217055978789"
          VITE_FIREBASE_APP_ID: "1:217055978789:web:937d1f2f781202cc1e26cc"
          VITE_FIREBASE_MEASUREMENT_ID: "G-XDJEBRBEVC"
        run: npm run build
