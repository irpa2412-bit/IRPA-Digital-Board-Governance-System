name: Research Portal Security Gate

on:
  push:
    branches:
      - repair/research-portal-access-control-20261008
  pull_request:
    branches:
      - feat/signature-trust-platform-20261007

permissions:
  contents: write

jobs:
  research-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Persist synchronized lockfile
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
          else
            git add package-lock.json
            git commit -m "chore: synchronize npm lockfile"
            git push
          fi
      - run: npm ci
      - run: npx firebase emulators:exec --only firestore --project demo-irpa-research-security "node --test tests/research-portal-security.test.mjs"
      - run: npm run build
