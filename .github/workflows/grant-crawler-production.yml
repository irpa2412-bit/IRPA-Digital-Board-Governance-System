name: IRPA Grant Crawler — Production Release
on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/grant-crawler-parallel/**"
      - ".github/workflows/grant-crawler-production.yml"
permissions:
  contents: read
concurrency:
  group: irpa-grant-crawler-production
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/grant-crawler-parallel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run parser, authentication and isolation tests
        run: npm run check
      - name: Validate production Worker bundle
        run: npx --yes wrangler@4 deploy --config wrangler.toml --dry-run --env production
      - name: Verify production isolation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = fs.readFileSync('wrangler.toml', 'utf8');
          if (config.includes('irpa-google-drive-gateway')) throw new Error('Crawler config references production gateway.');
          if (!config.includes('name = "irpa-grant-crawler-production"')) throw new Error('Production Worker name missing.');
          if (!config.includes('IRPA_ENVIRONMENT = "production"')) throw new Error('Production environment marker missing.');
          if (!config.includes('database_name = "irpa-grant-crawler-production"')) throw new Error('Production D1 database missing.');
          NODE
  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dashboard dependencies
        run: npm ci
      - name: Build production dashboard
        run: npm run build

  deploy-production:
    needs: [test, dashboard-build]
    # Main-branch release workflow deploys only the isolated crawler and never targets the Drive Gateway.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: irpa-grant-crawler-production
    defaults:
      run:
        working-directory: cloudflare/grant-crawler-parallel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Validate scoped deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GRANT_CRAWLER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GRANT_CRAWLER_CONTROL_TOKEN: ${{ secrets.GRANT_CRAWLER_CONTROL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "${#GRANT_CRAWLER_CONTROL_TOKEN}" -ge 32
          echo "Required secret presence validated; values are not printed."
      - name: Create or locate isolated production D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GRANT_CRAWLER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
          database_id="$(node - "$response" <<'NODE'
          const a = JSON.parse(process.argv[2]);
          if (!a.success) throw new Error('Cloudflare D1 listing failed.');
          const d = (a.result || []).find(x => x.name === 'irpa-grant-crawler-production');
          if (d?.uuid) process.stdout.write(d.uuid);
          NODE
          )"
          if [ -z "$database_id" ]; then
            created="$(curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"irpa-grant-crawler-production"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
            database_id="$(node - "$created" <<'NODE'
          const a = JSON.parse(process.argv[2]);
          if (!a.success || !a.result?.uuid) throw new Error('Could not create isolated production D1 database.');
          process.stdout.write(a.result.uuid);
          NODE
            )"
          fi
          node - "$database_id" <<'NODE'
          const fs = require('fs');
          const id = process.argv[2];
          if (!/^[0-9a-f-]{36}$/i.test(id)) throw new Error('Invalid production D1 identifier.');
          let config = fs.readFileSync('wrangler.toml', 'utf8');
          config = config.replaceAll('00000000-0000-0000-0000-000000000000', id);
          fs.writeFileSync('wrangler.toml', config);
          NODE
          echo "Isolated production database configured; ID is not printed."
      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GRANT_CRAWLER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply irpa-grant-crawler-production --config wrangler.toml --env production --remote
      - name: Deploy only the isolated production Worker
        id: deploy_production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_GRANT_CRAWLER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GRANT_CRAWLER_CONTROL_TOKEN: ${{ secrets.GRANT_CRAWLER_CONTROL_TOKEN }}
          GRANT_CRAWLER_FEED_URLS: ${{ secrets.GRANT_CRAWLER_FEED_URLS }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: |
          set -euo pipefail
          npx wrangler secret put CRAWLER_CONTROL_TOKEN --config wrangler.toml --env production <<< "$GRANT_CRAWLER_CONTROL_TOKEN"
          if [ -n "${GRANT_CRAWLER_FEED_URLS:-}" ]; then
            node - "$GRANT_CRAWLER_FEED_URLS" <<'NODE'
          const feeds = JSON.parse(process.argv[2]);
          if (!Array.isArray(feeds) || feeds.length > 30) throw new Error('Feed secret must be a JSON array with at most 30 URLs.');
          for (const value of feeds) {
            const url = new URL(value);
            if (url.protocol !== 'https:' || url.username || url.password || (url.port && url.port !== '443')) throw new Error('Every feed must use credential-free HTTPS on port 443.');
          }
          NODE
            printf '%s' "$GRANT_CRAWLER_FEED_URLS" | npx wrangler secret put GRANT_FEED_URLS_JSON --config wrangler.toml --env production
          fi
          if [ -n "${BRAVE_SEARCH_API_KEY:-}" ]; then
            printf '%s' "$BRAVE_SEARCH_API_KEY" | npx wrangler secret put BRAVE_SEARCH_API_KEY --config wrangler.toml --env production
          fi
          if deploy_log="$(npx wrangler deploy --config wrangler.toml --env production 2>&1)"; then
            printf '%s\n' "$deploy_log"
          else
            printf '%s\n' "$deploy_log" >&2
            exit 1
          fi
          worker_url="$(printf '%s\n' "$deploy_log" | grep -Eo 'https://irpa-grant-crawler-production\.[a-zA-Z0-9.-]+\.workers\.dev' | head -n 1 || true)"
          if [ -z "$worker_url" ]; then
            echo "Could not safely resolve the deployed production URL from Wrangler output." >&2
            exit 1
          fi
          health="$(curl --fail --silent --show-error --max-time 15 "$worker_url/health")"
          node - "$health" <<'NODE'
          const body = JSON.parse(process.argv[2]);
          if (body.service !== 'irpa-grant-crawler' || body.environment !== 'production' || body.storage !== 'configured' || body.ai !== 'configured') throw new Error('Production health response failed, including Workers AI binding.');
          if (body.identity !== 'firebase-id-token-verification-only' || body.draftStorage !== 'cloudflare-d1') throw new Error('Identity and Cloudflare D1 storage health markers are missing.');
          console.log('Production health verification passed; draft storage is Cloudflare D1 and Firebase is used only for identity verification.');
          NODE
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
      - name: Run live feed discovery and test AI eligibility on a public opportunity
        env:
          GRANT_CRAWLER_CONTROL_TOKEN: ${{ secrets.GRANT_CRAWLER_CONTROL_TOKEN }}
          PRODUCTION_WORKER_URL: ${{ steps.deploy_production.outputs.worker_url }}
        run: |
          set -euo pipefail
          result="$(curl --silent --show-error --max-time 90 -X POST \
            -H "Authorization: Bearer $GRANT_CRAWLER_CONTROL_TOKEN" \
            -H "Content-Type: application/json" \
            "$PRODUCTION_WORKER_URL/crawl")"
          printf '%s' "$result" | node scripts/staging-smoke-test.js

      - name: Smoke-test live fundraising search
        env:
          GRANT_CRAWLER_CONTROL_TOKEN: ${{ secrets.GRANT_CRAWLER_CONTROL_TOKEN }}
          PRODUCTION_WORKER_URL: ${{ steps.deploy_production.outputs.worker_url }}
        run: |
          node <<'NODE'
          const url = process.env.PRODUCTION_WORKER_URL + '/fundraising/search';
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 40000);
          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: {
                Authorization: 'Bearer ' + process.env.GRANT_CRAWLER_CONTROL_TOKEN,
                'Content-Type': 'application/json',
                Accept: 'application/json'
              },
              body: JSON.stringify({ query: 'pastoral rangeland restoration', mode: 'all' }),
              signal: controller.signal
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error('Production fundraising search HTTP ' + response.status + ': ' + String(body.error || body.message || 'No error detail').slice(0, 250));
            if (body.query !== 'pastoral rangeland restoration' || !Array.isArray(body.items) || !Array.isArray(body.providers) || !Array.isArray(body.errors)) {
              throw new Error('Production fundraising search response contract failed.');
            }
            if (body.errors.length >= 2) throw new Error('All live fundraising search requests failed: ' + JSON.stringify(body.errors).slice(0, 500));
            console.log('Live fundraising search passed with ' + body.resultCount + ' research leads; providers: ' + body.providers.join(', ') + '.');
          } finally { clearTimeout(timeout); }
          NODE

      - name: Smoke-test production AI document drafting and concept-note generation
        env:
          GRANT_CRAWLER_CONTROL_TOKEN: ${{ secrets.GRANT_CRAWLER_CONTROL_TOKEN }}
          PRODUCTION_WORKER_URL: ${{ steps.deploy_production.outputs.worker_url }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = process.env.PRODUCTION_WORKER_URL + '/assistant/analyze';
          const token = process.env.GRANT_CRAWLER_CONTROL_TOKEN;
          if (!token || token.length < 32) throw new Error('The production smoke-test token is missing or invalid.');
          const call = async (payload) => {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                Authorization: 'Bearer ' + token,
                'Content-Type': 'application/json',
                Accept: 'application/json'
              },
              body: JSON.stringify(payload),
              signal: AbortSignal.timeout(90000)
            });
            const body = await response.json().catch(() => ({}));
            const detail = String(body.error || body.message || 'No error detail').slice(0, 180);
            if (body.error && /4006|quota|neurons|daily free allocation|upgrade/i.test(body.error)) return { status: 'quota' };
            if (!response.ok) throw new Error('Production document endpoint HTTP ' + response.status + ': ' + detail);
            return { status: 'response', body };
          };
          const verifyDraft = (result, task) => {
            if (result.status === 'quota') return 'quota';
            const body = result.body;
            const draft = task === 'draft_message' ? body.draft : body.assessment?.concept_note?.draft;
            const metadata = task === 'draft_message' ? body : body.assessment?.concept_note;
            if (body.task !== task || typeof draft !== 'string' || draft.trim().length < (task === 'draft_message' ? 30 : 40)) {
              throw new Error('Production ' + task + ' endpoint returned no usable draft. Response keys: ' + Object.keys(body).join(', ') + '; sanitized error: ' + String(body.error || body.message || 'none').slice(0, 180));
            }
            if (metadata?.draft_source === 'deterministic_fallback' && metadata.requires_human_completion !== true) {
              throw new Error('Production ' + task + ' fallback is missing its human-review marker.');
            }
            if (metadata?.draft_source && !['workers_ai', 'deterministic_fallback'].includes(metadata.draft_source)) {
              throw new Error('Production ' + task + ' returned an unexpected draft-source marker.');
            }
            return metadata?.draft_source === 'deterministic_fallback' ? 'fallback' : 'success';
          };
          const messageResult = await call({
            task: 'draft_message',
            format: 'Formal letter',
            tone: 'Professional',
            length: 'Concise',
            instructions: 'Write a short production smoke-test draft confirming the IRPA document drafting assistant is available.'
          });
          const messageStatus = verifyDraft(messageResult, 'draft_message');
          if (messageStatus === 'quota') {
            console.warn('Workers AI daily quota is exhausted. The live endpoint returned a quota error; AI generation cannot be verified in this run.');
            process.exit(0);
          }
          console.log(messageStatus === 'fallback'
            ? 'Document-drafting endpoint passed with a labelled fallback scaffold; human completion is required.'
            : 'Production Workers AI document drafting returned a usable draft.');
          const conceptResult = await call({
            task: 'concept_note',
            title: 'IRPA AI smoke test: community rangeland restoration',
            description: 'Call for proposals for community-led rangeland restoration in Tanzania. Applications close 31 December 2026. Open to registered NGOs in Tanzania.',
            donorRequirements: 'Open to registered NGOs in Tanzania; deadline 31 December 2026.',
            url: 'https://example.org/irpa-ai-smoke-test',
            deadline: '2026-12-31',
            callStatus: 'open'
          });
          const conceptStatus = verifyDraft(conceptResult, 'concept_note');
          if (conceptStatus === 'quota') {
            console.warn('Workers AI quota became exhausted during the smoke test. Concept-note generation could not be verified in this run.');
          } else if (conceptStatus === 'fallback') {
            console.warn('Production concept-note endpoint returned a labelled fallback scaffold; human completion is required.');
          } else {
            console.log('Production Workers AI concept-note drafting returned a usable draft.');
          }
          NODE
