name: Signature startup preview verification
on:
  push:
    branches:
      - fix/signature-startup-boundary-20260929
permissions:
  contents: read
jobs:
  verify-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build each requested historical commit
        shell: bash
        run: |
          set +e
          git show "${GITHUB_SHA}:tests/signature-platform-startup.test.jsx" > /tmp/signature-platform-startup.test.jsx
          refs=(
            543b090ffccf36876fca39fd83bfa0e3289038c1
            ccb13fca931a75d58ffb0073e1991c2e3fb0263f
            79395397a984ac5015c495500ec346e7c57487f1
            079f23f7eeaaa600b220a961070121fe012c460f
            ac29406fe88e79d2a7f249205b3ca14ed6137aa9
          )
          failures=()
          for ref in "${refs[@]}"; do
            echo "=== HISTORICAL BUILD + SIGNATURE RENDER TEST: $ref ==="
            git checkout --detach "$ref"
            npm install
            npm install --no-save vitest@^3.2.4 @testing-library/react@^16.3.0 @testing-library/jest-dom@^6.8.0 jsdom@^26.1.0
            mkdir -p tests
            cp /tmp/signature-platform-startup.test.jsx tests/signature-platform-startup.test.jsx
            npm run build
            rc=$?
            if [ "$rc" -ne 0 ]; then
              failures+=("$ref")
              echo "HISTORICAL_BUILD_FAIL $ref"
              continue
            fi
            npx vitest run tests/signature-platform-startup.test.jsx --environment jsdom
            rc=$?
            if [ "$rc" -ne 0 ]; then
              failures+=("$ref")
              echo "HISTORICAL_SIGNATURE_RENDER_TEST_FAIL $ref"
            else
              echo "HISTORICAL_BUILD_AND_SIGNATURE_RENDER_TEST_PASS $ref"
            fi
          done
          echo "=== HISTORICAL BUILD SUMMARY ==="
          if [ "${#failures[@]}" -eq 0 ]; then
            echo "ALL_FIVE_HISTORICAL_BUILDS_PASS"
          else
            printf 'FIRST_FAIL_IN_REQUESTED_ORDER=%s\n' "${failures[0]}"
            printf 'ALL_FAILING_REFS=%s\n' "${failures[*]}"
          fi
          git checkout --detach "${GITHUB_SHA}"
          if [ "${#failures[@]}" -ne 0 ]; then exit 1; fi

      - name: Install current test dependencies
        run: |
          npm install
          npm install --no-save vitest@^3.2.4 @testing-library/react@^16.3.0 @testing-library/jest-dom@^6.8.0 jsdom@^26.1.0

      - name: Build repaired branch
        run: npm run build

      - name: Signature workspace render test
        run: npx vitest run tests/signature-platform-startup.test.jsx --environment jsdom

      - name: Clean URL and dual-URL routing test
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const s=fs.readFileSync("src/App.jsx","utf8");
          const initializer=s.match(/const\[active,setActive\]=useState\(\(\)=>\{const params=new URLSearchParams\(window\.location\.search\);const requested=params\.get\("adminModule"\)/);
          if(!initializer) throw new Error("adminModule routing initializer not found");
          if(s.includes('params.get("workspace")')) throw new Error("Unexpected workspace query routing found");
          if(!s.includes('window.location.hash')) console.log("HASH_NOT_READ_BY_SHELL=PASS");
          console.log("CLEAN_URL_EXPECTED_MODULE=Dashboard");
          console.log("ADMIN_MODULE_ONLY_EXPECTED_MODULE=Requested adminModule when authorized");
          console.log("DUAL_URL_EXPECTED_MODULE=Add Administrator because Shell consumes adminModule and does not consume #workspace");
          console.log("CLEAN_AND_DUAL_ROUTING_SOURCE_TEST: PASS");
          NODE

      - name: Deploy Hosting preview only
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
        run: |
          set -o pipefail
          npx firebase-tools hosting:channel:deploy signature-startup-fix-20260929 --project irpa-digital-board-governance --expires 7d 2>&1 | tee /tmp/firebase-preview.log
          url=$(grep -Eo 'https://[^[:space:]]+' /tmp/firebase-preview.log | grep -- '--signature-startup-fix-20260929' | tail -1)
          test -n "$url"
          echo "PREVIEW_URL=$url"
