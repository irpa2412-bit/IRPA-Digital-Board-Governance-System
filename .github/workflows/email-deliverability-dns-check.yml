name: Read-only IRPA email deliverability DNS check

on:
  pull_request:
    paths:
      - ".github/workflows/email-deliverability-dns-check.yml"
      - "docs/email-deliverability/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/email-deliverability-dns-check.yml"
      - "docs/email-deliverability/**"
  workflow_dispatch:
    inputs:
      dkim_selector_from_header:
        description: "Optional DKIM selector copied from a received message's DKIM-Signature header"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  dns-check:
    name: read-only-dns-authentication-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query MX, SPF, DKIM, DMARC, reverse DNS, SPF coverage and DNS blocklists
        env:
          DKIM_SELECTOR_FROM_HEADER: ""
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import dns from "node:dns/promises";
          import net from "node:net";
          import fs from "node:fs";

          const domain = "irpa.or.tz";
          const mailHost = "mail.irpa.or.tz";
          const rows = [];
          const report = (record, found, value, problem = "") => rows.push({record, found: found ? "YES" : "NO", value: String(value || "—").replace(/\|/g, "\\|").replace(/\n/g, " ").slice(0, 600), problem: String(problem || "").replace(/\|/g, "\\|").replace(/\n/g, " ").slice(0, 500)});
          const safe = async fn => { try { return await fn(); } catch (error) { return {error: String(error?.code || error?.message || "DNS lookup failed")}; } };
          const txt = async name => {
            const result = await safe(() => dns.resolveTxt(name));
            return Array.isArray(result) ? result.map(parts => parts.join("")) : [];
          };
          const resolve4 = async name => {
            const result = await safe(() => dns.resolve4(name));
            return Array.isArray(result) ? result : [];
          };
          const resolve6 = async name => {
            const result = await safe(() => dns.resolve6(name));
            return Array.isArray(result) ? result : [];
          };
          const mxResult = await safe(() => dns.resolveMx(domain));
          const mx = Array.isArray(mxResult) ? mxResult.sort((a,b)=>a.priority-b.priority) : [];
          report("MX " + domain, mx.length > 0, mx.map(x => x.priority + " " + x.exchange).join("; "), mx.length ? "" : (mxResult?.error || "No MX record found."));
          const spfRecords = (await txt(domain)).filter(value => /^v=spf1(?:\s|$)/i.test(value));
          report("SPF TXT " + domain, spfRecords.length === 1, spfRecords.join(" || "), spfRecords.length === 0 ? "SPF record is missing." : spfRecords.length > 1 ? "Multiple SPF records are invalid; publish one SPF record." : "");
          const mailA = await resolve4(mailHost);
          const mailAAAA = await resolve6(mailHost);
          report("A " + mailHost, mailA.length > 0, mailA.join(", "), mailA.length ? "" : "No IPv4 address found for the configured SMTP host.");
          report("AAAA " + mailHost, mailAAAA.length > 0, mailAAAA.join(", "), mailAAAA.length ? "IPv6 egress is not evaluated by this IPv4 SPF coverage check." : "No IPv6 address published.");
          const selectors = ["default","selector1","selector2","mail","k1"];
          const supplied = String(process.env.DKIM_SELECTOR_FROM_HEADER || "").trim().replace(/[^A-Za-z0-9_-]/g,"").slice(0,63);
          if (supplied && !selectors.includes(supplied)) selectors.push(supplied);
          const dkim = [];
          for (const selector of selectors) {
            const name = selector + "._domainkey." + domain;
            const records = await txt(name);
            const matches = records.filter(value => /v=DKIM1/i.test(value) && /p=[A-Za-z0-9+/=]+/.test(value));
            dkim.push({selector,name,records,matches});
            report("DKIM TXT " + name, matches.length > 0, matches.map(x=>x.slice(0,180)+(x.length>180?"…":"")).join("; "), matches.length ? "" : "No usable DKIM public-key TXT record found for this selector.");
          }
          const dmarcName = "_dmarc." + domain;
          const dmarcRecords = (await txt(dmarcName)).filter(value => /^v=DMARC1(?:\s|;|$)/i.test(value));
          const dmarc = dmarcRecords[0] || "";
          report("DMARC TXT " + dmarcName, dmarcRecords.length === 1, dmarcRecords.join(" || "), dmarcRecords.length === 0 ? "DMARC record is missing." : dmarcRecords.length > 1 ? "Multiple DMARC records are invalid." : !/\bp=(none|quarantine|reject)\b/i.test(dmarc) ? "DMARC policy tag p= is missing or invalid." : "");
          const ipv4ToBigInt = ip => ip.split(".").reduce((value,part)=>(value<<8n)|BigInt(Number(part)),0n);
          const ip4Matches = (ip,cidr) => {
            const [network,bitsText] = cidr.split("/");
            if(net.isIP(ip)!==4||net.isIP(network)!==4)return false;
            const bits=bitsText===undefined?32:Number(bitsText);
            if(!Number.isInteger(bits)||bits<0||bits>32)return false;
            const shift=BigInt(32-bits);
            return (ipv4ToBigInt(ip)>>shift)===(ipv4ToBigInt(network)>>shift);
          };
          const spfAuthorizes = async (host,ip,depth=0,seen=new Set()) => {
            if(depth>8||seen.has(host))return false;
            seen.add(host);
            const records=(await txt(host)).filter(value=>/^v=spf1(?:\s|$)/i.test(value));
            if(records.length!==1)return false;
            const terms=records[0].split(/\s+/).slice(1);
            for(const term0 of terms){
              const qualifier=term0[0]==="+"||term0[0]==="-"||term0[0]==="~"||term0[0]==="?"?term0[0]:"+";
              const term=term0.replace(/^[+\-~?]/,"");
              if(term.startsWith("ip4:")&&ip4Matches(ip,term.slice(4)))return qualifier==="+";
              if(term==="a"||term.startsWith("a:")){
                const target=term==="a"?host:term.slice(2).split("/")[0];
                if((await resolve4(target)).includes(ip))return qualifier==="+";
              }
              if(term==="mx"||term.startsWith("mx:")){
                const target=term==="mx"?host:term.slice(3).split("/")[0];
                const mxRows=await safe(()=>dns.resolveMx(target));
                if(Array.isArray(mxRows))for(const item of mxRows)if((await resolve4(item.exchange)).includes(ip))return qualifier==="+";
              }
              if(term.startsWith("include:")&&await spfAuthorizes(term.slice(8),ip,depth+1,new Set(seen)))return qualifier==="+";
              if(term==="all")return qualifier==="+";
            }
            const redirect=terms.find(term=>term.startsWith("redirect="));
            return redirect?spfAuthorizes(redirect.slice(9),ip,depth+1,new Set(seen)):false;
          };
          for (const ip of mailA) {
            const covered = await spfAuthorizes(domain,ip);
            report("SPF coverage of mail-host IPv4 " + ip, covered, spfRecords[0] || "No SPF record", covered ? "" : "The mail-host A record is not authorized by the SPF mechanisms found. Confirm the actual outbound SMTP IP with the host.");
            const ptr = await safe(() => dns.reverse(ip));
            const ptrRows = Array.isArray(ptr) ? ptr : [];
            report("PTR " + ip, ptrRows.length > 0, ptrRows.join(", "), ptrRows.length ? "" : (ptr?.error || "No reverse-DNS PTR record found."));
            const reversed = ip.split(".").reverse().join(".");
            for (const zone of ["zen.spamhaus.org","bl.spamcop.net"]) {
              const lookup = await safe(() => dns.resolve4(reversed + "." + zone));
              const listed = Array.isArray(lookup) && lookup.length > 0;
              const lookupError = lookup?.error || "";
              report("DNSBL " + zone + " for " + ip, listed, listed ? lookup.join(", ") : "No listing answer", listed ? "IP appears on this DNS blocklist." : lookupError && lookupError !== "ENOTFOUND" ? "Blocklist lookup did not complete cleanly: " + lookupError : "");
            }
          }
          report("Outgoing DKIM-Signature header evidence", false, "Not retrieved from a real recipient mailbox.", "A DNS public-key record does not prove that mail.irpa.or.tz signs outgoing messages. Confirm a DKIM-Signature header and its d= and s= values from a received message or provider mail log.");
          report("Actual SMTP egress IP", false, "Not exposed by DNS alone.", "The A record of mail.irpa.or.tz is only a candidate. The hosting provider must confirm the actual outbound IP from SMTP logs and compare it with SPF.");
          const table = [
            "| Record | Found | Value | Problem |",
            "|---|---|---|---|",
            ...rows.map(row => "| " + row.record + " | " + row.found + " | " + row.value + " | " + (row.problem || "—") + " |")
          ].join("\n");
          const md = "# IRPA email deliverability DNS report\n\nRead-only DNS lookups from a GitHub Actions runner. These checks do not send email or modify DNS.\n\n" + table + "\n";
          fs.writeFileSync(process.env.RUNNER_TEMP + "/irpa-email-dns-report.md", md);
          fs.writeFileSync(process.env.RUNNER_TEMP + "/irpa-email-dns-report.json", JSON.stringify(rows,null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          const required = rows.filter(row => row.record.startsWith("MX ") || row.record.startsWith("SPF TXT ") || row.record.startsWith("DKIM TXT ") || row.record.startsWith("DMARC TXT ") || row.record.startsWith("SPF coverage") || row.record.startsWith("PTR ") || row.record.startsWith("DNSBL "));
          const failures = required.filter(row => row.found !== "YES");
          console.log(JSON.stringify({records:rows.length,requiredChecks:required.length,failedChecks:failures.length,mailHostIPv4:mailA.length,dkimSelectors:dkim.map(item=>({selector:item.selector,found:item.matches.length>0}))},null,2));
          NODE
      - name: Preserve DNS report artifact
        run: |
          test -s "$RUNNER_TEMP/irpa-email-dns-report.md"
          test -s "$RUNNER_TEMP/irpa-email-dns-report.json"
