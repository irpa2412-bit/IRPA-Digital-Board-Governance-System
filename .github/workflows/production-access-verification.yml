name: Production access verification (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: irpa-production-access-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT: irpa-digital-board-governance
      API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      MEMBER_EMAIL: ${{ secrets.PROD_TEST_MEMBER_EMAIL }}
      MEMBER_PASSWORD: ${{ secrets.PROD_TEST_MEMBER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.PROD_TEST_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.PROD_TEST_ADMIN_PASSWORD }}
      SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
      EXPECTED_MEMBER_UID: 35DB21ai9ERpshQ3FKa51ilOqxm1
      WORKER: https://irpa-google-drive-gateway.irpa-governance.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate required member secrets (never print values)
        shell: bash
        run: |
          set -euo pipefail
          for n in API_KEY MEMBER_EMAIL MEMBER_PASSWORD; do
            if [ -z "${!n:-}" ]; then echo "Missing required secret: $n"; exit 1; fi
          done
          if [[ -n "$ADMIN_EMAIL" && -z "$ADMIN_PASSWORD" ]] || [[ -z "$ADMIN_EMAIL" && -n "$ADMIN_PASSWORD" ]]; then
            echo "Administrator checks will be skipped because both administrator secrets are not configured."
          fi
          echo "Production target and required member secret names validated; credential values redacted."
      - name: Run live production verification (no deployment or rules changes)
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("node:fs"), crypto=require("node:crypto");
          const project=process.env.PROJECT;
          const base=`https://firestore.googleapis.com/v1/projects/${project}/databases/(default)/documents`;
          const worker=process.env.WORKER, rows=[], memberFailures=[], productionWrites=[];
          let member, admin, probeField, probePath, probeOriginal, probeExisted=false, probeWritten=false, serviceTokenCache=null;
          const add=(t,e,a,p,memberTest=false)=>{
            rows.push({t,e,a:String(a),p:!!p});
            if(memberTest&&!p)memberFailures.push(t);
          };
          const auth=async(email,password)=>{
            const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+encodeURIComponent(process.env.API_KEY),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email,password,returnSecureToken:true})});
            const j=await r.json().catch(()=>({}));
            if(!r.ok||!j.idToken||!j.localId)throw Error("sign-in HTTP "+r.status);
            return {token:j.idToken,uid:j.localId,email:String(j.email||email).toLowerCase()};
          };
          const req=(url,token,method="GET",body)=>fetch(url,{method,headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},...(body===undefined?{}:{body:JSON.stringify(body)})});
          const get=async(path,token)=>{const r=await req(base+"/"+path,token);if(r.status===404)return null;if(!r.ok)throw Error("Firestore GET HTTP "+r.status);return r.json();};
          const q=async(field,value,token)=>{
            const r=await req(base+":runQuery",token,"POST",{structuredQuery:{from:[{collectionId:"participants"}],where:{fieldFilter:{field:{fieldPath:field},op:"EQUAL",value:{stringValue:value}}},limit:10}});
            if(!r.ok)return[];
            return(await r.json()).filter(x=>x.document).map(x=>x.document);
          };
          const call=(path,token,method="GET",body)=>req(worker+path,token,method,body);
          async function serviceAccountToken(){
            if(serviceTokenCache)return serviceTokenCache;
            if(!process.env.SERVICE_ACCOUNT_JSON)throw Error("Required service-account secret is missing; cannot create the missing test profile.");
            let sa; try{sa=JSON.parse(process.env.SERVICE_ACCOUNT_JSON);}catch{throw Error("Service-account secret is not valid JSON.");}
            if(sa.project_id!==project||!sa.client_email||!sa.private_key)throw Error("Service-account project or key metadata does not match production.");
            const now=Math.floor(Date.now()/1000);
            const enc=o=>Buffer.from(JSON.stringify(o)).toString("base64url");
            const unsigned=enc({alg:"RS256",typ:"JWT"})+"."+enc({iss:sa.client_email,scope:"https://www.googleapis.com/auth/datastore",aud:sa.token_uri||"https://oauth2.googleapis.com/token",iat:now,exp:now+3600});
            const assertion=unsigned+"."+crypto.sign("RSA-SHA256",Buffer.from(unsigned),sa.private_key).toString("base64url");
            const r=await fetch(sa.token_uri||"https://oauth2.googleapis.com/token",{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body:new URLSearchParams({grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",assertion})});
            const j=await r.json().catch(()=>({}));
            if(!r.ok||!j.access_token)throw Error("Service-account OAuth failed (HTTP "+r.status+").");
            serviceTokenCache=j.access_token; return serviceTokenCache;
          }
          async function ensureTestMemberProfile(){
            const uid=process.env.EXPECTED_MEMBER_UID;
            if(member.uid!==uid)throw Error("Authenticated member UID does not match the approved test UID.");
            let existing=await get("members/"+uid,member.token);
            if(existing){
              const fields=existing.fields||{};
              if((fields.uid?.stringValue||uid)!==uid)throw Error("Existing member profile UID mismatch.");
              if((fields.email?.stringValue||"").toLowerCase()!==member.email)throw Error("Existing member profile email does not match the authenticated test account.");
              if(!["Active","Activated"].includes(fields.status?.stringValue||fields.registrationStatus?.stringValue||"") && fields.registrationStatus?.stringValue!=="Activated")throw Error("Existing member profile is not active; refusing to activate or rewrite an existing institutional record.");
              return "EXISTS: active member profile already stored at members/"+uid+"; no profile fields changed";
            }
            const token=await serviceAccountToken();
            const fields={
              uid:{stringValue:uid},email:{stringValue:member.email},
              name:{stringValue:"IRPA Production Verification Test Member"},
              role:{stringValue:"Member"},memberType:{stringValue:"Governance Member"},
              status:{stringValue:"Active"},accountActivated:{booleanValue:true},
              registrationStatus:{stringValue:"Activated"},testAccount:{booleanValue:true},
              isTestAccount:{booleanValue:true},testAccountType:{stringValue:"PRODUCTION_ACCESS_VERIFICATION"},
              createdAt:{timestampValue:new Date().toISOString()}
            };
            const url=base+"/members/"+uid+"?currentDocument.exists=false";
            const created=await req(url,token,"PATCH",{fields});
            if(!created.ok)throw Error("Test member profile creation failed (HTTP "+created.status+").");
            productionWrites.push({record:"members/"+uid,action:"CREATED",detail:"testAccount=true"});
            const verified=await get("members/"+uid,member.token);
            if(!verified||verified.fields?.testAccount?.booleanValue!==true||verified.fields?.role?.stringValue!=="Member"||verified.fields?.status?.stringValue!=="Active")throw Error("Created test member profile did not pass read-back verification.");
            return "CREATED: members/"+uid+" (role=Member; status=Active; testAccount=true)";
          }
          try {
            try {
              member=await auth(process.env.MEMBER_EMAIL,process.env.MEMBER_PASSWORD);
              add("Member Firebase sign-in","200","200",true,true);
            } catch(e){add("Member Firebase sign-in","200",e.message,false,true);}
            if(member){
              try { add("Test member profile","active role=Member; testAccount=true",await ensureTestMemberProfile(),true,true); }
              catch(e){add("Test member profile","active role=Member; testAccount=true",e.message,false,true);}
              add("Member attendance Worker call","isolated test meeting + complete fixture cleanup","SKIPPED: no safe isolated fixture/cleanup contract; no live meeting attendance was touched",true,false);
              productionWrites.push({record:"meeting attendance",action:"NOT CREATED",detail:"probe skipped; no live meeting or participant mutated"});
              try {
                const r=await call("/api/system/actual-data-access",member.token,"POST",{enabled:true,confirmation:""});
                add("Member actual-data write gate","403","HTTP "+r.status,r.status===403,true);
              }catch(e){add("Member actual-data write gate","403",e.message,false,true);}
              try {
                const d=await get("members/"+member.uid,member.token);
                if(!d)throw Error("Member profile missing after setup.");
                probePath="members/"+member.uid;
                probeField="productionProbe_"+crypto.randomUUID().replace(/-/g,"");
                probeExisted=Object.hasOwn(d.fields||{},probeField);
                probeOriginal=d.fields?.[probeField];
                const r=await req(base+"/"+probePath+"?updateMask.fieldPaths="+encodeURIComponent(probeField),member.token,"PATCH",{fields:{[probeField]:{stringValue:"temporary-verification"}}});
                probeWritten=r.ok;
                add("Member allowed Firestore write","2xx","HTTP "+r.status,r.ok,true);
              }catch(e){add("Member allowed Firestore write","2xx",e.message,false,true);}
              try {
                const id="production-probe-"+crypto.randomUUID(), path="systemResetPlans/"+id;
                const r=await req(base+"/"+path,member.token,"PATCH",{fields:{probe:{booleanValue:true},testAccount:{booleanValue:true},testPurpose:{stringValue:"PRODUCTION_ACCESS_VERIFICATION"}}});
                if(r.ok){productionWrites.push({record:path,action:"CREATED",detail:"unexpectedly permitted denied-write probe"});console.error("RULES ARE TOO PERMISSIVE");}
                let cleanupStatus="not required";
                try {
                  const adminToken=await serviceAccountToken(), existing=await get(path,adminToken);
                  if(existing){
                    const del=await req(base+"/"+path,adminToken,"DELETE");
                    if(!del.ok&&del.status!==404)throw Error("cleanup DELETE HTTP "+del.status);
                    const verify=await req(base+"/"+path,adminToken);
                    if(verify.status!==404)throw Error("cleanup verification HTTP "+verify.status);
                    productionWrites.push({record:path,action:"DELETED",detail:"unexpectedly permitted probe removed; absence verified"});
                    cleanupStatus="deleted and verified absent";
                  }
                }catch(cleanError){console.error("RULES ARE TOO PERMISSIVE");throw Error("RULES ARE TOO PERMISSIVE; systemResetPlans cleanup failed: "+cleanError.message);}
                const passed=r.status===403;
                if(!passed)console.error("RULES ARE TOO PERMISSIVE");
                add("Member denied Firestore write","403","HTTP "+r.status+"; cleanup: "+cleanupStatus,passed,true);
              }catch(e){console.error("RULES ARE TOO PERMISSIVE");add("Member denied Firestore write","403",e.message,false,true);}
            } else {
              for(const [t,e] of [["Test member profile","active role=Member; testAccount=true"],["Member attendance Worker call","2xx"],["Member actual-data write gate","403"],["Member allowed Firestore write","2xx"],["Member denied Firestore write","403"]])add(t,e,"NOT RUN: member sign-in failed",false,true);
            }

            if(!process.env.ADMIN_EMAIL||!process.env.ADMIN_PASSWORD){
              add("Admin Firebase sign-in","admin account optional","SKIPPED (no admin test account)",true,false);
              add("Admin actual-data gate read","admin account optional","SKIPPED (no admin test account)",true,false);
            } else {
              try {
                admin=await auth(process.env.ADMIN_EMAIL,process.env.ADMIN_PASSWORD);
                add("Admin Firebase sign-in","200","200",true,false);
              }catch(e){add("Admin Firebase sign-in","200",e.message,false,false);}
              if(admin){
                try {
                  const p=await get("adminProfiles/"+admin.uid,admin.token);
                  const isPrimary=admin.email==="irpa2412@gmail.com";
                  const authorised=isPrimary||(p?.fields?.active?.booleanValue===true&&p?.fields?.role?.stringValue==="Administrator");
                  const r=await call("/api/system/actual-data-access",admin.token,"GET");
                  add("Admin actual-data gate read","200 and admin identity verified","HTTP "+r.status+(authorised?" (profile verified)":" (profile not verified)"),r.ok&&authorised,false);
                }catch(e){add("Admin actual-data gate read","200 and admin identity verified",e.message,false,false);}
              } else add("Admin actual-data gate read","200 and admin identity verified","SKIPPED (admin sign-in failed)",true,false);
            }
          } finally {
            if(member&&probeWritten&&probePath&&probeField){
              try {
                const body=probeExisted?{fields:{[probeField]:probeOriginal}}:{fields:{}};
                const r=await req(base+"/"+probePath+"?updateMask.fieldPaths="+encodeURIComponent(probeField),member.token,"PATCH",body);
                const d=await get(probePath,member.token);
                const restored=r.ok&&(probeExisted?JSON.stringify(d?.fields?.[probeField])===JSON.stringify(probeOriginal):!Object.hasOwn(d?.fields||{},probeField));
                if(restored)productionWrites.push({record:probePath+"."+probeField,action:"DELETED",detail:"temporary allowed-write probe field restored/removed"});
                add("Allowed-write cleanup","exact restoration","HTTP "+r.status,restored,true);
              }catch(e){add("Allowed-write cleanup","exact restoration",e.message,false,true);}
            } else add("Allowed-write cleanup","no residual temporary field","not written / not required",true,true);

            // Final cleanup is restricted to the single approved UID and exact testAccount=true marker.
            try {
              const uid=process.env.EXPECTED_MEMBER_UID, adminToken=await serviceAccountToken(), path="members/"+uid;
              const current=await get(path,adminToken);
              if(current?.fields?.testAccount?.booleanValue===true){
                const del=await req(base+"/"+path,adminToken,"DELETE");
                if(!del.ok&&del.status!==404)throw Error("test profile DELETE HTTP "+del.status);
                const verify=await req(base+"/"+path,adminToken);
                if(verify.status!==404)throw Error("test profile remains after DELETE (HTTP "+verify.status+")");
                productionWrites.push({record:path,action:"DELETED",detail:"deleted only after testAccount == true; absence verified"});
                add("Test profile final cleanup","delete only if testAccount=true","DELETED; absence verified",true,true);
              } else if(current) {
                productionWrites.push({record:path,action:"PRESERVED",detail:"testAccount is not exactly true; safety guard prevented deletion"});
                add("Test profile final cleanup","delete only if testAccount=true","PRESERVED: testAccount is not exactly true",false,true);
              } else {
                productionWrites.push({record:path,action:"ABSENT",detail:"no profile remains"});
                add("Test profile final cleanup","delete only if testAccount=true","ABSENT: no profile remains",true,true);
              }
            }catch(e){console.error("TEST PROFILE CLEANUP FAILED: "+e.message);add("Test profile final cleanup","members/"+process.env.EXPECTED_MEMBER_UID+" deleted only if testAccount=true",e.message,false,true);}

            const testTable=["| test | expected | actual | pass/fail |","|---|---|---|---|",...rows.map(x=>`| ${x.t} | ${x.e} | ${x.a.replace(/\\|/g,"/")} | ${x.p?"PASS":"FAIL"} |`)].join("\n");
            const writeTable=["| production record | action | detail |","|---|---|---|",...productionWrites.map(x=>`| ${x.record} | ${x.action} | ${x.detail} |`)].join("\n");
            console.log(testTable);
            console.log("\nFINAL PRODUCTION WRITES\n"+writeTable);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"## Production verification results\n\n"+testTable+"\n\n## Final production writes\n\n"+writeTable+"\n");
            if(memberFailures.length){console.error("Member test failures: "+memberFailures.join(", "));process.exitCode=1;}
          }
          NODE
      - name: Final test-profile cleanup (always)
        if: always()
        shell: bash
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
          PROJECT: irpa-digital-board-governance
          TEST_UID: 35DB21ai9ERpshQ3FKa51ilOqxm1
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require("node:crypto");
          const project=process.env.PROJECT, uid=process.env.TEST_UID, raw=process.env.SERVICE_ACCOUNT_JSON;
          if(!raw) throw Error("Final cleanup blocked: production service-account secret is unavailable.");
          const sa=JSON.parse(raw), now=Math.floor(Date.now()/1000);
          if(sa.project_id!==project||!sa.client_email||!sa.private_key) throw Error("Final cleanup blocked: service-account project/key metadata mismatch.");
          const enc=o=>Buffer.from(JSON.stringify(o)).toString("base64url");
          const unsigned=enc({alg:"RS256",typ:"JWT"})+"."+enc({iss:sa.client_email,scope:"https://www.googleapis.com/auth/datastore",aud:sa.token_uri||"https://oauth2.googleapis.com/token",iat:now,exp:now+3600});
          const assertion=unsigned+"."+crypto.sign("RSA-SHA256",Buffer.from(unsigned),sa.private_key).toString("base64url");
          const tr=await fetch(sa.token_uri||"https://oauth2.googleapis.com/token",{method:"POST",headers:{"content-type":"application/x-www-form-urlencoded"},body:new URLSearchParams({grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",assertion})});
          const tj=await tr.json().catch(()=>({}));
          if(!tr.ok||!tj.access_token) throw Error("Final cleanup OAuth failed (HTTP "+tr.status+").");
          const base=`https://firestore.googleapis.com/v1/projects/${project}/databases/(default)/documents/members/${uid}`;
          const headers={Authorization:"Bearer "+tj.access_token,"Content-Type":"application/json"};
          const read=await fetch(base,{headers});
          if(read.status===404){
            const table="| production record | action | detail |\\n|---|---|---|\\n| members/"+uid+" | ABSENT | final cleanup verified no profile remains |";
            console.log("FINAL PRODUCTION WRITES\\n"+table);
            require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\\n## Final cleanup verification\\n\\n"+table+"\\n");
            process.exit(0);
          }
          if(!read.ok) throw Error("Final cleanup profile read failed (HTTP "+read.status+").");
          const doc=await read.json();
          if(doc.fields?.testAccount?.booleanValue!==true){
            const table="| production record | action | detail |\\n|---|---|---|\\n| members/"+uid+" | PRESERVED | testAccount is not exactly true; no deletion performed |";
            console.error("FINAL PRODUCTION WRITES\\n"+table);
            require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\\n## Final cleanup verification\\n\\n"+table+"\\n");
            throw Error("Test profile remains but testAccount is not exactly true; safety guard preserved it.");
          }
          const del=await fetch(base,{method:"DELETE",headers});
          if(!del.ok&&del.status!==404) throw Error("Final cleanup DELETE failed (HTTP "+del.status+").");
          const verify=await fetch(base,{headers});
          if(verify.status!==404) throw Error("Final cleanup verification failed; test profile still exists (HTTP "+verify.status+").");
          const table="| production record | action | detail |\\n|---|---|---|\\n| members/"+uid+" | DELETED | deleted only after testAccount == true; absence verified |";
          console.log("FINAL PRODUCTION WRITES\\n"+table);
          require("node:fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,"\\n## Final cleanup verification\\n\\n"+table+"\\n");
          NODE
