name: Deploy IRPA Gateway to Cloudflare Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-gateway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout controlled revision
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drive-gateway/package-lock.json

      - name: Verify default production gateway configuration
        shell: bash
        run: |
          set -euo pipefail
          config=drive-gateway/wrangler.toml
          test -f "$config"

          # Validate only the default configuration, before any named [env.*] section.
          default_config="$(awk '/^\[env\./ { exit } { print }' "$config")"
          grep -q '^name = "irpa-google-drive-gateway"$' <<< "$default_config"
          grep -q '^keep_vars = true$' <<< "$default_config"
          grep -q '^FIREBASE_PROJECT_ID = "irpa-digital-board-governance"
          grep -q '^DRIVE_MOCK = "false"$' <<< "$default_config"
          grep -q '^LOCAL_TEST_MODE = "false"$' <<< "$default_config"
          ! grep -Eq '^IRPA_ENVIRONMENT[[:space:]]*=[[:space:]]*"staging"$' <<< "$default_config"
          ! grep -q '^FIREBASE_PROJECT_ID = "irpa-dbg-staging-a73ec"$' <<< "$default_config"

          default_kv_id="$(awk '
            /^\[\[kv_namespaces\]\]/ { in_kv=1; next }
            /^\[/ { in_kv=0 }
            in_kv && /^id[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*"/, "")
              sub(/".*$/, "")
              print
              exit
            }
          ' <<< "$default_config")"
          test -n "$default_kv_id"
          test "$default_kv_id" = "ccdbffa662ac48bfbdf7f4b1f62ca941"
          test "$default_kv_id" != "5ea76010553049a2b98c8493c37fbbc4"
          echo "Default production configuration verified; named [env.staging] configuration is permitted."

      - name: Install gateway dependencies
        working-directory: drive-gateway
        run: npm ci

      - name: Run gateway E2E tests
        working-directory: drive-gateway
        run: npm test

      - name: Verify Cloudflare credentials without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" >/tmp/token.json
          node -e 'const x=require("/tmp/token.json"); if(!x.success) process.exit(1);'

      - name: Sync Firebase service account secret to production Worker
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        working-directory: drive-gateway
        shell: bash
        run: |
          set -euo pipefail
          # Pass the secret through stdin only; never print or persist its contents.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON --config wrangler.toml --name irpa-google-drive-gateway

      - name: Warn when Firebase service account secret is not configured
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON == '' }}
        shell: bash
        run: echo "::warning::GitHub Actions secret FIREBASE_SERVICE_ACCOUNT_JSON is missing; production Worker secret was not updated."

      - name: Deploy default production Worker environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_SHA: ${{ github.sha }}
        working-directory: drive-gateway
        run: |
          set -euo pipefail
          echo "Deploying production Worker from commit ${GIT_SHA} (no --env override)."
          npx wrangler deploy --config wrangler.toml --name irpa-google-drive-gateway --var "GIT_SHA:${GIT_SHA}"

      - name: Verify production gateway health
        env:
          GIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://irpa-google-drive-gateway.irpa-governance.workers.dev/health"
          status="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "$url")"
          echo "Production gateway health HTTP status: $status"
          test "$status" = "200"
          node -e '
            const fs = require("node:fs");
            const health = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
            if (health.ok !== true || health.environment === "staging" || health.commit !== process.env.GIT_SHA) {
              console.error("Production gateway health payload or commit stamp does not match this deployment.");
              process.exit(1);
            }
            console.log("Production gateway health payload OK; commit matches deployment: " + health.commit);
          '
 <<< "$default_config"
          grep -q '^IRPA_WORKER_NAME = "irpa-google-drive-gateway"
          grep -q '^DRIVE_MOCK = "false"$' <<< "$default_config"
          grep -q '^LOCAL_TEST_MODE = "false"$' <<< "$default_config"
          ! grep -Eq '^IRPA_ENVIRONMENT[[:space:]]*=[[:space:]]*"staging"$' <<< "$default_config"
          ! grep -q '^FIREBASE_PROJECT_ID = "irpa-dbg-staging-a73ec"$' <<< "$default_config"

          default_kv_id="$(awk '
            /^\[\[kv_namespaces\]\]/ { in_kv=1; next }
            /^\[/ { in_kv=0 }
            in_kv && /^id[[:space:]]*=/ {
