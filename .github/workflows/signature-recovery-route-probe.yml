name: Signature Recovery Public Route Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/signature-recovery-route-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read production Gateway health version
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "https://irpa-google-drive-gateway.irpa-governance.workers.dev/health?probe=$GITHUB_SHA" -o "$RUNNER_TEMP/gateway-health.json"
          node -e 'const h=require(process.argv[1]); console.log("GATEWAY_HEALTH="+JSON.stringify({ok:h.ok,environment:h.environment,commit:h.commit,workerCommit:h.workerCommit,version:h.version,workerVersion:h.workerVersion}));' "$RUNNER_TEMP/gateway-health.json"
      - name: Read public build stamps from Firebase and Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          for item in "firebase|https://irpa-digital-board-governance.web.app" "cloudflare|https://irpa-digital-board-governance-frontend.irpa-governance.workers.dev"; do
            label="${item%%|*}"
            base="${item#*|}"
            file="$RUNNER_TEMP/$label-index.html"
            curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$base/?__irpa_probe=$GITHUB_SHA" -o "$file"
            node - "$file" "$label" <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync(process.argv[2], "utf8");
          const read = name => html.match(new RegExp('name="' + name + '" content="([^"]+)"', "i"))?.[1] || "MISSING";
          console.log(process.argv[3].toUpperCase() + "_BUILD_STAMP=" + JSON.stringify({version: read("irpa-build-version"), time: read("irpa-build-time")}));
          NODE
          done
      - name: Probe production recovery routes without credentials or envelope access
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://irpa-google-drive-gateway.irpa-governance.workers.dev"
          probe() {
            local label="$1"
            local path="$2"
            local body_file status
            body_file="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 --output "$body_file" --write-out '%{http_code}' "$BASE$path" || true)"
            printf '%s status=%s body=' "$label" "${status:-000}"
            head -c 100 "$body_file" | tr '\n' ' '
            printf '\n'
            rm -f "$body_file"
          }
          probe "evidence-envelope-id" "/api/recovery/envelopes/ENV-0000000000000000/evidence"
          probe "evidence-document-reference-id" "/api/recovery/envelopes/IRPA-ENV-2026-00000000/evidence"
          probe "recovery-queue" "/api/recovery/envelopes"
          probe "nonsense" "/__signature_recovery_route_probe_not_a_real_route__"
