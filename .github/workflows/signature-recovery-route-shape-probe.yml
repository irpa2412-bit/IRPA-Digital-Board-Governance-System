name: Signature Recovery Route Shape Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/signature-recovery-route-shape-probe.yml"
      - "docs/signature-recovery/route-shape-probe-change-record-2026-11-22.md"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe unauthenticated recovery routes and controls
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://irpa-google-drive-gateway.irpa-governance.workers.dev"
          probe() {
            local label="$1" path="$2" body_file status
            body_file="$(mktemp)"
            status="$(curl --silent --show-error --max-time 20 --output "$body_file" --write-out '%{http_code}' "$BASE$path" || true)"
            printf '%s status=%s body=' "$label" "${status:-000}"
            head -c 100 "$body_file" | tr '\n' ' '
            printf '\n'
            rm -f "$body_file"
          }
          probe "evidence-envelope-id" "/api/recovery/envelopes/ENV-0000000000000000/evidence"
          probe "evidence-document-reference" "/api/recovery/envelopes/IRPA-ENV-2026-00000000/evidence"
          probe "owner-queue" "/api/recovery/envelopes?limit=50&offset=0"
          probe "nonsense-control" "/__signature_recovery_route_probe_not_a_real_route__"
