name: Deploy IRPA Governance with Firebase CLI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install web dependencies
        run: npm install
      - name: Build production web application
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_DRIVE_GATEWAY_URL: ${{ secrets.VITE_GOOGLE_DRIVE_GATEWAY_URL }}
          VITE_GATEWAY_ORIGIN: ${{ secrets.VITE_GATEWAY_ORIGIN || 'https://irpa-google-drive-gateway.irpa-governance.workers.dev' }}
          VITE_GOOGLE_WEATHER_API_KEY: ${{ secrets.VITE_GOOGLE_WEATHER_API_KEY }}
        run: npm run build
      - name: Configure Firebase CLI authentication
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Deploy Hosting and Firestore using Firebase CLI (no Docker action)
        run: npx --yes firebase-tools deploy --project irpa-digital-board-governance --only hosting,firestore --non-interactive
      - name: Install Cloud Functions dependencies
        run: npm --prefix functions install --omit=dev
      - name: Deploy multilingual transcript translation callable
        id: translation
        continue-on-error: true
        run: npx --yes firebase-tools deploy --project irpa-digital-board-governance --only functions:translateMeetingTranscript --non-interactive
      - name: Report translation callable deployment status
        if: always()
        env:
          TRANSLATION_OUTCOME: ${{ steps.translation.outcome }}
        run: |
          if [ "$TRANSLATION_OUTCOME" = "success" ]; then
            echo "TRANSLATION_CALLABLE_DEPLOYED=true"
          else
            echo "::warning::Translation callable was not deployed. Hosting deployment can still succeed; check Cloud Functions billing, API enablement and service-account permissions."
          fi
      - name: Verify production page responds
        run: |
          set -e
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 30 https://irpa-digital-board-governance.web.app/ -o /tmp/irpa-live.html
          grep -q '<html' /tmp/irpa-live.html
          echo "Firebase Hosting returned a valid HTML response."
