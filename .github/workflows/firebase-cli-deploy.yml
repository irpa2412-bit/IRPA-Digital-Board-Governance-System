name: Deploy IRPA Governance with Firebase CLI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install web dependencies
        run: npm install

      - name: Mandatory full-source readability and contrast check
        run: npm run check:production-readability
      - name: Build production web application
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_DRIVE_GATEWAY_URL: ${{ secrets.VITE_GOOGLE_DRIVE_GATEWAY_URL }}
          VITE_GATEWAY_ORIGIN: ${{ secrets.VITE_GATEWAY_ORIGIN || 'https://irpa-google-drive-gateway.irpa-governance.workers.dev' }}
          VITE_GOOGLE_WEATHER_API_KEY: ${{ secrets.VITE_GOOGLE_WEATHER_API_KEY }}
          VITE_GRANT_CRAWLER_WORKER_URL: ${{ secrets.VITE_GRANT_CRAWLER_WORKER_URL }}
        run: npm run build

      - name: Independent production readability verification
        run: npm run verify:production-readability
      - name: Require Cloudflare migration secrets before production cutover
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_FIRESTORE_SA: ${{ secrets.CLOUDFLARE_FIREBASE_SERVICE_ACCOUNT_JSON }}
          CRAWLER_URL: ${{ secrets.VITE_GRANT_CRAWLER_WORKER_URL }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is required before production cutover."; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is required before production cutover."; exit 1; }
          test -n "$CF_FIRESTORE_SA" || { echo "::error::CLOUDFLARE_FIREBASE_SERVICE_ACCOUNT_JSON is required before production cutover."; exit 1; }
          test -n "$CRAWLER_URL" || { echo "::error::VITE_GRANT_CRAWLER_WORKER_URL is required before production cutover."; exit 1; }
          node -e 'const s=JSON.parse(process.env.CF_FIRESTORE_SA); if(!s.client_email||!s.private_key||!s.project_id)process.exit(1); if(s.project_id!=="irpa-digital-board-governance")process.exit(2);'
      - name: Deploy grant crawler to Cloudflare Workers
        working-directory: cloudflare/grant-crawler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.CLOUDFLARE_FIREBASE_SERVICE_ACCOUNT_JSON }}
          CRAWLER_URL: ${{ secrets.VITE_GRANT_CRAWLER_WORKER_URL }}
        run: |
          npx --yes wrangler deploy
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | npx --yes wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20 "$CRAWLER_URL/health"
      - name: Configure Firebase CLI authentication
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Deploy Hosting and Firestore using Firebase CLI (no Docker action)
        run: npx --yes firebase-tools deploy --project irpa-digital-board-governance --only hosting,firestore --non-interactive
      - name: Deploy multilingual transcript translation callable
        id: translation
        continue-on-error: true
        run: npx --yes firebase-tools deploy --project irpa-digital-board-governance --only functions:translateMeetingTranscript --non-interactive
      - name: Report translation callable deployment status
        if: always()
        env:
          TRANSLATION_OUTCOME: ${{ steps.translation.outcome }}
        run: |
          if [ "$TRANSLATION_OUTCOME" = "success" ]; then
            echo "TRANSLATION_CALLABLE_DEPLOYED=true"
          else
            echo "::warning::Translation callable was not deployed. Hosting deployment can still succeed; check Cloud Functions billing, API enablement and service-account permissions."
          fi
      - name: Verify production page responds
        run: |
          set -e
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 30 https://irpa-digital-board-governance.web.app/ -o /tmp/irpa-live.html
          grep -q '<html' /tmp/irpa-live.html
          echo "Firebase Hosting returned a valid HTML response."
