name: Temporary Lockfile Refresh

on:
  push:
    branches:
      - security/assessment-remediation-20261012

permissions:
  contents: write

concurrency:
  group: irpa-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile for declared dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when it changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "LOCKFILE_ALREADY_CURRENT=true"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push -m generated-lockfile -- package-lock.json
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git stash pop
          git add package-lock.json
          git commit -m "chore: refresh lockfile for supported ESLint"
          git push origin "HEAD:${GITHUB_REF_NAME}"
