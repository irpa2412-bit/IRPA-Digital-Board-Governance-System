name: Meeting workflow YAML validation
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/meeting-portal-fixture-browser.yml"
      - ".github/workflows/meeting-workflow-yaml-validation.yml"
permissions:
  contents: read
jobs:
  validate-meeting-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate isolated meeting workflow
        run: "$(go env GOPATH)/bin/actionlint" .github/workflows/meeting-portal-fixture-browser.yml
