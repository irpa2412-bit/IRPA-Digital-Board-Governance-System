name: Signature Approval Real Chain

on:
  push:
    branches:
      - feat/signature-approval-link-20261022
    paths:
      - "tests/signature-approval-real-chain.test.mjs"
      - "firebase.json"
      - ".github/workflows/signature-approval-real-chain.yml"
      - "drive-gateway/src/documentApproval.mjs"
      - "drive-gateway/src/documentLifecycle.mjs"
      - "drive-gateway/src/signing.mjs"
      - "src/firebase/signaturePlatform.js"
      - "src/firebase/signatureStorage.js"
      - "src/firebase/documentLifecycle.js"
  pull_request:
    paths:
      - "tests/signature-approval-real-chain.test.mjs"
      - "firebase.json"
      - ".github/workflows/signature-approval-real-chain.yml"
      - "drive-gateway/src/documentApproval.mjs"
      - "drive-gateway/src/documentLifecycle.mjs"
      - "drive-gateway/src/signing.mjs"
      - "src/firebase/signaturePlatform.js"
      - "src/firebase/signatureStorage.js"
      - "src/firebase/documentLifecycle.js"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signature-approval-real-chain-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  real-chain-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix drive-gateway install --no-audit --no-fund
      - name: Run signature approval regression with Auth and Firestore emulators
        env:
          IRPA_FIREBASE_PROJECT_ID: demo-irpa-staging
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: |
          set -euo pipefail
          export GCLOUD_PROJECT="$IRPA_FIREBASE_PROJECT_ID"
          test "$GCLOUD_PROJECT" = "$IRPA_FIREBASE_PROJECT_ID"
          npx firebase emulators:exec --project "$IRPA_FIREBASE_PROJECT_ID" --only auth,firestore "GCLOUD_PROJECT='$IRPA_FIREBASE_PROJECT_ID' IRPA_FIREBASE_PROJECT_ID='$IRPA_FIREBASE_PROJECT_ID' FIREBASE_AUTH_EMULATOR_HOST='$FIREBASE_AUTH_EMULATOR_HOST' FIRESTORE_EMULATOR_HOST='$FIRESTORE_EMULATOR_HOST' node --test tests/signature-approval-real-chain.test.mjs" | tee signature-approval-real-chain.log
      - name: Publish per-case results and annotations
        if: always()
        env:
          TEST_LOG: signature-approval-real-chain.log
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const log = fs.existsSync(process.env.TEST_LOG) ? fs.readFileSync(process.env.TEST_LOG, 'utf8') : '';
          const summary = [];
          const cases = [
            ['a','CASE (a)'],['b','CASE (b)'],['c','CASE (c)'],['d','CASE (d)'],
            ['e1','CASE (e1)'],['e2','CASE (e2)'],['e3','CASE (e3)'],['f','CASE (f)'],['g','CASE (g)']
          ];
          const esc = s => String(s).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');
          for (const [id, marker] of cases) {
            const start = log.indexOf(`# Subtest: ${marker}`);
            if (start < 0) {
              const msg = 'Case did not run or its TAP output could not be matched; inspect test log.';
              console.log(`::error title=${id}::${esc(msg)}`);
              summary.push({id,status:'FAIL / NOT REPORTED',first:msg,classification:'TEST ENVIRONMENT — case output missing'});
              continue;
            }
            const next = cases.slice(cases.findIndex(c=>c[0]===id)+1).map(c=>log.indexOf(`# Subtest: ${c[1]}`,start+marker.length)).filter(n=>n>=0);
            const block = log.slice(start, next.length ? Math.min(...next) : log.length);
            const failed = /\nnot ok \d+ - CASE/m.test(block);
            const assertion = block.match(/\n\s*(\d{3} !== \d{3} [^\n]+)|\n\s*(AssertionError[^\n]*|Expected[^\n]*|error: [^\n]+)/);
            const first = (assertion?.[1] || assertion?.[2] || (failed ? 'First failing assertion text not found in TAP block.' : 'All assertions in this case passed.')).trim();
            const classification = failed ? (/Select between 1 and 4 archives|audit collection query must succeed|emulator|timed out|not reachable|fetch failed|ECONNREFUSED/i.test(first) ? 'TEST ENVIRONMENT' : 'PRODUCT GAP — assertion failed in real-handler chain') : 'PASS';
            if (failed) console.log(`::error title=${id}::${esc(first)}`);
            else console.log(`::notice title=${id}::PASS — ${esc(first)}`);
            summary.push({id,status:failed?'FAIL':'PASS',first,classification});
          }
          const table = ['| Case | Result | First failing assertion / HTTP status | Classification |','|---|---|---|---|',...summary.map(r=>`| ${r.id} | ${r.status} | ${r.first.replace(/\|/g,'\\\|')} | ${r.classification} |`)].join('\n');
          console.log('\n### Signature Approval Real Chain — cases\n\n'+table);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n### Signature Approval Real Chain — cases\n\n'+table+'\n');
          NODE
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signature-approval-real-chain-diagnostics
          path: signature-approval-real-chain.log
