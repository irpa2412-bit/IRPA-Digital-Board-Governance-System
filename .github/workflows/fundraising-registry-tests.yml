name: Fundraising Source Registry Tests

on:
  pull_request:
    paths:
      - "src/pages/GrantIntelligencePortal.jsx"
      - "src/pages/grant-fundraising/**"
      - "tests/fundraising-source-registry.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fundraising-registry-tests.yml"
  push:
    branches:
      - "plan/fundraising-csr-esg-safe-expansion"
    paths:
      - "src/pages/GrantIntelligencePortal.jsx"
      - "src/pages/grant-fundraising/**"
      - "tests/fundraising-source-registry.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fundraising-registry-tests.yml"

permissions:
  contents: read

concurrency:
  group: fundraising-registry-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated fundraising change
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run fundraising registry unit tests
        run: npm run test:fundraising-registry
      - name: Build application without deploying
        env:
          VITE_IRPA_ENV: staging
          VITE_FIREBASE_API_KEY: "AIzaSyA6UmHtP-mRr99rBw57_-qrD4_mFSBnZ38"
          VITE_FIREBASE_AUTH_DOMAIN: "irpa-dbg-staging-a73ec.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "irpa-dbg-staging-a73ec"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "1018976634858"
          VITE_FIREBASE_APP_ID: "1:1018976634858:web:e73e9e09f55a76ade25493"
          VITE_FIREBASE_MEASUREMENT_ID: ""
        run: npm run build
