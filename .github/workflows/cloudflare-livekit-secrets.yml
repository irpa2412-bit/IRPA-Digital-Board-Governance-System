name: Bind LiveKit and R2 Secrets to Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      confirm_binding:
        description: "Type BIND-LIVEKIT-R2-SECRETS to bind production Worker secrets"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-livekit-production-secrets
  cancel-in-progress: false

jobs:
  bind-secrets:
    if: ${{ inputs.confirm_binding == 'BIND-LIVEKIT-R2-SECRETS' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: drive-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drive-gateway/package-lock.json

      - name: Validate production LiveKit and R2 secret inputs without printing values
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_EGRESS_R2_ENDPOINT: ${{ secrets.LIVEKIT_EGRESS_R2_ENDPOINT }}
          LIVEKIT_EGRESS_R2_BUCKET: ${{ secrets.LIVEKIT_EGRESS_R2_BUCKET }}
          LIVEKIT_EGRESS_R2_ACCESS_KEY_ID: ${{ secrets.LIVEKIT_EGRESS_R2_ACCESS_KEY_ID }}
          LIVEKIT_EGRESS_R2_SECRET_ACCESS_KEY: ${{ secrets.LIVEKIT_EGRESS_R2_SECRET_ACCESS_KEY }}
          LIVEKIT_EGRESS_R2_REGION: ${{ secrets.LIVEKIT_EGRESS_R2_REGION }}
        shell: bash
        run: |
          set -euo pipefail
          for name in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET LIVEKIT_EGRESS_R2_ENDPOINT LIVEKIT_EGRESS_R2_BUCKET LIVEKIT_EGRESS_R2_ACCESS_KEY_ID LIVEKIT_EGRESS_R2_SECRET_ACCESS_KEY LIVEKIT_EGRESS_R2_REGION; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing production environment secret: ${name}"; exit 1; fi
          done
          node --input-type=module <<'NODE'
          const url = new URL(process.env.LIVEKIT_URL);
          if (url.protocol !== "wss:" || !url.hostname) throw new Error("LIVEKIT_URL must be a secure wss:// endpoint.");
          if (["devkey"].includes(process.env.LIVEKIT_API_KEY) || process.env.LIVEKIT_API_SECRET === "secret" || process.env.LIVEKIT_API_SECRET.length < 32) throw new Error("Refusing default or weak LiveKit credentials.");
          const endpoint = new URL(process.env.LIVEKIT_EGRESS_R2_ENDPOINT);
          if (endpoint.protocol !== "https:" || !/\.r2\.cloudflarestorage\.com$/i.test(endpoint.hostname) || endpoint.pathname !== "/" || endpoint.search || endpoint.hash) throw new Error("R2 endpoint must be a Cloudflare R2 HTTPS S3 endpoint.");
          if (!/^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$/.test(process.env.LIVEKIT_EGRESS_R2_BUCKET)) throw new Error("R2 bucket name is invalid.");
          if (process.env.LIVEKIT_EGRESS_R2_REGION !== "auto") throw new Error("Cloudflare R2 region must be auto.");
          NODE

      - name: Install pinned Worker dependencies
        run: npm ci --no-audit --no-fund

      - name: Bind Worker secrets through Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_EGRESS_R2_ENDPOINT: ${{ secrets.LIVEKIT_EGRESS_R2_ENDPOINT }}
          LIVEKIT_EGRESS_R2_BUCKET: ${{ secrets.LIVEKIT_EGRESS_R2_BUCKET }}
          LIVEKIT_EGRESS_R2_ACCESS_KEY_ID: ${{ secrets.LIVEKIT_EGRESS_R2_ACCESS_KEY_ID }}
          LIVEKIT_EGRESS_R2_SECRET_ACCESS_KEY: ${{ secrets.LIVEKIT_EGRESS_R2_SECRET_ACCESS_KEY }}
          LIVEKIT_EGRESS_R2_REGION: ${{ secrets.LIVEKIT_EGRESS_R2_REGION }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          umask 077
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          node --input-type=module > "$secret_file" <<'NODE'
          const names = [
            "LIVEKIT_URL", "LIVEKIT_API_KEY", "LIVEKIT_API_SECRET",
            "LIVEKIT_EGRESS_R2_ENDPOINT", "LIVEKIT_EGRESS_R2_BUCKET",
            "LIVEKIT_EGRESS_R2_ACCESS_KEY_ID", "LIVEKIT_EGRESS_R2_SECRET_ACCESS_KEY",
            "LIVEKIT_EGRESS_R2_REGION"
          ];
          process.stdout.write(JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name]])));
          NODE
          npx wrangler secret bulk "$secret_file" --config wrangler.toml

      - name: Confirm binding command completed
        if: success()
        run: echo "Cloudflare Worker secret binding completed; secret values were not printed."
