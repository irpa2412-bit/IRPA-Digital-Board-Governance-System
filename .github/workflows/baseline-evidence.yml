name: Protected Portal Baseline Evidence

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/baseline-evidence.yml"

permissions:
  contents: read

concurrency:
  group: protected-baseline-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline-smoke:
    name: baseline-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable production baseline
        uses: actions/checkout@v4
        with:
          ref: 25ddcc6d8f89b6a4103c37a254fbd2af0c26febe
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies and build baseline application
        run: npm ci && npm run build
      - name: Install Chromium for production-browser-equivalent startup smoke
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Start built application and verify browser startup
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/irpa-preview.log 2>&1 &
          echo $! > /tmp/irpa-preview.pid
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          const url = "http://127.0.0.1:4173/";
          let response;
          for (let attempt = 0; attempt < 40; attempt++) {
            try {
              response = await fetch(url);
              if (response.ok) break;
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 1500));
          }
          if (!response?.ok) throw new Error("Built application preview failed startup: " + (response?.status ?? "no response"));
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1366, height: 900 } });
            const errors = [];
            page.on("pageerror", error => errors.push(error.message));
            const navigation = await page.goto(url, { waitUntil: "domcontentloaded", timeout: 30000 });
            if (!navigation || navigation.status() !== 200) throw new Error("Browser navigation did not return HTTP 200.");
            await page.waitForFunction(() => {
              const root = document.querySelector("#root");
              return Boolean(root && root.children.length > 0 && root.innerText.trim().length > 0);
            }, { timeout: 30000 });
            if (errors.length) throw new Error("Browser startup errors: " + errors.join(" | "));
            console.log(JSON.stringify({ baseline: "25ddcc6d8f89b6a4103c37a254fbd2af0c26febe", url, http: navigation.status(), rootRendered: true, pageErrors: errors }));
          } finally {
            await browser.close();
          }
          NODE
 
  full-regression:
    name: full-regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout immutable production baseline
        uses: actions/checkout@v4
        with:
          ref: 25ddcc6d8f89b6a4103c37a254fbd2af0c26febe
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete test:all suite
        run: npx firebase emulators:exec --only firestore --project demo-irpa-baseline 'npm run test:all'

  signature-portal-smoke:
    name: signature-portal-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable production baseline
        uses: actions/checkout@v4
        with:
          ref: 25ddcc6d8f89b6a4103c37a254fbd2af0c26febe
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Signature Portal lock tests using the seven-portal protection runner registry
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { spawnSync } from "node:child_process";
          const registry = JSON.parse(fs.readFileSync("docs/portal-protection/portal-register.json", "utf8"));
          const portal = registry.portals["Signature Portal"];
          if (!portal || !Array.isArray(portal.tests) || portal.tests.length === 0) {
            throw new Error("Signature Portal test registration missing from seven-portal protection registry.");
          }
          const result = spawnSync(process.execPath, ["--test", ...portal.tests], { encoding: "utf8" });
          process.stdout.write(result.stdout || "");
          process.stderr.write(result.stderr || "");
          if (result.status !== 0) process.exit(result.status ?? 1);
          console.log(JSON.stringify({ baseline: "25ddcc6d8f89b6a4103c37a254fbd2af0c26febe", portal: "Signature Portal", tests: portal.tests, result: "PASS" }));
          NODE
      - name: Checkout PR head for owner-panel policy test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: owner-panel
      - name: Enforce the owner recovery panel read-only boundary
        run: node --test owner-panel/tests/signature-recovery-owner-panel-readonly.test.mjs
      - name: Verify Gateway recovery reads preserve envelope and signing evidence
        run: node --test owner-panel/drive-gateway/tests/signature-recovery.test.mjs
