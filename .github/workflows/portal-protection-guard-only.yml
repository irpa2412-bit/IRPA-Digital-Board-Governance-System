name: Portal protection guard-only checks

on:
  pull_request:
    branches: ["**"]
    paths:
      - "scripts/portal-protection-check.mjs"
      - "scripts/portal-repair-window-renewal.mjs"
      - "tests/portal-protection-policy.test.mjs"
      - "tests/portal-repair-window-renewal.test.mjs"
      - "docs/portal-protection/**"
      - "docs/approvals.md"
      - ".github/pull_request_template.md"
      - ".github/workflows/portal-repair-window-renewal.yml"
      - ".github/workflows/portal-protection-guard-only.yml"
      - ".github/workflows/security-baseline.yml"
      - ".github/workflows/readability-release-gate.yml"
      - ".github/workflows/functions-entrypoint-integrity-test.yml"
      - "package.json"
      - "docs/implementation-status.md"

permissions:
  contents: read
  issues: read

concurrency:
  group: portal-guard-only-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax-check portal guard and renewal logic
        run: node --check scripts/portal-protection-check.mjs && node --check scripts/portal-repair-window-renewal.mjs
      - name: Test per-portal policy and owner renewal commands
        run: node --test tests/portal-protection-policy.test.mjs tests/portal-repair-window-renewal.test.mjs
      - name: Validate every registered portal has isolated window and Change Record files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const registry = JSON.parse(fs.readFileSync('docs/portal-protection/portal-register.json','utf8'));
          for (const portal of Object.keys(registry.portals)) {
            const slug = portal.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
            for (const folder of ['windows','records']) {
              const path = `docs/portal-protection/${folder}/${slug}.json`;
              if (!fs.existsSync(path)) throw new Error(`Missing per-portal ${folder} file: ${path}`);
              const data = JSON.parse(fs.readFileSync(path,'utf8'));
              if (data.portal !== portal) throw new Error(`Portal identity mismatch in ${path}`);
            }
            if (!(registry.portals[portal].lockTests || registry.portals[portal].tests || []).length) {
              throw new Error(`No lock tests registered for ${portal}`);
            }
          }
          console.log(`Validated isolated records, windows and lock-test declarations for ${Object.keys(registry.portals).length} portals.`);
          NODE
