name: Signature Portal Forensic Repair

on:
  push:
    branches: [feat/signature-trust-platform-20261007]
    paths:
      - "drive-gateway/src/signing.mjs"
      - "drive-gateway/src/router.mjs"
      - "drive-gateway/src/signatureTrust/**"
      - "drive-gateway/tests/**"
      - "drive-gateway/package.json"
      - "src/**"
      - "package.json"
      - ".github/workflows/signature-portal-forensic-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gateway dependencies
        working-directory: drive-gateway
        run: npm ci --no-audit --no-fund
      - name: Run gateway tests
        working-directory: drive-gateway
        run: npm test
      - name: Root dependency install
        run: npm install --no-audit --no-fund
      - name: Production build verification
        env:
          VITE_IRPA_ENV: production
          VITE_FIREBASE_API_KEY: "AIzaSyC2aMdxHD14nMnGiRyf4mSL1ixXdzBoOtE"
          VITE_FIREBASE_AUTH_DOMAIN: "irpa-digital-board-governance.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "irpa-digital-board-governance"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "217055978789"
          VITE_FIREBASE_APP_ID: "1:217055978789:web:937d1f2f781202cc1e26cc"
          VITE_FIREBASE_MEASUREMENT_ID: "G-XDJEBRBEVC"
        run: npm run build
      - name: No deployment gate
        run: |
          set -euo pipefail
          files="$(find drive-gateway -type f \
            \( -name '*.mjs' -o -name '*.js' -o -name '*.cjs' -o -name '*.ts' -o -name '*.tsx' -o -name '*.jsx' -o -name '*.sh' \) \
            -not -path '*/node_modules/*' -print)"
          if [ -n "$files" ] && printf '%s\n' "$files" | xargs grep -nHE 'wrangler[[:space:]]+deploy|firebase[[:space:]]+deploy|npm[[:space:]]+(run[[:space:]]+)?deploy'; then
            echo "Unexpected deployment command detected in executable source."
            exit 1
          fi
          echo "NO_PRODUCTION_DEPLOYMENT_COMMANDS_DETECTED=true"
