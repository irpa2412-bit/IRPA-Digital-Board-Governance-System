name: Deploy IRPA Hosting (mail migration)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy-hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Mandatory full-source readability and contrast check
        run: npm run check:production-readability
      - name: Build web application
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GOOGLE_WEATHER_API_KEY: ${{ secrets.VITE_GOOGLE_WEATHER_API_KEY }}
        run: npm run build
      - name: Independent production readability verification
        run: npm run verify:production-readability
      - name: Deploy Hosting only (Firestore releases are independently controlled)
        uses: w9jds/firebase-action@v14.17.0
        with:
          args: deploy --project irpa-digital-board-governance --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
