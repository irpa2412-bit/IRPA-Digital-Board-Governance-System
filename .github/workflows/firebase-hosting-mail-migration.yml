name: Deploy IRPA Hosting (mail migration)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify-production-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify production deployment configuration
        run: node scripts/verify-deploy-config.mjs --environment production --config drive-gateway/wrangler.toml

  deploy-hosting:
    needs: verify-production-config
    if: vars.ALLOW_PRODUCTION_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web application
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build
      - name: Verify deploy configuration safety gate
        env:
          FIREBASE_PROJECT_ID: irpa-digital-board-governance
          ALLOWED_ORIGINS: https://irpa.or.tz,https://www.irpa.or.tz,https://irpa-digital-board-governance.web.app,https://irpa-digital-board-governance.firebaseapp.com,http://localhost:5173
        run: node scripts/verify-deploy-config.mjs --environment production --config drive-gateway/wrangler.toml

      - name: Deploy Hosting only
        uses: w9jds/firebase-action@v14.17.0
        with:
          args: deploy --project irpa-digital-board-governance --only hosting
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IRPA_DIGITAL_BOARD_GOVERNANCE }}
