name: Deploy IRPA Self-Hosted LiveKit Staging

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Type DEPLOY-LIVEKIT-STAGING to authorize deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: irpa-livekit-staging-deployment
  cancel-in-progress: false

jobs:
  deploy-media-server:
    if: ${{ inputs.confirm_deployment == 'DEPLOY-LIVEKIT-STAGING' }}
    environment: livekit-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ secrets.LIVEKIT_STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.LIVEKIT_STAGING_SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.LIVEKIT_STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIVEKIT_STAGING_SSH_KNOWN_HOSTS }}
          LIVEKIT_DOMAIN: ${{ secrets.LIVEKIT_STAGING_DOMAIN }}
          LIVEKIT_TURN_DOMAIN: ${{ secrets.LIVEKIT_STAGING_TURN_DOMAIN }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_STAGING_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_STAGING_API_SECRET }}
          ACME_EMAIL: ${{ secrets.LIVEKIT_STAGING_ACME_EMAIL }}
          STAGING_FIREBASE_PROJECT_ID: ${{ secrets.LIVEKIT_STAGING_FIREBASE_PROJECT_ID }}
          STAGING_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.LIVEKIT_STAGING_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS LIVEKIT_DOMAIN LIVEKIT_TURN_DOMAIN LIVEKIT_API_KEY LIVEKIT_API_SECRET ACME_EMAIL STAGING_FIREBASE_PROJECT_ID STAGING_FIREBASE_SERVICE_ACCOUNT; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing GitHub Actions secret required for ${name}"; exit 1; fi
          done
          if [ "$LIVEKIT_DOMAIN" = "$LIVEKIT_TURN_DOMAIN" ]; then echo "::error::Use separate LiveKit and TURN DNS names"; exit 1; fi
          if [ "$LIVEKIT_API_KEY" = "devkey" ] || [ "$LIVEKIT_API_SECRET" = "secret" ] || [ "${#LIVEKIT_API_SECRET}" -lt 32 ]; then echo "::error::Refusing default or weak LiveKit credentials"; exit 1; fi
          if [ "$STAGING_FIREBASE_PROJECT_ID" = "irpa-digital-board-governance" ]; then echo "::error::Refusing to deploy the staging callable to the production Firebase project"; exit 1; fi

      - name: Prepare pinned SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIVEKIT_STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIVEKIT_STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Transfer installer and protected deployment configuration
        env:
          SSH_HOST: ${{ secrets.LIVEKIT_STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.LIVEKIT_STAGING_SSH_USER }}
          LIVEKIT_DOMAIN: ${{ secrets.LIVEKIT_STAGING_DOMAIN }}
          LIVEKIT_TURN_DOMAIN: ${{ secrets.LIVEKIT_STAGING_TURN_DOMAIN }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_STAGING_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_STAGING_API_SECRET }}
          ACME_EMAIL: ${{ secrets.LIVEKIT_STAGING_ACME_EMAIL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          keys = ["LIVEKIT_DOMAIN","LIVEKIT_TURN_DOMAIN","LIVEKIT_API_KEY","LIVEKIT_API_SECRET","ACME_EMAIL"]
          with open("/tmp/irpa-livekit-staging-env.json","w",encoding="utf-8") as f:
              json.dump({k:os.environ[k] for k in keys},f)
          os.chmod("/tmp/irpa-livekit-staging-env.json",0o600)
          PY
          scp -i ~/.ssh/id_ed25519 infra/livekit/deploy-staging.sh infra/livekit/run-deploy-with-env.py infra/livekit/docker-compose.yml infra/livekit/caddy.yaml.template infra/livekit/livekit.yaml.template "$SSH_USER@$SSH_HOST:/tmp/"
          scp -i ~/.ssh/id_ed25519 /tmp/irpa-livekit-staging-env.json "$SSH_USER@$SSH_HOST:/tmp/irpa-livekit-staging-env.json"
          rm -f /tmp/irpa-livekit-staging-env.json
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" 'chmod 600 /tmp/irpa-livekit-staging-env.json && sudo python3 /tmp/run-deploy-with-env.py /tmp/irpa-livekit-staging-env.json /tmp/deploy-staging.sh; result=$?; sudo rm -f /tmp/run-deploy-with-env.py /tmp/deploy-staging.sh; exit $result'

      - name: Verify TLS endpoint is reachable
        env:
          LIVEKIT_DOMAIN: ${{ secrets.LIVEKIT_STAGING_DOMAIN }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "https://$LIVEKIT_DOMAIN/")" || {
            echo "::error::TLS or network connection to the LiveKit endpoint failed."
            exit 1
          }
          case "$status" in
            2*|3*|404) echo "TLS endpoint reachable (HTTP $status)." ;;
            *) echo "::error::Unexpected endpoint response HTTP $status."; exit 1 ;;
          esac
          echo "TLS/HTTPS endpoint responded. This does not yet prove LiveKit API authentication or WebRTC media."

  deploy-staging-token-function:
    needs: deploy-media-server
    if: ${{ inputs.confirm_deployment == 'DEPLOY-LIVEKIT-STAGING' }}
    environment: livekit-staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to the isolated staging Firebase project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.LIVEKIT_STAGING_FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Configure Secret Manager and deploy only the LiveKit token callable
        env:
          STAGING_FIREBASE_PROJECT_ID: ${{ secrets.LIVEKIT_STAGING_FIREBASE_PROJECT_ID }}
          LIVEKIT_DOMAIN: ${{ secrets.LIVEKIT_STAGING_DOMAIN }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_STAGING_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_STAGING_API_SECRET }}
        run: |
          set -euo pipefail
          if [ "$STAGING_FIREBASE_PROJECT_ID" = "irpa-digital-board-governance" ]; then
            echo "::error::Production Firebase project is not permitted for this staging workflow."
            exit 1
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          umask 077
          printf 'wss://%s' "$LIVEKIT_DOMAIN" > "$tmp/livekit-url"
          printf '%s' "$LIVEKIT_API_KEY" > "$tmp/livekit-api-key"
          printf '%s' "$LIVEKIT_API_SECRET" > "$tmp/livekit-api-secret"
          npm install --global firebase-tools
          npm ci --prefix functions
          firebase functions:secrets:set LIVEKIT_URL --data-file "$tmp/livekit-url" --project "$STAGING_FIREBASE_PROJECT_ID"
          firebase functions:secrets:set LIVEKIT_API_KEY --data-file "$tmp/livekit-api-key" --project "$STAGING_FIREBASE_PROJECT_ID"
          firebase functions:secrets:set LIVEKIT_API_SECRET --data-file "$tmp/livekit-api-secret" --project "$STAGING_FIREBASE_PROJECT_ID"
          firebase deploy --only functions:issueLiveMeetingToken --project "$STAGING_FIREBASE_PROJECT_ID"

      - name: State remaining acceptance gate
        if: always()
        run: |
          echo "LiveKit host and staging token callable deployment attempted."
          echo "Authenticated API verification and a real two-browser audio/video test are still required."
