name: Retry failed Cloudflare frontend deployment

on:
  workflow_run:
    workflows: ["Deploy IRPA Governance Frontend to Cloudflare Workers"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry-failed-jobs:
    if: contains(fromJSON('["failure","cancelled"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait before one bounded retry
        run: sleep 180
      - name: Re-run only failed jobs, at most twice
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$RUN_ATTEMPT" -ge 3 ]; then
            echo "Retry limit reached; refusing another retry."
            exit 0
          fi
          gh run rerun --failed "$RUN_ID" --repo "$GH_REPO"
          echo "Requested a rerun of failed jobs only for Cloudflare frontend deployment run $RUN_ID (attempt $RUN_ATTEMPT)."
