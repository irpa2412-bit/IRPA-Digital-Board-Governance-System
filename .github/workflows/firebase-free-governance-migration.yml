name: Firebase-free governance migration checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "drive-gateway/**"
      - "functions/**"
      - "tests/**"
      - "vite.responsive-fixture.config.js"
      - "playwright.responsive-audit.config.mjs"
      - "scripts/check-no-billing-deps.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/firebase-free-governance-migration.yml"
  push:
    branches: [main, firebase-free-governance-migration-20261018, ci/group-b-test-all-billing-audit-20261110]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  responsive-audit:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: Responsive dashboard shell layout regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright without changing the lockfile
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run report-only responsive audit
        run: npx playwright test --config=playwright.responsive-audit.config.mjs
      - name: Upload responsive audit report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irpa-portal-responsive-audit-${{ github.sha }}
          path: artifacts/portal-responsive-audit/
          if-no-files-found: warn
          retention-days: 14

  build-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Verify portal navigation
        run: npm run test:portal-navigation
      - name: Verify meeting entry policy
        run: npm run test:meeting-entry-policy
      - name: Verify meeting invitation quorum
        run: npm run test:meeting-invitation-resend
      - name: Verify Cloudflare password-security client migration
        run: node --test tests/cloudflare-password-client-migration.test.mjs
      - name: Verify Cloudflare document-reference client migration
        run: node --test tests/cloudflare-document-reference-migration.test.mjs
      - name: Set up Java for Firebase emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify finance policy with Firestore emulator
        run: npx firebase emulators:exec --only firestore --project demo-irpa-dgbs "npm run test:finance-policy"
      - name: Install gateway dependencies
        run: npm ci --prefix drive-gateway
      - name: Run gateway regression and governance-store tests
        run: npm test --prefix drive-gateway
      - name: Run complete root test suite and billing audit
        run: npx firebase emulators:exec --only firestore --project demo-irpa-dgbs "npm run test:all"
