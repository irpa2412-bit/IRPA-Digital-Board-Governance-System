name: Deploy IRPA Google Drive Gateway

on:
  push:
    branches: [main]
    paths:
      - "drive-gateway/**"
      - ".github/workflows/cloudflare-gateway-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: drive-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recover existing production bindings and prepare ESIGN_DO safely
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"

          response="$(curl --fail --silent --show-error             -H "Authorization: Bearer $CF_API_TOKEN"             -H "Accept: application/json"             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/irpa-google-drive-gateway/settings")"

          node - "$response" <<'NODE'
          const fs = require("fs");
          const response = JSON.parse(process.argv[2]);

          if (response.success !== true) {
            throw new Error("Cloudflare rejected the production Worker settings request.");
          }

          const bindings = Array.isArray(response.result?.bindings) ? response.result.bindings : [];
          const allowed = new Map([
            ["DRIVE_KV", "kv_namespace"],
            ["ESIGN_DO", "durable_object_namespace"]
          ]);

          for (const binding of bindings) {
            const name = String(binding?.name || "");
            const expectedType = allowed.get(name);
            if (!expectedType) {
              throw new Error(
                `Safety stop: unexpected production Worker binding "${name}". This workflow may manage only DRIVE_KV and ESIGN_DO.`
              );
            }
            if (binding.type !== expectedType) {
              throw new Error(
                `Safety stop: binding "${name}" has type "${binding.type}", expected "${expectedType}".`
              );
            }
          }

          const driveKvBindings = bindings.filter(b => b.name === "DRIVE_KV");
          if (driveKvBindings.length !== 1) {
            throw new Error("Safety stop: production Worker must contain exactly one DRIVE_KV binding.");
          }

          const driveKv = driveKvBindings[0];
          if (!/^[a-f0-9]{32}$/.test(String(driveKv.namespace_id || ""))) {
            throw new Error(
              "Safety stop: existing production DRIVE_KV binding was not returned with a valid namespace ID."
            );
          }

          const esignBindings = bindings.filter(b => b.name === "ESIGN_DO");
          if (esignBindings.length > 1) {
            throw new Error("Safety stop: production Worker contains more than one ESIGN_DO binding.");
          }

          if (esignBindings.length === 1) {
            const esign = esignBindings[0];
            if (String(esign.class_name || "") !== "EsignRecordDurableObject") {
              throw new Error(
                'Safety stop: existing ESIGN_DO must target class "EsignRecordDurableObject".'
              );
            }
          }

          const config = {
            name: "irpa-google-drive-gateway",
            main: "src/index.js",
            compatibility_date: "2026-09-24",
            kv_namespaces: [
              { binding: "DRIVE_KV", id: driveKv.namespace_id }
            ],
            durable_objects: {
              bindings: [
                {
                  name: "ESIGN_DO",
                  class_name: "EsignRecordDurableObject"
                }
              ]
            },
            migrations: [
              {
                tag: "esign-do-v1",
                new_sqlite_classes: ["EsignRecordDurableObject"]
              }
            ]
          };

          fs.writeFileSync("wrangler.json", JSON.stringify(config, null, 2) + "\n");
          NODE

          echo "Prepared DRIVE_KV and ESIGN_DO configuration. IDs and credentials are intentionally not printed."

      - name: Verify production Worker configuration
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const c = JSON.parse(fs.readFileSync("wrangler.json", "utf8"));

          if (c.name !== "irpa-google-drive-gateway") {
            throw new Error("Worker identity mismatch.");
          }

          const kv = Array.isArray(c.kv_namespaces) ? c.kv_namespaces : [];
          if (kv.length !== 1 || kv[0]?.binding !== "DRIVE_KV" || !/^[a-f0-9]{32}$/.test(String(kv[0]?.id || ""))) {
            throw new Error("Production DRIVE_KV binding is invalid. Deployment blocked.");
          }

          const doBindings = c.durable_objects?.bindings || [];
          if (doBindings.length !== 1 ||
              doBindings[0]?.name !== "ESIGN_DO" ||
              doBindings[0]?.class_name !== "EsignRecordDurableObject") {
            throw new Error("Production ESIGN_DO binding is invalid. Deployment blocked.");
          }

          const migrations = Array.isArray(c.migrations) ? c.migrations : [];
          const migration = migrations.find(m => m?.tag === "esign-do-v1");
          if (!migration ||
              !Array.isArray(migration.new_sqlite_classes) ||
              migration.new_sqlite_classes.length !== 1 ||
              migration.new_sqlite_classes[0] !== "EsignRecordDurableObject") {
            throw new Error("ESIGN_DO migration is missing or invalid. Deployment blocked.");
          }

          const topLevelKeys = new Set([
            "name", "main", "compatibility_date", "kv_namespaces",
            "durable_objects", "migrations"
          ]);
          for (const key of Object.keys(c)) {
            if (!topLevelKeys.has(key)) {
              throw new Error(`Safety stop: unexpected generated Wrangler configuration key "${key}".`);
            }
          }
          NODE

      - name: Verify governance application build
        working-directory: .
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: Deploy existing production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: drive-gateway
          command: deploy --keep-vars

      - name: Verify production gateway
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 https://irpa-google-drive-gateway.irpa-governance.workers.dev/health)"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"storageProvider":"Google Drive"'
