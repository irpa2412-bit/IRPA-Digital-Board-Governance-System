name: Deploy IRPA Google Drive Gateway

on:
  push:
    branches: [main]
    paths:
      - "drive-gateway/**"
      - ".github/workflows/cloudflare-gateway-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: drive-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production Worker configuration
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const c = JSON.parse(fs.readFileSync("wrangler.json", "utf8"));
          if (c.name !== "irpa-google-drive-gateway") throw new Error("Worker identity mismatch.");
          const kv = Array.isArray(c.kv_namespaces) ? c.kv_namespaces : [];
          const driveKv = kv.find(x => x && x.binding === "DRIVE_KV");
          if (!driveKv || !/^[a-f0-9]{32}$/.test(String(driveKv.id || ""))) {
            throw new Error("Production DRIVE_KV binding is not declared with its existing namespace ID. Deployment is intentionally blocked to prevent disconnecting Google Drive authorization state.");
          }
          NODE

      - name: Verify governance application build
        working-directory: .
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: Deploy existing production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: drive-gateway
          command: deploy --keep-vars

      - name: Verify production gateway
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://irpa-google-drive-gateway.irpa-governance.workers.dev/health
