name: Deploy IRPA Google Drive Gateway

on:
  push:
    branches: [main]
    paths:
      - "drive-gateway/**"
      - ".github/workflows/cloudflare-gateway-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: drive-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify controlled production Worker configuration
        run: |
          set -euo pipefail
          test -f wrangler.toml
          grep -q '^name = "irpa-google-drive-gateway"$' wrangler.toml
          grep -q '^FIREBASE_PROJECT_ID = "irpa-digital-board-governance"$' wrangler.toml
          grep -q '^DRIVE_MOCK = "false"$' wrangler.toml
          grep -q '^LOCAL_TEST_MODE = "false"$' wrangler.toml
          grep -q '^ESIGN_MODULE_ENABLED = "true"$' wrangler.toml
          grep -q 'binding = "DRIVE_KV"' wrangler.toml
          grep -q 'name = "ESIGN_DO"' wrangler.toml
          grep -q 'class_name = "EsignRecordDurableObject"' wrangler.toml
          grep -q 'tag = "esign-do-v1"' wrangler.toml
          grep -q 'new_sqlite_classes = \["EsignRecordDurableObject"\]' wrangler.toml
          if grep -qi 'staging' wrangler.toml; then
            echo "Safety stop: production wrangler.toml contains staging configuration."
            exit 1
          fi

      - name: Verify governance application build
        working-directory: .
        run: |
          set -euo pipefail
          npm install
          npm run build

      - name: Deploy existing production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: drive-gateway
          command: deploy --config wrangler.toml --keep-vars

      - name: Verify production gateway
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 https://irpa-google-drive-gateway.irpa-governance.workers.dev/health)"
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"storageProvider":"Google Drive"'
