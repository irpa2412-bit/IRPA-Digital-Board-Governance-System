name: Firestore Rules Change Approval

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  firestore-rules-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit approval for firestore.rules changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files="$(gh api --paginate             -H "Accept: application/vnd.github+json"             "/repos/$REPO/pulls/$PR_NUMBER/files?per_page=100"             --jq '.[].filename')"
          if ! grep -qx 'firestore.rules' <<< "$files"; then
            echo "firestore.rules unchanged."
            exit 0
          fi
          if gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' | grep -Fxq 'firestore-rules-approved'; then
            echo "Explicit firestore.rules approval label present."
            exit 0
          fi
          echo "ERROR: firestore.rules changed but explicit approval is missing."
          echo "Add the 'firestore-rules-approved' label after explicit owner approval."
          exit 1
