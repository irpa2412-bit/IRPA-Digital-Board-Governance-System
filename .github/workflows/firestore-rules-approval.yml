name: Firestore Rules Change Approval

on:
  push:
    branches: [main, fix/firestore-approval-workflow-dispatch-20261114]
    paths:
      - ".github/workflows/firestore-rules-approval.yml"
      - ".github/workflows/firestore-rules-approval-comment.yml"
      - "scripts/firestore-rules-approval.mjs"
      - "tests/firestore-rules-approval.test.mjs"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  firestore-rules-approval-main-validation:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: firestore-rules-approval-main-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout main revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run offline approval decision fixtures
        run: node --test tests/firestore-rules-approval.test.mjs

  firestore-rules-approval:
    if: github.event_name == 'pull_request'
    name: firestore-rules-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout exact PR head for the read-only gate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Run offline approval decision fixtures
        run: node --test tests/firestore-rules-approval.test.mjs
      - name: Evaluate owner-applied, current Firestore rules approval
        env:
          PR_ACTION: ${{ github.event.action }}
          PR_ACTOR: ${{ github.actor }}
          EVENT_LABEL_NAME: ${{ github.event.label.name || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: node scripts/firestore-rules-approval.mjs

