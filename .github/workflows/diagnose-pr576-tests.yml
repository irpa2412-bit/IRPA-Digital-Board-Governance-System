name: Diagnose PR #576 gateway tests

on:
  workflow_dispatch:
  push:
    branches:
      - fix/communications-website-authorisation-diagnostics
    paths-ignore:
      - docs/diagnostics/pr576-tests.txt

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/communications-website-authorisation-diagnostics
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: drive-gateway/package-lock.json
      - name: Run PR branch tests with full TAP output
        shell: bash
        run: |
          set +e
          npm ci --prefix drive-gateway
          DRIVE_MOCK=true npm --prefix drive-gateway test -- --test-reporter=tap > /tmp/pr576.tap 2>&1
          echo "$?" > /tmp/pr576.exit
          set -e
      - name: Run main tests with full TAP output
        shell: bash
        run: |
          set +e
          git worktree add /tmp/pr576-main origin/main
          npm ci --prefix /tmp/pr576-main/drive-gateway
          DRIVE_MOCK=true npm --prefix /tmp/pr576-main/drive-gateway test -- --test-reporter=tap > /tmp/main.tap 2>&1
          echo "$?" > /tmp/main.exit
          set -e
      - name: Build diagnostic report
        if: always()
        shell: bash
        run: |
          mkdir -p docs/diagnostics
          {
            echo "# PR #576 gateway test diagnosis"
            echo
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "PR branch: fix/communications-website-authorisation-diagnostics"
            echo
            echo "## PR branch failures"
            echo
            if [ -f /tmp/pr576.tap ]; then
              awk '
                /^not ok / { print; capture=1; next }
                capture && /^  \.\.\./ { print; capture=0; next }
                capture { print }
              ' /tmp/pr576.tap
              echo
              echo "Exit status: $(cat /tmp/pr576.exit 2>/dev/null || echo unavailable)"
              echo '### Full TAP output'
              cat /tmp/pr576.tap
            else
              echo "Test output unavailable."
            fi
            echo
            echo "## main failures"
            echo
            if [ -f /tmp/main.tap ]; then
              awk '
                /^not ok / { print; capture=1; next }
                capture && /^  \.\.\./ { print; capture=0; next }
                capture { print }
              ' /tmp/main.tap
              echo
              echo "Exit status: $(cat /tmp/main.exit 2>/dev/null || echo unavailable)"
              echo '### Full TAP output'
              cat /tmp/main.tap
            else
              echo "Main test output unavailable."
            fi
          } > docs/diagnostics/pr576-tests.txt
      - name: Commit and push diagnostic report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/pr576-tests.txt
          git commit -m "Add PR #576 gateway test diagnostics" || exit 0
          git push origin HEAD:fix/communications-website-authorisation-diagnostics
