services:
  redis:
    image: redis:7.4-alpine
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--protected-mode", "yes", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.13.7
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  egress:
    # Pinned to the 1.13 release line used by this self-hosted LiveKit server.
    # Composite recording requires the Chrome sandbox capability below.
    image: livekit/egress:v1.13.0
    network_mode: host
    init: true
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6379
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  caddy:
    image: livekit/caddyl4:v2.11.4
    network_mode: host
    command: ["run", "--config", "/etc/caddy.yaml", "--adapter", "yaml"]
    restart: unless-stopped
    depends_on:
      - livekit
    volumes:
      - ./caddy.yaml:/etc/caddy.yaml:ro
      - caddy_data:/data

volumes:
  redis_data:
  caddy_data:
