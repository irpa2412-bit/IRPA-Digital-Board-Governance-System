services:
  redis:
    image: redis:7.4-alpine
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--protected-mode", "yes", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.13.7
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  caddy:
    image: livekit/caddyl4:v2.11.4
    network_mode: host
    command: ["run", "--config", "/etc/caddy.yaml", "--adapter", "yaml"]
    restart: unless-stopped
    depends_on:
      - livekit
    volumes:
      - ./caddy.yaml:/etc/caddy.yaml:ro
      - caddy_data:/data

volumes:
  redis_data:
  caddy_data:
