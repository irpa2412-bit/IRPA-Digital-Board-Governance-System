name: irpa-livekit-staging

services:
  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:latest}
    container_name: irpa-livekit-staging
    network_mode: host
    restart: unless-stopped
    command: ["--config", "/etc/livekit/livekit.yaml"]
    volumes:
      - ./runtime/livekit.yaml:/etc/livekit/livekit.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:7880/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2
    container_name: irpa-livekit-caddy-staging
    network_mode: host
    restart: unless-stopped
    depends_on:
      - livekit
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy_data:
  caddy_config:
